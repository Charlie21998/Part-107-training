  {id:"pq206", topic:"Operations I", q:"Under \u00a7107.9, which of the following alone triggers the reporting requirement, even without a 'serious injury' by AIS standard?", choices:["Any loss of consciousness, even without a formal 'serious injury' classification", "Minor bruising to a bystander", "Damage limited to the small unmanned aircraft itself", "A near-miss with a manned aircraft that involved no contact"], a:0, exp:"\u00a7107.9(a) separately lists 'serious injury to any person or any loss of consciousness' \u2014 loss of consciousness alone is reportable regardless of AIS severity scoring."},
  {id:"pq207", topic:"Operations I", q:"The alcohol/drug prohibition incorporated by \u00a7107.27 applies to:", choices:["Only the remote pilot in command", "Anyone manipulating the flight controls, the remote PIC, and the visual observer", "Only certificated remote pilots operating for compensation", "Only the person who submitted the airspace authorization request"], a:1, exp:"\u00a7107.27 names three roles explicitly: the person manipulating the flight controls, the remote pilot in command, and the visual observer."},
  {id:"pq208", topic:"Operations I", q:"\u00a7107.27 requires compliance with which two sections of Part 91?", choices:["\u00a791.13 and \u00a791.15", "\u00a791.103 and \u00a791.105", "\u00a791.17 and \u00a791.19", "\u00a791.7 and \u00a791.9"], a:2, exp:"\u00a7107.27 incorporates \u00a791.17 (alcohol/drugs standard) and \u00a791.19 (carriage of narcotics/depressant or stimulant drugs) by reference."},
  {id:"pq209", topic:"Operations I", q:"During a flyaway heading toward an active runway at a towered airport, who should the remote PIC or a crew member try to notify, in addition to attempting to regain control?", choices:["The airport's air traffic control tower, in addition to continuing to try to regain control", "The FAA's Flight Standards District Office, but only after landing", "No one \u2014 ATC has no operational interest in small UAS", "The aircraft manufacturer's customer support line"], a:0, exp:"Warning parties who could be affected \u2014 including a tower controlling traffic in the flyaway's path \u2014 is a practical priority alongside continued attempts to regain control."},
  {id:"pq210", topic:"Operations I", q:"In the August 2021 Toronto/Buttonville midair collision investigated by Canada's TSB, what was the remotely piloted aircraft doing at the moment of collision with the Cessna 172?", choices:["Climbing rapidly through 1,000 ft AGL toward the Cessna", "Hovering stationary at 400 ft AGL directly in the Cessna's approach path", "Landing at the moment of impact", "Flying a scripted racetrack pattern at 50 ft AGL"], a:1, exp:"TSB investigation report A21O0069 found the police RPA was in a stationary hover at 400 ft AGL in the Cessna's approach path when the collision occurred."},
  {id:"pq211", topic:"Operations I", q:"A remote PIC operating without a visual observer must personally satisfy which responsibility that a visual observer would otherwise share?", choices:["Filing a report with the FAA before the flight", "Coordinating with ATC on every flight", "Maintaining unaided visual contact with the aircraft throughout the flight", "Carrying a second aircraft as backup"], a:2, exp:"\u00a7107.31 requires unaided visual contact with the aircraft; without a visual observer, that burden falls entirely on the remote PIC (or the person manipulating the controls)."},
  {id:"pq212", topic:"Operations I", q:"Which of the following is NOT one of the common lost-link failsafe behaviors small UAS are typically programmed with?", choices:["Return-to-home", "Hover-and-wait", "Land-in-place", "Automatic diversion to the nearest airport"], a:3, exp:"Typical lost-link failsafes are return-to-home, hover-and-wait, or land-in-place \u2014 small UAS have no capability or programming for autonomous diversion to an airport."},
  {id:"pq213", topic:"Operations I", q:"Who bears the responsibility for submitting the \u00a7107.9 safety-event report to the FAA?", choices:["The remote pilot in command", "Any visual observer present at the time of the event", "The aircraft's registered owner, regardless of who was flying", "The manufacturer of the small unmanned aircraft"], a:0, exp:"\u00a7107.9 places the reporting obligation on the remote pilot in command, not on other crew members, the owner, or the manufacturer."},
  {id:"pq214", topic:"Operations I", q:"How may the safety-event report required under \u00a7107.9 be submitted to the FAA?", choices:["Only by certified mail to FAA Headquarters", "Online, by telephone, or through the appropriate FAA Regional Operations Center", "Only in person at a Flight Standards District Office", "It cannot be submitted until an NTSB investigator initiates contact"], a:1, exp:"\u00a7107.9 requires the report be made 'in a manner acceptable to the Administrator,' which in practice includes online submission, telephone, or the appropriate FAA Regional Operations Center."},
  {id:"pq215", topic:"Operations I", q:"In standard aviation phraseology, responding 'Wilco' to an instruction means:", choices:["'I have received all of your last transmission'", "'Please repeat your last transmission'", "'I understand your message and will comply with it'", "'Standby, unable to comply at this time'"], a:2, exp:"'Wilco' (will comply) means the message was understood and will be complied with \u2014 distinct from 'Roger,' which only confirms receipt of the transmission."},
  {id:"pq216", topic:"Operations II", q:"Under \u00a7107.49(a), the operating-environment assessment must evaluate local weather, local airspace and flight restrictions, the location of persons and property on the surface, and:", choices:["Other ground hazards", "The pilot's medical certificate status", "The aircraft's resale value", "Wi-Fi signal strength at the operating site"], a:0, exp:"\u00a7107.49(a)(4) rounds out the required environmental assessment with 'other ground hazards,' alongside weather, airspace, and persons/property."},
  {id:"pq217", topic:"Operations II", q:"\u00a7107.49(b) requires the remote PIC to ensure that all persons directly participating in the operation are informed about:", choices:["Only the phone number of the FAA Regional Operations Center", "Operating conditions, emergency and contingency procedures, roles/responsibilities, and hazards", "The aircraft's purchase price and warranty terms", "The remote PIC's total logged flight hours"], a:1, exp:"\u00a7107.49(b) requires briefing participants on operating conditions, emergency and contingency procedures, roles and responsibilities, and hazards associated with the operation."},
  {id:"pq218", topic:"Operations II", q:"\u00a7107.49(c) specifically requires the remote PIC to confirm before flight that:", choices:["The aircraft carries liability insurance", "A visual observer has been assigned to the flight", "All control links between the ground control station and the small UAS are working properly", "The flight has been logged with a state aviation authority"], a:2, exp:"\u00a7107.49(c) requires confirming that all control links between the ground control station and the small unmanned aircraft are working properly."},
  {id:"pq219", topic:"Operations II", q:"For a powered small UAS, \u00a7107.49(d) requires the remote PIC to ensure:", choices:["The battery is charged to exactly 100 percent before every flight", "A spare battery is carried on every flight", "The battery has fewer than 50 total charge cycles", "Enough available power for the aircraft to operate for the intended operational time"], a:3, exp:"\u00a7107.49(d) requires ensuring there is enough available power for the intended operational time \u2014 not a fixed charge percentage, spare-battery mandate, or cycle-count limit."},
  {id:"pq220", topic:"Operations II", q:"\u00a7107.49(e) requires that any object attached to or carried by the small UAS be:", choices:["Secure, and not adversely affect the aircraft's flight characteristics or controllability", "Registered separately with the FAA", "Weighed and logged in a written manifest before every flight", "Insured for its full replacement value"], a:0, exp:"\u00a7107.49(e) requires that any attached or carried object be secure and not adversely affect the aircraft's flight characteristics or controllability."},
  {id:"pq221", topic:"Operations II", q:"Which of the following is NOT one of the preflight actions \u00a7107.49 requires of the remote pilot in command?", choices:["Assessing local weather, airspace, and ground hazards", "Filing a NOTAM with the FAA before the flight", "Briefing participants on procedures and hazards", "Confirming control links are functioning properly"], a:1, exp:"\u00a7107.49 contains no NOTAM-filing requirement; its enumerated items cover environmental assessment, participant briefing, control-link checks, power sufficiency, and securing attached objects."},
  {id:"pq222", topic:"Operations II", q:"Under \u00a7107.29(b), what equipment is required during civil twilight, even though it's technically not yet 'night'?", choices:["No equipment \u2014 civil twilight is treated the same as full daylight", "A visual observer, regardless of what's required at other times", "The same anti-collision lighting required for night operations, visible for at least 3 statute miles", "A current airspace authorization"], a:2, exp:"\u00a7107.29(b) extends the night lighting requirement to civil twilight periods, requiring anti-collision lighting visible for at least 3 statute miles even though civil twilight isn't legally 'night.'"},
  {id:"pq223", topic:"Operations II", q:"For purposes of \u00a7107.29, civil twilight (outside Alaska) is defined as:", choices:["The hour before official sunrise and the hour after official sunset", "The period from sunset until the end of nautical twilight", "A fixed clock time published annually by the FAA for each airport", "The 30 minutes before official sunrise and the 30 minutes after official sunset"], a:3, exp:"\u00a7107.29(c) defines civil twilight (outside Alaska) as beginning 30 minutes before official sunrise and ending 30 minutes after official sunset."},
  {id:"pq224", topic:"Operations II", q:"To operate at night under \u00a7107.29, the remote PIC must have completed the applicable initial knowledge test or training under \u00a7107.65:", choices:["After April 6, 2021", "At any point in the pilot's career, with no date restriction", "Before their very first Part 107 flight, regardless of the date", "Only if the operation also requires a waiver"], a:0, exp:"\u00a7107.29(a)(1) requires the night-operations knowledge test or training under \u00a7107.65 to have been completed after April 6, 2021."},
  {id:"pq225", topic:"Operations II", q:"\u00a7107.29 requires the required anti-collision lighting's flash rate to be:", choices:["Exactly 60 flashes per minute", "Sufficient to avoid a collision", "Synchronized with any nearby manned aircraft's strobes", "Unspecified \u2014 any visible light satisfies the rule regardless of flashing"], a:1, exp:"\u00a7107.29 requires a flash rate 'sufficient to avoid a collision' \u2014 a functional standard, not a fixed numeric flash rate."},
  {id:"pq226", topic:"Operations II", q:"In the PAVE risk-assessment checklist, what does the 'V' stand for?", choices:["Velocity", "Visibility", "enVironment", "Vehicle condition"], a:2, exp:"PAVE's 'V' stands for enVironment \u2014 weather, terrain, obstacles, and airspace at the operating site."},
  {id:"pq227", topic:"Operations II", q:"The four categories of the PAVE checklist, in order, are:", choices:["Pilot, Airspace, Visibility, Emergency", "Preflight, Aircraft, Verification, Execution", "Pilot, Altitude, Velocity, Endurance", "Pilot, Aircraft, enVironment, External pressures"], a:3, exp:"PAVE breaks risk assessment into Pilot, Aircraft, enVironment, and External pressures."},
  {id:"pq228", topic:"Operations II", q:"The antidote thought 'Follow the rules \u2014 they're usually there for a reason' is paired with which hazardous attitude?", choices:["Anti-authority", "Impulsivity", "Resignation", "Invulnerability"], a:0, exp:"Anti-authority ('rules don't apply to me') is countered by the antidote thought to follow the rules, since they're usually there for a reason."},
  {id:"pq229", topic:"Operations II", q:"Which hazardous attitude does the antidote 'It could happen to me' address?", choices:["Macho", "Invulnerability", "Anti-authority", "Impulsivity"], a:1, exp:"Invulnerability ('it won't happen to me') is countered by the antidote thought 'it could happen to me.'"},
  {id:"pq230", topic:"Operations II", q:"Which hazardous attitude's antidote is 'I'm not helpless. I can make a difference'?", choices:["Macho", "Anti-authority", "Resignation", "Impulsivity"], a:2, exp:"Resignation ('what's the use') is countered by the antidote thought that the pilot isn't helpless and can influence the outcome."},
  {id:"pq231", topic:"Operations II", q:"A remote pilot disregards the manufacturer's published weight limit for the aircraft, reasoning, 'That's just corporate liability language \u2014 it doesn't really apply to careful pilots like me.' Which hazardous attitude does this reflect?", choices:["Invulnerability", "Resignation", "Macho", "Anti-authority"], a:3, exp:"Dismissing a documented limit as not really applying to oneself is the Anti-authority attitude, regardless of whether the 'authority' is the FAA or the manufacturer."},
  {id:"pq232", topic:"Operations II", q:"A remote pilot flies over a crowded outdoor event without the required waiver, thinking, 'I've done hundreds of flights and nothing bad has ever happened \u2014 it won't this time either.' Which hazardous attitude does this reflect?", choices:["Invulnerability", "Anti-authority", "Macho", "Resignation"], a:0, exp:"Believing a good track record makes an accident impossible for oneself is the Invulnerability attitude."},
  {id:"pq233", topic:"Operations II", q:"During preflight, a remote PIC notices a LiPo battery has become visibly puffy or swollen. Under the \u00a7107.49 safe-condition standard, the correct response is to:", choices:["Continue using it, since swelling doesn't affect flight performance", "Remove it from service \u2014 a swollen LiPo is a recognized safety hazard inconsistent with a safe-condition determination", "Use it only for flights under 5 minutes", "Use it only in cold weather, when swelling is less likely to worsen"], a:1, exp:"A swollen LiPo battery is a known fire/failure risk; continuing to fly it conflicts with the remote PIC's duty under \u00a7107.49 to ensure a genuinely safe condition for operation."},
  {id:"pq234", topic:"Operations II", q:"A remote PIC ignores the manufacturer's recommended motor-replacement interval, reasoning that Part 107 doesn't legally mandate it. Is this consistent with the \u00a7107.49 safe-condition standard?", choices:["Yes, since only FAA-mandated items are relevant to \u00a7107.49", "Yes, but only if the aircraft is still under warranty", "Not necessarily \u2014 disregarding manufacturer guidance can undercut the safe-condition determination even without an FAA-mandated schedule", "No, but only because it violates a separate recordkeeping requirement"], a:2, exp:"\u00a7107.49's safe-condition standard is a substantive judgment; ignoring known manufacturer maintenance guidance can undermine that judgment even without an FAA-mandated inspection calendar."},
  {id:"pq235", topic:"Operations II", q:"Consistent with the physiological effects of low illumination that night-operation training must cover, roughly how long does it take human eyes to reach substantial dark adaptation?", choices:["About 30 seconds", "About 2-3 minutes", "About 5 minutes", "Up to about 30 minutes"], a:3, exp:"Per the FAA's Airplane Flying Handbook, cones adapt within 5-7 minutes but rods \u2014 responsible for low-light vision \u2014 take up to about 30 minutes to fully adapt to darkness."},

  {id:"pq239", topic:"Operations II", q:"A remote PIC plans a 25-minute mapping mission, but the aircraft's battery, fully charged, provides only about 18 minutes of flight time. Does this satisfy the \u00a7107.49(d) power-sufficiency requirement?", choices:["Yes, since the battery was fully charged before the flight", "Yes, as long as a spare battery is nearby but not installed", "No, but only because Class G airspace requires a fixed 30-minute reserve", "No \u2014 the aircraft must have enough available power for the intended operational time, and 18 minutes doesn't cover a 25-minute mission"], a:3, exp:"\u00a7107.49(d) ties power sufficiency to the intended operational time; a battery that can't cover the planned mission length fails that standard regardless of charge state."},

  {id:"ref-tx", title:"Classroom Transmitters: Protocols & Module Bays", body:`
    <p style="color:var(--dim);font-size:12.5px;margin:0 0 12px">The three radios this class flies with, and how each one talks to a receiver. "Bay size" matters when buying an external module — a module built for one bay size physically won't seat in the other without an adapter.</p>
    <table>
      <tr><td>RadioMaster Pocket</td><td>Built-in ExpressLRS (ELRS), 2.4 GHz. External module bay is <strong>nano-size</strong>. Take a 4-in-1 multiprotocol module for older/other protocols (FrSky D8/D16, FlySky, Spektrum, and more).</td></tr>
      <tr><td>RadioMaster TX16S</td><td>ELRS runs on an <strong>internal</strong> RF module (swappable, but inside the radio). External module bay on the back is <strong>full JR-size</strong> — physically bigger than the Pocket's.</td></tr>
      <tr><td>Pocket &amp; TX16S 4-in-1, same physical module</td><td>RadioMaster's 4-in-1 module is nano-native but ships with a JR adapter, so the same physical module works in both the Pocket's nano bay and the TX16S's full JR bay. Functionally identical setup on both radios; same part, different bay adapter in play.</td></tr>
      <tr><td>Taranis Q X7 ACCESS (non-LBT)</td><td>FrSky's ACCESS protocol, 2.4 GHz. "Non-LBT" = the FCC-region build: no Listen-Before-Talk requirement, full transmit power, and D8 legacy mode available without extra unlocking. LBT (EU) units run reduced power and have D8 disabled by default. Non-LBT is the correct choice for US-based flying.</td></tr>
    </table>
  `},
  {id:"ref-binding", title:"Binding Methods by Protocol", body:`
    <p style="color:var(--dim);font-size:12.5px;margin:0 0 12px">"Binding" isn't one universal procedure — it depends entirely on which protocol chip is doing the talking. Same word, three different mechanisms.</p>
    <table>
      <tr><td>ELRS (ExpressLRS)</td><td>Built around a shared <strong>binding phrase</strong> — an alphanumeric string set on both transmitter and receiver, hashed into a matching UID. Same phrase on both sides means they bind automatically on power-up, no button press. An older manual bind-button/Lua-script method exists for receivers with no phrase set, but once a phrase is configured, manual bind no longer overrides it.</td></tr>
      <tr><td>FrSky ACCESS</td><td>Two-step: <strong>register</strong> the receiver to your specific transmitter once (ties its unique ID to your radio), then <strong>bind</strong> it to a model slot. ACCESS adds <strong>Model Match</strong> — the receiver only goes live when that exact model is selected on the radio, a real safety feature against flying with the wrong model's setup loaded.</td></tr>
      <tr><td>4-in-1 multiprotocol module</td><td>One external module, four separate RF chips inside it, covering FrSky D8/D16, FlySky, Spektrum DSM2/DSMX, Futaba, and others. You select the target protocol from a menu on the transmitter first — binding then follows <em>that protocol's own native procedure</em>, not a single universal method.</td></tr>
    </table>
  `},
  {id:"ref-battery-safety", title:"LiPo Battery Safety: Charging, Storage &amp; Disposal Protocols", body:`
    <p style="color:var(--dim);font-size:12.5px;margin:0 0 12px">A LiPo fire is a fast, hard-to-extinguish chemical fire, and the packs most likely to start one are exactly the ones these protocols catch early. These rules aren't optional shop suggestions &mdash; treat every one as a hard rule, every time, not just when it's convenient.</p>
    <table>
      <tr><td>Charge rate</td><td><strong>1C</strong> is the safe baseline for everyday charging (a 5000mAh pack charges at 5A). Only exceed 1C if the specific pack is explicitly rated for faster charging, and even then, treat the rating with the same skepticism as an implausible C-rating on a listing.</td></tr>
      <tr><td>Where to charge</td><td>Always inside a <strong>fireproof LiPo bag or a metal container with a tight-fitting lid</strong>, on a non-flammable surface, physically away from anything flammable. Never charge in the open on a wooden desk, carpet, or inside a backpack.</td></tr>
      <tr><td>Unattended charging</td><td><strong>Never.</strong> Not "just running to the next room" never. A charging pack gets watched by a person, full stop, for the entire charge.</td></tr>
      <tr><td>Balance charging</td><td>Use a charger that actually balance-charges each cell, not just the pack total — an unbalanced pack can read a safe total voltage while one individual cell is dangerously out of range.</td></tr>
      <tr><td>Storage voltage</td><td>Between flying sessions, store at <strong>3.80&ndash;3.85V per cell</strong> (roughly 40&ndash;60% charge) &mdash; not full charge, not empty. Most quality chargers have a dedicated storage-charge mode for exactly this. Full charge held for weeks accelerates degradation and raises risk.</td></tr>
      <tr><td>Storage environment</td><td>Cool, dry, out of direct sunlight, in a fireproof bag or metal container &mdash; not a hot car, not a garage in summer. If a pack sits unused, check its voltage roughly every 3 months and re-balance toward storage voltage if it's drifted.</td></tr>
      <tr><td>Retire immediately if</td><td>Visible swelling or puffing in any cell, a punctured or torn wrap, a sharp rise in internal resistance, or any impact/crash damage to the pack itself. These are fire-risk indicators, not cosmetic issues &mdash; a swollen pack is not something to "use up carefully."</td></tr>
      <tr><td>Field carry</td><td>Batteries travel and wait in a fire-safe LiPo bag until they're going into the aircraft &mdash; both charged packs and any pack suspected of damage after a hard landing or crash.</td></tr>
      <tr><td>Disposal</td><td>A retired LiPo is not household trash. Fully discharge it first (a dedicated LiPo discharger, or a controlled low-current discharge), then take it to a battery recycling drop-off or hazardous-waste facility that accepts lithium batteries &mdash; check locally, as accepted facilities vary by area.</td></tr>
    </table>
  `}
];

const FSA_DB_NAME = "p107_fsa_db_v1";
const FSA_STORE = "handles";
const FSA_HANDLE_KEY = "progressDirHandle";
const FSA_DISMISS_KEY = "p107_fsa_banner_dismissed_v1";
const FSA_SUPPORTED = typeof window.showDirectoryPicker === 'function';
let fsaProgressDirHandle = null;
let fsaStatus = 'unsupported'; // 'unsupported' | 'disconnected' | 'needs-permission' | 'connected'
let fsaSaveTimer = null;

function fsaOpenDb(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(FSA_DB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(FSA_STORE); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function fsaGetStoredHandle(){
  try{
    const db = await fsaOpenDb();
    return await new Promise((resolve,reject)=>{
      const tx = db.transaction(FSA_STORE,'readonly');
      const req = tx.objectStore(FSA_STORE).get(FSA_HANDLE_KEY);
      req.onsuccess = ()=>resolve(req.result||null);
      req.onerror = ()=>reject(req.error);
    });
  }catch(e){ return null; }
}
async function fsaStoreHandle(handle){
  try{
    const db = await fsaOpenDb();
    await new Promise((resolve,reject)=>{
      const tx = db.transaction(FSA_STORE,'readwrite');
      tx.objectStore(FSA_STORE).put(handle, FSA_HANDLE_KEY);
      tx.oncomplete = resolve; tx.onerror = ()=>reject(tx.error);
    });
  }catch(e){ /* IndexedDB unavailable — the connection just won't persist across reloads */ }
}

function fsaBuildSnapshot(){
  return JSON.stringify({ savedAt: new Date().toISOString(), progress, packingChecked, popupState, startDate }, null, 2);
}
function fsaApplySnapshot(data){
  if(!data || typeof data!=='object') return;
  if(data.progress && typeof data.progress==='object') progress = data.progress;
  if(data.packingChecked && typeof data.packingChecked==='object') packingChecked = data.packingChecked;
  if(data.popupState && Array.isArray(data.popupState.history)) popupState = {history:data.popupState.history, recentIds:data.popupState.recentIds||[]};
  if(data.startDate) startDate = data.startDate;
  // mirror into browser storage too, so it stays a working fallback, without re-triggering another file write
  localStorage.setItem(STORE_KEY, JSON.stringify(progress));
  localStorage.setItem(PACKING_KEY, JSON.stringify(packingChecked));
  localStorage.setItem(POPUP_KEY, JSON.stringify(popupState));
  localStorage.setItem(START_KEY, startDate);
}

function updateFolderBtn(){
  const btn = document.getElementById('folderStatusBtn');
  if(!btn) return;
  btn.classList.remove('connected','needs-attn');
  if(!FSA_SUPPORTED){ btn.style.display = 'none'; return; }
  btn.style.display = '';
  if(fsaStatus==='connected'){
    btn.textContent = '\u{1F4C1} Progress folder connected';
    btn.classList.add('connected');
  } else if(fsaStatus==='needs-permission'){
    btn.textContent = '\u{1F4C1} Reconnect Progress folder';
    btn.classList.add('needs-attn');
  } else {
    btn.textContent = '\u{1F4C1} Save progress to a folder';
  }
}

async function fsaTryReadExisting(dirHandle){
  try{
    const fh = await dirHandle.getFileHandle('progress.json');
    const file = await fh.getFile();
    return JSON.parse(await file.text());
  }catch(e){ return null; } // no file yet, or unreadable — treated as "nothing saved there yet"
}

async function fsaWriteNow(){
  if(fsaStatus!=='connected' || !fsaProgressDirHandle) return;
  try{
    const fh = await fsaProgressDirHandle.getFileHandle('progress.json', {create:true});
    const writable = await fh.createWritable();
    await writable.write(fsaBuildSnapshot());
    await writable.close();
  }catch(e){
    fsaStatus = 'needs-permission'; // permission likely lapsed — flag it, don't crash the app
    updateFolderBtn();
  }
}
function scheduleFsaSave(){
  if(!FSA_SUPPORTED || fsaStatus!=='connected') return;
  clearTimeout(fsaSaveTimer);
  fsaSaveTimer = setTimeout(fsaWriteNow, 700);
}

async function connectProgressFolder(){
  if(!FSA_SUPPORTED) return;
  let parentHandle;
  try{
    parentHandle = await window.showDirectoryPicker({id:'p107-progress', mode:'readwrite'});
  }catch(e){ return; } // user cancelled the picker
  try{
    const courseDir = await parentHandle.getDirectoryHandle('Part 107 certification training', {create:true});
    const progressDir = await courseDir.getDirectoryHandle('Progress', {create:true});
    fsaProgressDirHandle = progressDir;
    fsaStatus = 'connected';
    await fsaStoreHandle(progressDir);
    const existing = await fsaTryReadExisting(progressDir);
    if(existing){ fsaApplySnapshot(existing); renderSide(); renderMain(); }
    else await fsaWriteNow();
    localStorage.setItem(FSA_DISMISS_KEY, '1');
    hideFsaBanner();
    updateFolderBtn();
  }catch(e){
    fsaStatus = 'disconnected';
    updateFolderBtn();
  }
}

async function reconnectProgressFolder(){
  if(!fsaProgressDirHandle) return connectProgressFolder();
  try{
    const perm = await fsaProgressDirHandle.requestPermission({mode:'readwrite'});
    if(perm==='granted'){
      fsaStatus = 'connected';
      const existing = await fsaTryReadExisting(fsaProgressDirHandle);
      if(existing){ fsaApplySnapshot(existing); renderSide(); renderMain(); }
      else await fsaWriteNow();
      updateFolderBtn();
    }
  }catch(e){ /* still not permitted — leave status as-is, button stays in "needs-attn" state */ }
}

function showFsaBanner(){
  if(document.getElementById('fsaBanner')) return;
  const overlay = document.createElement('div');
  overlay.className = 'pmodal-overlay';
  overlay.id = 'fsaBanner';
  overlay.innerHTML = `
    <div class="pmodal" role="dialog" aria-modal="true" aria-label="Save progress to a folder">
      <button class="pmodal-close" id="fsaBannerClose" aria-label="Close">&times;</button>
      <div class="pmkicker">One-time setup</div>
      <div class="pmtitle">Save your progress to a real folder?</div>
      <div class="fsa-note">By default this app only saves inside your browser, which can get cleared. Pick a folder on this Chromebook (or your Google Drive) and the app will keep an up-to-date copy of your progress at <span class="fsa-path">Part 107 certification training / Progress / progress.json</span> inside it automatically, from now on. You can skip this and do it later from the button in the top-right.</div>
      <div class="pmfoot">
        <button id="fsaBannerConnect">Choose Folder</button>
        <button class="pmskip" id="fsaBannerSkip" type="button">Maybe later</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const close = ()=>{ overlay.remove(); localStorage.setItem(FSA_DISMISS_KEY,'1'); };
  document.getElementById('fsaBannerClose').onclick = close;
  document.getElementById('fsaBannerSkip').onclick = close;
  overlay.onclick = (e)=>{ if(e.target===overlay) close(); };
  document.getElementById('fsaBannerConnect').onclick = async ()=>{ overlay.remove(); await connectProgressFolder(); };
}
function hideFsaBanner(){ const b = document.getElementById('fsaBanner'); if(b) b.remove(); }

async function initFileSync(){
  updateFolderBtn();
  const btn = document.getElementById('folderStatusBtn');
  if(btn) btn.onclick = ()=>{ fsaStatus==='needs-permission' ? reconnectProgressFolder() : connectProgressFolder(); };
  if(!FSA_SUPPORTED) return;
  const handle = await fsaGetStoredHandle();
  if(!handle){
    if(!localStorage.getItem(FSA_DISMISS_KEY)) showFsaBanner();
    return;
  }
  fsaProgressDirHandle = handle;
  try{
    const perm = await handle.queryPermission({mode:'readwrite'});
    if(perm==='granted'){
      fsaStatus = 'connected';
      const existing = await fsaTryReadExisting(handle);
      if(existing){ fsaApplySnapshot(existing); renderSide(); renderMain(); }
    } else {
      fsaStatus = 'needs-permission';
    }
  }catch(e){
    fsaStatus = 'needs-permission';
  }
  updateFolderBtn();
}

/* ---------------------------------------------------------------
   RANDOM REVIEW POP-QUIZ — local-memory state (saved to this
   computer's browser storage, same mechanism as course progress)
--------------------------------------------------------------- */
const PACKING_KEY = "p107_packing_v1";
let packingChecked = {};
try{ packingChecked = JSON.parse(localStorage.getItem(PACKING_KEY)) || {}; }catch(e){ packingChecked = {}; }
function savePackingChecked(){ localStorage.setItem(PACKING_KEY, JSON.stringify(packingChecked)); scheduleFsaSave(); }

const POPUP_KEY = "p107_popup_v1";
let popupState = {history:[], recentIds:[]};
try{
  const saved = JSON.parse(localStorage.getItem(POPUP_KEY));
  if(saved && Array.isArray(saved.history)) popupState = {history:saved.history, recentIds:saved.recentIds||[]};
}catch(e){ popupState = {history:[], recentIds:[]}; }
function savePopupState(){ localStorage.setItem(POPUP_KEY, JSON.stringify(popupState)); scheduleFsaSave(); }
function popupAnsweredIds(){ return new Set(popupState.history.map(h=>h.id)); }
function pickPopupQuestion(){
  const recent = new Set(popupState.recentIds.slice(-15));
  const answered = popupAnsweredIds();
  let pool = POPUP_BANK.filter(q=>!recent.has(q.id) && !answered.has(q.id));
  if(!pool.length) pool = POPUP_BANK.filter(q=>!recent.has(q.id));
  if(!pool.length) pool = POPUP_BANK;
  return pool[Math.floor(Math.random()*pool.length)];
}
function markPopupShown(id){
  popupState.recentIds.push(id);
  if(popupState.recentIds.length>20) popupState.recentIds = popupState.recentIds.slice(-20);
  savePopupState();
}
function showPopupModal(question){
  const overlay = document.createElement('div');
  overlay.className = 'pmodal-overlay';
  overlay.innerHTML = `
    <div class="pmodal" role="dialog" aria-modal="true" aria-label="Random review question">
      <button class="pmodal-close" id="pmClose" aria-label="Close">&times;</button>
      <div class="pmkicker">Random Review &middot; ${question.topic}</div>
      <div class="pmtitle">${question.q}</div>
      <div id="pmChoices"></div>
      <div class="pmfoot">
        <button id="pmCheck">Check Answer</button>
        <button class="pmskip" id="pmSkip" type="button">Skip for now</button>
        <span class="score" id="pmHint"></span>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  markPopupShown(question.id);
  const choicesWrap = overlay.querySelector('#pmChoices');
  question.choices.forEach((c,ci)=>{
    const label = document.createElement('label');
    label.className = 'choice'; label.dataset.ci = ci;
    label.innerHTML = `<input type="radio" name="pmq" value="${ci}"><span>${c}</span>`;
    choicesWrap.appendChild(label);
  });
  const closeModal = ()=>{ overlay.remove(); };
  overlay.querySelector('#pmClose').onclick = closeModal;
  overlay.querySelector('#pmSkip').onclick = closeModal;
  overlay.onclick = (e)=>{ if(e.target===overlay) closeModal(); };
  overlay.querySelector('#pmCheck').onclick = ()=>{
    const sel = choicesWrap.querySelector('input:checked');
    if(!sel){
      const hint = overlay.querySelector('#pmHint');
      hint.textContent = 'Pick an answer first.';
      hint.style.color = 'var(--warn)';
      return;
    }
    const chosen = parseInt(sel.value,10);
    const isRight = chosen===question.a;
    choicesWrap.querySelectorAll('.choice').forEach(ch=>{
      const ci = parseInt(ch.dataset.ci,10);
      ch.querySelectorAll('input').forEach(i=>i.disabled=true);
      if(ci===question.a) ch.classList.add('correct');
      else if(ci===chosen) ch.classList.add('incorrect');
    });
    const exp = document.createElement('div');
    exp.className = 'qexp'; exp.style.display='block';
    exp.innerHTML = `<span class="verdict ${isRight?'ok':'no'}">${isRight?'Correct.':'Not quite.'}</span>${question.exp}`;
    overlay.querySelector('.pmodal').insertBefore(exp, overlay.querySelector('.pmfoot'));
    overlay.querySelector('#pmCheck').style.display='none';
    overlay.querySelector('#pmSkip').textContent = 'Continue to app';
    popupState.history.unshift({
      id:question.id, topic:question.topic, q:question.q,
      chosenText:question.choices[chosen], correctText:question.choices[question.a],
      isRight, exp:question.exp, ts:new Date().toISOString()
    });
    if(popupState.history.length>500) popupState.history = popupState.history.slice(0,500);
    savePopupState();
    if(current.kind==='review') renderMain();
  };
}
function launchPopupQuiz(){ showPopupModal(pickPopupQuestion()); }

function allItems(){
  const items=[];
  MODULES.forEach(m=>{
    m.lessons.forEach(l=>items.push({modId:m.id, kind:'lesson', id:l.id}));
    items.push({modId:m.id, kind:'quiz', id:m.id+"_final"});
  });
  return items;
}
function totalCount(){ return allItems().length; }
function doneCount(){ return allItems().filter(it=>progress[it.id]&&progress[it.id].done).length; }
function saveProgress(){ localStorage.setItem(STORE_KEY, JSON.stringify(progress)); scheduleFsaSave(); }
function ensureEntry(id){
  if(!progress[id]) progress[id] = {done:false, score:0, total:0, answers:{}, lastAttemptIds:[], recentIds:[], note:''};
  /* answers used to be a position-indexed array against a fixed quiz array; now that quizzes
     sample a subset from a larger pool each attempt, answers is keyed by each question's stable
     id instead, so history survives across attempts that show a different subset. */
  if(progress[id].answers===undefined || Array.isArray(progress[id].answers)) progress[id].answers={};
  if(progress[id].lastAttemptIds===undefined) progress[id].lastAttemptIds=[];
  if(progress[id].recentIds===undefined) progress[id].recentIds=[];
  if(progress[id].note===undefined) progress[id].note='';
  return progress[id];
}
/* Picks a varied subset from a question pool that's been doubled relative to what's actually
   shown per attempt (pool.length is always 2x the shown count). Avoids repeating whatever was
   shown last time for this quiz key, so a retake — including retaking a failed module quiz —
   doesn't ask the same set again. Falls back to the full pool if avoidance would leave too few
   candidates (mirrors the Random Review pop-quiz's own recency-avoidance pattern). */
function pickQuizSet(pool, key){
  const count = Math.max(1, Math.round(pool.length/2));
  const entry = ensureEntry(key);
  const recent = new Set(entry.recentIds.slice(-count));
  let candidates = pool.filter(q=>!recent.has(q.id));
  if(candidates.length < count) candidates = pool.slice();
  const shuffled = candidates.slice();
  for(let i=shuffled.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [shuffled[i],shuffled[j]] = [shuffled[j],shuffled[i]];
  }
  const chosen = shuffled.slice(0,count);
  entry.recentIds = chosen.map(q=>q.id).concat(entry.recentIds).slice(0,count*2);
  saveProgress();
  return chosen;
}
function findLesson(modId,lessonId){
  const m = MODULES.find(x=>x.id===modId);
  return m.lessons.find(l=>l.id===lessonId);
}
function runningHead(right){
  return `<div class="runninghead"><span>Part 107 Ground School</span><span><b>${right}</b></span></div>`;
}

function renderSide(){
  const side = document.getElementById('side');
  side.innerHTML = '';
  const nav = document.createElement('div'); nav.className='navbtns';
  [['home','Home'],['reference','Reference Sheet'],['review','My Review & Notes'],['packing','Field Trip Kit']].forEach(([k,label])=>{
    const b = document.createElement('div');
    b.className='navbtn'+(current.kind===k?' active':'');
    b.innerHTML = `<span class="dot"></span>${label}`;
    b.tabIndex=0; b.setAttribute('role','button');
    const go = ()=>{ current={kind:k}; renderMain(); renderSide(); };
    b.onclick=go;
    b.onkeydown=(e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } };
    nav.appendChild(b);
  });
  side.appendChild(nav);
  SEMESTERS.forEach(sem=>{
    const semHead = document.createElement('div'); semHead.className='semhead';
    const semDone = sem.modules.reduce((n,m)=> n + m.lessons.filter(l=>progress[l.id]&&progress[l.id].done).length + ((progress[m.id+'_final']&&progress[m.id+'_final'].done)?1:0), 0);
    const semTotal = sem.modules.reduce((n,m)=> n + m.lessons.length + 1, 0);
    semHead.innerHTML = `<span>${sem.short}</span><span class="semhead-pct">${semDone}/${semTotal}</span>`;
    side.appendChild(semHead);
    sem.modules.forEach(m=>{
      const modDiv = document.createElement('div'); modDiv.className='module';
      const total = m.lessons.length+1;
      const done = m.lessons.filter(l=>progress[l.id]&&progress[l.id].done).length + ((progress[m.id+'_final']&&progress[m.id+'_final'].done)?1:0);
      const head = document.createElement('div'); head.className='modhead';
      head.tabIndex=0; head.setAttribute('role','button'); head.setAttribute('aria-expanded', expanded[m.id]?'true':'false');
      head.innerHTML = `<div><div class="mtitle">${m.title}</div><div class="mweek">${m.week}</div></div><div class="mpct">${done}/${total}</div>`;
      const toggleMod = ()=>{ expanded[m.id]=!expanded[m.id]; renderSide(); };
      head.onclick = toggleMod;
      head.onkeydown = (e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggleMod(); } };
      modDiv.appendChild(head);
      const lwrap = document.createElement('div'); lwrap.className='lessons'+(expanded[m.id]?'':' hidden');
      m.lessons.forEach(l=>{
        const d = progress[l.id];
        const item = document.createElement('div');
        item.className='lesson-item'+((current.kind==='lesson'&&current.lessonId===l.id)?' active':'');
        item.tabIndex=0; item.setAttribute('role','button');
        item.innerHTML = `<span class="chk ${d&&d.done?'done':''}">${d&&d.done?'✓':''}</span>${l.title}`;
        const goLesson = ()=>{ current={modId:m.id, kind:'lesson', lessonId:l.id}; renderMain(); renderSide(); };
        item.onclick=goLesson;
        item.onkeydown=(e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); goLesson(); } };
        lwrap.appendChild(item);
      });
      const qd = progress[m.id+'_final'];
      const qitem = document.createElement('div');
      qitem.className='lesson-item quiz'+((current.kind==='quiz'&&current.modId===m.id)?' active':'');
      qitem.tabIndex=0; qitem.setAttribute('role','button');
      qitem.innerHTML = `<span class="chk ${qd&&qd.done?'done':''}">${qd&&qd.done?'✓':''}</span>Module quiz${qd?` — ${qd.score}/${qd.total}`:''}`;
      const goQuiz = ()=>{ current={modId:m.id, kind:'quiz'}; renderMain(); renderSide(); };
      qitem.onclick=goQuiz;
      qitem.onkeydown=(e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); goQuiz(); } };
      lwrap.appendChild(qitem);
      modDiv.appendChild(lwrap);
      side.appendChild(modDiv);
    });
  });
  const pct = totalCount()? Math.round(100*doneCount()/totalCount()) : 0;
  document.getElementById('pctlabel').textContent = pct+'% · '+doneCount()+'/'+totalCount();
  document.getElementById('pctfill').style.width = pct+'%';
}

function paceCardHtml(pct){
  const started = new Date(startDate);
  const weeksElapsed = Math.max(1, Math.floor((Date.now()-started.getTime())/(7*24*60*60*1000))+1);
  const nominalWeek = Math.min(TOTAL_PROGRAM_WEEKS, weeksElapsed);
  const nominalPct = Math.round(100*Math.min(1, nominalWeek/TOTAL_PROGRAM_WEEKS));
  const aheadBy = pct - nominalPct;
  let msg;
  if(weeksElapsed<=1 && doneCount()===0){
    msg = `A 24-week program at a steady pace — Semester 1 (building) runs 14 weeks, Semester 2 (certification) runs 10. No clock starts ticking until you do.`;
  } else if(aheadBy>=8){
    msg = `You're running ahead of the ${TOTAL_PROGRAM_WEEKS}-week pace — nominally in week ${nominalWeek}, but you've covered more than that.`;
  } else if(aheadBy<=-15){
    msg = `Behind the nominal week-${nominalWeek}-of-${TOTAL_PROGRAM_WEEKS} pace — no penalty for that here, just worth knowing before you plan a test date.`;
  } else {
    msg = `Nominally in week ${nominalWeek} of ${TOTAL_PROGRAM_WEEKS}, on a steady-pace read of when you started.`;
  }
  return `<div class="pacecard"><div class="clabel">Pacing</div>${msg}</div>`;
}

  main.innerHTML = `

  document.getElementById('refSearch').addEventListener('click', e=>e.stopPropagation());
  renderRefList();
  main.addEventListener('click', refClickHandler);
}
function refClickHandler(e){
  const t = e.target.closest('[data-ref]');
  if(t){ goRef(t.dataset.ref); }
}
function renderRefList(){
  const list = document.getElementById('refList');
  const q = refFilter.trim().toLowerCase();
  const filtered = REFERENCE.filter(r=> !q || (r.title+' '+r.body).toLowerCase().includes(q));
  if(!filtered.length){ list.innerHTML = `<div class="refempty">No reference entries match "${refFilter}".</div>`; return; }
  list.innerHTML = filtered.map(r=>`<div class="refsec" id="${r.id}"><h3>${r.title}</h3>${r.body}</div>`).join('');
}
function goRef(id){
  current = {kind:'reference'};

/* Every module/final-quiz question whose most recent saved attempt was wrong.
   Excludes the Random Review pop-quiz bank, which has its own separate practice flow. */
function collectWrongQuestions(){
  const wrong = [];
  MODULES.forEach(m=>{
    m.lessons.forEach(l=>{
      const d = progress[l.id];
      if(d && d.answers && !Array.isArray(d.answers)){
        const byId = {}; l.quiz.forEach(q=>{ byId[q.id]=q; });
        Object.keys(d.answers).forEach(qid=>{
          const a = d.answers[qid];
          if(a && !a.isRight && byId[qid]){
            wrong.push({modId:m.id, modTitle:m.title, key:l.id, sourceTitle:l.title, qId:qid, question:byId[qid]});
          }
        });
      }
    });
    const fd = progress[m.id+'_final'];
    if(fd && fd.answers && !Array.isArray(fd.answers)){
      const byId = {}; m.finalQuiz.forEach(q=>{ byId[q.id]=q; });
      Object.keys(fd.answers).forEach(qid=>{
        const a = fd.answers[qid];
        if(a && !a.isRight && byId[qid]){
          wrong.push({modId:m.id, modTitle:m.title, key:m.id+'_final', sourceTitle:'Module Quiz: '+m.title, qId:qid, question:byId[qid]});
        }
      });
    }
  });
  return wrong;
}

function renderReviewTest(){
  const main = document.getElementById('main');
  const wrongItems = collectWrongQuestions();
  main.innerHTML = `
    ${runningHead('Review Test — Questions You Got Wrong')}
    <div class="crumb">Departments &middot; Your Work</div>
    <h2 class="ltitle">Review Test</h2>
    <p style="color:var(--dim);margin-bottom:16px">${wrongItems.length} question${wrongItems.length===1?'':'s'} pulled from your lesson and module quiz history — anything whose most recent attempt was wrong. Answer one correctly here and it drops off this list next time; it doesn't touch a quiz's overall saved score beyond updating that one question.</p>
    ${wrongItems.length ? `
    <div class="quizsec" style="border-top:none;padding-top:0">
      <div id="qwrapReviewTest"></div>
      <div class="btnrow">
        <button id="checkReviewTestBtn">Check Answers</button>
        <span class="score" id="scoreLblReviewTest"></span>
      </div>
    </div>
    ` : `<div class="empty">Nothing wrong to review right now — answer some knowledge checks, and anything you miss will show up here.</div>`}
    <div class="navrow">
      <button id="backToReviewBtn">&larr; Back to My Review &amp; Notes</button>
    </div>
  `;
  document.getElementById('backToReviewBtn').onclick = ()=>{ current = {kind:'review'}; renderMain(); renderSide(); };
  if(!wrongItems.length) return;

  const qwrap = document.getElementById('qwrapReviewTest');
  wrongItems.forEach((item,qi)=>{
    const q = item.question;
    const qd = document.createElement('div'); qd.className='qitem'; qd.dataset.qi=qi;
    qd.innerHTML = `<div style="color:var(--dim);font-size:12px;margin-bottom:4px">${item.modTitle} &mdash; ${item.sourceTitle}</div>` +
      `<div class="qtext">${qi+1}. ${q.q}</div>` +
      q.choices.map((c,ci)=>`
        <label class="choice" data-ci="${ci}">
          <input type="radio" name="rtq${qi}" value="${ci}">
          <span>${c}</span>
        </label>`).join('') +
      `<div class="qexp"></div>`;
    qwrap.appendChild(qd);
  });

  document.getElementById('checkReviewTestBtn').onclick = ()=>{
    let correct = 0;
    const items = qwrap.querySelectorAll('.qitem');
    let allAnswered = true;
    items.forEach(qd=>{ if(!qd.querySelector('input:checked')) allAnswered=false; });
    if(!allAnswered){
      const lbl = document.getElementById('scoreLblReviewTest');
      lbl.textContent = 'Answer every question first.';
      lbl.style.color = 'var(--warn)';
      return;
    }
    items.forEach((qd,qi)=>{
      const item = wrongItems[qi];
      const q = item.question;
      const sel = qd.querySelector('input:checked');
      const chosen = parseInt(sel.value,10);
      const isRight = chosen===q.a;
      if(isRight) correct++;
      qd.classList.add('graded');
      qd.querySelectorAll('.choice').forEach(ch=>{
        const ci = parseInt(ch.dataset.ci,10);
        ch.querySelectorAll('input').forEach(i=>i.disabled=true);
        if(ci===q.a) ch.classList.add('correct');
        else if(ci===chosen) ch.classList.add('incorrect');
      });
      const exp = qd.querySelector('.qexp');
      exp.innerHTML = `<span class="verdict ${isRight?'ok':'no'}">${isRight?'Correct.':'Not quite.'}</span>${q.exp}`;
      const entry = ensureEntry(item.key);
      entry.answers[item.qId] = {q:q.q, chosenText:q.choices[chosen], correctText:q.choices[q.a], isRight, exp:q.exp};
      /* "score/total" elsewhere means "on last attempt" — only bump it here if this question
         was actually part of that last attempt; otherwise leave it alone so the last-attempt
         record stays honest even though the fix is now saved (and it'll drop off this list). */
      if(entry.lastAttemptIds && entry.lastAttemptIds.includes(item.qId)){
        entry.score = entry.lastAttemptIds.filter(id=>entry.answers[id]&&entry.answers[id].isRight).length;
      }
    });
    saveProgress();
    renderSide();
    document.getElementById('checkReviewTestBtn').style.display='none';
    const lbl = document.getElementById('scoreLblReviewTest');
    lbl.style.color = '';
    lbl.innerHTML = `Score: <b>${correct}/${wrongItems.length}</b>`;
    const banner = document.createElement('div');
    banner.className='done-banner';
    banner.textContent = correct===wrongItems.length
      ? "Every one of these corrected — none of them will show up on your next review test."
      : "Whatever you got right just now drops off next time; anything still wrong stays on the list.";
    document.querySelector('.quizsec').appendChild(banner);
  };
}

  MODULES.forEach(m=>{

    parts.forEach(p=>{
      const d = progress[p.id];
      if(!d || (!d.done && !d.note)) return;
      let qHtml = '';
      (d.answers||[]).forEach(a=>{
        if(reviewFilter.missedOnly && a.isRight) return;
        const blob = (a.q+' '+a.chosenText+' '+a.correctText+' '+a.exp).toLowerCase();
        if(q && !blob.includes(q)) return;
        qHtml += `<div class="reviewq">
          <div class="rqtext">${a.q}</div>
          <div class="ryour ${a.isRight?'ok':''}">Your answer: ${a.chosenText} ${a.isRight?'(correct)':'(incorrect)'}</div>
          ${a.isRight?'':`<div class="rcorrect">Correct answer: ${a.correctText}</div>`}
          <div class="rexp">${a.exp}</div>
        </div>`;
      });
      const noteMatches = !q || (d.note||'').toLowerCase().includes(q);
      const showNote = d.note && noteMatches && !reviewFilter.missedOnly;
      if(!qHtml && !showNote) return;
      any = true;
      html += `<div class="reviewcard">
        <h4 data-goto="${m.id}|${p.isQuiz?'quiz':'lesson'}|${p.id}">${m.title} — ${p.title}</h4>
        <div class="rmeta">${d.done? (d.score+'/'+d.total+' on last attempt') : 'Not yet graded'}</div>
        ${showNote?`<div class="rnote">${escapeHtml(d.note)}</div>`:''}
        ${qHtml}
      </div>`;
    });
  });
  if(!any && !popupState.history.length){
    html += `<div class="empty">Nothing here yet. Answer a knowledge check, a random review question, or jot a note on any lesson, and it'll show up here for review.</div>`;

  });
}

function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function exportNotes(){
  let out = "PART 107 GROUND SCHOOL — MY REVIEW & NOTES\nExported "+new Date().toLocaleDateString()+"\n\n";
  if(popupState.history.length){
    const correct = popupState.history.filter(h=>h.isRight).length;
    out += "=== Random Review — Pop Quiz History ===\n";
    out += correct+"/"+popupState.history.length+" correct overall\n";
    popupState.history.forEach(h=>{
      out += "\n["+new Date(h.ts).toLocaleDateString()+" · "+h.topic+"]\nQ: "+h.q+"\nYour answer: "+h.chosenText+(h.isRight?" (correct)":" (incorrect — correct answer: "+h.correctText+")")+"\n"+h.exp+"\n";
    });
    out += "\n";
  }
  MODULES.forEach(m=>{
    const parts = [...m.lessons.map(l=>({title:l.title, id:l.id})), {title:'Module quiz', id:m.id+'_final'}];
    let modHeaderWritten = false;
    parts.forEach(p=>{
      const d = progress[p.id];
      if(!d || (!d.done && !d.note)) return;
      if(!modHeaderWritten){ out += "\n=== "+m.title+" ("+m.week+") ===\n"; modHeaderWritten=true; }
      out += "\n-- "+p.title+" --\n";
      if(d.done) out += "Score: "+d.score+"/"+d.total+"\n";
      if(d.note) out += "Notes: "+d.note+"\n";
      (d.answers||[]).forEach(a=>{
        out += "\nQ: "+a.q+"\nYour answer: "+a.chosenText+(a.isRight?" (correct)":" (incorrect — correct answer: "+a.correctText+")")+"\n"+a.exp+"\n";
      });
    });
  });
  const blob = new Blob([out], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url; link.download = 'part-107-my-notes.txt';
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

function renderQuiz(questions, key, isModuleQuiz){
  const qwrap = document.getElementById('qwrap');
  qwrap.innerHTML='';
  questions.forEach((q,qi)=>{
    const qd = document.createElement('div'); qd.className='qitem'; qd.dataset.qi=qi;
    qd.innerHTML = `<div class="qtext">${qi+1}. ${q.q}</div>` +
      q.choices.map((c,ci)=>`
        <label class="choice" data-ci="${ci}">
          <input type="radio" name="q${qi}" value="${ci}">
          <span>${c}</span>
        </label>`).join('') +
      `<div class="qexp"></div>`;
    qwrap.appendChild(qd);
  });
  document.getElementById('checkBtn').onclick = ()=>gradeQuiz(questions, key, isModuleQuiz);
}

function gradeQuiz(questions, key, isModuleQuiz){
  let correct=0;
  const items = document.querySelectorAll('#qwrap .qitem');
  let allAnswered = true;
  items.forEach((qd)=>{
    const sel = qd.querySelector('input[type=radio]:checked');
    if(!sel){ allAnswered=false; }
  });
  if(!allAnswered){
    document.getElementById('scoreLbl').textContent = 'Answer every question first.';
    document.getElementById('scoreLbl').style.color = 'var(--warn)';
    return;
  }
  const answersById = {};
  items.forEach((qd,qi)=>{
    const q = questions[qi];
    const sel = qd.querySelector('input[type=radio]:checked');
    const chosen = parseInt(sel.value,10);
    const isRight = chosen===q.a;
    if(isRight) correct++;
    qd.classList.add('graded');
    qd.querySelectorAll('.choice').forEach(ch=>{
      const ci = parseInt(ch.dataset.ci,10);
      ch.querySelectorAll('input').forEach(i=>i.disabled=true);
      if(ci===q.a) ch.classList.add('correct');
      else if(ci===chosen) ch.classList.add('incorrect');
    });
    const exp = qd.querySelector('.qexp');
    exp.innerHTML = `<span class="verdict ${isRight?'ok':'no'}">${isRight?'Correct.':'Not quite.'}</span>${q.exp}`;
    answersById[q.id] = {q:q.q, chosenText:q.choices[chosen], correctText:q.choices[q.a], isRight, exp:q.exp};
  });
  document.getElementById('checkBtn').style.display='none';
  document.getElementById('retryBtn').style.display='inline-block';
  document.getElementById('retryBtn').onclick = ()=>renderMain();
  const missedIdx = questions.map((q,qi)=>qi).filter(qi=>{
    const qd = items[qi];
    const sel = qd.querySelector('input[type=radio]:checked');
    return parseInt(sel.value,10)!==questions[qi].a;
  });
  const retryMissedBtn = document.getElementById('retryMissedBtn');
  if(retryMissedBtn){
    if(missedIdx.length>0 && missedIdx.length<questions.length){
      retryMissedBtn.style.display='inline-block';
      retryMissedBtn.textContent = `Retry ${missedIdx.length} Missed`;
      retryMissedBtn.onclick = ()=>retryMissedOnly(questions, missedIdx, key, isModuleQuiz);
    } else {
      retryMissedBtn.style.display='none';
    }
  }
  const lbl = document.getElementById('scoreLbl');
  lbl.style.color = '';
  lbl.innerHTML = `Score: <b>${correct}/${questions.length}</b>`;
  const entry = ensureEntry(key);
  entry.done = true; entry.score = correct; entry.total = questions.length;
  entry.lastAttemptIds = questions.map(q=>q.id);
  entry.answers = Object.assign({}, entry.answers, answersById);
  saveProgress();
  renderSide();
  const pct = Math.round(100*correct/questions.length);
  const banner = document.createElement('div');
  banner.className='done-banner';
  banner.textContent = pct===100
    ? (isModuleQuiz ? "Perfect score on the module quiz — that's real command of the material." : "Perfect. Every question, right on the first pass.")
    : pct>=80
    ? (isModuleQuiz ? "Strong module score — that content is locked in. Ready for the next one." : "Solid — marked complete. On to the next lesson.")
    : "Marked complete either way — but consider retaking this before your practice tests. Nothing here is final until exam day.";
  document.querySelector('.quizsec').appendChild(banner);
}

function retryMissedOnly(fullQuestions, missedIdx, key, isModuleQuiz){
  const main = document.getElementById('main');
  const wrap = document.createElement('div');
  wrap.className='quizsec';
  wrap.style.marginTop='24px';
  wrap.innerHTML = `
    <h3>Retry — Missed Questions Only</h3>
    <div class="qsub">A focused re-pass on what you got wrong. This practice round doesn't overwrite your saved score.</div>
    <div id="qwrapMissed"></div>
    <div class="btnrow">
      <button id="checkMissedBtn">Check Answers</button>
      <span class="score" id="scoreLblMissed"></span>
    </div>
  `;
  document.querySelector('.quizsec').insertAdjacentElement('afterend', wrap);
  wrap.scrollIntoView({behavior:'smooth', block:'start'});
  const qwrap = wrap.querySelector('#qwrapMissed');
  const subset = missedIdx.map(i=>fullQuestions[i]);
  subset.forEach((q,qi)=>{
    const qd = document.createElement('div'); qd.className='qitem'; qd.dataset.qi=qi;
    qd.innerHTML = `<div class="qtext">${qi+1}. ${q.q}</div>` +
      q.choices.map((c,ci)=>`
        <label class="choice" data-ci="${ci}">
          <input type="radio" name="miss${qi}" value="${ci}">
          <span>${c}</span>
        </label>`).join('') +
      `<div class="qexp"></div>`;
    qwrap.appendChild(qd);
  });
  wrap.querySelector('#checkMissedBtn').onclick = ()=>{
    let correct=0;
    const items = qwrap.querySelectorAll('.qitem');
    let allAnswered = true;
    items.forEach(qd=>{ if(!qd.querySelector('input:checked')) allAnswered=false; });
    if(!allAnswered){
      wrap.querySelector('#scoreLblMissed').textContent = 'Answer every question first.';
      wrap.querySelector('#scoreLblMissed').style.color = 'var(--warn)';
      return;
    }
    items.forEach((qd,qi)=>{
      const q = subset[qi];
      const sel = qd.querySelector('input:checked');
      const chosen = parseInt(sel.value,10);
      const isRight = chosen===q.a;
      if(isRight) correct++;
      qd.classList.add('graded');
      qd.querySelectorAll('.choice').forEach(ch=>{
        const ci = parseInt(ch.dataset.ci,10);
        ch.querySelectorAll('input').forEach(i=>i.disabled=true);
        if(ci===q.a) ch.classList.add('correct');
        else if(ci===chosen) ch.classList.add('incorrect');
      });
      const exp = qd.querySelector('.qexp');
      exp.innerHTML = `<span class="verdict ${isRight?'ok':'no'}">${isRight?'Correct.':'Not quite.'}</span>${q.exp}`;
    });
    wrap.querySelector('#checkMissedBtn').style.display='none';
    const lbl = wrap.querySelector('#scoreLblMissed');
    lbl.style.color = '';
    lbl.innerHTML = `Score on missed questions: <b>${correct}/${subset.length}</b>`;
  };
}

function wireNav(){
  const items = allItems();
  const idx = items.findIndex(it=> current.kind==='lesson' ? (it.kind==='lesson'&&it.id===current.lessonId) : (it.kind==='quiz'&&it.modId===current.modId));
  document.getElementById('prevBtn').disabled = idx<=0;
  document.getElementById('nextBtn').disabled = idx>=items.length-1;
  document.getElementById('prevBtn').onclick=()=>{
    if(idx<=0) return;
    const it = items[idx-1];
    current = it.kind==='lesson' ? {modId:it.modId, kind:'lesson', lessonId:it.id} : {modId:it.modId, kind:'quiz'};
    renderMain(); renderSide();
  };
  document.getElementById('nextBtn').onclick=()=>{
    if(idx>=items.length-1) return;
    const it = items[idx+1];
    current = it.kind==='lesson' ? {modId:it.modId, kind:'lesson', lessonId:it.id} : {modId:it.modId, kind:'quiz'};
    renderMain(); renderSide();
  };
}

renderSide();
renderMain();
launchPopupQuiz();
initFileSync();
</script>
