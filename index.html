      {id:"b5l2_q4", q:"Why might a flight controller board that runs Betaflight perfectly well be unable to run ArduCopter at all?", choices:["Betaflight boards use a different processor architecture entirely", "ArduCopter requires more flash memory than many small racing-oriented Betaflight boards have", "ArduCopter cannot be installed via USB, only telemetry", "Betaflight boards lack an accelerometer"], a:1, exp:"ArduCopter's firmware and logging need meaningfully more flash memory than many small Betaflight racing boards provide, even when the processor family matches."},
      {id:"b5l2_q5", q:"Which symptom does the lesson tie specifically to a bad accelerometer calibration, as opposed to a bad compass or ESC calibration?", choices:["One motor lagging behind the others", "A slow heading drift over time", "An unlevel hover", "A dead GPS fix"], a:2, exp:"The lesson ties each mis-calibration to a distinct symptom: bad accel cal shows up as an unlevel hover, bad compass cal as heading drift, bad ESC cal as a lagging motor."},
      {id:"b5l2_q6", q:"Before trusting a Betaflight-oriented board to run ArduCopter, what should you check rather than assume?", choices:["The board's resale value", "Whether the board supports Bluetooth", "Whether the board has ever been used with QGroundControl before", "The board's compatibility against ArduPilot's own published hardware compatibility list, including flash size"], a:3, exp:"Not every Betaflight board has an ArduPilot port, and flashing an incompatible target can brick it \u2014 check the published compatibility list rather than assuming."}]},
    {id:"b5l3", title:"GPS & Compass: Reading the Numbers Before You Trust Them", content:`
      <p>GPS gives ArduCopter position; the compass gives it heading. Both feed the EKF that everything from Loiter to Auto missions depends on, and both are far more fragile than pilots coming from manual Betaflight flying tend to expect.</p>
      <p>The compass is a magnetometer &mdash; it reads the direction of magnetic north, and it cannot tell the difference between the Earth's field and any other magnetic field nearby. <strong>Power wires</strong> carrying high current generate their own field, which is why the GPS/compass module sits on a mast, away from the power distribution board and ESCs. Speaker magnets, ferrous tool boxes, steel-reinforced workbenches, and even a nearby laptop can all throw off a calibration performed in the wrong spot. Calibrate outdoors, away from vehicles, buildings, and metal, or the compass will "learn" interference as if it were part of the Earth's field &mdash; and then carry that error with it into every flight.</p>
      <div class="tip"><div class="clabel">Case Study</div>A pilot ran compass calibration on the kitchen table, laptop open beside the aircraft to watch the progress bar. It completed clean, no errors. In the field the next day, the quad launched fine in Stabilize, but the moment Loiter was engaged it began carving a slow, widening circle instead of holding position &mdash; a fly-away arrested only by switching back to Stabilize and landing manually. The laptop's power supply and speaker magnets had been close enough to bias the calibration just enough to throw off heading estimation outdoors, where the error compounded instead of canceling out.</div>
      <p>That widening, corkscrewing drift has a name: <strong>toilet bowling</strong>. It happens when the EKF's position or heading estimate is subtly wrong, so the aircraft's correction for perceived drift is itself wrong, and each correction feeds the next error &mdash; producing a slow spiral that gets worse, not better, the longer the mode stays engaged. Bad compass calibration is the most common cause, but poor GPS quality (weak signal, low satellite count, high HDOP) can produce the same symptom by corrupting the position half of the estimate instead of the heading half.</p>
      <p>Which is why <strong>HDOP</strong> (Horizontal Dilution of Precision &mdash; lower is better, it measures how good the satellite geometry is for a position fix) and <strong>satellite count</strong> aren't numbers to glance past on the GCS home screen. Treat them as go/no-go criteria: ArduCopter's own default threshold considers HDOP under <span class="keyfact">2.0</span> acceptable and flags worse, but for anything you're trusting with Loiter, Auto, or RTL, look for HDOP closer to <span class="keyfact">1.0</span> and at least <span class="keyfact">8 satellites</span> locked before arming, not the bare minimum of 6 ArduCopter requires to arm at all. A marginal fix might arm the aircraft; it won't hold position cleanly once airborne. If HDOP or satellite count is sitting at the margin at the field, don't launch into a GPS-dependent mode hoping it improves in the air &mdash; wait a few minutes in an open area with clear sky view (satellite geometry genuinely does improve as more satellites rise above the horizon), or relocate somewhere with less overhead obstruction (tree canopy, nearby buildings). If it hasn't cleared up within a reasonable wait, fly that session in Stabilize or AltHold instead rather than trusting Loiter or Auto to a fix you already know is marginal.</p>
      <div class="tip"><div class="clabel">Hands-On</div>Before your next GPS-enabled flight, actually read the HDOP and satellite-count fields on your GCS home screen instead of just watching for the "GPS: 3D Fix" text to turn green. Note what a clean sky, full lock looks like numerically, so you recognize a marginal one later.</div>
    `,
    quiz:[
      {id:"b5l3_q1", q:"Why is compass calibration uniquely sensitive to where and how it's performed?",
       choices:["It isn't — location has no effect on the result","A magnetometer can't distinguish Earth's magnetic field from nearby interference like power wires or magnets, so it learns any nearby field as if it were north","Compass calibration only matters for fixed-wing aircraft","It only matters at high altitude"],
       a:1, exp:"The compass reads magnetic field direction with no way to filter out local sources — power wiring, speaker magnets, laptops, and steel structures all bias the reading if calibration is done near them."},
      {id:"b5l3_q2", q:"What is \"toilet bowling\" in ArduCopter, and what commonly causes it?",
       choices:["A deliberate landing pattern; caused by low battery","A slow, widening circular drift caused by the EKF correcting against a subtly wrong position or heading estimate — often from bad compass calibration or poor GPS quality","A firmware crash; caused by ESC failure","A radio interference pattern; caused by 2.4 GHz Wi-Fi"],
       a:1, exp:"Toilet bowling is a self-reinforcing drift: the aircraft corrects for perceived error using an estimate that's itself wrong, so each correction compounds instead of resolving."},
      {id:"b5l3_q3", q:"What's the right way to treat HDOP and satellite count before an autonomous-mode flight?",
       choices:["Ignore them as long as the GPS icon shows any fix at all","Treat them as go/no-go preflight criteria — look for HDOP well under 2.0 and more satellites than the bare arming minimum before trusting Loiter, Auto, or RTL","They only matter for fixed-wing aircraft","They're irrelevant once the aircraft has armed successfully"],
       a:1, exp:"Arming only requires a marginal fix (roughly 6 satellites, HDOP under 2.0 by ArduCopter default); reliable autonomous flight deserves a materially better fix than the bare minimum."}
    ,
      {id:"b5l3_q4", q:"In the case study, what physical action stopped the fly-away caused by bad compass calibration?", choices:["Waiting for the battery failsafe to trigger RTL", "Increasing throttle to climb above the interference", "Power-cycling the flight controller mid-flight", "Switching back to Stabilize and landing manually"], a:3, exp:"The pilot regained control by switching out of Loiter \u2014 which depends on the bad calibration \u2014 into Stabilize, which needs no GPS or compass position, and landed manually."},
      {id:"b5l3_q5", q:"What's the gap between the bare minimum ArduCopter requires to arm and what the lesson recommends before trusting Loiter, Auto, or RTL?", choices:["Arming needs 6 satellites and HDOP under 2.0; trusted autonomous flight wants closer to 8+ satellites and HDOP near 1.0", "Arming needs 4 satellites; trusted flight needs 6", "Arming and trusted autonomous flight require the same GPS quality", "Arming needs HDOP under 1.0; autonomous flight only needs under 2.0"], a:0, exp:"ArduCopter will arm on a marginal fix (around 6 satellites, HDOP under 2.0) \u2014 but the lesson recommends a materially better fix, closer to 8 satellites and HDOP near 1.0, before trusting GPS-dependent modes."},
      {id:"b5l3_q6", q:"If HDOP and satellite count are marginal at the field and don't improve after a reasonable wait, what does the lesson recommend?", choices:["Fly the mission in Auto anyway since it's pre-planned", "Abort the flight session entirely and go home", "Fly that session in Stabilize or AltHold instead of trusting Loiter or Auto to a marginal fix", "Manually override the HDOP threshold in the GCS settings"], a:2, exp:"Rather than trust a known-marginal GPS fix to a position-holding mode, the lesson recommends falling back to a mode that doesn't depend on GPS at all for that session."}]},
    {id:"b5l4", title:"Flight Modes & Building a Mission", content:`
      <p>ArduCopter's flight modes form a practical hierarchy from most-manual to most-autonomous, and knowing where each one sits &mdash; and what it does if GPS drops out mid-flight &mdash; matters more than memorizing the full mode list.</p>
      <ul>
        <li><strong>Stabilize</strong> &mdash; self-levels roll and pitch, but you control everything else directly, including holding altitude and position with your own throttle and stick input. No GPS required or used.</li>
        <li><strong>AltHold</strong> &mdash; adds barometer-based altitude hold on top of Stabilize; throttle stick now controls climb/descent rate rather than raw motor output. Still no GPS dependency.</li>
        <li><strong>Loiter</strong> &mdash; the first GPS-dependent mode: holds position and altitude with no stick input, and lets you fly relative to that held position when you do give input. This is where a marginal GPS fix turns into toilet bowling.</li>
        <li><strong>Auto</strong> &mdash; executes a pre-loaded waypoint mission with no pilot input at all beyond mode selection and monitoring.</li>
        <li><strong>RTL (Return to Launch)</strong> &mdash; climbs to a set altitude, flies back to the recorded home point, and lands (or hovers, depending on configuration) automatically.</li>
      </ul>
      <p>That "recorded home point" gets set automatically: ArduCopter records home as the aircraft's GPS position at the moment it arms, provided it already has a good GPS lock at that moment &mdash; which is exactly why waiting for a solid fix before arming (per the previous lesson) isn't just about flight stability, it's also what makes RTL land back where you actually started rather than wherever the aircraft happened to be when a marginal fix finally settled.</p>
      <div class="diagram">${SVG_MODELADDER}<div class="dcap">The flight-mode ladder &mdash; Loiter is the line where GPS lock stops being optional.</div></div>
      <p>What happens if GPS is lost depends entirely on which mode you're in when it happens. Stabilize and AltHold don't care &mdash; they were never using it. Loiter, Auto, and RTL all depend on it, and ArduCopter's default response to a GPS-quality failure in those modes is to fall back toward Stabilize or AltHold rather than let a corrupted position estimate keep flying the aircraft &mdash; which is exactly why you should already be comfortable flying manually before you ever engage Loiter or Auto. Autonomy that fails gracefully still hands the aircraft back to a pilot who can actually catch it.</p>
      <p>Building a basic waypoint mission in either GCS follows the same shape: place waypoints on the map, set an altitude for each, and set the action at each point (fly-through, loiter for a set time, land), then upload the mission to the aircraft before switching to Auto. Altitude reference matters as much as the number itself: <strong>relative to home</strong> (the default, and what the Case Study below used) measures from your launch point's elevation regardless of what's underneath each waypoint; <strong>absolute</strong> measures from true sea level, useful mainly for coordinating with other aircraft using the same reference rather than for everyday missions; <strong>terrain-following</strong> (where the GCS and firmware version support it) actively adjusts commanded altitude against a terrain elevation model so the aircraft holds a constant height above the actual ground the whole way, which is the only one of the three that handles sloped terrain without the pilot doing that math by hand.</p>
      <div class="tip"><div class="clabel">Case Study</div>A pilot mapped a mission across a sloped property using a single relative-altitude value for every waypoint, planned entirely from a flat satellite image with no terrain check. The far end of the property sat noticeably higher than the launch point. Two waypoints in, the aircraft clipped the top of a tree line that a terrain-aware plan would have cleared &mdash; the altitude was correct relative to launch, but launch wasn't the ground beneath every waypoint. Uneven terrain has to be accounted for explicitly, not assumed away by one number.</div>
      <p><strong>Geofencing</strong> lets you define a maximum altitude, a maximum radius from home, or a full polygon boundary, with a configurable action if the aircraft crosses it &mdash; report only, RTL, or land immediately. It's worth setting even on a simple Loiter/Auto flight, not just missions. It's also worth noting the parallel to Semester 2: a geofence is a self-imposed containment boundary, conceptually similar to why controlled airspace requires authorization in the first place &mdash; both exist to keep an aircraft's actual position inside its intended, permitted boundary.</p>
      <div class="tip"><div class="clabel">Hands-On</div>In Mission Planner or QGroundControl, build a simple four-waypoint rectangular mission over a location you know well, checking each waypoint's altitude against actual ground elevation rather than a flat assumption. Don't upload or fly it &mdash; just get comfortable with the planning workflow.</div>
    `,
    quiz:[
      {id:"b5l4_q1", q:"Which flight mode is the first in the hierarchy to depend on GPS?",
       choices:["Stabilize","AltHold","Loiter","Manual"],
       a:2, exp:"Stabilize and AltHold rely only on the IMU and barometer. Loiter is the first mode that needs a GPS position fix to hold location."},
      {id:"b5l4_q2", q:"If GPS quality fails while an aircraft is in Loiter mode, what does ArduCopter's default behavior aim to do?",
       choices:["Continue in Loiter regardless, trusting the last known position indefinitely","Fall back toward a non-GPS mode like Stabilize or AltHold so a pilot can take manual control","Immediately cut power to all motors","Automatically switch to Auto mode"],
       a:1, exp:"Rather than keep flying on a corrupted position estimate, ArduCopter defaults toward handing control back to a mode that doesn't need GPS — which only works if the pilot is ready to fly manually."},
      {id:"b5l4_q3", q:"A mission is planned across sloped terrain using one relative-altitude value for every waypoint, based only on a flat satellite image. What's the risk?",
       choices:["No risk — relative altitude always compensates for terrain automatically","The aircraft may be too low relative to actual ground elevation at higher points in the terrain, risking a strike on trees or obstacles","The mission will simply fail to upload","GPS accuracy is unaffected by terrain, so altitude is irrelevant"],
       a:1, exp:"Relative altitude is measured from the home/launch point, not from the ground under each waypoint — on sloped or uneven terrain that gap can eat your clearance entirely."}
    ,
      {id:"b5l4_q4", q:"In AltHold mode, what does the throttle stick command, unlike in Stabilize?", choices:["Raw motor output, same as Stabilize", "Climb/descent rate, since the barometer now holds altitude automatically", "GPS position directly", "Nothing \u2014 the throttle stick is disabled in AltHold"], a:1, exp:"AltHold adds barometer-based altitude hold on top of Stabilize, so the throttle stick now commands a climb/descent rate rather than raw motor output."},
      {id:"b5l4_q5", q:"When does ArduCopter record its RTL home point?", choices:["At the moment the aircraft arms, provided it has a good GPS lock at that moment", "At the moment the mission is uploaded to the aircraft", "At the exact geographic center of the planned mission", "Only when the pilot manually sets a home point via a GCS button"], a:0, exp:"Home is recorded automatically at arm time \u2014 which is why waiting for a solid GPS fix before arming matters for RTL accuracy, not just flight stability."},
      {id:"b5l4_q6", q:"Which altitude reference type actively adjusts commanded altitude against a terrain elevation model so the aircraft holds a constant height above changing ground?", choices:["Absolute altitude", "Relative-to-home altitude", "Terrain-following altitude", "AGL-locked altitude"], a:2, exp:"Terrain-following is the only one of the three reference types that automatically compensates for sloped or uneven ground \u2014 relative and absolute both require the pilot to account for terrain by hand."}]},
    {id:"b5l5", title:"Failsafes & Testing Them Before You Need Them", content:`
      <p>A failsafe is a rule the flight controller follows when something it depends on goes away &mdash; and configuring them correctly is not optional polish on an autonomous build, it's core to flying one responsibly. Three matter most.</p>
      <p><strong>Battery failsafe</strong> triggers at a configured voltage or remaining-capacity threshold and can be set to RTL, land immediately, or (at a lower, second-stage threshold) land regardless of position. The threshold has to leave enough real charge for the aircraft to actually complete the response you picked &mdash; not just enough to trigger it.</p>
      <div class="tip"><div class="clabel">Case Study</div>A pilot set the battery failsafe voltage low, reasoning it would give the longest possible flight time before RTL kicked in. On a flight at the far edge of the mission area, the failsafe triggered RTL as configured &mdash; but the aircraft was now flying home on a battery that had already been drawn down past the point of having a real margin left, and it landed short of the home point with a battery reading near empty. The failsafe fired correctly; it just fired too late to have anywhere near enough charge left to finish the job it was supposed to do. The threshold needs to account for the return flight itself, not just detect low charge.</div>
      <p><strong>GCS/telemetry-link failsafe</strong> triggers when the ground station loses contact with the aircraft &mdash; distinct from RC failsafe, which triggers when the transmitter link itself drops. It's only meaningfully armed when you've actually enabled it in ArduCopter's parameters and are relying on GCS monitoring as part of the flight plan; for a short local flight where you're not actively watching a GCS screen at all, this failsafe simply isn't in play the way it is for a genuinely supervised autonomous mission, so closing your laptop mid-flight on a quick local hop won't trigger anything by itself unless you've specifically configured it to. On a fully autonomous mission with the pilot supervising rather than holding sticks, losing the GCS link is often the more consequential failure, and it's typically configured to continue the mission, RTL, or land depending on how much you trust an unsupervised continuation.</p>
      <p><strong>Geofence breach failsafe</strong> triggers when the aircraft crosses the altitude, radius, or polygon boundary set up in the previous lesson &mdash; typically configured to RTL or land immediately, catching a mission-planning error or a drift problem before it becomes a lost aircraft.</p>
      <div class="callout"><div class="clabel">Why It Matters</div>A failsafe you've configured but never tested is a guess, not a safety system &mdash; the only way to know it actually does what the parameter says is to make it happen deliberately, on your terms, in a place and altitude where the outcome is recoverable either way.</div>
      <p>Testing deliberately means picking a safe, open area, flying at a modest altitude with real margin, and triggering each failsafe on purpose &mdash; powering off the transmitter to test RC failsafe, closing the GCS connection to test link failsafe, flying to the fence boundary to test geofence response &mdash; while ready to take manual control if the response isn't what you configured. Do this before a mission ever depends on it working right, not after.</p>
      <div class="tip"><div class="clabel">Hands-On</div>In Mission Planner or QGroundControl, open the failsafe configuration screen and read through your current battery, GCS-link, and geofence failsafe settings and thresholds even if you don't fly today. If you can't say confidently what each one is set to do, that's the gap to close before your next autonomous flight.</div>
    `,
    quiz:[
      {id:"b5l5_q1", q:"What's the key difference between an RC failsafe and a GCS-link failsafe?",
       choices:["They're the same thing under different names","RC failsafe triggers on loss of the transmitter link; GCS-link failsafe triggers on loss of the ground control station's telemetry connection","RC failsafe only applies to fixed-wing aircraft","GCS-link failsafe overrides battery failsafe automatically"],
       a:1, exp:"They watch two different links — the RC control link and the GCS telemetry link — and can be configured with different responses since losing one doesn't necessarily mean losing the other."},
      {id:"b5l5_q2", q:"A battery failsafe voltage was set low to maximize flight time, and it triggered RTL far from home. What went wrong?",
       choices:["Nothing — the failsafe worked exactly as intended","The threshold left too little real charge for the aircraft to actually complete the RTL flight home","RTL mode doesn't use GPS","The failsafe should have triggered a landing instead, in every case"],
       a:1, exp:"A failsafe threshold has to account for the response's own cost — RTL from a distant point takes real charge, and a threshold set only to detect low voltage without margin for the return flight can trigger too late to succeed."},
      {id:"b5l5_q3", q:"Why is deliberately testing failsafes before a mission depends on them considered a core practice rather than optional?",
       choices:["It isn't necessary if the parameters are set correctly on paper","A configured-but-untested failsafe is unverified — testing it under controlled, recoverable conditions is the only way to confirm it behaves as intended before it matters","Testing failsafes is required by Part 107 regulation","Failsafes test themselves automatically on every arm"],
       a:1, exp:"A parameter value is a setting, not a guarantee — verifying the actual behavior in a safe, controlled test is what turns it into something you can trust in a real failure."}
    ,
      {id:"b5l5_q4", q:"What are the configurable responses for a battery failsafe?", choices:["RTL, land immediately, or (at a lower second-stage threshold) land regardless of position", "Only an audible alarm, no automatic action", "Automatic firmware downgrade to Stabilize permanently", "A mandatory 30-second hover before any action"], a:0, exp:"Battery failsafe can be configured to RTL or land immediately at the first threshold, with a lower second-stage threshold forcing a land-regardless-of-position response."},
      {id:"b5l5_q5", q:"A pilot closes their laptop mid-flight during a short local hop where they weren't actively monitoring a GCS screen. What happens?", choices:["The GCS-link failsafe always triggers automatically regardless of configuration", "The aircraft immediately switches to RTL", "The battery failsafe is triggered instead", "Nothing by itself \u2014 the GCS-link failsafe is only in play if it's been specifically enabled in ArduCopter's parameters"], a:3, exp:"GCS-link failsafe only matters when you've enabled it and are relying on GCS monitoring as part of the flight plan \u2014 it won't fire on its own during an unrelated quick local flight."},
      {id:"b5l5_q6", q:"How should you test the geofence breach failsafe specifically, per the lesson's deliberate-testing approach?", choices:["Power off the transmitter mid-flight", "Close the GCS connection mid-flight", "Fly to the fence boundary on purpose, ready to take manual control", "Simulate a battery drain in the GCS software"], a:2, exp:"Each failsafe is tested by triggering its specific condition on purpose \u2014 RC failsafe via powering off the transmitter, link failsafe via closing the GCS connection, geofence via flying to the boundary."}]}
  ],

    {id:"b5_final_q6", q:"A mission uses a single relative-altitude value across sloped terrain planned from a flat satellite image. What's the risk?",choices:["None — relative altitude auto-adjusts for terrain","Insufficient clearance over higher ground later in the mission, risking a strike on trees or obstacles","The mission will fail to upload to the GCS","GPS accuracy degrades on slopes"],a:1,exp:"Relative altitude is measured from the home point, not the ground beneath each waypoint — terrain has to be accounted for explicitly."},

{
  id:"bfpv", title:"FPV Flight Technique & Where These Skills Lead", week:"Weeks 13–14",
  lessons:[
    {id:"bfpvl1", title:"Seeing Through the Aircraft's Eyes: FPV Fundamentals", content:`
      <p>Everything so far has assumed you're standing on the ground watching your aircraft the way you'd watch a kite &mdash; this is called <strong>line of sight (LOS)</strong> flying. <strong>FPV (first-person view)</strong> flying is different in a way that changes almost everything about how you fly: a camera on the aircraft sends live video to goggles or a screen, and you fly from the aircraft's perspective instead of your own. You're not watching a small object move through the sky anymore; you're "inside" it.</p>
      <p>That shift is what makes FPV feel like actual flight rather than remote control &mdash; and it's also what makes it demand more of you as a pilot. Depth perception changes completely. Distance is harder to judge. And you lose your own peripheral awareness of the world around the aircraft, which is exactly why real FPV flights require a <strong>visual observer</strong>: a second person watching the aircraft with their own eyes, keeping the whole operation genuinely within visual line of sight even while the pilot's eyes are inside a pair of goggles.</p>
      <div class="callout"><div class="clabel">Why It Matters</div>Semester 2 will formalize this: visual line of sight isn't optional under Part 107, and FPV goggles don't count as "seeing" the aircraft under that rule. A dedicated visual observer is what makes FPV flying legal for anything beyond a waiver. That's not a technicality &mdash; it's the difference between a hobby flight and a flight you can be held accountable for.</div>
      <p>Two things separate FPV video systems worth knowing before you fly: <strong>analog</strong> and <strong>digital</strong>. Analog systems have been around longer, are cheaper, and tend to have the lowest possible latency &mdash; the delay between something happening in front of the camera and you seeing it in your goggles. Digital HD systems (like the ones from DJI and HDZero/Walksnail) give you a dramatically sharper picture, which matters a lot for judging distance and spotting obstacles early, at the cost of slightly more latency than analog. Neither is "wrong" &mdash; racers who need every millisecond of reaction time often still prefer analog's raw speed, while freestyle and cinematic pilots increasingly lean digital for the picture quality. What matters for you right now is understanding that latency exists at all, and that it's one more reason FPV flying rewards deliberate practice before you push your limits.</p>
      <p>Before any of that latency conversation matters, video actually has to get from the aircraft to your eyes &mdash; a step this course has mentioned in passing (B1's component stack listed a VTX as part of a full FPV build) without ever walking through. The <strong>camera</strong> on the aircraft feeds the <strong>VTX (video transmitter)</strong>, which broadcasts on a specific frequency band (almost universally <span class="keyfact">5.8 GHz</span> for both analog and digital hobby gear) and a specific <strong>channel</strong> within that band. Your <strong>goggles</strong> have to be tuned to that same band and channel to show anything at all. On an analog system, that's usually a manual step: cycle the goggles' channel selector until the picture locks in clean. On a digital system (DJI, HDZero, Walksnail), goggles and VTX go through a <strong>pairing</strong> process broadly similar to receiver binding &mdash; sometimes automatic between matched first-party gear, sometimes a manual bind button on both ends &mdash; and once paired, they usually reconnect automatically on future power-ups without you touching a channel selector again.</p>
      <p>Channel selection isn't just a your-aircraft problem once you're flying anywhere with other pilots. Two analog VTXs broadcasting on the same channel at the same field will both show snow, static, or a corrupted picture in both pilots' goggles simultaneously &mdash; there's no graceful sharing of an analog channel. Before powering on your VTX at a shared site, ask who else is flying and what channel they're on; most FPV groups have an informal (sometimes literally a whiteboard) system for claiming a channel for the session precisely to avoid this. Digital systems handle multiple simultaneous pilots more gracefully since they use frequency-hopping and per-pilot pairing rather than a single shared analog channel, but it's still worth asking, especially at a site with more analog fliers than digital ones.</p>
      <div class="tip"><div class="clabel">Hands-On</div>If you own goggles already, put them on with the aircraft powered off and just get used to the feel &mdash; weight, fit, how much of your peripheral vision they block. If you don't have goggles yet, most simulators (including the one in the next lesson) work fine on a monitor first.</div>
      <div class="tip"><div class="clabel">Case Study</div>A new FPV pilot flying LOS-trained instincts straight into FPV misjudged the distance to a tree line because the camera's field of view compressed depth differently than her own eyes did on the ground. She caught herself and pulled up in time &mdash; but it's a near-universal first-timer mistake, and it's exactly why every pilot's first FPV flights should happen low, slow, and over open ground with a spotter present.</div>
    `,
    quiz:[
      {id:"bfpvl1_q1", q:"What fundamentally changes when a pilot switches from line-of-sight (LOS) flying to FPV flying?",
       choices:["Nothing meaningful — it's the same skill with a screen added","The pilot flies from the aircraft's own perspective via live video instead of watching it from the ground","FPV flying no longer requires a battery","The aircraft becomes fully autonomous"],
       a:1, exp:"FPV replaces the pilot's ground-level view with the aircraft's own camera feed — a genuinely different way of perceiving the flight, not just a visual add-on."},
      {id:"bfpvl1_q2", q:"Why does real FPV flying require a dedicated visual observer?",
       choices:["It's only a courtesy, not a real safety requirement","Goggles block the pilot's own view of the surroundings, so a second person must maintain genuine visual contact with the aircraft","Observers are required only for autonomous flights","Goggles legally count as maintaining visual line of sight on their own"],
       a:1, exp:"Because the pilot's eyes are inside the goggles, someone else has to actually watch the aircraft with unaided vision to keep the flight within true visual line of sight."},
      {id:"bfpvl1_q3", q:"What is the key practical tradeoff between analog and digital FPV video systems?",
       choices:["Analog is illegal for Part 107 operations", "Analog systems typically have lower latency; digital HD systems typically offer sharper picture quality at slightly higher latency","Digital systems have no video delay at all","Analog systems cannot be used with goggles"],
       a:1, exp:"Analog tends to win on raw speed (lower latency), while digital HD systems trade a small amount of extra latency for a much clearer picture — different pilots weigh that tradeoff differently depending on their discipline."},
      {id:"bfpvl1_q4", q:"Why do new FPV pilots commonly misjudge distance during their first flights?",
       choices:["FPV cameras are always miscalibrated","A camera's field of view compresses depth differently than natural human eyesight, so distance judgment has to be relearned","GPS accuracy is worse in FPV mode","FPV aircraft always fly faster than LOS aircraft"],
       a:1, exp:"The camera's perspective and field of view don't match how a pilot's eyes judge distance from the ground — it's a learned skill, which is exactly why starting low, slow, and with a spotter matters."},
      {id:"bfpvl1_q5", q:"Two pilots at the same field both power on analog VTXs set to the same channel. What happens?",
       choices:["Nothing — analog channels share cleanly between pilots", "Both pilots' goggles show snow, static, or a corrupted picture simultaneously, since analog video has no way to share a channel gracefully", "Only the pilot who powered on second loses signal", "The VTXs automatically negotiate and switch to different channels"],
       a:1, exp:"Analog video has no shared-channel protocol — two VTXs on the same channel simply interfere with each other, corrupting the picture for both pilots. Checking channel claims before powering on is a real field courtesy, not just politeness."}

      {id:"bfpvl1_q6", q:"What frequency band do both analog and digital hobby FPV video systems almost universally use?", choices:["2.4 GHz", "900 MHz", "5.8 GHz", "433 MHz"], a:2, exp:"Hobby VTX/goggle video, analog or digital, almost universally runs on the 5.8 GHz band."},
      {id:"bfpvl1_q7", q:"How does pairing a digital FPV system (DJI, HDZero, Walksnail) typically work, compared to tuning an analog system?", choices:["Goggles and VTX go through a binding-like pairing process, then usually reconnect automatically on future power-ups, rather than manually cycling a channel selector", "Digital systems require no pairing at all \u2014 video appears automatically on any goggles", "Digital pairing must be redone before every single flight", "Digital systems use the same manual channel-selector process as analog"], a:0, exp:"Digital pairing is broadly similar to receiver binding \u2014 done once, then the system reconnects automatically without further channel hunting."},
      {id:"bfpvl1_q8", q:"Why do digital FPV video systems handle multiple simultaneous pilots at a shared field more gracefully than analog systems?", choices:["Digital systems broadcast at a completely different, uncrowded frequency band", "Digital goggles can display two pilots' feeds side by side", "Analog systems are actually better at handling multiple pilots", "They use frequency-hopping and per-pilot pairing rather than a single shared analog channel"], a:3, exp:"Frequency-hopping and per-pilot pairing let digital systems coexist in ways a single shared analog channel simply can't."},
      {id:"bfpvl1_q9", q:"Before powering on an analog VTX at a shared flying site, what does the lesson say a pilot should do?", choices:["Immediately claim the lowest-numbered channel available", "Ask who else is flying and what channel they're on, since analog channels don't share gracefully", "Wait for written FAA clearance", "Nothing \u2014 analog channels resolve conflicts automatically"], a:1, exp:"Two analog VTXs on the same channel corrupt both pilots' video simultaneously, so checking channel claims first is a real field courtesy."},
      {id:"bfpvl1_q10", q:"What does the lesson recommend as a first step for a new pilot who already owns goggles, before ever powering on the aircraft?", choices:["Immediately attempt a full acro flight to test reaction time", "Fly LOS exclusively for the first month", "Put the goggles on with the aircraft powered off, to get used to the fit, weight, and how much peripheral vision they block", "Disassemble the goggles to inspect the internal display"], a:2, exp:"Getting comfortable with the goggles' feel and fit, aircraft off, is the lesson's suggested first step before flying FPV for real."}]},
    {id:"bfpvl2", title:"Stick Control: Throttle, Pitch, Roll, Yaw, and Flight Modes", content:`
      <p>Every FPV maneuver, from a gentle hover to a full power loop, comes down to four inputs on your transmitter's two sticks. On the most common layout &mdash; <strong>Mode 2</strong>, which the large majority of FPV pilots fly &mdash; the left stick controls <strong>throttle</strong> (up/down) and <strong>yaw</strong> (rotation left/right), while the right stick controls <strong>pitch</strong> (forward/back tilt) and <strong>roll</strong> (side-to-side tilt). Four fingers, four axes, and every trick you'll ever fly is some combination of them.</p>
      <p>Where those inputs actually take you depends on <strong>flight mode</strong> — B4 already walked through Angle, Horizon, and Acro when you set up your Modes tab, so here's the quick recap in FPV terms rather than the full explanation again: Angle self-levels for you, Horizon is a stepping stone that lets go of that safety net near the stick's edge, and Acro hands you pure rotation rate with no self-leveling at all. What's worth adding here, specifically for stick-and-goggles flying, is what that progression means in practice: Acro is the mode every freestyle and racing pilot ultimately flies in, and it's the mode that makes FPV feel like actual piloting rather than assisted flight. (If any of that is fuzzy, B4L2 — Ports, Receiver Binding & Flight Modes — is where it's covered in full, including how to set the modes up on your transmitter.)</p>
      <p>Two more settings shape how those inputs feel: <strong>rates</strong> (how fast the aircraft rotates for a given stick deflection) and <strong>expo</strong> (how much the stick's response is softened near center for finer control, while still allowing full rotation speed at the stick's edge). Both live on Betaflight Configurator's <strong>Rates</strong> tab &mdash; the same app and same general area as the PID tuning from B4L3, just a different tab. New acro pilots should fly low rates and generous expo &mdash; it makes the aircraft calmer and more forgiving while you build stick-to-motion muscle memory, and you can always raise rates later once the basics are automatic.</p>
      <div class="callout"><div class="clabel">Ask Yourself</div>Angle mode feels safer because the aircraft corrects your mistakes for you. What does that actually teach your hands — and what doesn't it teach them?</div>
      <p>The single most valuable early skill, in any mode, is a rock-steady hover: hold position and altitude with small, smooth corrections instead of big, late ones. Everything else &mdash; forward flight, turns, eventually inverted maneuvers &mdash; builds on the same fine stick control a good hover requires.</p>
      <div class="tip"><div class="clabel">Workshop Tip</div>Keep your thumbs resting lightly on the sticks, not gripping them. A tense grip translates into jerky, overcorrected inputs — the calmest-looking pilots almost always have the loosest hands.</div>
      <div class="tip"><div class="clabel">Hands-On</div>On your transmitter (or in the simulator in the next lesson), practice this drill: hover in angle mode for 60 seconds without drifting more than a few feet in any direction. It sounds trivial until you try it.</div>
    `,
    quiz:[
      {id:"bfpvl2_q1", q:"On a standard Mode 2 transmitter, what does the left stick control?",
       choices:["Pitch and roll","Throttle and yaw","Only camera angle","Flight mode switching"],
       a:1, exp:"Mode 2, the most common layout, puts throttle and yaw on the left stick and pitch/roll on the right stick."},
      {id:"bfpvl2_q2", q:"What is the defining characteristic of acro (rate/manual) mode?",
       choices:["The aircraft automatically returns to level flight when the sticks are centered","The aircraft has no self-leveling at all — stick input controls rotation speed, and it will stay inverted indefinitely if commanded to","It disables yaw control entirely","It is only available on aircraft with GPS"],
       a:1, exp:"Acro mode removes self-leveling completely; the sticks command rotation rate rather than a target angle, which is what allows sustained inverted flight and full aerobatics."},
      {id:"bfpvl2_q3", q:"Why would a new acro pilot deliberately fly with low rates and generous expo?",
       choices:["It's required by Part 107 for new pilots","It makes the aircraft calmer and more forgiving while building fundamental stick-to-motion muscle memory","It disables acro mode automatically","It has no effect on how the aircraft flies"],
       a:1, exp:"Low rates and softened center-stick response give a beginner more margin for error while the basic connection between stick movement and aircraft motion becomes automatic."},
      {id:"bfpvl2_q4", q:"What is widely considered the most valuable early FPV skill to build, regardless of flight mode?",
       choices:["Flying at maximum speed", "A steady, controlled hover with small smooth corrections rather than large late ones","Flying only in a straight line","Disabling all flight modes except acro immediately"],
       a:1, exp:"A calm, controlled hover is the foundation every other maneuver builds on — it's the clearest demonstration of fine stick control."}
    ,
      {id:"bfpvl2_q5", q:"On a standard Mode 2 transmitter, what does the right stick control?", choices:["Throttle and yaw", "Only camera gimbal angle", "Flight mode switching", "Pitch (forward/back tilt) and roll (side-to-side tilt)"], a:3, exp:"Mode 2 puts pitch and roll on the right stick, with throttle and yaw on the left."},
      {id:"bfpvl2_q6", q:"What is 'expo,' as distinct from 'rates,' on Betaflight's Rates tab?", choices:["A setting that determines which flight mode is active", "How much the stick's response is softened near center for finer control, while still allowing full rotation speed at the stick's edge", "The maximum voltage the FC will accept before cutting power", "A synonym for PID gain"], a:1, exp:"Expo softens center-stick sensitivity for fine control without capping the full-deflection rotation speed that rates set."},
      {id:"bfpvl2_q7", q:"According to the workshop tip on stick grip, what tends to produce jerky, overcorrected inputs?", choices:["A tense, gripping hold on the sticks rather than a light rest", "Resting thumbs lightly on the sticks", "Flying with low rates and generous expo", "Using a Mode 2 transmitter instead of Mode 1"], a:0, exp:"The lesson notes that a tense grip translates into jerky, overcorrected inputs \u2014 the calmest-looking pilots almost always have the loosest hands."},
      {id:"bfpvl2_q8", q:"Where in Betaflight Configurator do you adjust rates and expo?", choices:["The Ports tab", "The Modes tab", "The Rates tab \u2014 the same general app area as PID tuning, but a different tab", "The Failsafe tab"], a:2, exp:"Rates and expo live on Configurator's Rates tab, distinct from the Modes and PID Tuning tabs covered elsewhere."}]},
    {id:"bfpvl3", title:"Building Real Skill in the Simulator", content:`
      <p>Every experienced FPV pilot will tell you the same thing: crash in the simulator, not in the field. A simulator lets you fly hundreds of "flights" a day, at zero cost per crash, building the stick-to-motion muscle memory that real flying demands &mdash; before you risk a single real prop, motor, or frame.</p>
      <p>For a genuinely free, well-regarded option, <strong>FPV.SkyDive by ORQA</strong> is a strong starting point. It's free-to-play on Steam, models realistic flight physics, and supports both angle and acro modes across racing, freestyle, and micro-quad aircraft types &mdash; plus local and online multiplayer and a track editor for building your own practice courses. It includes a free introductory "Flight School" unit covering fundamental FPV concepts in angle mode, with a deeper structured curriculum (including a dedicated acro-mode unit) available as an optional paid add-on if you want a more guided path later. For a lightweight, fully free alternative, <strong>FlowState</strong> is a solid open-source option worth knowing about. If you eventually decide to invest in a more complete platform, <strong>Liftoff</strong> is the best-known paid simulator in the FPV community, known for its physics accuracy and deep Steam Workshop content &mdash; but it's not a free starting point, and you don't need it to build real competence.</p>
      <div class="tip"><div class="clabel">Hands-On</div>Install FPV.SkyDive from Steam, and work through its free introductory unit before your first real flight (or before your next one, if you've already started). Set a concrete goal: complete the steady-hover drill from the last lesson entirely in acro mode, not just angle mode, before moving on.</div>
      <p>A sensible practice progression looks something like this: steady hover in angle mode &rarr; steady hover in acro mode &rarr; smooth forward flight and turns in acro &rarr; simple maneuvers like power loops and rolls &rarr; flying a fixed course or gate pattern cleanly and repeatably. Each stage should feel comfortable before you push to the next one &mdash; rushing ahead just means relearning the same lesson later, mid-flight, for real.</p>
      <div class="callout"><div class="clabel">Why It Matters</div>Simulator time transfers real, measurable skill — but it isn't a perfect substitute for flying an actual aircraft. Real quads have weight, momentum, vibration, wind, and battery sag that a simulator only approximates. Treat the sim as where you build your baseline reflexes, and treat your early real flights as where you calibrate those reflexes against reality — gently, and with margin for error.</div>
      <div class="tip"><div class="clabel">Case Study</div>A pilot who'd never touched a real FPV quad spent roughly three months doing focused simulator practice — the hover-to-acro-to-gates progression above — before his first real flight. His first flight wasn't clumsy beginner flying; it was recognizably competent stick control from the first pack, because the fundamental hand-eye coordination was already built. What the simulator hadn't taught him — reading real wind, managing real battery sag, judging real depth through a real camera — he picked up over his next several flights, on top of an already-solid foundation.</div>
    `,
    quiz:[
      {id:"bfpvl3_q1", q:"What is the primary practical benefit of building FPV stick skills in a simulator before real flight?",
       choices:["Simulators are required by the FAA before real flights", "It allows essentially unlimited practice and crashes at zero cost, building muscle memory before risking real hardware", "Simulators fly identically to real aircraft in every respect", "It replaces the need for a visual observer during real flights"],
       a:1, exp:"The core value is repetition without consequence — building the stick-to-motion muscle memory that real flying demands, without the cost of real crashes."},
      {id:"bfpvl3_q2", q:"What free, Steam-based simulator does this course recommend as a strong starting point for building real FPV skill?",
       choices:["Liftoff","FPV.SkyDive by ORQA","DRL Simulator","A proprietary simulator with no free tier"],
       a:1, exp:"FPV.SkyDive is free-to-play on Steam, models realistic physics across multiple aircraft types and flight modes, and includes a free introductory Flight School unit — a strong, genuinely free entry point."},
      {id:"bfpvl3_q3", q:"According to the recommended practice progression, what should come immediately after achieving a steady hover in angle mode?",
       choices:["Flying a full competitive race course", "A steady hover in acro mode", "Attempting inverted flight immediately", "Skipping directly to real-world flight"],
       a:1, exp:"The progression moves from angle-mode hover to acro-mode hover before advancing to forward flight, turns, and maneuvers — each stage building directly on the last."},
      {id:"bfpvl3_q4", q:"Why doesn't simulator practice fully replace real-world flight experience?",
       choices:["Simulators are illegal to use for training under Part 107", "Real aircraft involve weight, momentum, vibration, wind, and battery behavior that a simulator only approximates", "Simulators can't model any flight modes", "Simulator practice has no measurable transfer to real flying at all"],
       a:1, exp:"A simulator builds real, transferable reflexes, but real aircraft introduce physical factors — true weight and momentum, wind, vibration, battery sag — that a simulator can only approximate, not fully replicate."}
    ,
      {id:"bfpvl3_q5", q:"What free, open-source simulator does the lesson mention as a lightweight alternative to FPV.SkyDive?", choices:["Liftoff", "DRL Simulator", "FlowState", "VelociDrone"], a:2, exp:"FlowState is named as a lightweight, fully free, open-source alternative."},
      {id:"bfpvl3_q6", q:"Why does the lesson describe Liftoff as worth knowing about but not necessary to get started?", choices:["It's the best-known paid simulator, valued for physics accuracy and Steam Workshop content, but not a free starting point and not required to build real competence", "It's the only simulator that supports acro mode", "It's being discontinued by its developer", "It requires specialized VR hardware unlike the other options"], a:0, exp:"Liftoff is flagged as a strong paid option for later, not a required or free entry point."},
      {id:"bfpvl3_q7", q:"In the recommended practice progression, what comes right after smooth forward flight and turns in acro mode?", choices:["Real-world flight, skipping further simulator practice", "Steady hover in angle mode", "Flying a fixed course or gate pattern, skipping maneuvers entirely", "Simple maneuvers like power loops and rolls"], a:3, exp:"The progression moves from forward flight and turns to simple maneuvers like power loops and rolls, before advancing to fixed courses."},
      {id:"bfpvl3_q8", q:"In the case study, roughly how long had the pilot spent in focused simulator practice before his first real FPV flight?", choices:["About two weeks", "About three months", "About one year", "A single weekend"], a:1, exp:"The case study describes roughly three months of focused simulator practice before the pilot's genuinely competent first real flight."}]},
    {id:"bfpvl4", title:"What These Skills Unlock — Technologies, Careers, and the Case for Certification", content:`
      <p>Stick skill and a well-tuned aircraft aren't the end goal &mdash; they're the entry ticket to an unusually wide range of things you can actually do with a drone. It's worth taking stock of the landscape before Semester 2, because it reframes what's coming next: certification isn't a hoop to jump through, it's the thing that turns a skill into a career, a business, or a serious tool.</p>
      <p>Some of what these skills open up:</p>
      <ul>
        <li><strong>Aerial cinematography &amp; FPV content creation</strong> &mdash; the dramatic, swooping "drone shot" in modern film, real estate video, and action sports coverage is often flown FPV-acro, not on a gimbal-stabilized camera platform. This is a real, growing professional niche.</li>
        <li><strong>Infrastructure &amp; industrial inspection</strong> &mdash; cell towers, bridges, wind turbines, solar farms, and pipelines are increasingly inspected by drone instead of by a person on a rope or a ladder. It's faster, cheaper, and dramatically safer.</li>
        <li><strong>Agriculture</strong> &mdash; crop health scouting via multispectral imaging, and increasingly targeted spraying, are reshaping how larger farms operate.</li>
        <li><strong>Public safety &amp; search and rescue</strong> &mdash; fire departments, police, and search-and-rescue teams increasingly run "drone as first responder" programs, getting eyes on a scene minutes before a person could arrive.</li>
        <li><strong>Real estate, surveying, and mapping</strong> &mdash; photogrammetry (stitching overlapping aerial photos into precise 3D maps and models) has become a standard surveying tool, not a novelty.</li>
        <li><strong>Drone light shows</strong> &mdash; large synchronized fleets replacing traditional fireworks displays, an entire industry that didn't meaningfully exist a decade ago.</li>
        <li><strong>Racing &amp; competitive freestyle</strong> &mdash; organized leagues like MultiGP and the Drone Racing League have turned the exact stick skills from this module into a competitive sport with real prize money.</li>
      </ul>
      <div class="diagram">${SVG_CAREERS}<div class="dcap">Drone skills radiate outward &mdash; cinematography and racing draw on the same stick time as inspection and mapping, just aimed at different ends.</div></div>
      <div class="callout"><div class="clabel">Why It Matters</div>Every single one of these is a <strong>commercial</strong> use — done for compensation, for a business, or as part of a job. None of it is covered by the recreational flying exception, no matter how good your stick skills are. That's not a footnote; it's the whole reason Semester 2 exists.</div>
      <p>This is the real relationship between the two halves of this course: Semester 1 gave you the aircraft and the hands-on skill to fly it well. Semester 2 gives you the legal standing to do any of the above without risking your certificate, your business, or someone else's safety. A brilliant pilot without a Part 107 certificate can't legally take a single paying job. A certificated pilot with clumsy stick skills can't do the work well, or safely. You need both halves, and you've now built the first one.</p>
      <div class="tip"><div class="clabel">Hands-On</div>Pick one application area from the list above that genuinely interests you, and spend twenty minutes researching what a real job or business in that space actually looks like day-to-day — required equipment, typical clients, typical pay. Bring that concrete picture with you into Semester 2; it'll make the certification requirements feel a lot less abstract.</div>
    `,
    quiz:[
      {id:"bfpvl4_q1", q:"What is the central relationship this lesson draws between Semester 1 and Semester 2 of the course?",
       choices:["They're unrelated — Semester 2 replaces the skills from Semester 1", "Semester 1 builds the aircraft and flying skill; Semester 2 provides the legal standing (certification) required to use those skills commercially", "Semester 2 is only necessary for pilots who plan to race competitively", "Certification eliminates the need for good stick skills"],
       a:1, exp:"The two semesters are complementary, not redundant — flying skill without certification can't legally be monetized, and certification without flying skill doesn't produce good work."},
      {id:"bfpvl4_q2", q:"Which of the following applications listed in this lesson is described as increasingly replacing traditional fireworks displays?",
       choices:["Agricultural crop spraying","Infrastructure inspection","Drone light shows","Search and rescue"],
       a:2, exp:"Synchronized drone light shows are an application area specifically noted as replacing traditional fireworks in many events."},
      {id:"bfpvl4_q3", q:"Why does the lesson emphasize that all the listed applications (inspection, agriculture, real estate mapping, etc.) require Part 107 certification?",
       choices:["Because they're all flown at night","Because they are commercial uses — done for compensation or as part of a job — which falls outside the recreational flying exception regardless of pilot skill","Because they all require aircraft over 55 lbs","Because the FAA requires a separate license for each application area"],
       a:1, exp:"The applications are commercial by nature — for compensation or business purposes — which is exactly the line that separates the recreational exception from the Part 107 requirement covered in Semester 2."},
      {id:"bfpvl4_q4", q:"What does 'photogrammetry,' as referenced in the real estate/surveying/mapping application, refer to?",
       choices:["A type of drone motor","Stitching overlapping aerial photos into precise 3D maps and models","A flight mode used only in racing","A federal licensing category"],
       a:1, exp:"Photogrammetry is the technique of combining overlapping aerial images into accurate 3D maps and models — now a standard tool in surveying and real estate."}
    ,
      {id:"bfpvl4_q5", q:"What is distinctive about how the dramatic, swooping 'drone shot' in film and action-sports coverage is often flown, per this lesson?", choices:["Always on a gimbal-stabilized camera platform, never FPV", "Exclusively by autonomous ArduCopter missions", "Only in Angle mode, for stability", "Often flown FPV-acro rather than on a gimbal-stabilized camera platform"], a:3, exp:"The lesson specifically notes this shot is often flown FPV-acro, not via a gimbal-stabilized platform."},
      {id:"bfpvl4_q6", q:"What does the lesson identify as the appeal of drone-based infrastructure inspection over traditional methods?", choices:["It requires less pilot training than any other application", "It's faster, cheaper, and dramatically safer than a person inspecting from a rope or ladder", "It eliminates the need for Part 107 certification", "It only works on structures under 55 lbs"], a:1, exp:"Inspecting cell towers, bridges, and turbines by drone instead of by a person on a rope or ladder is faster, cheaper, and dramatically safer."},
      {id:"bfpvl4_q7", q:"What two named organizations does the lesson cite as having turned FPV racing/freestyle stick skills into a competitive sport with real prize money?", choices:["The FAA and AMA", "DJI and ORQA", "MultiGP and the Drone Racing League", "USA Drone Racing and FPV.SkyDive"], a:2, exp:"MultiGP and the Drone Racing League are the two organized leagues the lesson names."},
      {id:"bfpvl4_q8", q:"According to the lesson's closing argument, what's true of a certificated pilot with clumsy stick skills?", choices:["They can't do the work well or safely, even though they're legally permitted to take the job", "Certification alone guarantees competent flying regardless of stick skill", "They are automatically barred from all commercial work", "Their certificate is revoked until skills improve"], a:0, exp:"The lesson pairs legal standing with actual skill: certification permits the work, but clumsy stick skills still undermine doing it well or safely."}]}
