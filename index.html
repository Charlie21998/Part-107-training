  finalQuiz:[
    {id:"m1_final_q1", q:"A small UAS is defined by Part 107 as weighing less than what, at takeoff, including everything attached?",choices:["25 lbs","55 lbs","100 lbs","150 lbs"],a:1,exp:"55 lbs including payload."},
    {id:"m1_final_q2", q:"For Part 107 aircraft registration, how many registration numbers does a pilot with 4 commercial drones need?",choices:["One, covering all four","Four — one per aircraft","Zero — commercial drones are exempt","Two, one per pair"],a:1,exp:"Each Part 107 aircraft is registered, and numbered, individually."},
    {id:"m1_final_q3", q:"Which Remote ID compliance path restricts an aircraft to visual-line-of-sight only?",choices:["Standard Remote ID","A broadcast module","Flying in a FRIA","All of them restrict to VLOS"],a:1,exp:"Broadcast modules limit you to VLOS and are ineligible for BVLOS under Part 108."},
    {id:"m1_final_q4", q:"In a right-of-way conflict between a small UA and a manned aircraft, who yields?",choices:["The manned aircraft","The small UA, always","Whichever is closer to controlled airspace","Neither — ATC decides"],a:1,exp:"The small UA always yields."},
    {id:"m1_final_q5", q:"Which airspace requires no prior authorization for Part 107 flight?",choices:["Class D","Class C","Class G","Class E surface area"],a:2,exp:"Class G is uncontrolled — no authorization needed."},
    {id:"m1_final_q6", q:"A Category 1 operation over people requires the aircraft to weigh, at takeoff, no more than:",choices:["0.55 lb (250 g)","5 lbs","20 lbs","There is no limit"],a:0,exp:"0.55 lb / 250 g, plus no lacerating exposed rotors."},
    {id:"m1_final_q7", q:"Which of these Part 107 rules is not waivable under any circumstance?",choices:["400 ft altitude limit","Visual line of sight","Careless or reckless operation prohibition","Operating over moving vehicles"],a:2,exp:"Careless/reckless prohibition (and drug/alcohol rules) cannot be waived."}
  ,
    {id:"m1_final_q8", q:"How much does it cost to register a Part 107 aircraft, and how long is that registration valid?", choices:["$25, valid 1 year", "$5, valid 3 years", "Free, valid 5 years", "$5, valid 1 year"], a:1, exp:"Registration costs $5 per aircraft and is valid for three years."},
    {id:"m1_final_q9", q:"Where must a Part 107 registration number be marked on the aircraft?", choices:["Hidden inside the battery compartment", "On a removable sticker inside the case only", "Somewhere accessible without the use of tools", "Not required if flown for business use"], a:2, exp:"The number must be legible and accessible without disassembling anything."},
    {id:"m1_final_q10", q:"Under what condition may someone without a remote pilot certificate manipulate a Part 107 aircraft's controls?", choices:["Never, under any circumstance", "Yes, with no supervision required", "Only if the aircraft weighs under 0.55 lb", "If a certificated remote PIC directly supervises and can take over at any time"], a:3, exp:"An uncertificated person may fly it as long as a certificated remote PIC supervises directly and can take over instantly."},
    {id:"m1_final_q11", q:"What are the two ways to get authorization to fly in controlled airspace under Part 107?", choices:["LAANC (near-instant) or a manual FAADroneZone request", "A phone call to the airport tower", "An automatic approval after 24 hours", "A waiver application, exclusively"], a:0, exp:"Authorization comes via LAANC, which is near-instant, or a manual FAADroneZone request when LAANC isn't available."},
    {id:"m1_final_q12", q:"Operating a UA from a moving vehicle is allowed under Part 107 only when:", choices:["It's a police or government vehicle", "The area is sparsely populated and the aircraft isn't carrying hazardous material", "The vehicle's speed stays under 25 mph", "It's never allowed under Part 107"], a:1, exp:"Moving-vehicle operation requires a sparsely populated area and no hazardous material aboard."},
    {id:"m1_final_q13", q:"Which operations-over-people category requires an FAA airworthiness certificate?", choices:["Category 2", "Category 3", "Category 4", "Category 1"], a:2, exp:"Category 4 is the only one of the four that requires an airworthiness certificate."},
    {id:"m1_final_q14", q:"What is a FRIA?", choices:["A waiver category for BVLOS operations", "A type of airworthiness certificate", "A restricted military training zone", "An FAA-Recognized Identification Area where Remote ID broadcast isn't required"], a:3, exp:"A FRIA is the one place you can legally fly without Remote ID broadcast equipment."}]
},
{
  id:"m2", title:"Airspace", week:"Weeks 3–4",
  lessons:[
    {id:"m2l1", title:"The Airspace Classes", content:`
      <p>Six classes, but only five you'll actually deal with (Class A starts at 18,000 ft MSL, well above where a Part 107 drone can legally fly, so treat it as a trivia answer rather than an operational concern).</p>
      <ul>
        <li><strong>Class B</strong> &mdash; the busiest airports (major hubs). Controlled, authorization required.</li>
        <li><strong>Class C</strong> &mdash; mid-size towered airports with radar approach control. Authorization required.</li>
        <li><strong>Class D</strong> &mdash; smaller towered airports. Authorization required.</li>
        <li><strong>Class E</strong> &mdash; controlled airspace that isn't A, B, C, or D. Sometimes extends to the surface around an airport (authorization required there), otherwise usually starts at 700 or 1,200 ft AGL (no Part 107 authorization needed once you're below the Class E floor, since you're in Class G beneath it).</li>
        <li><strong>Class G</strong> &mdash; uncontrolled airspace, from the surface up to the floor of the overlying controlled airspace. No authorization needed.</li>
      </ul>
      <div class="diagram">${SVG_AIRCAKE}<div class="dcap">Simplified side profile — Class B tiers out around the busiest airport; Class G sits underneath everything.</div></div>
      <p>The practical takeaway for a 400-ft-ceiling drone: you're almost always either in Class G with no authorization needed, or near an airport where controlled airspace reaches the ground and you do need one.<span class="cfrcite" data-ref="ref-citations">§107.41</span></p>
    `,
    quiz:[
      {id:"m2l1_q1", q:"Which airspace class is generally irrelevant to Part 107 operations because it starts at 18,000 ft MSL?",
       choices:["Class B","Class A","Class G","Class E"],
       a:1, exp:"Class A starts at 18,000 ft MSL — far above the 400 ft Part 107 ceiling."},
      {id:"m2l1_q2", q:"What's the defining feature of Class G airspace?",
       choices:["It's the most restricted airspace in the country","It's uncontrolled, extending from the surface up to the floor of overlying controlled airspace","It only exists over oceans","It always requires two-way radio contact"],
       a:1, exp:"Class G is uncontrolled airspace with no ATC authorization requirement."}
    ,
      {id:"m2l1_q3", q:"When Class E airspace doesn't extend down to the surface, where does its floor typically begin?", choices:["700 or 1,200 ft AGL", "Always at 18,000 ft MSL", "Always at the surface", "5,000 ft AGL"], a:0, exp:"Non-surface Class E typically starts at either 700 or 1,200 ft AGL, with Class G underneath."},
      {id:"m2l1_q4", q:"Which airspace class serves the busiest, major-hub airports?", choices:["Class E", "Class D", "Class B", "Class C"], a:2, exp:"Class B surrounds the nation's busiest major-hub airports."}]},
    {id:"m2l2", title:"Reading a Sectional Chart", content:`
      <p>Sectional charts encode airspace by line style and color. Memorize these and a huge share of airspace questions become pattern matching:</p>
      <div class="diagram">${SVG_SECTIONAL}<div class="dcap">The handful of symbols that actually change your authorization requirement.</div></div>
      <p>Numbers next to airspace boundaries (like a boxed number) give you the floor/ceiling in hundreds of feet MSL.</p>
      <div class="tip"><div class="clabel">Test tip</div>The exam gives you a real sectional excerpt and a legend. You don't need to memorize every symbol &mdash; you need to know which handful actually change your authorization requirement.</div>
    `,
    quiz:[
      {id:"m2l2_q1", q:"A solid blue line on a sectional chart marks the boundary of which airspace?",
       choices:["Class C","Class B","Class D","Class G"],
       a:1, exp:"Solid blue = Class B."},
      {id:"m2l2_q2", q:"A dashed magenta line on a sectional chart indicates:",
       choices:["Class D airspace","A Class E surface area extending to the ground","Class G airspace","A military operations area"],
       a:1, exp:"Dashed magenta marks a Class E surface area, which reaches the ground and requires authorization."},
      {id:"m2l2_q3", q:"An airport depicted with a magenta symbol (rather than blue) tells you:",
       choices:["The airport has a control tower","The airport has no operating control tower","The airport is closed","The airport is inside Class B airspace"],
       a:1, exp:"Magenta = no tower; blue = towered airport."}
    ,
      {id:"m2l2_q4", q:"A solid magenta line on a sectional chart marks the boundary of which airspace?", choices:["Class B", "Class C", "Class D", "Class E surface area"], a:1, exp:"Solid magenta marks Class C airspace, distinct from the solid blue used for Class B."},
      {id:"m2l2_q5", q:"Faded blue shading on a sectional indicates a Class E floor at what altitude?", choices:["700 ft AGL", "The surface", "1,200 ft AGL", "18,000 ft MSL"], a:2, exp:"Faded blue marks a Class E floor of 1,200 ft AGL, compared to faded magenta's 700 ft AGL floor."},
      {id:"m2l2_q6", q:"You're planning a flight and see a dashed magenta line encircling an airport at your intended site, reaching the ground. What do you need before flying there?", choices:["Nothing \u2014 dashed magenta means uncontrolled airspace", "A waiver of the careless-or-reckless rule, not authorization", "Nothing \u2014 this symbol only affects manned aircraft", "Prior authorization, since this marks a Class E surface area reaching the ground"], a:3, exp:"Dashed magenta marks a Class E surface area, which is controlled down to the ground and requires authorization to enter."}]},
    {id:"m2l3", title:"LAANC & Getting Authorized", content:`
      <p><strong>LAANC</strong> (Low Altitude Authorization and Notification Capability) gives near-real-time authorization to fly in controlled airspace at or below the pre-approved altitude for that grid cell, through an FAA-approved app.<span class="cfrcite" data-ref="ref-citations">§107.41</span> Most authorizations come back in seconds to minutes.</p>
      <div class="flowrow">
        <div class="flowbox"><b style="color:var(--ink)">Request via app</b></div>
        <span class="flowarrow">&rarr;</span>
        <div class="flowbox" style="border-color:var(--good)"><b style="color:var(--good)">LAANC-enabled, within grid ceiling</b><br><span style="color:var(--dim)">seconds to minutes</span></div>
        <span class="flowarrow">or</span>
        <div class="flowbox" style="border-color:var(--warn)"><b style="color:var(--warn)">Above ceiling / not LAANC-enabled</b><br><span style="color:var(--dim)">manual request, up to 90 days</span></div>
      </div>
      <p>If your planned altitude exceeds the LAANC grid ceiling for that area, or the airspace isn't LAANC-enabled, you fall back to a <strong>manual request</strong> through FAADroneZone. Plan far ahead for those.</p>
      <p>Authorization is airspace-specific and altitude-specific. Getting cleared for 200 ft over one location doesn't authorize you at 350 ft, or at a different location.</p>
    `,
    quiz:[
      {id:"m2l3_q1", q:"What is LAANC primarily used for?",
       choices:["Registering an aircraft","Near-real-time authorization to fly in controlled airspace below a pre-set ceiling","Filing an accident report","Requesting a waiver of the 400 ft altitude rule"],
       a:1, exp:"LAANC provides fast controlled-airspace authorization up to the grid's approved altitude."},
      {id:"m2l3_q2", q:"If your requested altitude exceeds the LAANC grid ceiling, what's your recourse?",
       choices:["Fly anyway, it's a minor rule","Submit a manual authorization request through FAADroneZone","Automatically get bumped to the next grid cell","Nothing — that altitude is permanently off-limits"],
       a:1, exp:"A manual request through FAADroneZone is the fallback, though it can take far longer."}
    ,
      {id:"m2l3_q3", q:"How long can a manual airspace authorization request through FAADroneZone take to process?", choices:["Exactly 24 hours", "Up to 90 days", "Always under 5 minutes", "It cannot be processed at all"], a:1, exp:"Manual requests are the fallback when LAANC isn't available and can take up to 90 days, so they need to be planned far ahead."},
      {id:"m2l3_q4", q:"A pilot obtains LAANC authorization to fly at 200 ft over a specific grid cell. Does this also authorize 350 ft over that same cell, or 200 ft over the adjacent cell?", choices:["Yes, any altitude at that same location is covered", "Yes, any location is covered at that altitude", "No \u2014 authorization is both airspace-specific and altitude-specific", "Yes, LAANC authorizations are blanket approvals"], a:2, exp:"LAANC authorization is tied to a specific grid cell and a specific altitude \u2014 neither transfers automatically to a different one."}]},
    {id:"m2l4", title:"Special Use Airspace & NOTAMs", content:`
      <p>Beyond the standard classes, watch for <strong>Special Use Airspace</strong>:</p>
      <div class="badge-row">
        <span class="badge"><b>Prohibited</b> — legally off-limits</span>
        <span class="badge"><b>Restricted</b> — needs specific permission</span>
        <span class="badge"><b>MOA</b> — military training, use caution</span>
        <span class="badge"><b>Warning Area</b> — over water, hazardous activity possible</span>
        <span class="badge"><b>Alert Area</b> — high volume of training/unusual activity</span>
      </div>
      <p><strong>Temporary Flight Restrictions (TFRs)</strong> pop up around wildfires, VIP movement, stadiums during major events, and disasters. They're published through NOTAMs and are legally binding &mdash; flying into an active TFR is a real enforcement risk, not a technicality. Checking for active TFRs is part of preflight planning for every flight, not just ones near known hotspots.</p>
      <p><strong>NOTAMs</strong> (Notices to Air Missions) broadly communicate any temporary hazard or airspace change &mdash; TFRs are one type among many (also: obstacle lighting outages, GPS interference testing, etc.).</p>
      <div class="tip"><div class="clabel">Case Study</div>On January 9, 2025, during the Palisades Fire near Los Angeles, a hobbyist flew a drone more than 1.5 miles into an active wildfire TFR, out of visual line of sight, and collided with a "Super Scooper" firefighting aircraft &mdash; punching a roughly 3-by-6-inch hole in its wing. The plane landed safely, but was grounded for repairs for about five days, during an active fire, while one fewer water-dropping aircraft was available. The FBI recovered pieces of the destroyed drone, and the operator later pleaded guilty to a federal misdemeanor for unsafe operation of an unmanned aircraft. A TFR isn't a formality to check off &mdash; it's the line between "I got dramatic footage" and "I grounded an aircraft that was actively fighting a fire near my own neighborhood."</div>
    `,
    quiz:[
      {id:"m2l4_q1", q:"What should a remote pilot do before every flight regarding TFRs?",
       choices:["Nothing, unless flying near a stadium","Check for active Temporary Flight Restrictions in the planned operating area","Only check if flying above 400 ft","Only check once per month"],
       a:1, exp:"TFR checks are a standard part of preflight planning for every flight."},
      {id:"m2l4_q2", q:"NOTAMs are best described as:",
       choices:["A type of airspace class","Notices communicating temporary hazards or airspace changes, including TFRs","A certificate required to fly Part 107","A weather report format"],
       a:1, exp:"NOTAMs cover a broad range of temporary notices; TFRs are one category of NOTAM."},
      {id:"m2l4_q3", q:"In the Palisades Fire drone incident, what made the violation so costly beyond just breaking the TFR?",
       choices:["The drone was flying at night","The drone physically collided with a firefighting aircraft, damaging it and taking it out of service for days during an active fire","The pilot lost the drone with no other consequence","It happened in Class B airspace instead of Class G"],
       a:1, exp:"The real cost wasn't just the TFR violation on paper — it was a real aircraft taken out of firefighting service for days because of a physical collision."}
    ,
      {id:"m2l4_q4", q:"What distinguishes Prohibited airspace from Restricted airspace?", choices:["Prohibited is legally off-limits outright; Restricted requires specific permission to enter", "They are identical terms for the same airspace type", "Restricted is more severe and closes airspace completely", "Prohibited only restricts manned aircraft, not drones"], a:0, exp:"Prohibited airspace is off-limits outright, while Restricted airspace can be entered with specific permission."},
      {id:"m2l4_q5", q:"A Warning Area on a sectional chart typically indicates:", choices:["A military training area over land requiring extra caution", "Airspace over water where hazardous activity may be occurring", "An area of high-volume flight training with no hazard", "Airspace that is always completely off-limits"], a:1, exp:"Warning Areas sit over water and flag potential hazardous activity, unlike the land-based MOA."},
      {id:"m2l4_q6", q:"In the Palisades Fire incident, how far into the TFR \u2014 and under what visibility condition \u2014 did the hobbyist fly before colliding with the firefighting aircraft?", choices:["Exactly at the TFR boundary, while maintaining VLOS", "The drone never actually entered the TFR", "More than 1.5 miles into the TFR, and out of visual line of sight", "Less than 100 ft in, while maintaining VLOS"], a:2, exp:"The operator flew more than 1.5 miles into the active TFR and out of VLOS before the collision \u2014 not a marginal, borderline violation."}]}
  ],
  finalQuiz:[
    {id:"m2_final_q1", q:"Which airspace class starts at 18,000 ft MSL and is irrelevant to virtually all Part 107 flights?",choices:["Class E","Class A","Class G","Class B"],a:1,exp:"Class A begins at 18,000 ft MSL."},
    {id:"m2_final_q2", q:"A dashed blue line on a sectional marks:",choices:["Class B","Class C","Class D","Class G"],a:2,exp:"Dashed blue = Class D."},
    {id:"m2_final_q3", q:"Faded magenta shading on a sectional indicates Class E airspace starting at what altitude?",choices:["Surface","700 ft AGL","1,200 ft AGL","3,000 ft AGL"],a:1,exp:"Faded magenta = Class E floor at 700 ft AGL; faded blue = 1,200 ft AGL."},
    {id:"m2_final_q4", q:"What does a blue airport symbol (vs. magenta) tell you?",choices:["No fuel available","The airport has an operating control tower","The runway is closed","It's inside a MOA"],a:1,exp:"Blue = towered; magenta = non-towered."},
    {id:"m2_final_q5", q:"LAANC authorization is:",choices:["A blanket waiver of all Part 107 rules","Near-real-time authorization for controlled airspace up to a pre-approved altitude","Only available to recreational flyers","Required even in Class G"],a:1,exp:"LAANC is fast controlled-airspace authorization, not a rule waiver."},
    {id:"m2_final_q6", q:"Which of these is a legally binding restriction, not just informational?",choices:["A weather briefing","A Temporary Flight Restriction (TFR)","A sectional chart legend","An airport diagram"],a:1,exp:"TFRs are enforceable airspace restrictions."}
  ,
    {id:"m2_final_q7", q:"A solid magenta line on a sectional marks the boundary of which airspace class?", choices:["Class C", "Class B", "Class D", "Class E"], a:0, exp:"Solid magenta = Class C, the mid-size towered airport class."},
    {id:"m2_final_q8", q:"Faded blue shading on a sectional indicates a Class E floor at:", choices:["700 ft AGL", "1,200 ft AGL", "The surface", "18,000 ft MSL"], a:1, exp:"Faded blue marks a Class E floor of 1,200 ft AGL."},
    {id:"m2_final_q9", q:"Dashed magenta on a sectional marks a Class E surface area. What does this mean operationally?", choices:["An area only relevant to manned aircraft above 18,000 ft", "A permanently prohibited area", "Controlled airspace reaching the ground, requiring prior authorization", "Uncontrolled airspace with no authorization needed"], a:2, exp:"A Class E surface area is controlled all the way down to the ground, so it requires authorization like Class B, C, or D."},
    {id:"m2_final_q10", q:"Which type of special use airspace is legally off-limits outright, rather than requiring specific permission to enter?", choices:["A Military Operations Area (MOA)", "An Alert Area", "Restricted airspace", "Prohibited airspace"], a:3, exp:"Prohibited airspace is off-limits outright; Restricted airspace can be entered with specific permission."},
    {id:"m2_final_q11", q:"Besides TFRs, what else might a NOTAM communicate?", choices:["Obstacle lighting outages or GPS interference testing", "Only weight limit changes for the aircraft", "Only airport closures", "Nothing \u2014 NOTAMs and TFRs are the same thing"], a:0, exp:"NOTAMs cover a broad range of temporary notices; a TFR is just one category among several, including things like lighting outages and GPS testing."},
    {id:"m2_final_q12", q:"If a planned altitude exceeds the LAANC grid ceiling for that area, what's the fallback?", choices:["Automatic denial with no alternative", "A manual authorization request through FAADroneZone, which can take up to 90 days", "LAANC auto-approves at the next lower altitude", "Flying is permitted anyway since LAANC was attempted"], a:1, exp:"When LAANC can't cover the request, a manual FAADroneZone request is the fallback \u2014 plan ahead since it can take up to 90 days."}]
},
{
  id:"m3", title:"Weather", week:"Weeks 5–6",
  lessons:[
    {id:"m3l1", title:"Weather's Effect on Small UAS", content:`
      <p>Small UAS are far more weather-sensitive than manned aircraft &mdash; low mass and small control surfaces mean wind, gusts, and precipitation matter more, faster. A gust that a Cessna shrugs off can push a 2 lb quadcopter well off its intended path.</p>
      <div class="badge-row">
        <span class="badge"><b>Wind</b> — cuts control authority, drains battery</span>
        <span class="badge"><b>Precipitation</b> — electronics risk, cuts visibility</span>
        <span class="badge"><b>Temperature</b> — hurts battery chemistry both ways</span>
        <span class="badge"><b>Density altitude</b> — thins the "effective" air</span>
      </div>
      <p>Key effects worth internalizing:</p>
      <ul>
        <li><strong>Wind</strong> reduces control authority, drains battery faster (fighting into a headwind), and can exceed the aircraft's rated max wind speed without ever exceeding what feels windy on the ground.</li>
        <li><strong>Precipitation</strong> risks electronics and reduces visibility &mdash; most consumer/prosumer drones aren't rated for rain.</li>
        <li><strong>Temperature extremes</strong> affect battery chemistry (cold reduces capacity and voltage sag gets worse; heat risks thermal throttling or damage).</li>
        <li><strong>Density altitude</strong> (effective altitude the aircraft "feels," driven up by heat, humidity, and elevation) reduces propeller and motor efficiency, cutting into performance and endurance even when true altitude hasn't changed.</li>
      </ul>
      <div class="callout"><div class="clabel">Ask yourself</div>If density altitude makes the air "feel thinner" to a propeller, why would a hot, humid day at a low-elevation field actually erode performance the same way flying at a higher physical altitude would?</div>
    `,
    quiz:[
      {id:"m3l1_q1", q:"Why are small UAS generally more sensitive to wind than manned aircraft?",
       choices:["They have larger control surfaces","Their low mass and small control surfaces make them more easily displaced by wind and gusts","Wind doesn't actually affect drones","They fly too low for wind to matter"],
       a:1, exp:"Low mass + small control surfaces = greater sensitivity to wind and gusts."},
      {id:"m3l1_q2", q:"Rising density altitude (from heat, humidity, or elevation) generally does what to small UAS performance?",
       choices:["Improves lift and endurance","Has no measurable effect","Reduces propeller/motor efficiency and cuts into performance and endurance","Only affects manned aircraft, not drones"],
       a:2, exp:"Higher density altitude means thinner effective air, which reduces propeller efficiency."}
    ,
      {id:"m3l1_q3", q:"Besides reducing control authority, what else does wind commonly do to a small UAS in flight?", choices:["Nothing else \u2014 control authority is the only effect", "Increases visibility", "Automatically triggers Remote ID broadcast", "Drains the battery faster, especially when fighting into a headwind"], a:3, exp:"Flying into a headwind forces the motors to work harder, draining the battery faster than calm-air flight."},
      {id:"m3l1_q4", q:"How does cold temperature primarily affect a small UAS's battery?", choices:["It reduces capacity and makes voltage sag worse", "It has no effect on lithium battery chemistry", "It only affects charging speed, not flight performance", "It permanently increases battery capacity"], a:0, exp:"Cold weather reduces battery capacity and worsens voltage sag, both of which cut into usable flight performance."}]},
    {id:"m3l2", title:"Reading a METAR", content:`
      <p>A <strong>METAR</strong> is a routine, current-conditions weather report, issued roughly hourly at airports.</p>
      <div class="diagram">${SVG_METAR}<div class="dcap">Anatomy of a typical METAR string.</div></div>
      <p>For Part 107 purposes, the pieces that matter most are wind (speed and gusts vs. your aircraft's rated limits), visibility (must be &ge; 3 SM), and sky condition (for cloud clearance math).<span class="cfrcite" data-ref="ref-citations">§107.51</span></p>
      <div class="tip"><div class="clabel">Test tip</div>The test loves gust spreads: 24012G20KT means sustained 12 knots, gusting to 20. A large gust spread is a bigger operational concern than the sustained number alone.</div>
    `,
    quiz:[
      {id:"m3l2_q1", q:"In the METAR fragment 24012G20KT, what does 'G20' mean?",
       choices:["Wind gusting to 20 knots","Visibility of 20 statute miles","Cloud base at 2,000 ft","Ground temperature of 20°C"],
       a:0, exp:"G20 = gusts to 20 knots, on top of a sustained wind of 12 knots from 240°."},
      {id:"m3l2_q2", q:"In a METAR reading '10SM', what does this represent?",
       choices:["10 statute miles of visibility","Wind speed of 10 knots","10,000 ft cloud ceiling","Sky condition code"],
       a:0, exp:"10SM = 10 statute miles visibility."},
      {id:"m3l2_q3", q:"What does the sky condition code 'BKN250' indicate?",
       choices:["Broken clouds at 250 ft","Broken clouds at 25,000 ft","Clear below 250 ft","Wind direction of 250°"],
       a:1, exp:"Cloud height codes in METARs are in hundreds of feet, so 250 = 25,000 ft."}
    ,
      {id:"m3l2_q4", q:"Roughly how often are METARs issued at a given reporting station?", choices:["Every 6 hours", "Once a day", "Roughly once an hour", "Only when conditions change significantly"], a:2, exp:"A METAR is a routine, current-conditions report issued roughly hourly, unlike the 6-hour TAF cycle."},
      {id:"m3l2_q5", q:"Under \u00a7107.51, what is the minimum visibility that a METAR's visibility figure should be checked against?", choices:["1 statute mile", "5 statute miles", "10 statute miles", "3 statute miles"], a:3, exp:"Part 107 requires at least 3 statute miles of visibility, per \u00a7107.51 \u2014 one of the values a METAR lets you verify before flying."},
      {id:"m3l2_q6", q:"In the METAR fragment 18012G28KT, why does the gust spread matter operationally more than the sustained wind number alone?", choices:["A large gap between sustained and gust speed signals more turbulent, harder-to-control conditions than the sustained number alone suggests", "It doesn't \u2014 only the sustained number matters for planning", "G28 indicates a temperature reading, not wind", "Gusts only matter for manned aircraft, not small UAS"], a:0, exp:"A wide gust spread (12 to 28 knots here) means much rougher, less predictable air than the sustained number alone implies."}]},
    {id:"m3l3", title:"Reading a TAF", content:`
      <p>Where a METAR tells you what conditions are <em>right now</em>, a <strong>TAF</strong> (Terminal Aerodrome Forecast) predicts conditions at an airport for a set period ahead, typically in 24–30 hour blocks, updated every 6 hours.</p>
      <div class="diagram">${SVG_TAF}<div class="dcap">A TAF's change indicators tell you how conditions shift across the forecast period.</div></div>
      <p>TAFs matter for the 16-week planning habit itself: checking tomorrow's TAF before committing to a flight window is standard practice, not overkill. It's also directly testable &mdash; expect a TAF excerpt and a question about whether conditions at a specific future hour meet Part 107 minimums.</p>
    `,
    quiz:[
      {id:"m3l3_q1", q:"What does a TAF forecast, compared to a METAR?",
       choices:["Current conditions only","Forecast conditions at an airport over a set future period","Only wind direction","Only cloud cover"],
       a:1, exp:"TAF = forecast; METAR = current observed conditions."},
      {id:"m3l3_q2", q:"In a TAF, 'TEMPO' indicates:",
       choices:["A permanent gradual change","A temporary fluctuation expected to last under an hour at a time","The station identifier","Wind gust information"],
       a:1, exp:"TEMPO flags short-lived, temporary fluctuations within the forecast period."}
    ,
      {id:"m3l3_q3", q:"A TAF typically forecasts conditions for what length of period?", choices:["The next 1\u20132 hours only", "A full week, updated daily", "A 24\u201330 hour block, updated every 6 hours", "The next 30 minutes, updated continuously"], a:2, exp:"TAFs cover roughly 24\u201330 hours ahead and are refreshed on a 6-hour cycle."},
      {id:"m3l3_q4", q:"Why is checking tomorrow's TAF before committing to a flight window considered standard practice rather than overkill?", choices:["Because TAFs are legally required to be filed before every flight", "Because METARs are unavailable more than an hour in advance", "Because TAFs replace the need for a preflight inspection", "Because it lets you check whether forecast conditions at a specific future hour will meet Part 107 minimums before you commit"], a:3, exp:"A TAF lets you check a specific future hour's forecast against Part 107 minimums before committing to a flight window \u2014 exactly what the exam tests with a TAF excerpt."}]}
  ],
  finalQuiz:[
    {id:"m3_final_q1", q:"Why are drones more sensitive to wind than manned aircraft?",choices:["Larger wingspans","Low mass and small control surfaces","They fly higher","Wind doesn't affect them"],a:1,exp:"Low mass + small control surfaces amplify wind's effect."},
    {id:"m3_final_q2", q:"Rising density altitude tends to:",choices:["Increase propeller efficiency","Decrease propeller/motor efficiency","Only matter above 10,000 ft","Improve battery life"],a:1,exp:"Higher density altitude reduces effective performance."},
    {id:"m3_final_q3", q:"A METAR reports current or forecast conditions?",choices:["Current","Forecast","Both equally","Neither"],a:0,exp:"METAR = current observed conditions."},
    {id:"m3_final_q4", q:"'A2992' in a METAR refers to:",choices:["Altitude in feet","Altimeter setting, 29.92 inches Hg","Azimuth heading","Airport code"],a:1,exp:"A2992 = altimeter setting of 29.92 in Hg."},
    {id:"m3_final_q5", q:"A TAF is typically updated:",choices:["Every hour","Every 6 hours","Once a day","Once a week"],a:1,exp:"TAFs are issued roughly every 6 hours."},
    {id:"m3_final_q6", q:"'BECMG' in a TAF signals:",choices:["A brief temporary change","A gradual, permanent change to forecast conditions","Wind calm","End of the forecast period"],a:1,exp:"BECMG = becoming — a lasting shift in conditions."}
  ,
    {id:"m3_final_q7", q:"What risk does precipitation pose to most consumer and prosumer drones?", choices:["None \u2014 all drones are rated for rain", "It only affects Remote ID broadcast range", "Electronics risk and reduced visibility, since most aren't rated for rain", "It improves motor cooling"], a:2, exp:"Most consumer/prosumer drones aren't rain-rated, so precipitation threatens electronics and cuts visibility."},
    {id:"m3_final_q8", q:"How does cold weather typically affect a small UAS battery?", choices:["It has no measurable effect", "It only slows the propellers", "It permanently damages Remote ID modules", "It reduces capacity and worsens voltage sag"], a:3, exp:"Cold reduces battery capacity and makes voltage sag worse, cutting into available flight performance."},
    {id:"m3_final_q9", q:"Under \u00a7107.51, what is the minimum visibility required for Part 107 operations?", choices:["3 statute miles", "1 statute mile", "5 statute miles", "10 statute miles"], a:0, exp:"\u00a7107.51 sets a 3 statute mile visibility minimum, one of the key figures to check in a METAR."},
    {id:"m3_final_q10", q:"In a TAF, what does 'TEMPO' indicate?", choices:["A permanent shift in conditions", "A temporary fluctuation expected to last under an hour at a time", "The station identifier code", "Wind gust speed only"], a:1, exp:"TEMPO flags short-lived fluctuations within the forecast period, each lasting under an hour at a time."},
    {id:"m3_final_q11", q:"A TAF typically covers a forecast period of about:", choices:["1\u20132 hours", "72 hours", "24\u201330 hours", "One week"], a:2, exp:"TAFs typically forecast 24\u201330 hours ahead, updated roughly every 6 hours."},
    {id:"m3_final_q12", q:"Why does a large gust spread (e.g., sustained 12 knots gusting to 28) matter more operationally than the sustained wind number alone?", choices:["It doesn't \u2014 sustained wind is the only figure worth reading", "It indicates a change in visibility, not wind", "It only matters for aircraft over 55 lbs", "It signals rougher, less predictable air than the sustained number suggests by itself"], a:3, exp:"A wide gap between sustained and gust speed points to more turbulent, harder-to-control conditions than the sustained figure alone conveys."}]
},
{
  id:"m4", title:"Loading & Performance", week:"Week 7",
  lessons:[
    {id:"m4l1", title:"Weight & Balance", content:`
      <p>Even on a small quadcopter, where mass sits relative to the center of lift affects stability, control response, and how hard the flight controller has to work to hold level flight. Mount a heavy gimbal or payload off-center and you're asking the aircraft to constantly fight an imbalance it wasn't designed for.</p>
      <div class="diagram">${SVG_WB}<div class="dcap">Same total weight, very different handling.</div></div>
      <p>Manufacturers publish a maximum takeoff weight and often a recommended center-of-gravity envelope. Loading outside that envelope isn't just a performance nuisance &mdash; it's a controllability and safety issue, and operating outside published limits can itself be a violation of the careless-or-reckless standard.<span class="cfrcite" data-ref="ref-citations">§107.23</span></p>
      <div class="callout"><div class="clabel">Why it matters</div>A drone that's stable and predictable within its weight/balance envelope can become unpredictable the moment you're outside it &mdash; not gradually, but abruptly, often at the worst moment (high wind, low battery).</div>
    `,
    quiz:[
      {id:"m4l1_q1", q:"Why does center of gravity matter on a small UAS?",
       choices:["It doesn't — only manned aircraft care about CG","An off-center load forces the flight controller to constantly compensate, degrading stability and control response","It only affects battery life","It only matters above 400 ft"],
       a:1, exp:"Poor weight distribution stresses the control system and reduces stability/predictability."},
      {id:"m4l1_q2", q:"Operating a small UAS well outside its published weight/balance limits is primarily a concern because:",
       choices:["It voids the warranty only","It's purely a cosmetic issue","It can make the aircraft unpredictable and unsafe to control","It has no real effect below 400 ft"],
       a:2, exp:"Exceeding weight/balance limits threatens controllability, not just performance."}
    ,
      {id:"m4l1_q3", q:"Besides maximum takeoff weight, what else do manufacturers typically publish to define safe loading limits?", choices:["A recommended center-of-gravity envelope", "A minimum Remote ID broadcast range", "A required paint color scheme", "A mandatory flight log template"], a:0, exp:"Manufacturers publish both a max takeoff weight and a recommended CG envelope; loading outside either is a controllability issue."},
      {id:"m4l1_q4", q:"Why is loading a small UAS outside its published weight/balance envelope especially dangerous?", choices:["It only affects the aircraft's resale value", "It gradually and predictably reduces battery life over many flights", "It can make the aircraft unpredictable abruptly rather than gradually, often at the worst moment such as high wind or low battery", "It has no real safety effect below 400 ft AGL"], a:2, exp:"A drone stable within its envelope can turn unpredictable the moment it's outside \u2014 abruptly, not gradually, often when conditions are already stressed."}]},
    {id:"m4l2", title:"Reading Performance Data", content:`
      <p>Manufacturer performance data &mdash; range charts, endurance-vs-payload tables, wind-speed ratings &mdash; exists so you can plan a flight that the aircraft can actually complete, not just start.</p>
      <div class="diagram">${SVG_PERF}<div class="dcap">A typical range-vs-payload curve — read the value at your actual payload, not the headline spec.</div></div>
      <p>A published 30-minute flight time typically assumes a specific payload weight, temperature range, and light wind; add a heavy gimbal in cold weather with a headwind and real endurance can drop noticeably below the spec sheet number. The exam may give you a performance table or chart and ask you to read off a value &mdash; treat it as a lookup exercise: identify your row/column inputs, then read the output.</p>
      <div class="tip"><div class="clabel">Test tip</div>These questions are less about aviation knowledge and more about reading a table accurately in 90 seconds. Slow down and double-check which axis is which before answering.</div>
    `,
    quiz:[
      {id:"m4l2_q1", q:"Manufacturer-published flight time figures typically assume:",
       choices:["Worst-case conditions, always exceeded in practice","Specific conditions (payload, temperature, wind) that real flights may not match","Nothing — they're guaranteed under any conditions","Only indoor flight"],
       a:1, exp:"Published specs assume specific test conditions; real-world endurance varies with payload, temperature, and wind."},
      {id:"m4l2_q2", q:"When the knowledge test presents a performance chart, the main skill being tested is:",
       choices:["Memorized aerodynamics formulas","Accurately reading the correct row/column values under time pressure","Guessing based on drone brand","Weather pattern recognition"],
       a:1, exp:"These are lookup/reading-comprehension questions, not formula-recall questions."}
    ,
      {id:"m4l2_q3", q:"What is the underlying purpose of manufacturer performance data like range-vs-payload charts?", choices:["To let you plan a flight the aircraft can actually complete, not just start", "To satisfy FAA paperwork requirements only", "To set the aircraft's maximum legal altitude", "To calculate registration fees"], a:0, exp:"Performance data exists so you can plan a flight the aircraft can actually finish, not merely begin."},
      {id:"m4l2_q4", q:"When reading a range-vs-payload chart, what should you do to get an accurate answer?", choices:["Always use the headline spec regardless of payload", "Read the value at your actual payload weight, not the headline spec", "Assume range is unaffected by payload", "Round up to the nearest chart gridline"], a:1, exp:"The headline spec is a best case; the chart's value at your actual payload is the number that reflects your real flight."}]}
  ],
  finalQuiz:[
    {id:"m4_final_q1", q:"An off-center payload primarily threatens:",choices:["Battery voltage only","Stability and control response","Remote ID broadcast","Registration validity"],a:1,exp:"Poor CG stresses the control system and reduces predictability."},
    {id:"m4_final_q2", q:"A manufacturer's published flight-time spec generally assumes:",choices:["Worst-case wind and cold","Specific reference conditions that may not match your flight","No payload ever","Indoor use only"],a:1,exp:"Real endurance shifts with payload, temperature, and wind relative to the spec's reference conditions."},
    {id:"m4_final_q3", q:"Operating well outside published weight/balance limits can violate:",choices:["Nothing — it's manufacturer guidance only","The careless-or-reckless operation standard","Remote ID rules exclusively","Only recreational flyer rules"],a:1,exp:"It can constitute careless or reckless operation, which is enforceable under Part 107."}
  ,
    {id:"m4_final_q4", q:"What do manufacturers publish, in addition to maximum takeoff weight, to define a small UAS's safe loading limits?", choices:["A recommended center-of-gravity envelope", "A mandatory insurance policy", "A required flight log format", "A minimum crew size"], a:0, exp:"A recommended CG envelope, alongside max takeoff weight, defines the aircraft's safe loading limits."},
    {id:"m4_final_q5", q:"What is the underlying purpose of published performance data such as range-vs-payload charts?", choices:["To set legal altitude limits", "To let you plan a flight the aircraft can actually complete, not just start", "To calculate registration fees", "To determine Remote ID broadcast range"], a:1, exp:"Performance data lets you plan a flight the aircraft can actually finish, not merely begin."},
    {id:"m4_final_q6", q:"A heavy gimbal, cold weather, and a headwind together tend to do what to a drone's real-world endurance compared to its spec sheet number?", choices:["Increase it above the spec sheet number", "Have no effect, since specs already account for all conditions", "Push it noticeably below the spec sheet number", "Only affect endurance if flying above 400 ft"], a:2, exp:"Published endurance assumes specific reference conditions; stacking a heavy payload, cold temps, and headwind can drop real endurance noticeably below the spec sheet."}]
},
{
  id:"m5", title:"Operations I", week:"Weeks 8–9",
  lessons:[
    {id:"m5l1", title:"Radio Communication & Airport Operations", content:`
      <p>Most small UAS pilots don't carry aviation radios, but understanding radio procedure still matters &mdash; especially when operating near an airport with permission, where you may need to coordinate with a control tower or monitor CTAF (Common Traffic Advisory Frequency) at a non-towered field to build situational awareness of manned traffic.</p>
      <p>Standard phraseology (position, altitude, intentions) exists so pilots operating without direct visual contact with each other can still build a shared mental picture. Even if you're not transmitting, understanding what you're hearing on a monitored frequency is a real safety tool.</p>
    `,
    quiz:[
      {id:"m5l1_q1", q:"What is CTAF used for at a non-towered airport?",
       choices:["Filing flight plans","A common frequency pilots use to announce position and intentions for situational awareness","Weather broadcasts only","Registering aircraft"],
       a:1, exp:"CTAF lets pilots self-announce position/intentions where there's no tower to coordinate traffic."},
      {id:"m5l1_q2", q:"Why might a remote pilot monitor CTAF near a non-towered airport even without transmitting?",
       choices:["It's legally required for all flights","To build situational awareness of nearby manned aircraft traffic","It boosts drone signal range","It's required only for night flights"],
       a:1, exp:"Listening in builds awareness of manned traffic even if the pilot never transmits."}
    ,
      {id:"m5l1_q3", q:"What does the acronym CTAF stand for?", choices:["Controlled Terminal Aircraft Frequency", "Central Tower Advisory Frequency", "Common Traffic Advisory Frequency", "Civil Traffic Approach Frequency"], a:2, exp:"CTAF stands for Common Traffic Advisory Frequency, the shared channel pilots use to self-announce at non-towered fields."},
      {id:"m5l1_q4", q:"The standard phraseology used on frequencies like CTAF \u2014 position, altitude, intentions \u2014 exists mainly so that:", choices:["Pilots without direct visual contact with each other can still build a shared mental picture", "The FAA can track every aircraft's exact GPS coordinates", "Remote pilots can skip filing a flight plan", "Air traffic controllers can bill pilots for airspace use"], a:0, exp:"Standardized phraseology lets pilots who can't see each other still form an accurate mental picture of who's where and doing what."}]},
    {id:"m5l2", title:"Emergency Procedures & Lost Link", content:`
      <p>Plan for failure before you need the plan.</p>
      <div class="diagram">${SVG_LOSTLINK}<div class="dcap">Know your aircraft's default lost-link behavior before you fly it, not after the link drops.</div></div>
      <p>Two scenarios worth having a rehearsed response to:</p>
      <ul>
        <li><strong>Lost link</strong> (control signal drops): most aircraft have a programmable failsafe &mdash; return-to-home, hover-and-wait, or land-in-place.</li>
        <li><strong>Flyaway or loss of control</strong>: have a plan for who you'd notify and what area you'd warn if the aircraft is heading somewhere it shouldn't.</li>
      </ul>
      <p>If an in-flight emergency requires deviating from any Part 107 rule (altitude, airspace, visual line of sight) to protect life or property, the remote PIC may do so &mdash; and must, upon request, submit a written report of the deviation to the FAA. This mirrors the same emergency-authority principle manned-aircraft pilots operate under.</p>
      <div class="tip"><div class="clabel">Test tip</div>"In an emergency, may a remote pilot deviate from Part 107 rules?" &mdash; yes, to the extent required, with a report available on request afterward.</div>
    `,
    quiz:[
      {id:"m5l2_q1", q:"May a remote PIC deviate from Part 107 operating rules during an in-flight emergency?",
       choices:["Never, under any circumstance","Yes, to the extent required by the emergency, with a report available to the FAA on request","Only with prior FAA approval obtained mid-flight","Only if flying for a government agency"],
       a:1, exp:"Emergency authority allows deviation as needed, with post-incident reporting on request."},
      {id:"m5l2_q2", q:"A 'lost link' failsafe most commonly triggers which of the following behaviors?",
       choices:["Immediate uncontrolled descent","A programmed response like return-to-home, hover, or land-in-place","Permanent shutdown of the aircraft's registration","Automatic FAA notification"],
       a:1, exp:"Lost-link failsafes are pre-programmed pilot-selectable behaviors, not a single mandated response."}
    ,
      {id:"m5l2_q3", q:"Per the lesson, a flyaway or loss-of-control event \u2014 as distinct from a lost link \u2014 calls for the remote pilot to have a plan for:", choices:["Reprogramming the failsafe mid-flight", "Who to notify and what area to warn if the aircraft is heading somewhere it shouldn't", "Filing a NOTAM before the next flight", "Switching to a backup transmitter frequency"], a:1, exp:"A flyaway plan is about notification and warning the area at risk, not an in-flight technical fix."},
      {id:"m5l2_q4", q:"Which of the following is NOT one of the lost-link failsafe behaviors the lesson names as commonly programmable?", choices:["Return-to-home", "Hover-and-wait", "Land-in-place", "Automatic handoff of control to air traffic control"], a:3, exp:"The lesson names return-to-home, hover-and-wait, and land-in-place as programmable failsafe behaviors \u2014 ATC never takes direct control of a lost-link aircraft."}]},
    {id:"m5l3", title:"Crew Resource Management", content:`
      <p>Even a two-person team (remote PIC plus a visual observer) benefits from deliberate crew resource management (CRM): clear roles, closed-loop communication (the receiver repeats back what they heard), and a habit of speaking up when something looks wrong regardless of hierarchy.</p>
      <p>A visual observer's job is specific: maintain visual contact with the aircraft and scan for hazards, then communicate clearly and promptly to the remote PIC &mdash; not fly the aircraft, and not substitute for the remote PIC's own situational awareness.</p>
      <div class="tip"><div class="clabel">Case Study</div>On August 10, 2021, near Toronto/Buttonville Municipal Airport in Ontario, a drone and a Cessna 172 on a training flight collided in midair. Canada's Transportation Safety Board (this was a Canadian investigation, not an FAA case &mdash; but the failure at its center applies just as directly under Part 107) found the drone pilot was task-saturated, focused on the live video feed rather than scanning the sky, and that the visual observer assigned to the flight didn't actually know maintaining visual line of sight was their job. The drone's onboard traffic receiver, which could have warned of nearby aircraft, never triggered, because the Cessna wasn't broadcasting the signal it was listening for. Having a visual observer on paper isn't the same thing as having one who knows &mdash; and acts on &mdash; what the role actually requires.</div>
    `,
    quiz:[
      {id:"m5l3_q1", q:"What is the primary role of a visual observer in a Part 107 operation?",
       choices:["To operate the controller instead of the remote PIC","To maintain visual contact with the aircraft and communicate hazards to the remote PIC","To file the flight plan","To hold the remote pilot certificate on behalf of the PIC"],
       a:1, exp:"A visual observer watches and communicates — they don't fly the aircraft."},
      {id:"m5l3_q2", q:"'Closed-loop communication' in a CRM context means:",
       choices:["Only the PIC is allowed to speak","The receiver repeats back what they heard to confirm understanding","Communication happens only after landing","Radios must be used exclusively"],
       a:1, exp:"Closed-loop communication confirms a message was received and understood correctly."},
      {id:"m5l3_q3", q:"In the Toronto drone-Cessna midair collision case, what was the core CRM failure?",
       choices:["The remote PIC was flying too fast for conditions","The visual observer didn't actually understand that maintaining visual line of sight was their responsibility","The Cessna pilot ignored air traffic control","The drone's battery failed mid-flight"],
       a:1, exp:"Assigning a visual observer role doesn't help if the person in that role doesn't understand what it actually requires — that gap, not equipment or speed, was the core failure."}
    ,
      {id:"m5l3_q4", q:"Under the CRM principles described in the lesson, a crew member who notices something wrong should speak up:", choices:["Only if they outrank the remote PIC", "Only after the flight has landed", "Regardless of hierarchy", "Only if the remote PIC asks for input first"], a:2, exp:"CRM depends on a habit of speaking up regardless of hierarchy \u2014 waiting for rank or permission defeats the purpose."},
      {id:"m5l3_q5", q:"The case study's drone-Cessna midair collision took place:", choices:["Near Toronto/Buttonville Municipal Airport, Ontario, in August 2021, investigated by Canada's Transportation Safety Board", "Near Tampa, Florida, in September 2021, investigated by the FAA", "Near Los Angeles, California, in January 2025, investigated by the NTSB", "Near Vancouver, British Columbia, in June 2020, investigated by Transport Canada's enforcement branch"], a:0, exp:"This was a Canadian Transportation Safety Board investigation near Buttonville Municipal Airport, Ontario \u2014 not an FAA case, though the CRM lesson applies just as directly under Part 107."},
      {id:"m5l3_q6", q:"In the case study, why didn't the drone's onboard traffic receiver warn of the approaching Cessna?", choices:["The receiver's battery had died", "The Cessna wasn't broadcasting the signal the receiver was listening for", "The pilot had disabled the receiver before takeoff", "The receiver only functions above 400 feet"], a:1, exp:"The Cessna wasn't transmitting the signal type the drone's receiver was designed to detect, so the technology never had a chance to trigger a warning."}]},
    {id:"m5l4", title:"Physiological Factors", content:`
      <p>Part 107 explicitly incorporates the same drug-and-alcohol standard used across Part 91: no operating within <span class="keyfact" data-ref="ref-alcohol">8 hours</span> of consuming alcohol, while under the influence, with a blood alcohol concentration of <span class="keyfact" data-ref="ref-alcohol">0.04</span> or greater, or while using any drug that affects faculties in a way contrary to safety.<span class="cfrcite" data-ref="ref-citations">§107.27</span></p>
      <p>Beyond substances, the same human factors that ground manned pilots apply here: fatigue, stress, illness, and emotional state all degrade judgment and reaction time. The classic <strong>IMSAFE</strong> checklist is worth running through before any flight, not just formally taught for the exam.</p>
      <div class="diagram">${SVG_IMSAFE}<div class="dcap">IMSAFE — a 30-second self-check before you fly.</div></div>
      <div class="callout"><div class="clabel">Ask yourself</div>Would you trust a judgment call you made on four hours of sleep the same way you'd trust one made well-rested? The FAA's answer, encoded into these rules, is no.</div>
    `,
    quiz:[
      {id:"m5l4_q1", q:"What blood alcohol concentration threshold does Part 107 set, mirroring Part 91?",
       choices:["0.02","0.04","0.08","0.10"],
       a:1, exp:"0.04 BAC is the Part 107/Part 91 threshold."},
      {id:"m5l4_q2", q:"How long must a remote pilot wait after consuming alcohol before operating, per the standard incorporated into Part 107?",
       choices:["4 hours","6 hours","8 hours","12 hours"],
       a:2, exp:"8 hours — the classic 'bottle to throttle' rule."},
      {id:"m5l4_q3", q:"The IMSAFE checklist covers all of the following except:",
       choices:["Illness","Medication","Registration status","Fatigue"],
       a:2, exp:"IMSAFE = Illness, Medication, Stress, Alcohol, Fatigue, Emotion/Eating — registration isn't part of it."}
    ,
      {id:"m5l4_q4", q:"In the IMSAFE checklist, what does the 'S' stand for?", choices:["Signal", "Speed", "Sensors", "Stress"], a:3, exp:"IMSAFE's S is Stress \u2014 one of the human factors that degrades judgment alongside illness, medication, alcohol, fatigue, and emotion."},
      {id:"m5l4_q5", q:"The Part 107 drug-and-alcohol standard, including the 0.04 BAC threshold, is codified at:", choices:["\u00a7107.29", "\u00a7107.27", "\u00a7107.49", "\u00a7107.51"], a:1, exp:"\u00a7107.27 sets the drug-and-alcohol standard, mirroring the same rule manned-aircraft pilots operate under in Part 91."},
      {id:"m5l4_q6", q:"Beyond drugs and alcohol, which factors does the lesson identify as degrading a pilot's judgment and reaction time?", choices:["Only physical fatigue", "Weather and terrain", "Fatigue, stress, illness, and emotional state", "Airspace classification"], a:2, exp:"The lesson names fatigue, stress, illness, and emotional state as the human factors \u2014 beyond substances \u2014 that degrade judgment and reaction time."}]}
  ],
  finalQuiz:[
    {id:"m5_final_q1", q:"CTAF exists primarily to:",choices:["Replace airspace authorization","Let pilots self-announce position/intent at non-towered fields","Broadcast Remote ID","File accident reports"],a:1,exp:"CTAF supports self-coordination where there's no tower."},
    {id:"m5_final_q2", q:"During a genuine in-flight emergency, a remote PIC may:",choices:["Never deviate from any rule","Deviate as needed, reporting on request afterward","Only deviate with real-time FAA phone approval","Deviate only below 100 ft"],a:1,exp:"Emergency authority permits deviation with after-the-fact reporting."},
    {id:"m5_final_q3", q:"A visual observer's core job is to:",choices:["Fly the aircraft when the PIC is busy","Watch the aircraft and hazards, and communicate to the PIC","Handle registration paperwork","Monitor the battery voltage only"],a:1,exp:"Observation and communication, not control."},
    {id:"m5_final_q4", q:"The Part 107 alcohol BAC threshold is:",choices:["0.02","0.04","0.08","0.10"],a:1,exp:"0.04, same as Part 91."},
    {id:"m5_final_q5", q:"The 'bottle to throttle' rule requires waiting how long after drinking before flying?",choices:["4 hours","6 hours","8 hours","24 hours"],a:2,exp:"8 hours minimum."},
    {id:"m5_final_q6", q:"IMSAFE stands for Illness, Medication, Stress, Alcohol, Fatigue, and:",choices:["Emotion/Eating","Equipment","Elevation","Endurance"],a:0,exp:"The final letter covers emotional state and eating/nutrition."}
  ,
    {id:"m5_final_q7", q:"Per the lesson, when operating with permission near an airport, a remote pilot may need to:", choices:["Coordinate with a control tower or monitor CTAF at a non-towered field", "File an IFR flight plan", "Request priority handling over manned traffic", "Broadcast a Remote ID override code"], a:0, exp:"Operating near an airport with authorization may call for tower coordination or CTAF monitoring, depending on whether the field is towered."},
    {id:"m5_final_q8", q:"What distinguishes a 'lost link' event from a 'flyaway' as described in the lesson?", choices:["A flyaway only happens with fixed-wing aircraft", "A lost link only happens at night", "They are two names for the same failure", "Lost link is a control-signal dropout with a programmable failsafe; a flyaway is loss of control needing a notification plan"], a:3, exp:"Lost link has a built-in programmed response (RTH, hover, land); a flyaway needs a human notification plan since there's no automatic fix."},
    {id:"m5_final_q9", q:"CRM principles, as described in the lesson, apply meaningfully to a Part 107 crew of:", choices:["Five or more certificated crew members only", "As few as two people \u2014 a remote PIC and a visual observer", "Only operations requiring a waiver", "Only operations with a dedicated dispatcher"], a:1, exp:"The lesson makes the point explicitly: even a two-person team of PIC and visual observer benefits from deliberate CRM."},
    {id:"m5_final_q10", q:"The Transportation Safety Board's investigation into the Toronto drone-Cessna collision found the drone pilot was primarily:", choices:["Flying above the 400 ft altitude limit", "Uncertificated", "Task-saturated, focused on the video feed rather than scanning the sky", "Operating at night without required lighting"], a:2, exp:"Task saturation on the video feed, not an altitude or certification violation, was the investigation's central finding."},
    {id:"m5_final_q11", q:"The IMSAFE checklist is best described as:", choices:["A personal pre-flight self-check covering illness, medication, stress, alcohol, fatigue, and emotion", "A mandatory annual aircraft maintenance inspection", "A radio call sequence used at towered airports", "A checklist required only for BVLOS waiver applications"], a:0, exp:"IMSAFE checks the pilot's own fitness to fly, not the aircraft or the airspace."},
    {id:"m5_final_q12", q:"Part 107's drug-and-alcohol standard is best characterized as:", choices:["A stricter, drone-specific rule that goes beyond manned aviation", "Optional guidance with no enforcement mechanism", "Applicable only to Category 2 through 4 operations", "The same standard incorporated from Part 91 manned-aircraft rules"], a:3, exp:"Part 107 explicitly incorporates the same drug-and-alcohol standard used across Part 91 \u2014 no separate, drone-specific threshold."}]
},
{
  id:"m6", title:"Operations II", week:"Week 10",
  lessons:[
    {id:"m6l1", title:"Maintenance & Inspection", content:`
      <p>Part 107 requires the remote PIC to ensure the small UAS is in a condition for safe operation before every flight &mdash; a preflight inspection covering things like propeller condition, airframe integrity, battery condition and charge, firmware/software currency, and control link function.<span class="cfrcite" data-ref="ref-citations">§107.49</span></p>
      <p>There's no FAA-mandated maintenance schedule the way there is for manned aircraft, but the manufacturer's recommended maintenance and any known airworthiness issues (recalls, service bulletins) still apply, and keeping basic maintenance records is good practice even when not strictly mandated by rule.</p>
      <div class="tip"><div class="clabel">Test tip</div>If a question implies "there's no maintenance requirement at all for drones," that's the wrong framing — the requirement is a functional one (ensure safe condition before flight), not a fixed inspection calendar.</div>
    `,
    quiz:[
      {id:"m6l1_q1", q:"What does Part 107 require regarding aircraft condition before flight?",
       choices:["Nothing — no inspection requirement exists","The remote PIC must ensure the aircraft is in a condition for safe operation","A certified mechanic must inspect it before every flight","Only annual inspections are required, as with manned aircraft"],
       a:1, exp:"It's a functional preflight-condition requirement, not a fixed inspection schedule like manned aviation."},
      {id:"m6l1_q2", q:"Manufacturer maintenance recommendations and recalls/service bulletins:",
       choices:["Are legally irrelevant to Part 107 pilots","Still matter and should inform the pilot's safe-condition determination","Only apply to Category 4 aircraft","Are optional reading with no practical effect"],
       a:1, exp:"They inform whether the aircraft is genuinely in a safe condition to fly, even without a formal FAA schedule."}
    ,
      {id:"m6l1_q3", q:"Which of the following is explicitly named in the lesson as something a Part 107 preflight inspection should cover?", choices:["Weight-and-balance manifest filed with the FAA", "Propeller condition, airframe integrity, battery condition/charge, firmware currency, and control link function", "A licensed mechanic's written sign-off", "Airport diagram currency"], a:1, exp:"The lesson lists these five specific items as what a genuine preflight condition check covers."},
      {id:"m6l1_q4", q:"Per the lesson, keeping basic maintenance records for a small UAS is:", choices:["Good practice, even though it isn't strictly mandated by rule", "Mandatory and must be filed with the FAA annually", "Required only for aircraft over 55 lbs", "Irrelevant since there's no FAA maintenance schedule at all"], a:0, exp:"There's no mandated schedule, but the lesson is clear that record-keeping is still good practice \u2014 not pointless just because it's not required."}]},
    {id:"m6l2", title:"Night Operations", content:`
      <p>Night flight no longer requires a waiver for most Part 107 pilots. The requirement instead is equipment-based: the aircraft must have <strong>anti-collision lighting</strong> visible for at least <span class="keyfact" data-ref="ref-night">3 statute miles</span>, visible through the full <span class="keyfact" data-ref="ref-night">360&deg;</span> around the aircraft, with a flash rate sufficient to avoid collision.<span class="cfrcite" data-ref="ref-citations">§107.29</span></p>
      <div class="diagram">${SVG_NIGHT}<div class="dcap">Anti-collision lighting must reach every direction, not just forward or down.</div></div>
      <p>The remote PIC may reduce the lighting's intensity if it would improve safety under the operating conditions (e.g., avoiding excessive glare) &mdash; but may not extinguish it entirely. Night operations also require the remote pilot to have completed the recurrent/initial training that specifically covers night operations, and to be able to recognize the onset of physiological effects of low illumination (like reduced depth perception) that don't apply in daylight.</p>
    `,

      {id:"m6l2_q1", q:"What lighting requirement applies to Part 107 night operations?",
       choices:["No lighting requirement exists at night","Anti-collision lighting visible for at least 3 statute miles, 360° around the aircraft","A steady white light visible for 1 mile","Strobe lights only above 200 ft"],
       a:1, exp:"3 statute mile visibility, all around the aircraft, is the standard."},
      {id:"m6l2_q2", q:"May a remote PIC turn off anti-collision lighting entirely if they judge it safer?",
       choices:["Yes, anytime","No — intensity may be reduced for safety, but the light may not be extinguished entirely","Only during civil twilight","Only with a waiver"],
       a:1, exp:"Reduce intensity if needed; never fully extinguish."}
    ,

      {id:"m6l2_q4", q:"Beyond the lighting equipment rule, what additional requirement does the lesson attach to night operations?", choices:["Completion of training that specifically covers night operations", "A logged minimum of 10 night flight hours", "A second remote pilot on every flight", "A medical certificate renewed annually"], a:0, exp:"Night ops require training specific to night flying, including recognizing physiological effects like reduced depth perception \u2014 not extra logged hours or a medical certificate."}]},
    {id:"m6l3", title:"Aeronautical Decision-Making", content:`
      <p>Two classic frameworks show up on the test and, more importantly, are worth actually using.</p>
      <p><strong>PAVE</strong> breaks risk assessment into four categories:</p>
      <div class="diagram">${SVG_PAVE}</div>
      <p>The five classic <strong>hazardous attitudes</strong>, each with an antidote thought to counter it:</p>
      <div class="attitude-grid">
        <div class="attitude-card"><span class="aname">Anti-authority — "rules don't apply to me"</span><span class="aanti"><small>Antidote</small>Follow the rules — they're usually there for a reason.</span></div>
        <div class="attitude-card"><span class="aname">Impulsivity — "do something now"</span><span class="aanti"><small>Antidote</small>Not so fast. Think first.</span></div>
        <div class="attitude-card"><span class="aname">Invulnerability — "it won't happen to me"</span><span class="aanti"><small>Antidote</small>It could happen to me.</span></div>
        <div class="attitude-card"><span class="aname">Macho — "I can prove I'm better"</span><span class="aanti"><small>Antidote</small>Taking chances is foolish.</span></div>
        <div class="attitude-card"><span class="aname">Resignation — "what's the use"</span><span class="aanti"><small>Antidote</small>I'm not helpless. I can make a difference.</span></div>
      </div>
      <div class="callout"><div class="clabel">Ask yourself</div>Which of these five attitudes is easiest for you, specifically, to slip into under a deadline &mdash; and would you actually notice yourself doing it in the moment?</div>
    `,

const SEMESTER1_MODULES = [
{
  id:"b1", title:"Drone Fundamentals & Anatomy", week:"Weeks 1–2",
  lessons:[
    {id:"b1l1", title:"The Component Stack: How a Drone Is Actually Built", content:`
      <p>Every multirotor, from a $30 toy to a $3,000 cinema rig, breaks down into the same handful of systems doing the same jobs. Learn these once and every build guide, wiring diagram, and forum post you read afterward will actually make sense instead of being a wall of acronyms.</p>
      <p>The <strong>frame</strong> is the skeleton — usually carbon fiber for its stiffness-to-weight ratio. Frame size is described two ways: <strong>wheelbase</strong> (motor-to-motor diagonal distance, in mm) and the prop size it's built around, in inches. A "5-inch frame" is built around 5-inch propellers; that single number tells you roughly how big, loud, and powerful the finished aircraft will be.</p>
      <p>The <strong>flight controller (FC)</strong> is the brain. It's a small board carrying a gyroscope and accelerometer that sense the aircraft's orientation hundreds of times a second, running firmware (Betaflight and ArduPilot are the two you'll meet constantly) that decides how much power each motor needs to keep the aircraft stable and follow your stick inputs.</p>
      <p>The FC doesn't talk to the motors directly — it can't push enough current. That's the <strong>electronic speed controller (ESC)</strong>'s job: it takes a signal from the FC and switches battery power to each motor's three phases many thousands of times per second, which is what actually makes a brushless motor spin. Most modern builds use a <strong>4-in-1 ESC</strong> — all four motor controllers on one board — rather than four separate ESCs strapped to the arms.</p>
      <p><strong>Motors</strong> spin the <strong>propellers</strong>, which convert rotation into thrust by shoving air downward. The <strong>battery</strong> — almost always a lithium polymer (LiPo) pack on anything built for performance — is the power source for all of it, and it's the single component most beginners underestimate the importance of (Lesson 3 is entirely about why).</p>
      <p>None of this matters without a way for you to tell the aircraft what to do. The <strong>receiver (RX)</strong> sits on the aircraft and listens for a radio signal from your handheld <strong>transmitter (TX)</strong>, then passes your stick commands to the FC. Add a <strong>camera and video transmitter (VTX)</strong> if you're flying FPV — <strong>first-person view</strong>, piloting from a live video feed instead of watching the aircraft from the ground — and you've got the full stack. Note what's missing from this list: nothing here tells the aircraft *where* it is, only which way it's pointed. Position-aware flight (GPS, compass, autonomous missions) is a separate sensor set and a separate flight controller firmware, covered in the ArduPilot module later this semester.</p>
      <ul>
        <li>Transmitter → Receiver: your stick inputs, sent over the air.</li>
        <li>Receiver → Flight controller: those inputs, handed off over a wire.</li>
        <li>Flight controller → ESCs: computed per-motor power commands, based on your inputs plus what the gyro is sensing.</li>
        <li>ESCs → Motors: actual electrical power, switched at high frequency.</li>
        <li>Motors → Props → Air → Thrust: the only part of this chain that actually moves the aircraft.</li>
      </ul>
      <div class="diagram">${SVG_STACK}<div class="dcap">Trace the arrows backward from Air/Thrust &mdash; RX, FC and the ESC only exist to make that last Motor to Prop link happen.</div></div>
      <div class="callout"><div class="clabel">Ask Yourself</div>If the flight controller is the only part making stabilization decisions, why does almost every other component on this list exist purely to serve it — sensing for it, powering it, or obeying it?</div>
      <div class="tip"><div class="clabel">Hands-On</div>If you have any drone or a spare FC board in front of you, physically point to each part as you name it — frame, FC, ESC, motor, prop, battery, receiver — before you read further. If you can't find one of them, that's exactly the part to research next.</div>
    `, quiz:[

      {id:"b1l1_q5", q:"What does a flight controller use to sense the aircraft's orientation hundreds of times per second?", choices:["A GPS and compass module", "A gyroscope and accelerometer", "A barometer and magnetometer only", "The video transmitter's onboard sensor"], a:1, exp:"The FC carries a gyroscope and accelerometer that sense the aircraft's orientation hundreds of times a second, which its firmware uses to compute stabilization corrections."},
      {id:"b1l1_q6", q:"What is a '4-in-1 ESC,' and why do most modern builds use one?", choices:["A single ESC that can control four different drones at once", "An ESC built with four separate power inputs for redundancy", "A board combining all four motor speed controllers, reducing parts and wiring versus four separate ESCs", "A battery connector rated for four times normal current"], a:2, exp:"A 4-in-1 ESC puts all four motor controllers on a single board \u2014 most modern builds prefer this over strapping four separate ESCs to the arms."}]},
    {id:"b1l2", title:"Motors and Propellers: KV, Pitch, and Matching", content:`
      <p>Two specs decide almost everything about how a drone flies: motor <strong>KV</strong> and propeller size. Get them mismatched and you'll either burn out a motor or build something that barely lifts off its own weight.</p>
      <p><strong>KV</strong> is defined as RPM increase per volt applied, with no propeller attached and no load. A <span class="keyfact">2400KV</span> motor spins roughly 2400 RPM for every volt you feed it. This trips up almost every beginner: higher KV does <strong>not</strong> mean a better or stronger motor. It means the motor is wound to spin faster and produce less torque at a given voltage — the opposite of "better" in most builds. A high-KV motor forced to swing a large propeller will draw excessive current trying to overcome the prop's resistance, overheating the motor and ESC in minutes.</p>
      <p>Propellers are sized as diameter × pitch, in inches — a "5142" prop is roughly 5.1 inches in diameter with a 4.2-inch pitch. That four-digit code alone doesn't say how many blades it has — blade count is called out separately in the product name (e.g., "5142 Tri-Blade"), and two blades is the assumed default when nothing else is specified. <strong>Pitch</strong> is the theoretical distance the prop would travel forward in one full rotation if it were driving through a solid medium like a screw through wood — a higher-pitch prop moves more air per rotation but demands more torque to turn.</p>
      <p>Matching motor to prop is a torque problem: a <strong>low-KV motor</strong> produces more torque at lower RPM and comfortably swings a larger, higher-pitch prop — the combination favored for long-range and cinematic builds prioritizing efficiency and flight time. A <strong>high-KV motor</strong> paired with a small, light prop spins up fast for sharp, punchy response — the combination favored for freestyle and racing, where agility matters more than endurance. Bigger props generally mean more absolute thrust; smaller, lighter props mean better efficiency per gram of current drawn. That tradeoff is exactly why a 5-inch freestyle quad and a 3-inch "cinewhoop" feel like different categories of aircraft even though the electronics inside them aren't that different — the 5-inch hits harder and covers ground faster, the 3-inch is quieter, more forgiving in tight spaces, and easier to fly indoors.</p>
      <p>One more thing that trips up nearly every first build: propellers come in <strong>clockwise (CW) and counter-clockwise (CCW)</strong> pairs, and motors are wired to spin in a matching direction. Here's the intuition for why direction even matters: a spinning motor doesn't just push air down, it also pushes back against its own mount — the frame — with an equal and opposite twisting force. On a quad, diagonal motor pairs spin the same direction specifically so those reaction twists cancel each other out across the frame; get this wrong and the aircraft will spin on its yaw axis on takeoff instead of climbing straight. If you power up a fresh build and a motor spins the wrong way, the fix is simple: nearly all hobby motors are <strong>sensorless</strong> brushless motors (they infer rotor position electrically rather than using a dedicated position sensor, which is why they're cheaper and simpler to wire) — swap any two of its three motor wires, or reverse that motor's direction in the flight controller software — don't force the wrong-direction prop onto it and hope.</p>
      <div class="callout"><div class="clabel">Ask Yourself</div>If higher KV means less torque per volt, why would a racing pilot — who wants raw punch — often prefer a higher-KV setup than a cinematic pilot flying the same frame size?</div>
      <div class="tip"><div class="clabel">Hands-On</div>Find an online static-thrust calculator (search for one built for multirotor builders) and plug in a candidate motor's KV, your intended battery cell count, and a couple of prop sizes. Watch how estimated thrust and current draw shift — this is the same math you'll do before buying real parts.</div>
    `, quiz:[

      {id:"b1l2_q5", q:"A propeller labeled '5142' tells you which two dimensions, in inches?", choices:["Diameter and blade count", "Pitch and blade count", "Weight and diameter", "Diameter and pitch"], a:3, exp:"A four-digit prop code gives diameter \u00d7 pitch in inches \u2014 '5142' is roughly 5.1 inches in diameter with a 4.2-inch pitch. Blade count is called out separately in the product name, not in the four-digit code."},
      {id:"b1l2_q6", q:"A builder wants long flight times and smooth, efficient flight rather than sharp punch. Which motor/prop pairing fits that goal?", choices:["A low-KV motor with a larger, higher-pitch prop", "A high-KV motor with a small, light prop", "Any KV motor, since KV doesn't affect efficiency", "A high-KV motor with no propeller at all"], a:0, exp:"Low-KV motors produce more torque at lower RPM and comfortably swing larger, higher-pitch props \u2014 the combination favored for long-range and cinematic builds that prioritize efficiency and flight time over punch."},
      {id:"b1l2_q7", q:"Why are diagonal motor pairs on a quadcopter set to spin in the same rotational direction?", choices:["So they draw current from the battery at the same rate", "So their reaction torques cancel out across the frame instead of causing unwanted yaw", "So the propellers don't collide with each other mid-flight", "Because the flight controller cannot control motors spinning in different directions"], a:1, exp:"Each spinning motor pushes back against the frame with an equal and opposite reaction torque; matching diagonal pairs' spin direction cancels those twists so the aircraft climbs straight instead of spinning on yaw at takeoff."},
