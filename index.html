    {id:"b1l3", title:"Batteries and the Power System", content:`
      <p>More builds get damaged — and more fires start — from mishandled batteries than from crashes. Treat this lesson as seriously as it's written.</p>
      <p>Performance drones almost universally run <strong>lithium polymer (LiPo)</strong> batteries: energy-dense, capable of very high discharge rates, and genuinely dangerous if abused. Puncture, overcharge, over-discharge, or crush one and it can go into <strong>thermal runaway</strong> — a self-sustaining chemical fire that water won't put out and that can reignite hours later.</p>
      <p>Cell count is written as a number followed by <strong>S</strong> — a 4S pack has four cells wired in series. Each cell is nominally <span class="keyfact">3.7V</span>, fully charged at <span class="keyfact">4.2V</span>, and should never be discharged below roughly <span class="keyfact">3.0V</span> under load. A 4S pack therefore runs at a nominal 14.8V, fully charged around 16.8V. More cells means more voltage delivered to the motors without a proportional increase in current — which is why bigger, more powerful builds tend to move to higher S counts rather than just bigger single-cell packs.</p>
      <p><strong>C-rating</strong> describes how fast a pack can safely discharge, as a multiple of its capacity: a 1500mAh (1.5Ah) pack rated at 75C can theoretically sustain 1.5Ah × 75 = 112.5A continuous — convert mAh to Ah first (divide by 1000) before multiplying by the C-rating, or the number comes out a thousand times too large. In practice, treat manufacturer C-ratings with some skepticism — they're often optimistic, and the number that matters more day-to-day is <strong>voltage sag</strong>: how far the pack's voltage drops the instant you demand a hard punch of throttle. A healthy, well-matched pack sags briefly and recovers; a worn-out, undersized, or cold pack sags hard and stays low, which shows up as mushy, underpowered flight even though the charge percentage looks fine.</p>
      <p>Charging and storage safety is not optional ceremony — it's the difference between a normal hobby and a house fire:</p>
      <ul>
        <li>Always charge on a <strong>balance charger</strong>, which monitors and equalizes every individual cell rather than just the pack total — an imbalanced cell is exactly what leads to overcharge damage.</li>
        <li>Charge inside a <strong>LiPo-safe bag or fireproof container</strong>, on a non-flammable surface, and never leave a charging pack unattended.</li>
        <li>For long-term storage, discharge to roughly <span class="keyfact">3.8V per cell</span> ("storage voltage") — not full charge, not empty. Packs left at full charge for weeks degrade faster and are at higher risk.</li>
        <li>Inspect every pack before you plug it in: swelling ("puff"), a punctured or torn wrapper, a burnt smell, or a cell voltage significantly lower than its neighbors are all reasons to stop and retire the pack, not charge it.</li>
        <li>Never charge or fly a visibly puffed pack. Retire it and dispose of it properly — see the Reference Sheet's <span class="keyfact" data-ref="ref-battery-safety">Battery Safety</span> entry for the full charging/storage/disposal protocol. It does not go in household trash.</li>
      </ul>
      <p>Connectors matter too, mostly for current handling: <span class="keyfact">XT60</span> connectors are the common standard on small-to-mid builds, rated for sustained draws well past what a typical 4S build needs; smaller JST connectors show up on lightweight whoops and micro builds where current draw is much lower. Using an undersized connector for your pack's real discharge current is its own way to generate heat and damage.</p>
      <div class="tip"><div class="clabel">Case Study</div>A pilot lands a 4S freestyle quad hard after clipping a branch — the aircraft's fine, no visible damage. He tosses the battery back in his backpack and flies again the next day. Mid-flight the pack feels "off" — soft power delivery, heavier-than-usual sag — and afterward he notices the pack is visibly swollen. The hard landing had stressed a cell internally without any external sign at the time; the swelling only became visible after another full charge/discharge cycle stressed the already-damaged cell further. He was lucky it didn't happen mid-flight or in the bag. The lesson: after any hard impact, inspect the pack before the next charge, not just the airframe.</div>
      <div class="tip"><div class="clabel">Hands-On</div>If you own a cell checker or a balance charger with a voltage display, check a pack you haven't flown in a while. Compare individual cell voltages — if one cell reads noticeably lower than the others, that pack is telling you something before it ever shows visible damage.</div>
    `, quiz:[
      {id:"b1l3_q1", q:"What does the 'S' number on a LiPo battery (e.g., 4S) indicate?",
       choices:["The battery's total capacity in mAh","The number of cells wired in series, which sets the pack's voltage","The maximum safe discharge rate","The battery's physical size class"],
       a:1, exp:"S counts series-wired cells. A 4S pack has four 3.7V-nominal cells in series for a nominal 14.8V — more cells means higher voltage, not more capacity."},
      {id:"b1l3_q2", q:"What does 'voltage sag' refer to, and what does heavy sag under normal load usually indicate?",
       choices:["A permanent voltage loss that never recovers; it means the charger is broken","A temporary voltage drop under load; heavy sag usually indicates a worn-out or overtaxed pack","The voltage difference between two different battery brands; it's not a real concern","The voltage lost during storage; it means the pack was overcharged"],
       a:1, exp:"Sag is the momentary voltage drop when current demand spikes. A healthy pack sags briefly and recovers; a heavily sagging pack — even at full charge percentage — points to a degraded or mismatched battery."},
      {id:"b1l3_q3", q:"What is the correct storage voltage target for a LiPo pack that won't be flown for a while?",
       choices:["Fully charged, at 4.2V per cell","Fully discharged, at 0V per cell","Roughly 3.8V per cell","It doesn't matter as long as it's charged before the next flight"],
       a:2, exp:"Storage voltage (~3.8V/cell) reduces long-term chemical stress compared to storing at full charge, which accelerates degradation and raises risk."},
      {id:"b1l3_q4", q:"You find a LiPo pack with a visibly swollen case. What's the correct next step?",
       choices:["Charge it once more to confirm the problem, then decide","Fly it on a shorter flight since it's still holding some charge","Retire it — do not charge or fly it — and dispose of it through proper LiPo disposal, not household trash","Squeeze the swelling flat and continue using it normally"],
       a:2, exp:"A puffed pack has already suffered internal damage and is a real fire risk. It should never be charged or flown again, and needs proper discharge/disposal, not a trash can."}
    ,
      {id:"b1l3_q5", q:"A 2000mAh LiPo pack is rated at 50C. What is its theoretical maximum continuous discharge current?", choices:["50A", "20A", "10A", "100A"], a:3, exp:"Convert mAh to Ah first (2000mAh \u00f7 1000 = 2.0Ah), then multiply by the C-rating: 2.0Ah \u00d7 50C = 100A continuous \u2014 skipping the conversion step is the most common way this calculation goes wrong."},
      {id:"b1l3_q6", q:"What does a balance charger do that a simple pack-voltage charger does not?", choices:["It monitors and equalizes each individual cell's voltage, not just the pack total", "It charges at a much faster rate than any other charger type", "It automatically detects and repairs swollen cells", "It converts the pack's stored energy into watt-hours for display"], a:0, exp:"A balance charger monitors and equalizes every individual cell rather than just the pack total \u2014 an imbalanced cell is exactly what leads to overcharge damage if left unmonitored."},
      {id:"b1l3_q7", q:"What is a fully charged LiPo cell's voltage, and roughly how low should it be discharged under load?", choices:["Fully charged at 3.0V, discharge no lower than 4.2V", "Fully charged at 4.2V, discharge no lower than roughly 3.0V", "Fully charged at 3.7V, discharge no lower than 3.7V", "Fully charged at 5.0V, discharge no lower than 4.2V"], a:1, exp:"Each cell is nominally 3.7V, tops out at 4.2V fully charged, and shouldn't be discharged below roughly 3.0V under load \u2014 going outside that range stresses or damages the cell."},
      {id:"b1l3_q8", q:"What makes LiPo thermal runaway especially dangerous compared to an ordinary fire?", choices:["It only happens while the pack is charging, never in storage", "It produces no heat, only smoke", "It's a self-sustaining chemical reaction that water won't extinguish and that can reignite hours later", "It can be stopped simply by disconnecting the battery"], a:2, exp:"Thermal runaway is a self-sustaining chemical fire that water won't put out and that can reignite hours later \u2014 fundamentally different from a fire you can simply douse and walk away from."}]},
    {id:"b1l4", title:"The Radio Link and Control Chain", content:`
      <p>Everything upstream of the receiver is invisible to a beginner until it fails, so it's worth understanding what's actually happening between your thumbs and the aircraft.</p>
      <p>Your <strong>transmitter (TX)</strong> encodes your stick and switch positions into a radio signal. The aircraft's <strong>receiver (RX)</strong> is tuned to that signal and, once <strong>bound</strong> to your specific transmitter (a one-time pairing process, distinct from just being powered on), continuously decodes it into channel values it hands off to the flight controller. "Channel" here doesn't mean the radio frequency channel the link operates on — it means one axis or switch of control data (throttle, roll, an arm switch, and so on), one of typically 8–16 such values a receiver outputs at once. Different radio protocols trade off range, latency, and how many channels they can carry — you don't need vendor-level detail to fly, just the concept that these are engineering tradeoffs, not arbitrary branding differences.</p>
      <p>Here's a distinction worth being precise about, because a later module covers Betaflight's software failsafe in depth and conflating the two will confuse you then: a <strong>hardware-level failsafe</strong> is configured on the receiver itself, independent of any flight controller firmware. It defines what channel values the receiver outputs when it stops getting valid signal from the transmitter — commonly holding a preset "safe" position (throttle low, for instance) rather than freezing at the last received command. The flight controller's software failsafe is a separate, later stage of decision-making that acts on what the receiver is telling it; it's covered when you get to configuring Betaflight.</p>
      <p>It's also worth separating two situations that look similar from the pilot's seat but are diagnostically very different: <strong>signal loss</strong> (a link that was working, then dropped — due to range, interference, or obstruction) versus a link that <strong>never existed in the first place</strong> (a receiver that was never successfully bound, or lost its binding). A receiver that's never been bound typically won't produce valid channel data at all and may sit in failsafe from power-on; a receiver that had a good link and lost it will show a clear transition. When you're troubleshooting "my drone won't respond," which of these you're looking at changes where you start: re-bind the receiver, or go looking for an interference source or obstruction.</p>
      <div class="callout"><div class="clabel">Why It Matters</div>A hardware failsafe that puts the aircraft into a safe, predictable state the instant signal drops is the difference between a drone that lands itself in place and one that flies off under whatever the last received stick input happened to be.</div>
      <div class="tip"><div class="clabel">Hands-On</div>If you have a bound TX/RX pair, power on the receiver alone (without the transmitter on) and, safely with no propellers attached, watch what the flight controller's receiver tab reports. That's your hardware failsafe state — get familiar with what it looks like when nothing is being received.</div>
    `, quiz:[
      {id:"b1l4_q1", q:"What is the receiver 'binding' process?",
       choices:["Physically screwing the receiver to the frame","A one-time pairing step that tunes a specific receiver to a specific transmitter's signal","Configuring the flight controller's PID values","Calibrating the battery's voltage sag"],
       a:1, exp:"Binding pairs a receiver to one transmitter so it only accepts and decodes that transmitter's signal — it's separate from simply powering the receiver on."},
      {id:"b1l4_q2", q:"How does a hardware-level receiver failsafe differ from Betaflight's software failsafe?",
       choices:["They're the same thing, just different names","Hardware failsafe is configured on the receiver itself and defines its output when signal is lost; software failsafe is a separate flight-controller-level stage that acts on that data","Hardware failsafe only exists on expensive receivers","Software failsafe replaces the need for a hardware failsafe entirely"],
       a:1, exp:"Hardware failsafe lives on the receiver and sets what channel values it outputs with no valid signal. The flight controller's software failsafe is a later, separate decision layer covered in later coursework."},
      {id:"b1l4_q3", q:"A receiver that was never successfully bound to a transmitter, versus one that had a good link and then lost it — why does distinguishing these matter?",
       choices:["It doesn't — both are fixed the same way","They point to different root causes: a never-bound receiver needs re-binding, while a dropped link points to interference, range, or obstruction","A never-bound receiver is a hardware defect requiring replacement","Only the dropped-link case involves failsafe at all"],
       a:1, exp:"A link that never existed and a link that failed produce similar symptoms (no response) but have different causes and different fixes — correctly identifying which one you're facing saves troubleshooting time."}
    ,
      {id:"b1l4_q4", q:"In the context of receiver channels, what does a 'channel' actually refer to?", choices:["The specific radio frequency the link operates on", "The number of motors the receiver can control", "One axis or switch of control data, such as throttle or an arm switch", "A separate physical wire for each control input"], a:2, exp:"'Channel' here means one axis or switch of control data \u2014 throttle, roll, an arm switch, and so on \u2014 not the radio frequency channel the link operates on, a common beginner mix-up."},
      {id:"b1l4_q5", q:"When a hardware-level receiver failsafe triggers, what does it typically do?", choices:["It freezes the aircraft at the last received stick command", "It outputs a preset 'safe' channel position, such as throttle low, rather than freezing at the last command", "It immediately cuts all power to the flight controller", "It automatically re-binds to the transmitter"], a:1, exp:"A hardware failsafe commonly holds a preset safe position \u2014 throttle low, for instance \u2014 rather than freezing at whatever the last received command happened to be, which is what actually makes it safe."},
      {id:"b1l4_q6", q:"The lesson notes that different radio link protocols trade off range, latency, and channel count. What does it say about these tradeoffs?", choices:["They're arbitrary marketing differences between vendors with no real engineering basis", "Only latency matters; range and channel count are irrelevant to hobby flying", "Every protocol offers identical range, latency, and channel count", "They are genuine engineering tradeoffs, not just branding differences, though vendor-level detail isn't required to fly"], a:3, exp:"The lesson is explicit that these are real engineering tradeoffs between protocols, not arbitrary branding \u2014 though a beginner doesn't need vendor-level detail to fly, just the concept."}]}

  id:"b2", title:"Sourcing Parts & Planning a Build", week:"Weeks 3–4",
  lessons:[
    {id:"b2l1", title:"Define the Build Before You Buy Anything", content:`
      <p>Before you open a single browser tab to shop, answer one question: <strong>what is this aircraft for?</strong> A freestyle quad, a racing quad, a cinematic rig, a long-range explorer, and a Part 107-compliant commercial platform are five different design problems, not five trim levels of the same drone. Buy parts before answering this and you'll end up with a frame that fights its own motors.</p>
      <p><strong>Freestyle</strong> builds prioritize punch and durability for tricks near obstacles — beefier arms, mid-KV motors, props chosen for control at low throttle as much as top speed. <strong>Racing</strong> builds shave every gram for acceleration and top speed, accepting fragility as the tradeoff. <strong>Cinematic</strong> builds (often on larger frames, sometimes with a gimbal) prioritize smooth, damped flight over aggressive punch — softer prop pitch, sometimes heavier frames to soak up vibration. <strong>Long-range</strong> builds are an efficiency problem first: bigger props turning slower on higher-capacity batteries, everything optimized for watts-per-minute-of-flight rather than watts-per-gram-of-thrust. A <strong>Part 107-compliant commercial platform</strong> is a different animal again — you're now also weighing Remote ID compliance, payload mounting (camera, sensor), and often a weight class deliberately kept under a Category threshold for operations-over-people flexibility. Don't worry about the specifics of Remote ID or weight Categories yet — both are covered in full in the Semester 2 Regulations module (M1L3 and M1L5); the only thing to note here is that build goal and regulatory category are connected, not separate decisions.</p>
      <div class="callout"><div class="clabel">Why It Matters</div>Every part listing you're about to look at is written in codes and abbreviations that assume you already know how to read them. You don't yet — so before shopping, learn the three you'll hit immediately: motor size codes, prop codes, and basic power math.</div>
      <p><strong>Motor size (stator dimensions)</strong> is written as a four-digit code, like <span class="keyfact">2207</span> — the first two digits are the stator's diameter in mm, the last two are its height. A taller or wider stator generally means more torque and more heat capacity, which is why a 5-inch freestyle build typically runs something in the 2207–2306 range while a 3-inch whoop runs a much smaller stator like 1404. This is a separate number from KV — two motors can share a stator size and differ wildly in KV, or share a KV and differ in stator size and therefore power handling. <strong>Prop codes</strong> work the way B1L2 already covered — diameter × pitch in inches, e.g. "5142" — so a builder reading a parts list needs both numbers, from two different components, to know if they're compatible.</p>
      <p><strong>Basic power math</strong> comes up constantly once you're comparing real listings. <strong>Watts = volts × amps</strong> (P = V × I) tells you how much power a component is actually drawing or delivering at a given voltage and current — a motor's max-current spec only means something once you multiply it by pack voltage to see the real wattage involved. <strong>Watt-hours = volts × amp-hours</strong> (Wh = V × Ah, where Ah is just mAh ÷ 1000) is how you compare battery capacity fairly across different cell counts, since raw mAh alone doesn't account for voltage: a 4S 1500mAh pack (14.8V nominal × 1.5Ah ≈ 22.2Wh) and a 6S 1000mAh pack (22.2V nominal × 1.0Ah ≈ 22.2Wh) sound very different by their mAh number alone, but actually store almost the same usable energy — the higher cell count just delivers it at higher voltage and lower current.</p>
      <p>Frame size (the diagonal motor-to-motor distance, expressed in inches, roughly tracking prop size) is the first real fork in the road. A <span class="keyfact">3&Prime;</span> frame is light, cheap to crash, and flies happily in a backyard or indoors — but it has little payload margin and burns through battery fast relative to flight time. A <span class="keyfact">5&Prime;</span> frame is the do-everything freestyle/racing standard: enough thrust for real acrobatics, small enough to stay affordable and replaceable. A <span class="keyfact">7&Prime;</span>-plus frame trades agility for range and payload capacity — this is where long-range and camera-carrying commercial builds tend to live. None of this is fixed law, but going in blind and picking a frame because it "looked cool" is how beginners end up with a platform that can't do the thing they actually wanted.</p>
      <p>Once you know the frame class, everything downstream has to <strong>chain together</strong>: frame arm thickness and motor mount hole pattern determine which motors physically bolt on; motor size (stator dimensions) and KV (RPM per volt) determine which prop sizes and pitches the motor can swing without overheating; prop size and pitch determine the current draw under load; that current draw determines the minimum continuous-current rating your ESC needs; and the ESC's current draw, multiplied across all four motors, determines the discharge rating (the "C rating") your battery needs to supply without sagging or overheating. Break any one link — say, a high-KV motor paired with an ESC rated for half the current it'll actually pull under load — and you get a build that either underperforms or lets the smoke out on the maiden flight.</p>
      <div class="callout"><div class="clabel">Ask Yourself</div>If you had to state, in one sentence, what this drone needs to be good at, could you — before you've spent a dollar on parts?</div>
      <div class="tip"><div class="clabel">Hands-On</div>Before buying anything, write down your frame size and your intended use case, then look up two or three existing "known-good" parts lists for that exact frame size and use case from a reputable retailer or community wiki. You're not copying it part-for-part — you're calibrating what a sane compatibility chain actually looks like before you start substituting your own choices.</div>
      <div class="diagram">${SVG_COMPAT}<div class="dcap">Break one link in the chain &mdash; say, props too big for the ESC to handle &mdash; and the whole build fails, not just that part.</div></div>
    `,
    quiz:[
      {id:"b2l1_q1", q:"Why does frame size (e.g. 3\" vs. 5\" vs. 7\") matter beyond just physical size?",
       choices:["It only affects how the drone looks", "It's a rough proxy for prop size, which cascades into thrust, payload capacity, and flight time tradeoffs", "Frame size has no effect on performance, only price", "Larger frames are always better regardless of use case"],
       a:1, exp:"Frame size roughly sets prop size, and prop size drives thrust, efficiency, and payload capacity — a 3\" and a 7\" build are suited to genuinely different missions, not just scaled versions of each other."},
      {id:"b2l1_q2", q:"A builder pairs a high-KV motor with an ESC rated for a current draw well below what that motor pulls under load at full throttle. What's the likely result?",
       choices:["No effect — ESCs adjust automatically to any motor", "The ESC will likely overheat and fail, potentially damaging other components", "The motor will simply spin slower with no other consequences", "This combination is not possible to assemble physically"],
       a:1, exp:"An underrated ESC pushed past its continuous current rating overheats and can fail catastrophically — the classic 'let the smoke out' beginner mistake."},
      {id:"b2l1_q3", q:"Which build goal is most defined by prioritizing efficiency (watts per minute of flight) over raw acceleration?",
       choices:["Racing", "Long-range", "Freestyle", "Cinematic"],
       a:1, exp:"Long-range builds are fundamentally an efficiency optimization — bigger, slower-turning props on higher-capacity batteries, favoring flight time over punch."},
      {id:"b2l1_q4", q:"A 4S 1500mAh pack and a 6S 1000mAh pack have very different mAh numbers. Why can they store almost the same usable energy?",
       choices:["mAh alone already accounts for voltage, so this is a coincidence with no explanation", "Watt-hours (Wh = V × Ah) factor in the higher pack voltage of the 6S cell, which offsets its lower Ah — mAh alone ignores voltage entirely", "The 6S pack is defective and doesn't really deliver its rated capacity", "Cell count has no effect on stored energy, only on discharge rate"],
       a:1, exp:"Raw mAh ignores voltage. Converting to watt-hours (V × Ah) shows both packs store roughly the same energy — the 6S pack just delivers it at higher voltage and lower current."}
    ,
      {id:"b2l1_q5", q:"A motor listed with the code '2207' tells you what, according to the stator-dimension naming convention?", choices:["A stator 22mm in diameter and 7mm tall", "A stator 07mm in diameter and 22mm tall", "A KV rating of 2,207", "The motor's maximum current draw in amps"], a:0, exp:"Motor size codes give stator diameter first, then height, both in mm \u2014 '2207' is a 22mm-diameter, 7mm-tall stator. This is a separate spec from KV."},
      {id:"b2l1_q6", q:"Using P = V \u00d7 I, a component pulling 20A at 14.8V (4S) is drawing approximately how much power?", choices:["148 watts", "296 watts", "74 watts", "592 watts"], a:1, exp:"Watts = volts \u00d7 amps: 14.8V \u00d7 20A = 296W. This is the real power draw a max-current spec only reveals once multiplied by pack voltage."},
      {id:"b2l1_q7", q:"What is a defining characteristic of a 3-inch frame build, according to the lesson?", choices:["It has the most payload margin of any frame size", "It's the standard choice for long-range and commercial payload builds", "It's light and cheap to crash, but has little payload margin and burns through battery fast relative to flight time", "It requires the highest-KV motors on the market"], a:2, exp:"A 3\" frame is described as light and cheap to crash, happy in a backyard or indoors \u2014 but with little payload margin and quick battery burn relative to flight time."},
      {id:"b2l1_q8", q:"Beyond payload and frame class, what additional factor does the lesson say a Part 107-compliant commercial build must weigh that a freestyle or racing build doesn't?", choices:["The color of the frame", "The brand of propeller used", "Whether the battery is LiPo or NiMH", "Remote ID compliance and weight class relative to a regulatory Category threshold"], a:3, exp:"A Part 107-compliant commercial platform also has to weigh Remote ID compliance and often a weight class kept under a Category threshold for operations-over-people flexibility \u2014 considerations a freestyle or racing build doesn't face."}]},
    {id:"b2l2", title:"Sourcing Parts Without Getting Burned", content:`
      <p>Where you buy matters almost as much as what you buy. <strong>Specialty FPV/drone retailers</strong> (the kind that sell nothing but drone parts) tend to stock components vetted for this specific hobby, list accurate specs, and have return policies that understand what "this ESC died on first arm" means. <strong>General electronics marketplaces</strong> can be cheaper and carry a wider selection, but listings are frequently copy-pasted, specs are sometimes aspirational rather than measured, and there's no guarantee the seller understands — or cares — whether a battery's stated discharge rating is real.</p>
      <p>Reading a datasheet critically means treating every number as a claim, not a fact, until you've cross-checked it. A battery listed as "100C" that weighs the same as a competitor's honestly-rated 35C cell of the same capacity is not a better battery — it's a mislabeled one. Real discharge capability tracks physically with cell chemistry and construction; you can't get free lunch on power density. If a spec sheet reads like a spec sheet from a different, better product with the numbers swapped in, that's exactly what it might be.</p>
      <p><strong>Red flags for counterfeit or mislabeled parts:</strong></p>
      <ul>
        <li>A battery's C-rating or capacity that seems physically impossible for its weight and size compared to known-reputable cells of the same capacity.</li>
        <li>Motor KV or max-current specs with no matching thrust/current test data from the manufacturer or a third party.</li>
        <li>Product photos that don't match the actual branding, or brand names that are near-misses of a known reputable manufacturer's name.</li>
        <li>Prices dramatically below every other listing for what's claimed to be the identical part — undercutting by a little is normal competition; undercutting by half usually isn't.</li>
        <li>No reviews, or reviews that are suspiciously generic and posted in a tight cluster of dates.</li>
      </ul>
      <div class="callout"><div class="clabel">Why It Matters</div>A batter­y that swells after ten cycles isn't just an inconvenience — a swollen or damaged LiPo is a fire risk, and the failure mode that gets people hurt is exactly the one a counterfeit cell is most likely to have.</div>
      <p>Budget for the <strong>whole</strong> build, not just the flying parts. A realistic first-build budget includes the frame, motors, ESC (or a 4-in-1), flight controller, receiver, props (buy spares — you will break some), battery and charger, and — easy to forget — the tools to actually assemble it. Total up the tool cost separately before you're surprised by it at checkout.</p>
      <div class="tip"><div class="clabel">Case Study</div>A beginner buys a "5000mAh 100C" battery from a marketplace listing at half the price of a known brand's 35C cell of the same capacity. It flies fine for the first several packs. On the eleventh charge, the pack is visibly puffed. The seller's "100C" rating was never real — the cell construction simply can't deliver that discharge rate, and the repeated over-spec demand degraded the pack fast. The lesson isn't "never buy affordable batteries" — it's that a rating with no plausible physical basis is a warning, not a bargain.</div>
      <div class="tip"><div class="clabel">Hands-On</div>Pull up a battery listing from a specialty FPV retailer and a visually similar one from a general marketplace. Compare weight, price, and claimed C-rating side by side, and calculate rough watt-hours per dollar for each — using the Wh = V × Ah math from B2L1 (nominal voltage from the cell count, times capacity in Ah), then dividing by price. If the marketplace pack claims a much higher discharge rating at a much lower price for the same weight, you've just spotted the red flag firsthand.</div>
    `,
    quiz:[
      {id:"b2l2_q1", q:"A battery listing claims a much higher C-rating than a same-weight, same-capacity cell from a reputable brand, at half the price. What should this tell you?",
       choices:["It's simply a great deal from an efficient seller", "Discharge capability is physically tied to cell construction — an implausible rating at that price is a red flag for a mislabeled or counterfeit cell", "Higher C-ratings always cost less because they're simpler to manufacture", "This is normal and no cause for concern"],
       a:1, exp:"C-rating isn't a marketing number you can inflate for free — it tracks real physical construction. An implausible rating at a bargain price is a classic mislabeling red flag."},
      {id:"b2l2_q2", q:"What is a key practical difference between specialty FPV/drone retailers and general electronics marketplaces?",
       choices:["Specialty retailers never have good prices", "Specialty retailers tend to have more accurate specs and hobby-aware return policies; marketplaces can have inaccurate or copy-pasted listings with less accountability", "There is no meaningful difference between the two", "Marketplaces only sell counterfeit goods"],
       a:1, exp:"Specialty retailers aren't always cheaper, but they tend to understand the hobby and stand behind accurate specs — marketplaces trade that reliability for selection and price, sometimes at the cost of accuracy."},
      {id:"b2l2_q3", q:"When budgeting for a first build, what do beginners most commonly forget to account for?",
       choices:["The cost of the frame", "The cost of the flight controller", "The cost of tools (soldering iron, multimeter, LiPo-safe charging setup, etc.) needed to actually assemble the build", "The cost of motors"],
       a:2, exp:"Beginners typically budget the flying parts carefully and forget that assembly requires real tools, which add up separately."}
    ,
      {id:"b2l2_q4", q:"According to the lesson, what's the right mindset when reading a parts datasheet?", choices:["Treat every number as a claim, not a fact, until you've cross-checked it", "Trust any number that appears in a professional-looking table", "Assume higher numbers are always more accurate", "Ignore datasheets entirely and rely only on price"], a:0, exp:"The lesson's own framing: treat every spec as a claim until cross-checked \u2014 a plausible-looking datasheet can still be copy-pasted or aspirational."},
      {id:"b2l2_q5", q:"Which of these is listed as a red flag for a possibly counterfeit or mislabeled part's reviews?", choices:["A product with dozens of detailed reviews spread over several years", "No reviews at all, or reviews that are suspiciously generic and clustered in a tight range of dates", "Reviews mentioning specific thrust test data", "A product with a clear return policy"], a:1, exp:"The lesson flags no reviews, or generic reviews clustered in a tight span of dates, as a red flag pattern consistent with a rushed or fake listing."},
      {id:"b2l2_q6", q:"Besides electronics and tools, what does the lesson specifically recommend buying extra of when budgeting a first build?", choices:["Extra battery chargers", "A second flight controller as backup", "Spare propellers, since you will break some", "Extra frame arms only"], a:2, exp:"The lesson specifically calls out buying spare propellers as part of a realistic first-build budget, since breaking a few during learning is expected."}]},
    {id:"b2l3", title:"Tools & Workspace Before You Touch a Wire", content:`
      <p>You cannot solder a quad together with whatever iron happens to be in a kitchen drawer and expect reliable joints. A <strong>soldering iron</strong> for FPV work should be temperature-controlled and have enough wattage — <span class="keyfact">60W+</span> is a reasonable minimum — to heat a thick power pad fast, before the heat has time to wick away and damage a nearby component. A low-wattage iron forces you to hold heat on a joint far longer than you should, which is how flight controllers and ESCs get cooked during assembly rather than during flight. Tip choice matters too: a fine tip for signal wires and pads, a wider chisel tip for power pads that need to dump heat quickly.</p>
      <p>The rest of the core kit:</p>
      <ul>
        <li>A <strong>multimeter</strong> — for checking continuity, verifying you haven't bridged a solder joint, and confirming voltage before you ever plug in a battery for the first time.</li>
        <li><strong>Hex drivers</strong> in the sizes your frame's hardware actually uses (metric, almost always, on FPV frames) — don't force an imperial driver into a metric bolt head and round it out.</li>
        <li><strong>Thread lock</strong> (low-strength/removable) on motor screws — vibration will walk screws loose over time without it, and a motor departing mid-flight is not a minor failure.</li>
        <li><strong>Heat-shrink</strong> in a few diameters, for insulating solder joints and connector leads.</li>
        <li>A <strong>LiPo-safe charging setup</strong> — at minimum a charge bag or fireproof container, and a charger that actually balances cells and won't be tricked by a mislabeled or damaged pack. Charging and storing LiPo batteries in the open on a wooden desk is a habit that eventually catches up with someone.</li>
      </ul>
      <p>Workspace safety basics, before any wiring starts: work on a non-flammable surface, keep the LiPo you're about to connect physically away from your soldering area until you're ready to power up, verify polarity with the multimeter above before every connection (reversed polarity on a first power-up is one of the most common ways to destroy a flight controller instantly — check it with a meter, don't eyeball wire colors), and never leave a charging battery unattended.</p>
      <div class="tip"><div class="clabel">Workshop Tip</div>Do your first power-up with the props off. Every single time. It costs you nothing and it's the one habit that turns a wiring mistake into an inconvenience instead of an injury.</div>
      <div class="tip"><div class="clabel">Hands-On</div>Before your first build session, set up your LiPo charging area separately from your assembly area — even if that just means a fireproof bag on one side of the desk and your tools on the other. Get in the habit of physically separating "powered up" from "being worked on."</div>
      <div class="callout"><div class="clabel">Why It Matters</div>Most of the real safety risk in this hobby isn't in the air — it's on the workbench, in the ten seconds between "I think this is wired right" and actually applying power.</div>
    `,
    quiz:[
      {id:"b2l3_q1", q:"Why does soldering iron wattage matter for FPV builds specifically?",
       choices:["Higher wattage irons are always safer regardless of use", "Insufficient wattage forces prolonged heat contact on a joint, risking damage to nearby components; adequate wattage heats power pads quickly and reduces that exposure", "Wattage only affects how fast the iron heats up initially, not joint quality", "Wattage has no practical effect on build quality"],
       a:1, exp:"A low-wattage iron can't dump heat into a power pad fast enough, so you end up holding it there longer — which is how components near the joint get thermally damaged."},
      {id:"b2l3_q2", q:"What is the primary purpose of thread lock on motor mounting screws?",
       choices:["To make screws easier to remove later", "To prevent screws from vibrating loose during flight", "To improve electrical conductivity", "To waterproof the motor"],
       a:1, exp:"Sustained vibration works screws loose over time; thread lock (removable-strength) keeps motor screws seated through normal flight vibration."},
      {id:"b2l3_q3", q:"What is the recommended practice for a first power-up of a new build?",
       choices:["Power up with props installed to test full performance immediately", "Power up with props removed first, to catch wiring mistakes safely", "Skip the multimeter check and go straight to battery power", "Charge the battery to maximum voltage before the first power-up test"],
       a:1, exp:"Testing with props off turns a wiring mistake (reversed motor direction, a short, reversed polarity) into a bench inconvenience instead of a spinning-prop hazard."}
    ,
      {id:"b2l3_q4", q:"What role does a multimeter play before a build's first assembly steps, according to the lesson?", choices:["Checking continuity, verifying no bridged solder joints, and confirming voltage before ever plugging in a battery", "Measuring the soldering iron's exact temperature", "Testing propeller balance", "Charging the LiPo battery directly"], a:0, exp:"A multimeter checks continuity, verifies you haven't bridged a joint, and confirms voltage before the battery is ever connected \u2014 core parts of the pre-power-up kit."},
      {id:"b2l3_q5", q:"Why does the lesson insist on verifying polarity with a multimeter rather than trusting wire color alone?", choices:["Wire colors are standardized worldwide so a meter is redundant", "Reversed polarity on first power-up is one of the most common ways to instantly destroy a flight controller, so it needs to be confirmed with a meter, not eyeballed", "Multimeters are legally required for any soldering project", "Wire color only matters for signal wires, not power wires"], a:1, exp:"Reversed polarity on a first power-up is one of the fastest ways to kill a flight controller \u2014 the lesson insists on checking it with a meter rather than trusting wire colors alone."},
      {id:"b2l3_q6", q:"Why does the lesson caution against forcing an imperial hex driver into a metric bolt head on an FPV frame?", choices:["Imperial drivers are always too large to fit at all", "Metric bolts are more expensive to replace", "FPV frame hardware is almost always metric, and a mismatched driver can round out the bolt head", "Imperial drivers conduct electricity and can short a circuit"], a:2, exp:"FPV frame hardware is almost always metric \u2014 forcing an imperial driver into a metric bolt head is a simple way to round out and ruin the head."}]},
    {id:"b2l4", title:"Reading Reviews and Build Guides Critically", content:`
      <p>This hobby's hardware and firmware move fast — a highly-rated ESC or a "best beginner motor" recommendation from three years ago may reference a part that's been revised, discontinued, or quietly downgraded since. Before trusting a review or build guide, check its date, and check whether it's reviewing the exact current revision of the part you're looking at, not an earlier version sharing the same product name.</p>
      <p>Signs a build guide or review is outdated rather than just old:</p>
      <ul>
        <li>It recommends firmware settings or a flight controller firmware version that's since been superseded, especially around <strong>ESC protocol</strong> — the digital signaling standard (like DShot) the FC uses to talk to the ESC, distinct from the physical wiring — or Remote ID-related features.</li>
        <li>It references a part number or revision the manufacturer's current site no longer lists, or lists as legacy.</li>
        <li>The comments underneath (if any) contain more recent corrections that the main content was never updated to reflect.</li>
        <li>It gives advice that contradicts current safety consensus — for example, casual language about charging habits or storage that current LiPo-safety guidance would flag.</li>
      </ul>
      <p>Credible sourcing lives in a few reliable places: manufacturer documentation and official specs directly from the maker, established FPV-specific community forums and wikis with active moderation, and build logs from creators who show their actual bench work rather than just a polished result. Low-quality content tends to cluster around SEO-optimized "top 10 drones" list articles with no hands-on testing behind them, and video content that's really an unboxing dressed up as a review.</p>
      <div class="callout"><div class="clabel">Ask Yourself</div>If a build guide's advice turned out to be wrong, would you have any way of noticing before you'd already bought the part it recommended?</div>
      <div class="tip"><div class="clabel">Hands-On</div>Pick one part you're considering for your build and find two independent sources recommending it — ideally a manufacturer spec sheet and a community build log or forum thread. If you can't find a second, independent source agreeing with the first, treat the recommendation as unverified.</div>
      <div class="tip"><div class="clabel">Case Study</div>A beginner follows a two-year-old "best budget flight controller" guide and buys the recommended board, only to discover after purchase that the manufacturer revised the board's ESC connector layout in a later hardware revision the guide never mentions — the wiring diagram in the guide doesn't match the part that arrives. A quick check of the manufacturer's current product page before buying would have caught the mismatch; the guide itself had no way to warn about a change made after it was published.</div>
    `,
    quiz:[
      {id:"b2l4_q1", q:"Why is publication date especially important when evaluating an FPV build guide or review?",
       choices:["Older content is always factually wrong", "Hardware and firmware in this hobby change quickly, so a guide can reference a part revision, firmware version, or recommendation that's since been superseded", "Publication date has no bearing on accuracy in this hobby", "Newer guides are always less reliable than older ones"],
       a:1, exp:"Fast-moving hardware and firmware mean a guide's recommendations can go stale within a year or two — checking the date is a first filter, not a guarantee, but it flags what needs double-checking."},
      {id:"b2l4_q2", q:"Which of these is the strongest signal that a build guide's information may be outdated?",
       choices:["It was written by an experienced builder", "It references a part number or firmware version the manufacturer now lists as legacy or superseded", "It includes photos of the actual build process", "It has a large number of views"],
       a:1, exp:"A guide referencing a superseded part number or firmware version is a concrete sign the content may no longer match what's actually being sold or run today."},
      {id:"b2l4_q3", q:"What's a reasonable way to verify a part recommendation before buying?",
       choices:["Trust the first search result automatically", "Cross-check the recommendation against a second independent source, such as manufacturer documentation or a community build log", "Only look at the number of stars on a marketplace listing", "Assume any guide with good production quality is accurate"],
       a:1, exp:"A single source, however polished, can be outdated or simply wrong — cross-checking against an independent second source (ideally the manufacturer's own current spec) is the practical safeguard."}
    ,
      {id:"b2l4_q4", q:"Which of these does the lesson identify as a credible source for build guidance, as opposed to low-quality content?", choices:["An SEO-optimized 'top 10 drones' list article with no hands-on testing", "A video that's really just an unboxing dressed up as a review", "A build log from a creator who shows their actual bench work", "A forum post from an anonymous account with no moderation"], a:2, exp:"The lesson names build logs showing real bench work, alongside manufacturer docs and moderated community forums, as credible sources \u2014 as opposed to SEO listicles and unboxings dressed as reviews."},
      {id:"b2l4_q5", q:"The lesson gives 'ESC protocol' (like DShot) as an example of what kind of outdated-guide red flag?", choices:["A guide recommending firmware settings or ESC protocol features that have since been superseded", "A guide with too many photos", "A guide that's too short to be useful", "A guide written by a manufacturer directly"], a:0, exp:"The lesson specifically flags outdated ESC protocol or firmware recommendations as a sign a guide's content hasn't kept pace with the hobby's fast-moving hardware and firmware."},
      {id:"b2l4_q6", q:"In the case study, what would have caught the mismatch between a build guide's wiring diagram and the flight controller that actually arrived?", choices:["Reading more customer reviews before buying", "Checking the manufacturer's current product page for the part before purchasing", "Buying a more expensive flight controller instead", "Asking the guide's author directly, since no other check would work"], a:1, exp:"The case study's own lesson is that a quick check of the manufacturer's current product page before buying would have caught the connector-layout revision the outdated guide never mentioned."}]}
  ],
  finalQuiz:[
    {id:"b2_final_q1", q:"What is the correct order of the parts compatibility chain a beginner should trace before buying?",choices:["Battery → ESC → prop → motor → frame","Frame/motor mount → motor & KV → prop size/pitch → ESC current rating → battery discharge (C) rating","Prop → frame → battery → ESC → motor","There is no meaningful order — any parts combination works if each part is individually high quality"],a:1,exp:"Each link sets requirements for the next: frame determines motor mount fit, motor and KV determine viable prop range, prop load determines ESC current needs, and total current draw determines the battery's required discharge rating."},
    {id:"b2_final_q2", q:"A builder wants maximum flight time and range, accepting less agility. Which frame class and build philosophy fits best?",choices:["3\" frame, racing-focused","5\" frame, freestyle-focused","7\"-plus frame, efficiency-focused long-range build","Frame size is irrelevant to flight time"],a:2,exp:"Larger frames turning bigger props more slowly, paired with higher-capacity batteries, are the standard approach for maximizing range and flight time."},
    {id:"b2_final_q3", q:"Which is the strongest red flag for a counterfeit or mislabeled LiPo battery listing?",choices:["The battery is from a well-known specialty retailer", "The claimed C-rating and capacity are physically implausible for the weight and price compared to known-reputable cells", "The listing includes a datasheet at all", "The battery ships with a balance connector"],a:1,exp:"Discharge capability tracks real cell construction — a rating that would require breaking known physical limits, at a bargain price, is the classic counterfeit signal."},
    {id:"b2_final_q4", q:"Why should a first build's budget include tools, not just flying parts?",choices:["Tools are optional and rarely needed", "Assembly requires real equipment (soldering iron, multimeter, LiPo-safe charging setup, hex drivers) that beginners commonly forget to price in", "Tools cost more than the drone itself in every case", "Retailers include tools free with every parts order"],a:1,exp:"A realistic first-build budget accounts for the soldering iron, multimeter, drivers, thread lock, heat-shrink, and LiPo-safe charging setup alongside the flying parts."},
    {id:"b2_final_q5", q:"Why is soldering iron wattage a real consideration rather than a minor spec?",choices:["Higher wattage irons are more expensive but otherwise identical", "Low wattage forces longer heat exposure on a joint, risking damage to nearby components — adequate wattage heats power pads quickly and safely", "Wattage only matters for wire thickness, not for components", "Any iron works identically regardless of wattage"],a:1,exp:"Underpowered irons can't transfer heat fast enough into thick power pads, forcing prolonged contact that risks cooking nearby components."},
    {id:"b2_final_q6", q:"What should a builder do before the very first power-up of a completed build?",choices:["Fully charge the battery to maximum voltage first", "Remove the propellers", "Test in an outdoor, open area immediately", "Skip continuity checks to save time"],a:1,exp:"Removing props before first power-up turns a wiring mistake into a bench inconvenience rather than a spinning-prop hazard."},
    {id:"b2_final_q7", q:"What's the best practice when evaluating an FPV build guide or part review found online?",choices:["Trust it if it has a professional-looking website", "Check its publication date and cross-check its recommendation against a second, independent, current source", "Assume all community content is equally reliable", "Only trust guides with the most views, regardless of date"],a:1,exp:"Given how fast hardware and firmware change in this hobby, checking currency and independently verifying a recommendation are the two real safeguards against outdated advice."}

    {id:"b2_final_q8", q:"A motor labeled '2207' communicates which two dimensions?", choices:["Stator diameter and height in mm", "KV rating and voltage", "Propeller diameter and pitch", "Weight and price tier"], a:0, exp:"Motor size codes give stator diameter first, then height, in mm \u2014 a separate spec from KV rating."},
    {id:"b2_final_q9", q:"Using P = V \u00d7 I, how much power does a component drawing 15A at 14.8V (4S) actually consume?", choices:["148 watts", "222 watts", "15 watts", "74 watts"], a:1, exp:"Watts = volts \u00d7 amps: 14.8V \u00d7 15A = 222W \u2014 the real power draw behind a max-current spec."},
    {id:"b2_final_q10", q:"What's a defining tradeoff of a 3-inch frame build?", choices:["Maximum payload capacity with heavy batteries", "Best suited for long-range missions", "Light and cheap to crash, but limited payload margin and shorter flight time", "Requires the lowest-KV motors available"], a:2, exp:"A 3\" frame is light and cheap to crash but carries little payload margin and burns through battery fast relative to flight time \u2014 a different mission than a 7\"-plus long-range build."},
    {id:"b2_final_q11", q:"What extra factor must a Part 107-compliant commercial build weigh that a purely recreational freestyle build doesn't?", choices:["The frame's paint color", "Whether the transmitter has a screen", "The number of propeller blades", "Remote ID compliance and a regulatory weight Category threshold"], a:3, exp:"A Part 107-compliant commercial build also has to weigh Remote ID compliance and often a weight class under a Category threshold \u2014 considerations a purely recreational build skips."},
    {id:"b2_final_q12", q:"What mindset does the lesson recommend when reading a parts datasheet?", choices:["Treat every number as a claim, not a fact, until independently cross-checked", "Trust any number in a professional-looking table", "Assume bigger numbers are always accurate", "Ignore datasheets and rely on price alone"], a:0, exp:"The lesson's core datasheet-reading advice: treat every spec as an unverified claim until cross-checked against another source."},
    {id:"b2_final_q13", q:"What is a multimeter used for before a build's first assembly and power-up steps?", choices:["Balancing the LiPo cells during charging", "Checking continuity, spotting bridged solder joints, and confirming voltage before a battery is ever connected", "Measuring propeller RPM", "Testing Wi-Fi signal strength on the FC"], a:1, exp:"A multimeter's pre-assembly role is checking continuity, spotting bridged joints, and confirming voltage before the battery is ever connected."},
    {id:"b2_final_q14", q:"What distinguishes a credible build-guide source from a low-quality one, per the lesson?", choices:["Credible sources always have the most views", "Low-quality content is always written by beginners, credible content by experts only", "Credible sources include manufacturer docs and build logs showing real bench work; low-quality content clusters around SEO listicles and unboxings dressed as reviews", "There's no meaningful way to distinguish them"], a:2, exp:"Manufacturer documentation, moderated community wikis, and creators who show real bench work are credible; SEO 'top 10' listicles and unboxings dressed as reviews are the low-quality end."}]
