{
  id:"b3", title:"Assembly & Wiring", week:"Weeks 5–6",
  lessons:[
    {id:"b3l1", title:"Build Sequence & Why Order Matters", content:`
      <p>You've got parts on the bench. Before you pick up a screwdriver, understand why build order isn't arbitrary &mdash; it's a chain of dependencies, and skipping a link means backtracking through steps you thought were finished.</p>
      <p>The standard sequence: <strong>frame first</strong>, then <strong>motors</strong>, then <strong>flight controller (FC) and stack</strong>, then <strong>ESC and wiring</strong> last. Each stage locks in something the next stage needs to already be true.</p>
      <ul>
        <li><strong>Frame assembly</strong> establishes your arm geometry and mounting points &mdash; get this square and torqued before anything else goes on it.</li>
        <li><strong>Motors</strong> mount to the arms while they're still easy to access from every angle. Confirm rotation direction for each motor position now, while the wires are still loose and nothing's soldered &mdash; not after. "Confirming" at this stage means checking your motor positions against the standard alternating CW/CCW layout printed in your frame or FC's documentation (diagonal pairs match, adjacent motors oppose) &mdash; you're not spinning anything yet, since there's no ESC or firmware to test with. The actual spin test happens once you've reached B4L1/B4L2 and can arm the motors in Betaflight Configurator; this early check just makes sure your wiring plan matches the layout before a single wire is soldered.</li>
        <li><strong>FC and stack</strong> go in next, seated on <strong>vibration-isolation grommets or foam</strong> so motor and prop vibration doesn't reach the gyro. Mount this before you commit any wiring, so you can still see and reach every solder pad.</li>
        <li><strong>ESC and wiring</strong> come last, once you know the physical positions of everything they need to connect to.</li>
      </ul>
      <p>Here's the failure mode that trips up almost everyone building their first frame: soldering motor wires to the ESC <strong>before</strong> confirming which way each motor spins. If a motor turns the wrong direction, the fix without swapping wires is a software reversal in the ESC firmware &mdash; but if you haven't gotten that far yet, or your ESC doesn't support it, you're desoldering a joint you just finished, on a stack that's now buried under other wiring. Confirm rotation direction while the motor leads are still bare and reachable, before they're locked into a harness.</p>
      <div class="callout"><div class="clabel">Ask Yourself</div>If a later step in a build depends on a fact you could have checked two steps earlier, why does checking it early cost you almost nothing, while checking it late can cost you an hour of rework?</div>
      <div class="tip"><div class="clabel">Hands-On</div>Before mounting anything, lay your frame, motors, stack, and ESC out on the bench in build order, left to right. Dry-fit each part in place without securing it. You'll catch clearance problems &mdash; a standoff that's too short, a wire that won't reach &mdash; while they cost you nothing to fix.</div>
    `,
    quiz:[
      {id:"b3l1_q1", q:"What is the standard build sequence for a drone build?",
       choices:["ESC/wiring, motors, frame, FC/stack","Frame, motors, FC/stack, ESC/wiring","FC/stack, frame, ESC/wiring, motors","Motors, ESC/wiring, frame, FC/stack"],
       a:1, exp:"Frame first establishes geometry, motors mount while fully accessible, the FC/stack goes in before wiring commits everything in place, and ESC/wiring comes last since it depends on knowing every other part's final position."},
      {id:"b3l1_q2", q:"Why should you confirm each motor's rotation direction before soldering its wires to the ESC?",
       choices:["Rotation direction doesn't matter until first flight","Because fixing it later means desoldering a finished joint that may now be buried under other wiring","Because the FC won't power on otherwise","Because motors ship pre-wired for the wrong direction"],
       a:1, exp:"Rotation direction can often be fixed in ESC firmware after the fact, but if you haven't reached that stage yet — or your ESC lacks the feature — you're stuck desoldering a joint that's no longer easy to reach."},
      {id:"b3l1_q3", q:"Why mount the flight controller stack with vibration-isolation grommets or foam before doing final wiring?",
       choices:["It looks better","It has no functional purpose, it's purely cosmetic","Unfiltered vibration reaching the gyro degrades flight performance, and it's easier to seat the stack correctly before wires are in the way","It makes the battery easier to remove"],
       a:2, exp:"The FC's gyro is sensitive to vibration; isolating it from frame and motor vibration is a functional requirement, not decoration — and it's far easier to do while you still have full access to the mounting area."}
    ,
      {id:"b3l1_q4", q:"What does frame assembly establish that every later build stage depends on?", choices:["Arm geometry and mounting points, squared and torqued before anything else goes on", "The final paint color of the aircraft", "The flight controller's firmware version", "The battery's discharge rating"], a:0, exp:"Frame assembly establishes arm geometry and mounting points \u2014 get it square and torqued before anything else goes on, since every later stage builds on it."},
      {id:"b3l1_q5", q:"At the motor-mounting stage, what does 'confirming' rotation direction actually involve, since there's no ESC or firmware yet to test with?", choices:["Spinning each motor briefly by hand to feel resistance", "Checking motor positions against the standard alternating CW/CCW layout in the frame or FC documentation", "Measuring each motor's KV with a multimeter", "Skipping rotation checks entirely until the ESC is wired"], a:1, exp:"At this stage 'confirming' rotation just means checking your planned motor positions against the standard alternating CW/CCW layout in documentation \u2014 there's no ESC or firmware yet to actually spin anything."},
      {id:"b3l1_q6", q:"According to the lesson, when does the actual motor spin test happen?", choices:["Immediately after motors are mounted, before the FC is installed", "During frame assembly, before motors are even mounted", "Once firmware is flashed and motors can be armed in Betaflight Configurator's motor test tab (B4L1/B4L2)", "It never happens before first flight"], a:2, exp:"The actual spin test waits until firmware is flashed and you can arm the motors in Configurator's motor test tab \u2014 this early check is only about matching your wiring plan to the layout, not spinning anything."}]},
    {id:"b3l2", title:"Soldering Lab: Station Setup, Safety & Technique", content:`
      <p>A drone build lives or dies on its solder joints, and a bad one is invisible on the bench. It looks fine, it passes a visual check, the aircraft flies &mdash; right up until vibration or thermal cycling finds the weak point mid-air. This lesson is written as a lab-day walkthrough: set the station up, run the safety basics, then work the technique &mdash; in that order, every time, not just the first time.</p>
      <p><strong>Step 1 &mdash; Set up the station.</strong> Before the iron goes anywhere near an outlet:</p>
      <ul>
        <li>Clear a dedicated, non-flammable work surface &mdash; a silicone soldering mat or a bare section of bench, not a paper-covered desk.</li>
        <li>Iron in its stand, always, the instant it's not actively touching a joint. A hot tip set down on the bench is how benches, cables, and hands get burned.</li>
        <li>A brass-wool or damp-sponge tip cleaner within reach &mdash; wipe the tip before every few joints so old, oxidized solder doesn't contaminate a fresh one.</li>
        <li>Ventilation or a small fume extractor pulling air away from your face &mdash; rosin flux smoke is a real respiratory irritant with repeated exposure, not just an unpleasant smell.</li>
        <li>Confirm iron wattage and tip before you start: <span class="keyfact">60W+</span>, temperature-controlled, per B2L3 &mdash; a fine tip staged for signal wires, a wider chisel tip staged for power pads. Swap tips now, not mid-joint.</li>
        <li>Confirm you have <strong>solder with a flux core</strong> staged. Nearly all hobby-grade rosin-core solder already has flux built into the wire itself &mdash; flux is the chemical that cleans oxidation off the metal so solder actually bonds, and you're not buying or applying it as a separate product unless you're using specialty flux-free solder or a flux pen for stubborn joints.</li>
        <li>A <strong>helping-hands tool or third-hand clamp</strong> staged and ready. Soldering takes two hands &mdash; one for the iron, one for the solder &mdash; so whatever you're joining needs to already be held still by something else before you start.</li>
        <li>Heat-shrink tubing in a few sizes staged nearby, for insulating and sealing finished joints once they've cooled.</li>
        <li>LiPo batteries physically away from the soldering area entirely until the build is done and it's time to power up &mdash; not just "off to the side," actually elsewhere in the room.</li>
      </ul>
      <p><strong>Step 2 &mdash; Safety basics before you pick up the iron.</strong> A soldering iron tip runs 300&ndash;400&deg;C or hotter &mdash; well past the temperature that causes an instant burn on contact:</p>
      <ul>
        <li>Safety glasses on. Flux can spit, and a freshly clipped wire lead becomes a small projectile.</li>
        <li>Tie back long hair and clear loose sleeves before you start &mdash; both are unpleasant surprises near an open flame-equivalent heat source.</li>
        <li>Never test the tip's heat with a finger, ever, no matter how many times you've done this before. Assume it's hot and let it prove otherwise by staying in its stand.</li>
        <li>No food or drink at the soldering station. Traditional 60/40 leaded solder is still common in this hobby because it flows more predictably than lead-free alternatives &mdash; wash your hands after a session, every time, rather than treating that as optional.</li>
        <li>Know where the room's fire extinguisher is before you start, not after something goes wrong. Keep LiPo cells in a fireproof bag or ammo can regardless of whether you're soldering near them right now.</li>
        <li>If you do get burned: cool water on the burn immediately, for several minutes. Don't touch the tip again to "make sure" &mdash; check that it's off and cooling instead.</li>
      </ul>
      <div class="callout"><div class="clabel">Why It Matters</div>Most of the real safety risk in this hobby isn't in the air &mdash; it's on the workbench, in the ten seconds of carelessness around a tool that's hot enough to burn on contact and doesn't look any different from a cold one.</div>
      <p><strong>Step 3 &mdash; Technique, joint by joint.</strong> Once the station's set up and the safety basics are second nature, the actual soldering is five repeatable moves:</p>
      <ul>
        <li><strong>Strip the insulation first.</strong> Use wire strippers sized for the wire's gauge and remove just enough insulation to expose the bare conductor &mdash; roughly 3&ndash;5mm for most signal and small power wires. Strip too little and you won't get a full tinned surface; strip too much and you'll have exposed bare wire past the joint, waiting to short against something.</li>
        <li><strong>Tin first.</strong> Coat both the iron tip and the wire (or pad) with a thin layer of solder before you join them. Tinning lets heat transfer evenly and gives the joint something to bond to on both sides, instead of asking cold solder to bridge two dry surfaces.</li>
        <li><strong>Heat the joint, not the solder.</strong> Touch the iron to the pad and wire together, let them come up to temperature, then feed solder into the joint itself &mdash; not onto the iron tip. The solder should flow and wick into the joint on its own. If you're pushing solder around with the iron tip, the joint isn't hot enough yet.</li>
        <li><strong>Remove the iron, then hold everything still.</strong> Solder needs a moment to cool and set. Moving the wire during that window &mdash; even slightly &mdash; is how a joint that looks perfect ends up fractured inside.</li>
        <li><strong>Inspect and tug-test.</strong> A good joint is shiny, smooth, and shaped like a small volcano around the wire, not a dull gray blob. Give it a gentle tug once it's cooled &mdash; it should not move.</li>
      </ul>
      <p>What to watch for when a joint doesn't come out right:</p>
      <ul>
        <li><strong>Cold joint</strong> &mdash; dull, grainy, or lumpy instead of smooth and shiny. Usually means the joint never reached full temperature. Weak mechanically, often high-resistance electrically.</li>
        <li><strong>Bridged pads</strong> &mdash; excess solder connecting two pads that should be isolated, especially common on tightly spaced ESC pads. Can short two phases or a signal line to power. Fix it with <strong>solder wick</strong> (desoldering braid): lay the braid over the bridge, press the hot iron on top, and capillary action pulls the excess solder up into the braid, leaving the pads clean and separated.</li>
        <li><strong>Disturbed joint</strong> &mdash; the wire moved while the solder was still cooling, leaving a joint that looks solid but has a fractured internal structure.</li>
      </ul>
      <div class="callout"><div class="clabel">Why It Matters</div>A cold or fractured joint can pass current fine while the aircraft sits still on your bench, and only fail once motor vibration flexes it in the air &mdash; which means your pre-flight visual inspection will never catch it, and the first sign of trouble is a motor cutting out mid-flight.</div>
      <div class="tip"><div class="clabel">Case Study</div>A builder wired up a quad's rear-right motor with a joint that looked clean &mdash; shiny enough, held together on the bench, passed a tug test. Three flights in, on a warm summer afternoon with the motor running harder than usual, that joint let go mid-air. The post-crash teardown found a hairline fracture: the wire had shifted a fraction of a millimeter while the solder was still setting, invisible from the outside. The lesson wasn't "solder better" in the abstract &mdash; it was to let every joint sit completely undisturbed until it's fully cooled, and to physically tug-test each one afterward before calling it done.</div>
      <div class="tip"><div class="clabel">Hands-On</div>Before touching your actual build: set up your station per Step 1, run through the Step 2 safety checklist out loud, then practice on scrap wire. Tin a wire end, tin a pad, join them, and inspect the result. Do this until three in a row look right, and only then move to a real joint on the aircraft.</div>
    `,
    quiz:[
      {id:"b3l2_q1", q:"Where should a soldering iron be the instant it's not actively touching a joint?",
       choices:["Balanced on the edge of the bench","In its stand, every time","Held in your other hand","It doesn't matter as long as the tip faces away from you"],
       a:1, exp:"A hot tip set down anywhere other than its stand is one of the most common ways benches, cables, and hands get burned in a soldering lab."},
      {id:"b3l2_q2", q:"Why does it matter where LiPo batteries are kept during a soldering session?",
       choices:["They need to be warm for best performance","They should be physically away from the soldering area entirely until the build is done and it's time to power up, not just set to one side","LiPo batteries are unaffected by heat or sparks","They should be plugged in during soldering to test connections as you go"],
       a:1, exp:"Keeping LiPo cells genuinely away from an active heat source and stray solder splashes — not just nearby — is a basic fire-risk precaution, not an exaggeration."},
      {id:"b3l2_q3", q:"What does 'tinning' accomplish before joining a wire and pad?",
       choices:["It cleans flux residue off the iron","It coats both surfaces with a thin layer of solder so heat transfers evenly and the joint bonds on both sides","It cools the joint faster","It is a purely cosmetic step"],
       a:1, exp:"Tinning both surfaces first means the joint doesn't rely on cold solder bridging two dry surfaces — it gives heat and solder somewhere to flow on both sides."},
      {id:"b3l2_q4", q:"What is the correct technique for feeding solder into a joint?",
       choices:["Melt solder onto the iron tip, then smear it onto the joint","Heat the joint itself until it reaches temperature, then feed solder into the joint so it flows and wicks in on its own","Apply solder before the iron touches the joint at all","Solder technique doesn't affect joint quality"],
       a:1, exp:"If you're pushing solder around with the iron tip instead of letting it wick into a hot joint, the joint likely hasn't reached full temperature — a classic precursor to a cold joint."},
      {id:"b3l2_q5", q:"Why is a cold or fractured solder joint especially dangerous on a drone, compared to most other failure points?",
       choices:["It's louder than other failures, making it easy to diagnose","It can hold up fine on the bench and only fail once vibration flexes it in flight, so a pre-flight visual check won't catch it","It always fails within the first five minutes of assembly","It only affects battery charge time"],
       a:1, exp:"A joint that's mechanically weak or fractured can carry current fine while stationary and only give out under the vibration and load of actual flight — by which point it's an in-air failure, not a bench inspection catch."},
      {id:"b3l2_q6", q:"What is a 'bridged pad' and why is it a particular risk on ESC boards?",
       choices:["A missing pad that needs to be replaced","Excess solder connecting two pads that should be electrically isolated, which on tightly spaced ESC pads can short a phase or signal line to power","A pad that has been tinned twice","A term for a properly soldered joint"],
       a:1, exp:"ESC pads are often small and closely spaced, so a slightly overheated or over-fluxed joint can easily bridge solder across two pads that need to stay isolated — a common and damaging beginner mistake."},
      {id:"b3l2_q7", q:"How do you correctly fix a bridged solder joint?",
       choices:["Scrape it off with a knife blade while it's still hot", "Lay solder wick over the bridge and press the hot iron on top so capillary action pulls the excess solder into the braid", "Add more solder until the bridge disappears", "Bridged joints can't be fixed and the board must be replaced"],
       a:1, exp:"Solder wick (desoldering braid) heated against a bridge draws the excess solder up via capillary action, cleanly separating the pads without damaging them."}
    ,
      {id:"b3l2_q8", q:"Why should you periodically wipe the iron's tip on a brass-wool or damp sponge during a soldering session?", choices:["To remove old, oxidized solder so it doesn't contaminate a fresh joint", "To cool the tip down between joints", "To sharpen the tip's point", "To apply flux to the tip"], a:0, exp:"Wiping the tip on brass wool or a damp sponge clears old, oxidized solder so it doesn't contaminate the next joint."},
      {id:"b3l2_q9", q:"What is the purpose of a helping-hands tool or third-hand clamp at a soldering station?", choices:["To hold the multimeter probes steady", "To hold whatever you're joining still, since soldering itself takes both hands \u2014 one for the iron, one for the solder", "To clamp the LiPo battery in place during charging", "To measure wire gauge before stripping"], a:1, exp:"Soldering takes both hands \u2014 one for the iron, one for the solder \u2014 so whatever you're joining needs to already be held still by a helping-hands tool or clamp before you start."},
      {id:"b3l2_q10", q:"Why does the lesson call for safety glasses before soldering, specifically?", choices:["Bright solder joints can strain the eyes over time", "Soldering irons emit harmful UV light", "Flux can spit and a freshly clipped wire lead can become a small projectile", "Glasses prevent flux fumes from being inhaled"], a:2, exp:"Safety glasses guard against flux spitting and freshly clipped wire leads, which can become small projectiles \u2014 not against UV or fumes."},
      {id:"b3l2_q11", q:"If you get burned by a hot iron tip, what does the lesson say to do?", choices:["Touch the tip again briefly to confirm it's actually hot", "Apply ice directly to the burn for the fastest relief", "Continue working and address it after the session", "Run cool water on the burn immediately for several minutes, and check that the iron is off and cooling rather than touching it again"], a:3, exp:"The lesson's guidance is cool water immediately, for several minutes \u2014 and to check the iron is off and cooling rather than touching it again to 'make sure.'"},
      {id:"b3l2_q12", q:"What's the risk of stripping too much insulation off a wire before soldering a joint, versus too little?", choices:["Stripping too much leaves exposed bare wire past the joint that can short against something, while stripping too little won't give a full tinned surface", "There's no real difference \u2014 either way affects the joint identically", "Too much stripping makes the wire too short to reach its pad", "Too little stripping causes the iron to overheat"], a:0, exp:"Strip too little and you won't get a full tinned surface; strip too much and you leave bare wire past the joint, waiting to short against something."},
      {id:"b3l2_q13", q:"What is a 'disturbed joint,' and why is it dangerous?", choices:["A joint that was never fluxed, making it visibly dull", "A joint where the wire moved slightly while the solder was still cooling, leaving it looking solid but with a fractured internal structure", "A joint soldered with the wrong tip size", "A joint that was bridged to an adjacent pad"], a:1, exp:"A disturbed joint happens when the wire shifts even slightly while the solder is still setting \u2014 it can look perfect from outside while being fractured internally."},
      {id:"b3l2_q14", q:"What should a properly soldered joint look like on inspection, and how do you confirm it mechanically?", choices:["Dull and grainy, confirmed by measuring resistance only", "Flat and matte, confirmed by visual inspection only, never touched", "Shiny and smooth, shaped like a small volcano around the wire, confirmed with a gentle tug test after it's cooled", "Bright white and rough-textured, confirmed by reheating it once more"], a:2, exp:"A good joint is shiny, smooth, and shaped like a small volcano around the wire \u2014 inspect it, then give it a gentle tug once cooled to confirm it doesn't move."}]},
    {id:"b3l3", title:"Power Distribution & ESC/FC Wiring", content:`
      <p>Once the frame, motors, and stack are mounted, it's time to get power to the motors and signal to the ESC. Two common architectures: a <strong>4-in-1 ESC</strong> (all four motor ESCs on a single board, usually integrated with power distribution) or <strong>individual ESCs</strong> per motor, wired to a separate <strong>power distribution board (PDB)</strong>. A 4-in-1 means fewer solder joints and a cleaner build; individual ESCs mean easier field repairs, since a failed ESC is a full swap instead of a board-level repair. Note the two ways a 4-in-1 physically attaches, too: many stacks simply <strong>plug the 4-in-1 directly onto the FC's pin headers</strong>, no wires at all between the two boards; others still connect FC-to-ESC signal and power with short soldered wires even though it's a 4-in-1. Don't assume "4-in-1" automatically means "no wiring here" &mdash; check your specific stack.</p>
      <p>Whichever you choose, keep <strong>power wiring and signal wiring</strong> physically separated and managed &mdash; power leads carry current that can induce noise into nearby signal lines, and a tidy loom is also just easier to diagnose later when something goes wrong. Route them along different paths where you can, and secure everything so nothing can vibrate into a prop or a hot ESC.</p>
      <p>Connectors matter more than they seem to. <strong>XT60</strong> connectors handle the main battery-to-frame power connection on most builds; <strong>bullet connectors</strong> (usually 3.5mm or 4mm, or pre-soldered on motor leads) connect motors to ESCs. Every connector has a defined <strong>polarity</strong> &mdash; positive and negative are not interchangeable, and most connector housings are keyed specifically so you can't plug them in backward once assembled correctly. The risk lives entirely in how <em>you</em> solder them.</p>
      <div class="callout"><div class="clabel">Why It Matters</div>Reversed polarity on a main power connector sends battery current backward through components that were never designed to see it in that direction &mdash; and unlike a cold solder joint, this failure doesn't wait for vibration or a bad flight. It happens the instant you connect the battery.</div>
      <p><strong>Wiring the receiver is part of this stage too</strong>, and it's easy to build a quad that's electrically complete on the motor/ESC side while the receiver is still just sitting there unconnected. The receiver needs two things from the FC: <strong>power</strong> and a <strong>signal path</strong>. For power, most FCs provide a regulated <span class="keyfact">5V</span> rail (stepped down from battery voltage by an onboard <strong>BEC</strong> &mdash; battery eliminator circuit) specifically for accessories like the receiver, so it's not drawing straight off the main battery voltage; find the FC's 5V and ground pads (labeled on the silkscreen, usually near the receiver connection area) and wire the receiver's power and ground leads there. For signal, solder the receiver's single signal wire (carrying the full CRSF or SBUS data stream, protocols B4L2 covers) to one specific <strong>UART</strong> pad on the FC &mdash; check your FC's manual for which UART is receiver-designated, since it varies by board and you'll need to tell Betaflight which port you used once you get to configuration. Three wires, done correctly, is the entire receiver installation: power, ground, signal &mdash; there's no separate "binding wire" or anything more exotic than that.</p>
      <div class="tip"><div class="clabel">Hands-On</div>Before soldering, find your FC's silkscreen labels (or its printed pinout diagram) for the 5V/BEC pad, a ground pad, and each UART's RX/TX pads. Dry-fit the receiver's three leads against those pads and confirm you know exactly which UART you're using before any solder goes down &mdash; you'll need that UART number again in B4L2.</div>
      <div class="tip"><div class="clabel">Case Study</div>A first-time builder soldered their XT60 pigtail by matching wire color to "whatever looked right" instead of checking the connector's keyed shape against the board's silkscreen labels. Everything looked correct &mdash; connector fully seated, no bare wire showing. On first battery connection, the FC's power regulator let go in under a second, releasing a thin stream of smoke and a smell that doesn't come out of a workbench easily. The board was dead. The fix going forward wasn't more caution in general &mdash; it was a specific habit: always dry-fit and visually trace power polarity against the PDB or FC silkscreen before a single drop of solder touches the connector.</div>
      <div class="tip"><div class="clabel">Hands-On</div>Before soldering your main power connector, find the polarity markings on your PDB or FC (usually a "+" and "&minus;" or red/black silkscreen) and physically trace the wire path with your finger from battery lead to board pad. Only pick up the iron once you've confirmed the path twice.</div>
    `,
    quiz:[
      {id:"b3l3_q1", q:"What is the main practical trade-off between a 4-in-1 ESC and individual ESCs with a separate PDB?",
       choices:["4-in-1 ESCs cannot handle more than 2S batteries","Individual ESCs are always faster","A 4-in-1 means fewer joints and a cleaner build, while individual ESCs make field repairs easier since a failed one is a simple swap","There is no real difference between the two approaches"],
       a:2, exp:"4-in-1 boards simplify the build with fewer solder joints; individual ESCs cost more wiring complexity but let you replace a single failed unit without touching the rest of the power system."},
      {id:"b3l3_q2", q:"Why should power wiring and signal wiring be kept physically separated where possible?",
       choices:["It's a cosmetic preference with no electrical basis","Power leads can induce electrical noise into nearby signal lines, and separated wiring is easier to diagnose later","Signal wires get hot and can melt power insulation","FCs will not power on if the wires touch"],
       a:1, exp:"Current-carrying power leads can induce noise into signal lines running alongside them, and a well-organized loom is significantly easier to troubleshoot when something misbehaves."},
      {id:"b3l3_q3", q:"What makes reversed polarity on a main battery connector especially dangerous compared to a cold solder joint?",
       choices:["It only shows up after many flight hours","It causes damage instantly on first connection, rather than waiting for vibration or stress to reveal a weakness","It is not actually dangerous, just inconvenient","It only affects the motors, never the flight controller"],
       a:1, exp:"A cold joint can pass bench tests and only fail later under vibration; reversed polarity sends current backward through components the instant the battery is connected — there is no gradual failure window."},
      {id:"b3l3_q4", q:"What is the most reliable way to prevent a reversed-polarity connector mistake before soldering?",
       choices:["Solder quickly so there's less time for error","Assume the connector's physical keying makes any wiring order safe","Trace and visually confirm polarity against the board's silkscreen or markings before soldering, every time","Rely on wire color alone, since manufacturers are always consistent"],
       a:2, exp:"Connector keying prevents backward insertion after assembly, but it does nothing to stop you from soldering the wires onto the wrong pads in the first place — that has to be caught by checking markings before you solder, not after."},
      {id:"b3l3_q5", q:"What three connections does wiring a receiver to the flight controller actually require?",
       choices:["Power, ground, and signal, with signal going to a specific UART pad", "A single combined data-and-power wire, same as a USB cable", "Four wires, one per control channel", "Only a signal wire — receivers draw power wirelessly from the transmitter"],
       a:0, exp:"A receiver needs regulated 5V power and ground (from the FC's BEC-fed rail) plus one signal wire carrying the full CRSF/SBUS data stream into a specific UART — three wires total, nothing more exotic."}
    ,
      {id:"b3l3_q6", q:"The lesson notes two different ways a 4-in-1 ESC can physically attach to the flight controller. What are they?", choices:["Plugging directly onto the FC's pin headers with no wires, or still being connected via short soldered wires depending on the stack", "Only through a wireless Bluetooth pairing", "Only by being permanently glued to the frame", "Only through a USB cable"], a:0, exp:"Some stacks plug the 4-in-1 directly onto the FC's pin headers with no wires at all; others still connect FC-to-ESC power and signal with short soldered wires even though it's a 4-in-1 \u2014 check your specific stack rather than assuming."},
      {id:"b3l3_q7", q:"Which connector type handles the main battery-to-frame power connection on most builds, versus motor-to-ESC connections?", choices:["JST for main power; XT60 for motor-to-ESC", "XT60 for main power; bullet connectors (3.5mm or 4mm) for motor-to-ESC", "Bullet connectors for main power; XT60 for motor-to-ESC", "Both connections use the same JST connector"], a:1, exp:"XT60 connectors handle the main battery-to-frame power connection on most builds; bullet connectors (usually 3.5mm or 4mm) connect motors to ESCs."},
      {id:"b3l3_q8", q:"Why does the receiver draw its power from the FC's regulated 5V rail (via the onboard BEC) rather than straight off the main battery voltage?", choices:["Because receivers can only run on AC power", "Because the main battery voltage is too low for the receiver", "Because the BEC (battery eliminator circuit) steps battery voltage down to a regulated 5V specifically for accessories like the receiver", "Because it eliminates the need for a signal wire entirely"], a:2, exp:"Most FCs provide a regulated 5V rail via an onboard BEC specifically for accessories like the receiver, rather than exposing it to raw, unregulated battery voltage."},
      {id:"b3l3_q9", q:"What does the receiver's single signal wire carry into the flight controller?", choices:["A raw analog voltage proportional to throttle only", "A binding request only, sent once at power-up", "Firmware update data for the FC", "The full CRSF or SBUS data stream, into one specific UART pad"], a:3, exp:"The receiver's single signal wire carries the full CRSF or SBUS data stream into one specific UART pad on the FC \u2014 not a simple analog throttle voltage."},
      {id:"b3l3_q10", q:"Why does it matter which specific UART port you wire the receiver's signal to?", choices:["UART choice varies by board, and you'll need to tell Betaflight which port you used when you reach configuration later", "It doesn't matter \u2014 any UART works identically", "Only even-numbered UARTs can carry receiver data", "The UART also supplies the receiver's power"], a:0, exp:"Which UART is receiver-designated varies by board, and you'll need to know and select that same UART again when configuring Betaflight later."}]},
    {id:"b3l4", title:"Pre-Power Checks & First Power-Up", content:`
      <p>Everything is soldered and mounted. Before a battery goes anywhere near this aircraft, there's a sequence of checks that exists for one reason: to catch a wiring mistake while the consequence is a multimeter reading, not smoke, a fire, or a spinning prop near your hand.</p>
      <p>Start with <strong>continuity testing</strong>. Set a multimeter to continuity or resistance mode and check for shorts between your main power positive and negative <strong>before the battery is ever connected</strong>. Touch the probes to the positive and negative pads or leads at the battery connector. A dead short (near-zero resistance, continuous beep) means something is bridged somewhere in your power path &mdash; a solder bridge, a pinched wire, a nicked insulation layer &mdash; and you find it now, with a nine-volt-scale test current, not with a fully charged LiPo.</p>
      <p>Once continuity checks out clean, use a <strong>smoke stopper</strong> (a current-limiting device wired in series with the battery for first power-up) if you have one. It limits current to a safe trickle, so if there is still a fault your multimeter missed, you get a dim LED or a mildly warm component instead of a destroyed board.</p>
      <ul>
        <li>Confirm props are <strong>off</strong> before any power-up testing &mdash; arming, calibrating, and testing motor response should all happen prop-off, every time, no exceptions.</li>
        <li>Connect the smoke stopper (if used) or battery, and watch for any component that gets hot, smokes, or smells within the first few seconds.</li>
        <li>Confirm <strong>FC boot</strong> right now: a normal boot shows a steady or slow-blinking status LED and, on most FCs, a short confirmation beep sequence from the ESCs. A dead LED, a rapid unfamiliar blink pattern, or no ESC beeps at all means stop and diagnose before going further &mdash; don't proceed on a guess.</li>
        <li>Motor direction and control response get their own confirmation once you reach firmware flashing and Configurator's motor test tab in B4L1/B4L2 &mdash; there's no way to test either one yet at this stage, since nothing is flashed. For now, confirming FC boot cleanly is the checkpoint; only once FC boot, motor direction, and control response <em>all</em> check out prop-off do you move to a prop-on test, and even then, treat the aircraft as capable of arming and spinning at any moment.</li>
        <li>Never work on a "powered off" aircraft as if it's inert &mdash; a connected LiPo is live even when the FC is asleep.</li>
      </ul>
      <div class="callout"><div class="clabel">Ask Yourself</div>If a fault only shows up once, at full power, why would you ever want that first exposure to happen with props on and a battery at full charge, instead of engineered down to the smallest possible consequence?</div>
      <div class="tip"><div class="clabel">Case Study</div>A builder finished their wiring late at night, skipped the prop-off testing step because "it had worked on the bench before," and armed the aircraft with props attached to do a quick throttle check by hand. A stick input the builder didn't expect &mdash; a brief unintended arm signal from a mis-set switch &mdash; spun the props at low but real speed. The result was a cut to a fingertip, not catastrophic, but a permanent lesson: prop-off testing isn't a suggestion for cautious people, it's the only version of a first power-up that doesn't put a body part in the path of a spinning blade.</div>
      <div class="tip"><div class="clabel">Hands-On</div>Set your multimeter to continuity mode right now and test it against a known short (touch the two probes together) so you know what the beep sounds like. Then, before your next battery connection on any build, run the same test across your main power leads and confirm silence.</div>
    `,
    quiz:[
      {id:"b3l4_q1", q:"What is the purpose of continuity testing with a multimeter before the first battery connection?",
       choices:["To measure motor RPM","To detect a short between positive and negative power before real current is ever applied, catching wiring faults at low stakes","To calibrate the flight controller's gyro","To check Wi-Fi signal strength on the FC"],
       a:1, exp:"A continuity check finds a dead short — from a solder bridge, pinched wire, or damaged insulation — using the multimeter's own tiny test current, long before a charged LiPo would turn the same fault into real damage."},
      {id:"b3l4_q2", q:"What does a smoke stopper do during first power-up?",
       choices:["It fully replaces the need for continuity testing","It limits current to a safe trickle, so a remaining fault causes a dim light or warm part instead of destroying a component","It prevents the battery from ever being overcharged","It measures flight controller firmware version"],
       a:1, exp:"A smoke stopper is a current-limiting device in series with the battery, meant to reduce the consequence of a fault your continuity check might have missed — not to replace that check."},
      {id:"b3l4_q3", q:"Why must all initial arming, calibration, and motor-response testing be done with props off?",
       choices:["Props are only needed for actual flight, not testing","An unexpected arm or stick input during testing can spin a live prop with a hand or body part nearby, which is a genuine injury risk","Props off makes the FC boot faster","It's a cosmetic convention with no safety purpose"],
       a:1, exp:"Testing prop-off removes the injury risk entirely — an unexpected arm signal or stray input spins nothing dangerous. Testing with props on treats every unverified circuit and every human error as something a spinning blade might be near."},
      {id:"b3l4_q4", q:"Why should a connected LiPo battery always be treated as 'live,' even if the flight controller appears powered off?",
       choices:["Because the FC being asleep doesn't disconnect the battery from the power system, so current is still present and components can still be energized","Because LiPo batteries recharge themselves automatically","Because the FC requires a live battery to display any lights at all","This is a myth — a sleeping FC means the aircraft is fully safe to handle"],
       a:0, exp:"A connected battery supplies power to the aircraft's power rails regardless of what state the flight controller's firmware is in — treating a plugged-in LiPo as inert is exactly the assumption that leads to careless handling."}
    ,
      {id:"b3l4_q5", q:"What does a normal flight controller boot look like at first power-up?", choices:["A steady or slow-blinking status LED, plus a short confirmation beep sequence from the ESCs", "A rapid, erratic LED blink with no beeps", "Complete silence and a dead LED for several minutes before booting", "A continuous, non-stop beeping tone that doesn't stop"], a:0, exp:"A normal boot shows a steady or slow-blinking status LED and, on most FCs, a short confirmation beep sequence from the ESCs."},
      {id:"b3l4_q6", q:"You power up a new build and see a dead status LED with no ESC beep sequence. What should you do?", choices:["Proceed to a prop-on test since props being off makes any fault safe", "Stop and diagnose the issue before going any further \u2014 don't proceed on a guess", "Reflash the firmware immediately without further checks", "Assume it's normal and continue to the next build stage"], a:1, exp:"A dead LED, unfamiliar rapid blink, or missing ESC beeps means stop and diagnose before going further \u2014 the lesson is explicit about not proceeding on a guess."},
      {id:"b3l4_q7", q:"At this pre-power-up stage, why can't motor direction and control response be tested yet?", choices:["Because props must be installed first", "Because the battery must be fully depleted first", "Because nothing is flashed yet \u2014 that confirmation only happens once you reach Betaflight Configurator's motor test tab in B4L1/B4L2", "Because motor direction can only be tested after the first real flight"], a:2, exp:"Motor direction and control response can't be tested yet because nothing is flashed at this stage \u2014 that check waits for Configurator's motor test tab in B4L1/B4L2. FC boot is the one checkpoint available now."},
      {id:"b3l4_q8", q:"Before moving from prop-off testing to a prop-on test, what does the lesson say must all check out first?", choices:["Only that the battery is fully charged", "Only that the multimeter shows continuity", "Only that the smoke stopper LED is lit", "FC boot, motor direction, and control response must all check out cleanly, prop-off, first"], a:3, exp:"Only once FC boot, motor direction, and control response all check out prop-off do you move to a prop-on test \u2014 and even then, the aircraft is treated as capable of arming at any moment."}]}
  ],
  finalQuiz:[
    {id:"b3_final_q1", q:"What is the correct build order and why does it matter?",choices:["ESC/wiring, then frame, then motors, then FC — wiring first avoids rework","Frame, motors, FC/stack, then ESC/wiring — each stage locks in something the next depends on","Motors first, since they're the hardest part","Order doesn't matter as long as everything gets done eventually"],a:1,exp:"Each stage establishes something the next stage needs — frame geometry before motor mounting, motor positions and confirmed rotation before wiring, stack placement before it's buried under a harness."},
    {id:"b3_final_q2", q:"Why confirm motor rotation direction before soldering motor wires to the ESC?",choices:["Rotation direction is fixed at the factory and can't be changed","Fixing it after soldering often means desoldering a finished, possibly buried joint — check it while wires are still loose and reachable","It has no effect on flight","ESCs automatically detect and correct rotation direction"],a:1,exp:"Confirming rotation early, while leads are bare and accessible, avoids reworking a completed joint later."},
    {id:"b3_final_q3", q:"What visually distinguishes a cold solder joint from a good one?",choices:["A cold joint is dull, grainy, or lumpy rather than smooth and shiny","A cold joint is always darker in color only","There is no visual difference, only an electrical one","A cold joint is shinier than a good joint"],a:0,exp:"A properly heated joint flows smooth and shiny; a cold joint looks dull, grainy, or lumpy because it never reached full temperature."},
    {id:"b3_final_q4", q:"Why is a cold or fractured solder joint dangerous specifically on a flying aircraft?",choices:["It's a purely cosmetic issue","It can pass a bench check and only fail once vibration in flight flexes it, so the failure is invisible until it happens mid-air","It only affects charging speed","It causes the battery to overheat immediately"],a:1,exp:"A weak or fractured joint can conduct current fine at rest and only give way under the vibration and stress of actual flight — undetectable ahead of time by visual inspection."},
    {id:"b3_final_q5", q:"What is the key difference between a 4-in-1 ESC setup and individual ESCs with a separate PDB?",choices:["4-in-1 boards can't be used on quadcopters","Individual ESCs make single-motor failures a simple swap; 4-in-1 boards mean fewer joints and a cleaner build overall","There's no functional difference","4-in-1 ESCs require no power distribution at all"],a:1,exp:"4-in-1 simplifies wiring and reduces joint count; individual ESCs trade some build complexity for easier field repair of a single failed unit."},
    {id:"b3_final_q6", q:"Why is reversed polarity on a main power connector so damaging compared to most other wiring mistakes?",choices:["It causes damage instantly on battery connection, with no warning period, unlike stress-related failures that build up over time","It only causes minor, easily reversible issues","It takes weeks of flying before any damage appears","It only affects the receiver, never the flight controller"],a:0,exp:"Reversed polarity sends current backward through components the moment the battery connects — there's no gradual failure window like there is with a marginal joint."},
    {id:"b3_final_q7", q:"What is the purpose of prop-off testing before a first power-up?",choices:["It's an optional step for inexperienced builders only","It removes real injury risk during a phase where wiring faults and unexpected arm signals are still possible — the aircraft should be assumed live at every step","It makes the flight controller boot faster","Props must be off for the battery to charge"],a:1,exp:"Testing prop-off means an unverified circuit or an unexpected arm signal spins nothing that can hurt you — treating the aircraft as always potentially live is the entire point of the discipline."}
  ,
    {id:"b3_final_q8", q:"What does frame assembly establish that every later build stage depends on?", choices:["Arm geometry and mounting points, squared and torqued before anything else goes on", "The flight controller's firmware version", "The battery's discharge rating", "The final paint scheme"], a:0, exp:"Frame assembly establishes arm geometry and mounting points \u2014 squared and torqued before anything else goes on, since every later stage depends on it."},
    {id:"b3_final_q9", q:"Why should you periodically wipe a soldering iron's tip on brass wool or a damp sponge during a build session?", choices:["To sharpen the tip", "To remove old, oxidized solder so it doesn't contaminate a fresh joint", "To cool the tip so it lasts longer", "To apply extra flux automatically"], a:1, exp:"Wiping the tip on brass wool or a damp sponge clears old, oxidized solder so it doesn't contaminate the next joint."},
    {id:"b3_final_q10", q:"What is a 'disturbed joint' in soldering, and why is it dangerous on a drone?", choices:["A joint that was never cleaned with flux", "A joint that used the wrong wattage iron", "A joint where the wire moved slightly while the solder was cooling, leaving a fracture invisible from outside", "A joint that was bridged to an adjacent pad"], a:2, exp:"A disturbed joint happens when the wire shifts even slightly while the solder is still setting \u2014 it can look solid from outside while being fractured internally."},
    {id:"b3_final_q11", q:"Which connector type handles the main battery-to-frame power connection on most builds?", choices:["JST", "Bullet connectors", "USB-C", "XT60"], a:3, exp:"XT60 connectors handle the main battery-to-frame power connection on most builds; bullet connectors handle the motor-to-ESC connections."},
    {id:"b3_final_q12", q:"What does the FC's onboard BEC provide to the receiver?", choices:["A regulated 5V power rail stepped down from battery voltage", "Direct, unregulated battery voltage", "A wireless charging signal", "The receiver's binding code"], a:0, exp:"The FC's onboard BEC steps battery voltage down to a regulated 5V rail specifically for accessories like the receiver."},
    {id:"b3_final_q13", q:"What does a normal flight controller boot look like at first power-up?", choices:["Total silence with no LED activity for several minutes", "A steady or slow-blinking status LED plus a short ESC confirmation beep sequence", "A single loud continuous alarm tone", "Rapid unfamiliar blinking with no beeps at all"], a:1, exp:"A normal boot shows a steady or slow-blinking status LED plus a short ESC confirmation beep sequence \u2014 anything else means stop and diagnose."},
    {id:"b3_final_q14", q:"What is the purpose of continuity testing with a multimeter before the first battery connection?", choices:["To measure the battery's remaining charge", "To calibrate the gyroscope", "To detect a short between positive and negative power before real current is applied, catching faults at low stakes", "To test the transmitter's range"], a:2, exp:"Continuity testing finds a dead short \u2014 from a solder bridge, pinched wire, or damaged insulation \u2014 with the multimeter's own tiny test current, long before a charged LiPo would turn the same fault into real damage."}]

{
  id:"b4", title:"Betaflight: Configuration & Tuning", week:"Weeks 7–9",
  lessons:[
    {id:"b4l1", title:"Flashing Firmware & Surviving First Connection", content:`
      <p>Every flight controller ships blank or running whatever firmware the factory loaded — before it can do anything useful, you need to flash <strong>Betaflight</strong> firmware onto it and connect through <strong>Betaflight Configurator</strong>, the desktop app that talks to your FC over USB.</p>
      <p>The single most important decision in this whole process is picking the right <strong>target</strong> — the specific firmware build matched to your FC's exact processor and board layout (a Matek F405-Wing target is not interchangeable with a SpeedyBee F405 target, even though both use an STM32F405 chip). Flash the wrong target and the firmware may boot into a half-working state, silently misassign pins, or fail to boot at all.</p>
      <p>To flash: put the FC into <strong>DFU mode</strong> (usually by holding a small labeled <strong>BOOT</strong> button — typically near the USB port, though check your specific board's diagram, since a few use a solder-bridge jumper instead of a button — while plugging in USB, or via the "Flash Firmware" button in Configurator, which reboots the board into DFU automatically), select your exact target from the dropdown, and hit Flash. For a first flash, leave everything at default except target selection and, if offered, "Full chip erase" — checking that box wipes any old configuration and firmware cleanly, which is what you want on a brand-new board. Do not unplug during the write.</p>
      <p>If you do flash the wrong target and the board won't enumerate normally afterward, it is very rarely permanently bricked. Almost every STM32-based FC has a hardware bootloader burned in at the factory that a bad firmware flash can't overwrite — re-enter DFU mode, let Configurator detect it as a DFU device, select the correct target this time, and reflash. The recovery path is the same motion as the original flash.</p>
      <div class="tip"><div class="clabel">Case Study</div>A builder flashed a generic "OMNIBUSF4" target onto a board that actually needed a manufacturer-specific F405 target with different UART mapping. The board powered up and Configurator connected, but the receiver never showed signal and two motor outputs were swapped. Rather than troubleshoot a fundamentally wrong firmware map, they held the boot button, re-entered DFU, reflashed the correct target, and everything — UARTs, motor order, sensors — was correct on the first try. When behavior looks scrambled right after a flash, suspect the target before you suspect your wiring.</div>
      <div class="callout"><div class="clabel">Ask Yourself</div>If a bad flash can't normally destroy the bootloader, what does that tell you about how much caution you actually need versus how much caution feels warranted the first time you do it?</div>
      <div class="tip"><div class="clabel">Workshop Tip</div>If Configurator never sees your FC at all — no device shows up to select, DFU or otherwise — suspect USB drivers before anything else. This is the single most common first-connection blocker, especially on Windows: the board needs the correct STM32 VCP (normal connection) and DFU (flashing) drivers installed, which don't always install automatically. Check your FC manufacturer's site for a driver installer before assuming the board or cable is bad.</div>
      <div class="tip"><div class="clabel">Hands-On</div>Open Betaflight Configurator now, plug in your FC, and go to the Firmware Flasher tab. Without actually flashing anything, find your exact board in the target dropdown and read its notes — manufacturer pages often list known quirks for that specific target.</div>
      <div class="diagram">${SVG_DFU}<div class="dcap">A wrong-target flash isn&rsquo;t a brick &mdash; hold the boot button and DFU mode is always there to let you try again.</div></div>
    `,
    quiz:[
      {id:"b4l1_q1", q:"What determines which Betaflight target you should select when flashing?",
       choices:["The FC's processor family alone (e.g. any F405 target works)","The exact board-and-processor combination specified by the FC manufacturer","Whichever target flashes fastest","The battery size you plan to use"],
       a:1, exp:"Targets are matched to the specific board layout, not just the processor family — two boards sharing an STM32F405 chip can still need different targets."},
      {id:"b4l1_q2", q:"You flash the wrong target and the board now behaves strangely. What's the most accurate description of your situation?",
       choices:["The FC is permanently destroyed","Almost always recoverable — re-enter DFU/bootloader mode and reflash the correct target","You must contact the manufacturer for a hardware replacement","Nothing can be done except waiting for a firmware update"],
       a:1, exp:"The hardware bootloader is burned in at the factory and a bad firmware flash normally can't touch it, so DFU mode is available for a redo."},
      {id:"b4l1_q3", q:"What is DFU mode used for?",
       choices:["Normal flight operation","Putting the FC into a state where new firmware can be written to it","Binding the receiver","Calibrating the accelerometer"],
       a:1, exp:"DFU (Device Firmware Update) mode is the bootloader-level state Configurator uses to write firmware to the chip."}
    ,
      {id:"b4l1_q4", q:"Configurator shows no device at all to select \u2014 not even in DFU mode. What should you suspect first?", choices:["A physically broken solder joint on the flight controller", "Missing or incorrect STM32 VCP/DFU USB drivers, especially on Windows", "A corrupted firmware target file that needs re-downloading", "The wrong Betaflight Configurator version installed"], a:1, exp:"Missing STM32 VCP/DFU drivers is the single most common first-connection blocker, especially on Windows, and should be ruled out before suspecting hardware."},
      {id:"b4l1_q5", q:"On a brand-new, never-before-flashed board, what does checking 'Full chip erase' before the first flash accomplish?", choices:["It permanently disables DFU mode after flashing", "It automatically selects the correct target for you", "It wipes any old configuration and firmware cleanly, appropriate for a brand-new board", "It backs up the factory firmware for later restoration"], a:2, exp:"A full chip erase clears out any prior configuration or firmware, giving a brand-new board a clean baseline \u2014 exactly what you want on a first flash."},
      {id:"b4l1_q6", q:"In the case study, a builder flashed a generic 'OMNIBUSF4' target onto a board that actually needed a manufacturer-specific F405 target. What went wrong as a result?", choices:["The board refused to power on at all", "The FC was permanently bricked beyond DFU recovery", "Nothing was noticeably wrong until a hard crash occurred", "The receiver showed no signal and two motor outputs were swapped"], a:3, exp:"The wrong target's different UART and motor mapping left the receiver with no signal and two motor outputs swapped \u2014 a scrambled-but-recoverable result, not a hardware failure."}]},
    {id:"b4l2", title:"Ports, Receiver Binding & Flight Modes", content:`
      <p>Once firmware is on and Configurator connects, the next job is telling the flight controller which physical port your receiver is wired to and what protocol it's speaking. This happens on the <strong>Ports</strong> tab: find the UART you soldered your receiver's signal wire to back in B3L3 and enable <strong>Serial RX</strong> on that same port.</p>
      <p>The protocol matters here. Modern digital protocols like <strong>CRSF</strong> (ExpressLRS, TBS Crossfire) run at a fixed baud rate of <span class="keyfact">420,000</span> and configure automatically once you select "CRSF" as the receiver protocol on the Configuration tab. Older <strong>SBUS</strong> is an inverted signal — some F4 boards need a specific UART with hardware inversion support, while F7 and newer boards handle inversion on any UART. Get the wrong UART or wrong protocol selected and you'll see no signal at all on the Receiver tab, which is often mistaken for a wiring fault when it's really a configuration one.</p>
      <p>With ports configured, <strong>bind</strong> the receiver to your transmitter — the exact procedure depends on your radio link (a bind button and a flashing-then-solid LED for most protocols, a one-time bind phrase entered in both TX and RX for ExpressLRS). The Reference Sheet's <span class="keyfact" data-ref="ref-binding">Binding Methods by Protocol</span> entry covers the exact steps for each of this classroom's radios. Confirm binding worked on the Receiver tab: move a stick and watch the channel bars move in Configurator before you trust anything further.</p>
      <p>Next, set up <strong>modes</strong> on the Modes tab. At minimum you need an <strong>ARM</strong> switch assigned to an AUX channel range — never leave arming on a stick gesture alone if you can help it; a dedicated switch is safer and more deliberate. Then assign your flight mode switch: a 3-position switch is the classic setup, with <strong>Angle</strong> mode on one end, <strong>Horizon</strong> in the middle, and nothing assigned (pure <strong>Acro</strong>) on the other.</p>
      <p>Angle mode self-levels the aircraft toward the stick's proportional tilt — let go of the sticks and it rights itself. Horizon does the same near center stick but allows full rotation at full deflection. Acro has no self-leveling at all: the sticks control pure rotational rate, and the aircraft will happily stay inverted forever if you let it.</p>
      <div class="callout"><div class="clabel">Why It Matters</div>A beginner who starts in Acro is fighting two learning curves at once — throttle and attitude management, plus the total absence of a safety net. Start in Angle, where letting go of the sticks is itself a recovery maneuver, and graduate to Acro once basic control is automatic.</div>
      <div class="tip"><div class="clabel">Workshop Tip</div>Label your transmitter switches — a strip of tape works fine — with which position is Angle, Horizon, and Acro until it's muscle memory. Reaching for the wrong switch under stress is a common source of avoidable crashes.</div>
      <div class="tip"><div class="clabel">Hands-On</div>In Configurator's Modes tab, add a range for ARM on an unused AUX channel, then add ranges for Angle and Horizon on another AUX channel. Flip your transmitter switches and watch the mode indicators light up in Configurator to confirm the ranges are correct before you ever plug in a battery.</div>
    `,
