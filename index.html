<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Part 107 Ground School</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#12100e; --panel:#1b1815; --panel2:#221e1a; --line:#332d27;
  --ink:#efe9e1; --dim:#a2968a; --accent:#d9a441; --good:#5fb37a;
  --warn:#d98a41; --bad:#c25b52; --blue:#6fa8d9; --radius:10px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  font-size:14.5px;line-height:1.6}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,
[tabindex]:focus-visible,.navbtn:focus-visible,.modhead:focus-visible,.lesson-item:focus-visible,
.tocrow:focus-visible,.hcard:focus-visible,.choice:focus-within{
  outline:2px solid var(--accent);outline-offset:2px}
header{padding:20px 28px 16px;border-bottom:3px solid var(--accent);position:relative;
  display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
header::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:1px;background:var(--bad)}
header .kicker{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--bad);font-weight:800;margin-bottom:5px}
header h1{margin:0;font-size:25px;letter-spacing:-.01em;font-weight:800;text-transform:uppercase;
  font-family:Georgia,'Times New Roman',serif}
header .sub{color:var(--dim);font-size:12px;margin-top:5px;font-style:italic;font-family:Georgia,serif}
.progresswrap{min-width:220px}
.progresslabel{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;display:flex;justify-content:space-between}
.progressbar{height:7px;background:var(--panel2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.progressbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#f0c470)}
.layout{display:grid;grid-template-columns:290px 1fr;min-height:calc(100vh - 78px)}
.side{border-right:1px solid var(--line);padding:16px;overflow-y:auto;max-height:calc(100vh - 78px)}
.navbtns{display:flex;flex-direction:column;gap:5px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.navbtn{padding:9px 12px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--dim);
  cursor:pointer;display:flex;align-items:center;gap:8px;border:1px solid transparent}
.navbtn:hover{background:var(--panel2);color:var(--ink)}
.navbtn.active{background:var(--panel2);color:var(--accent);border-color:var(--line)}
.navbtn .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.semhead{display:flex;justify-content:space-between;align-items:baseline;font-size:10.5px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:800;
  margin:16px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.semhead:first-of-type{margin-top:0}
.semhead-pct{color:var(--dim);letter-spacing:0;font-weight:600;font-size:10.5px;text-transform:none}
.module{margin-bottom:6px;border-radius:8px;overflow:hidden}
.modhead{padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
.modhead:hover{border-color:var(--accent)}
.modhead .mtitle{font-weight:800;font-size:13.5px;font-family:Georgia,'Times New Roman',serif}
.modhead .mweek{font-size:10.5px;color:var(--dim);margin-top:2px}
.modhead .mpct{font-size:11px;color:var(--accent);font-weight:600;white-space:nowrap}
.lessons{padding:4px 0 8px 8px}
.lessons.hidden{display:none}
.lesson-item{padding:10px 10px 10px 14px;font-size:12.5px;color:var(--dim);cursor:pointer;
  border-left:2px solid var(--line);display:flex;align-items:center;gap:7px;border-radius:0 6px 6px 0;min-height:40px}
.lesson-item:hover{color:var(--ink);background:var(--panel2)}
.lesson-item.active{color:var(--ink);background:var(--panel2);border-left-color:var(--accent);font-weight:600}
.lesson-item .chk{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:9px}
.lesson-item .chk.done{background:var(--good);border-color:var(--good);color:#0e1a12}
.lesson-item.quiz .chk{border-style:dashed}
main{padding:28px 40px;max-width:800px;overflow-y:auto;max-height:calc(100vh - 78px);counter-reset:fig}
.runninghead{display:flex;justify-content:space-between;gap:16px;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:18px;font-weight:700;
  flex-wrap:wrap;row-gap:4px}
.runninghead span{min-width:0}
.runninghead b{color:var(--accent);font-weight:800;overflow-wrap:break-word}
.crumb{font-size:11.5px;color:var(--bad);text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px;font-weight:800}
h2.ltitle{margin:0 0 18px;font-size:29px;line-height:1.15;letter-spacing:-.01em;font-weight:800;
  font-family:Georgia,'Times New Roman',serif}
.lbody p{margin:0 0 13px}
.lbody ul{margin:0 0 13px;padding-left:20px}
.lbody li{margin-bottom:6px}
.lbody strong{color:var(--accent);font-weight:600}
.lbody>p:first-of-type::first-letter{float:left;font-family:Georgia,'Times New Roman',serif;font-weight:800;
  font-size:52px;line-height:.8;padding:5px 8px 0 0;color:var(--accent)}
.callout{background:transparent;border:none;border-top:3px double var(--line);border-bottom:3px double var(--line);
  border-radius:0;padding:18px 4px;margin:28px 0;font-size:18px;line-height:1.5;color:var(--ink);
  font-family:Georgia,'Times New Roman',serif;font-style:italic}
.callout .clabel{color:var(--bad);font-weight:800;font-size:10px;text-transform:uppercase;letter-spacing:.16em;
  margin-bottom:9px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-style:normal}
.tip{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);
  border-radius:2px;padding:14px 17px;margin:20px 0;font-size:13px}
.tip .clabel{color:var(--accent);font-weight:800;font-size:10px;text-transform:uppercase;letter-spacing:.14em;margin-bottom:6px}
.keyfact{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:3px;
  padding:1px 7px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.93em}
.keyfact[data-ref]{cursor:pointer;border-bottom:1px dotted var(--accent)}
.keyfact[data-ref]:hover{border-color:var(--accent);color:var(--accent)}
.cfrcite{cursor:pointer;color:var(--blue);font-weight:700;font-size:.78em;vertical-align:super;
  margin-left:1px;text-decoration:none;border-bottom:none}
.cfrcite:hover{text-decoration:underline}
.diagram{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:2px;
  padding:20px 18px 16px;margin:24px 0;text-align:center;counter-increment:fig}
.diagram::before{content:"Fig. " counter(fig);display:block;text-align:left;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent);font-weight:800;margin-bottom:12px}
.diagram svg{max-width:100%;height:auto;display:block;margin:0 auto}
.diagram .dcap{font-size:11.5px;color:var(--dim);margin-top:12px;text-align:left;font-style:italic;
  font-family:Georgia,'Times New Roman',serif}
.cardrow{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.card-sm{flex:1;min-width:150px;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:11px 13px;font-size:12px}
.card-sm b{display:block;color:var(--accent);font-size:12.5px;margin-bottom:3px}
.badge-row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.badge{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:11.5px;color:var(--dim)}
.badge b{color:var(--ink)}
.flowrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0}
.flowbox{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 13px;font-size:12px;flex:1;min-width:160px}
.flowarrow{color:var(--dim);font-size:16px}
.attitude-grid{display:grid;grid-template-columns:1fr;gap:8px;margin:16px 0}
.attitude-card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--bad);
  border-radius:6px;padding:10px 14px;display:flex;justify-content:space-between;gap:14px;align-items:center;font-size:12.5px}
.attitude-card .aname{font-weight:700;color:var(--ink)}
.attitude-card .aanti{color:var(--good);text-align:right}
.attitude-card .aanti small{display:block;color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.05em}
.notesbox{margin-top:26px;border-top:1px solid var(--line);padding-top:18px}
.notesbox h3{margin:0 0 4px;font-size:14px}
.notesbox .qsub{color:var(--dim);font-size:12px;margin-bottom:10px}
.notesbox textarea{width:100%;min-height:80px;background:var(--panel2);border:1px solid var(--line);
  color:var(--ink);border-radius:7px;padding:10px 12px;font:inherit;font-size:13px;resize:vertical}
.notesbox textarea:focus{outline:none;border-color:var(--accent)}
.savedflag{font-size:11px;color:var(--good);margin-top:6px;opacity:0;transition:opacity .3s}
.savedflag.show{opacity:1}
.quizsec{margin-top:32px;border-top:1px solid var(--line);padding-top:22px}
.quizsec h3{margin:0 0 4px;font-size:15px}
.quizsec .qsub{color:var(--dim);font-size:12px;margin-bottom:18px}
.qitem{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:14px 16px;margin-bottom:12px}
.qitem .qtext{font-weight:600;margin-bottom:10px;font-size:13.5px}
.choice{display:flex;align-items:flex-start;gap:9px;padding:10px 9px;border-radius:6px;cursor:pointer;
  margin-bottom:4px;border:1px solid transparent;font-size:13px;min-height:44px}
.choice:hover{background:var(--panel2)}
.choice input{margin-top:3px}
.qitem.graded .choice{cursor:default}
.qitem.graded .choice:hover{background:none}
.choice.correct{border-color:var(--good);background:rgba(95,179,122,.1)}
.choice.incorrect{border-color:var(--bad);background:rgba(194,91,82,.1)}
.choice.correct span::after{content:" ✓";color:var(--good);font-weight:800}
.choice.incorrect span::after{content:" ✗";color:var(--bad);font-weight:800}
.qexp{display:none;font-size:12.5px;color:var(--dim);margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
.qitem.graded .qexp{display:block}
.qexp .verdict{font-weight:700;margin-right:5px}
.qexp .verdict.ok{color:var(--good)}
.qexp .verdict.no{color:var(--bad)}
.btnrow{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
button{background:var(--accent);color:#221a08;border:0;padding:10px 18px;border-radius:7px;
  font-weight:700;cursor:pointer;font-size:13px}
button:hover{filter:brightness(1.08)}
button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);font-weight:600}
button.ghost:hover{color:var(--ink);border-color:var(--accent);filter:none}
button:disabled{opacity:.4;cursor:not-allowed}
.score{font-size:13px;color:var(--dim)}
.score b{color:var(--ink)}
.navrow{display:flex;justify-content:space-between;margin-top:30px;padding-top:18px;border-top:1px solid var(--line)}
.navrow button{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.navrow button:hover{border-color:var(--accent)}
.home .kicker{color:var(--bad);font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;margin-bottom:6px}
.home .dek{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:15.5px;line-height:1.5;
  color:var(--dim);margin-bottom:22px}
.home .hcard{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--accent);
  border-radius:2px;padding:16px 18px;margin-bottom:12px;cursor:pointer}
.home .hcard:hover{border-color:var(--accent)}
.home .hcard h4{margin:0 0 4px;font-size:13px;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.home .hcard p{margin:0;color:var(--dim);font-size:12.5px}
.deptrow{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.deptrow .hcard{flex:1;min-width:220px;margin-bottom:0}
.sectionkicker{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--bad);
  font-weight:800;margin:30px 0 4px;border-top:1px solid var(--line);padding-top:22px}
.toclist{margin:10px 0 0}
.tocrow{display:flex;align-items:baseline;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.tocrow:hover .toctitle{color:var(--accent)}
.tocnum{font-family:Georgia,'Times New Roman',serif;font-weight:800;font-size:22px;color:var(--dim);min-width:30px}
.toctitle{font-weight:700;flex:1;font-family:Georgia,'Times New Roman',serif;font-size:16px;color:var(--ink)}
.tocmeta{font-size:11px;color:var(--dim);white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.statgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:18px 0 24px}
.stat{background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--accent);border-radius:2px;padding:14px}
.stat .n{font-size:24px;font-weight:700;color:var(--accent);font-family:Georgia,serif}
.stat .l{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.done-banner{background:rgba(95,179,122,.1);border:1px solid var(--good);border-radius:8px;
  padding:12px 15px;margin:18px 0;font-size:13px;color:var(--good);font-weight:600}
.searchbar{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.searchbar input[type=text]{flex:1;min-width:200px;background:var(--panel2);border:1px solid var(--line);
  color:var(--ink);padding:9px 12px;border-radius:7px;font:inherit;font-size:13px}
.searchbar input[type=text]:focus{outline:none;border-color:var(--accent)}
.searchbar label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);white-space:nowrap;cursor:pointer}
.refsec{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:2px;
  padding:18px 22px;margin-bottom:18px}
.refsec h3{margin:0 0 10px;font-size:14px;color:var(--ink);text-transform:uppercase;letter-spacing:.08em;
  font-family:Georgia,'Times New Roman',serif;font-weight:800;border-bottom:1px solid var(--line);padding-bottom:9px}
.refsec table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12.5px}
.refsec td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.refsec td:first-child{color:var(--dim);white-space:nowrap;width:40%}
.refsec td:last-child{color:var(--ink);font-weight:600}
.refempty{color:var(--dim);text-align:center;padding:30px;font-size:13px}
.reviewcard{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--accent);
  border-radius:2px;padding:16px 18px;margin-bottom:14px}
.reviewcard h4{margin:0 0 2px;font-size:15px;color:var(--ink);cursor:pointer;
  font-family:Georgia,'Times New Roman',serif;font-weight:800}
.reviewcard h4:hover{color:var(--accent)}
.reviewcard h4:hover{text-decoration:underline}
.reviewcard .rmeta{font-size:11px;color:var(--dim);margin-bottom:10px}
.reviewq{border-top:1px dashed var(--line);padding:9px 0;font-size:12.5px}
.reviewq .rqtext{font-weight:600;margin-bottom:4px}
.reviewq .ryour{color:var(--bad)}
.reviewq .ryour.ok{color:var(--good)}
.reviewq .rcorrect{color:var(--good)}
.reviewq .rexp{color:var(--dim);margin-top:4px}
.rnote{background:var(--panel2);border-radius:6px;padding:9px 11px;font-size:12.5px;color:var(--ink);white-space:pre-wrap;margin-top:6px}
.empty{color:var(--dim);text-align:center;padding:56px 20px;font-size:13.5px;line-height:1.7}
.flash{animation:flashfx 1.2s ease}
@keyframes flashfx{0%{box-shadow:0 0 0 2px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
::-webkit-scrollbar{width:9px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
.pmodal-overlay{position:fixed;inset:0;background:rgba(10,8,6,.75);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:24px}
.pmodal{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--accent);
  border-radius:4px;max-width:640px;width:100%;padding:26px 28px;max-height:86vh;overflow-y:auto;
  box-shadow:0 24px 70px rgba(0,0,0,.55);position:relative}
.pmodal-close{position:absolute;top:14px;right:16px;cursor:pointer;color:var(--dim);font-size:20px;
  line-height:1;padding:4px 8px;border-radius:6px;background:none;border:none}
.pmodal-close:hover{color:var(--ink);background:var(--panel2)}
.pmodal-close:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pmodal .pmkicker{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--bad);
  font-weight:800;margin-bottom:8px}
.pmodal .pmtitle{font-family:Georgia,'Times New Roman',serif;font-weight:800;font-size:21px;
  margin:0 0 16px;padding-right:24px;line-height:1.35}
.pmodal .pmfoot{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}
.pmodal .pmskip{background:none;border:none;color:var(--dim);font-size:12px;cursor:pointer;
  text-decoration:underline;padding:8px 4px}
.pmodal .pmskip:hover{color:var(--ink)}
.pmstat{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--blue);
  border-radius:2px;padding:16px 20px;margin-bottom:16px;display:flex;justify-content:space-between;
  align-items:center;flex-wrap:wrap;gap:12px}
.pmstat .pmstatn{display:flex;gap:22px;flex-wrap:wrap}
.pmstat .pmstatn div{text-align:left}
.pmstat .pmstatn .n{font-size:22px;font-weight:800;color:var(--ink);font-family:Georgia,serif}
.pmstat .pmstatn .l{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.pmpracticebtn{background:var(--blue);color:#0e1a26;border:none;border-radius:6px;padding:9px 16px;
  font-weight:700;font-size:12.5px;cursor:pointer}
.pmpracticebtn:hover{filter:brightness(1.08)}
.pmsection-label{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);
  font-weight:800;margin:0 0 10px}
.folderbtn{font-size:11px;padding:7px 12px;white-space:nowrap}
.folderbtn.connected{color:var(--good);border-color:var(--good)}
.folderbtn.needs-attn{color:var(--warn);border-color:var(--warn)}
.fsa-note{font-size:12.5px;color:var(--dim);line-height:1.6;margin-bottom:14px}
.fsa-path{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:2px 7px;
  font-family:Georgia,serif;font-style:italic;color:var(--ink)}
.pacecard{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--blue);
  border-radius:2px;padding:14px 17px;margin:20px 0;font-size:13px}
.pacecard .clabel{color:var(--blue);font-weight:800;font-size:10px;text-transform:uppercase;letter-spacing:.14em;margin-bottom:6px}
@media (max-width:860px){
  .layout{display:block}
  .side{border-right:none;border-bottom:1px solid var(--line);max-height:none;
    position:sticky;top:0;background:var(--bg);z-index:5;overflow-y:visible}
  .lessons{max-height:340px;overflow-y:auto}
  main{padding:20px;max-width:none;max-height:none}
  header{padding:16px 18px 14px}
  header h1{font-size:20px}
  .statgrid{grid-template-columns:1fr 1fr}
  .deptrow{flex-direction:column}
  .hcard{width:100%}
}
@media (max-width:480px){
  .navbtn,.modhead,.lesson-item{min-height:44px}
  h2.ltitle{font-size:23px}
}
</style>
</head>
<body>

<header>
  <div>
    <div class="kicker">Field Manual &middot; No. 1 &middot; First-Time Certification</div>
    <h1>Part 107 Ground School</h1>
  </div>
  <div class="progresswrap">
    <div class="progresslabel"><span>Course progress</span><span id="pctlabel">0%</span></div>
    <div class="progressbar"><i id="pctfill" style="width:0%"></i></div>
  </div>
  <button class="ghost folderbtn" id="folderStatusBtn" type="button">&#128193; Checking save location&hellip;</button>
</header>

<div class="layout">
  <nav class="side" id="side"></nav>
  <main id="main"></main>
</div>

<script>
/* ---------------------------------------------------------------
   REUSABLE DIAGRAMS (plain inline SVG, theme-colored, no external
   image dependency — this app has to work as a single offline file)
--------------------------------------------------------------- */
const SVG_CLOUD = `<svg viewBox="0 0 480 240">

const SEMESTER2_MODULES = [
{

  lessons:[
    {id:"m1l1", title:"What Counts as a Small UAS", content:`
      <p>Start with the definition, because everything else in Part 107 hangs off it. A <strong>small unmanned aircraft system (sUAS)</strong> is an unmanned aircraft weighing less than <span class="keyfact" data-ref="ref-weight">55 lbs</span> at takeoff &mdash; and that weight includes everything attached to it: payload, camera, spare battery taped to the frame, all of it.<span class="cfrcite" data-ref="ref-citations">§107.3</span> Go over 55 lbs and you're out of Part 107 entirely.</p>
      <p>Part 107 governs <strong>civil, non-recreational</strong> operation of small UAS: real estate photography, inspections, mapping, agriculture, public safety support that isn't done under a government COA, and so on.<span class="cfrcite" data-ref="ref-citations">§107.1</span> It does not cover hobby flying done purely for fun &mdash; that falls under the separate recreational exception (Section 44809), with its own test (TRUST, not this one).</p>
      <p>One frequently tested nuance: the certificated <strong>remote pilot in command (PIC)</strong> doesn't have to be the one with their thumbs on the sticks. An uncertificated person may manipulate the controls as long as a certificated remote PIC is directly supervising, capable of taking over at any moment, and accepts responsibility for the flight.<span class="cfrcite" data-ref="ref-citations">§107.12</span></p>
      <div class="callout"><div class="clabel">Ask yourself</div>Why might the FAA care more about who's <em>responsible</em> for a flight than who's physically holding the controller?</div>
    `,

      {id:"m1l1_q1", q:"What is the maximum weight for an aircraft to qualify as a small UAS under Part 107?",

      {id:"m1l1_q4", q:"An unmanned aircraft weighs 60 lbs fully loaded at takeoff. What does this mean for Part 107?", choices:["It's still covered, just needs a waiver", "It falls outside Part 107 entirely because it exceeds the 55 lb sUAS threshold", "It automatically qualifies as Category 4", "It only needs Remote ID compliance, nothing else changes"], a:1, exp:"Part 107 only governs aircraft under 55 lbs at takeoff \u2014 go over that and the aircraft is out of Part 107 altogether, not just subject to extra rules."},
      {id:"m1l1_q5", q:"A hobbyist flies a drone purely for personal enjoyment at a community field. Which framework and knowledge test apply?", choices:["Part 107, and this same knowledge test applies", "Part 89 exclusively, with no test required", "The recreational flyer exception under Section 44809, tested via TRUST rather than this exam", "There is no regulatory framework for hobby flying"], a:2, exp:"Recreational-only flying falls under 44809, not Part 107, and uses the separate TRUST test rather than the Part 107 knowledge exam."},
      {id:"m1l1_q6", q:"A fire department flies a drone to photograph evidence at a structure fire, not operating under a government COA. How is this flight classified?", choices:["Recreational, since it's flown by a government agency", "Exempt from all federal drone regulation", "Automatically a Category 4 operation requiring an airworthiness certificate", "A Part 107 civil operation, since it's non-recreational and not conducted under a government COA"], a:3, exp:"Public safety work that isn't done under a COA is treated as a civil operation and falls under Part 107, same as any other non-recreational flight."}]},
    {id:"m1l2", title:"Registration & Marking", content:`
      <p>Every aircraft you intend to fly under Part 107 must be registered individually through <strong>FAADroneZone</strong>, regardless of its weight.<span class="cfrcite" data-ref="ref-citations">§48.15</span> This is a real point of contrast with recreational flyers, who register once and that single number covers every aircraft they own. Under Part 107, one number per aircraft.</p>
      <p>Registration currently costs <span class="keyfact" data-ref="ref-reg">$5</span> per aircraft and is valid for <span class="keyfact" data-ref="ref-reg">3 years</span>. The registration number must be marked on the aircraft somewhere it's accessible without tools — you can't bury it under a battery pack you'd need a screwdriver to remove.<span class="cfrcite" data-ref="ref-citations">§48.205</span></p>
      <p>You must also carry proof of registration (physical or digital) and your remote pilot certificate whenever you fly, and present them to the FAA, NTSB, or law enforcement on request.</p>
      <div class="tip"><div class="clabel">Test tip</div>If a question describes someone flying several drones commercially under one registration number, that's the giveaway it's wrong — Part 107 registration is per-aircraft.</div>
    `,

      {id:"m1l2_q5", q:"Under Part 107, does an aircraft's weight exempt it from individual registration?", choices:["Yes \u2014 aircraft under 0.55 lb are exempt from individual registration", "No \u2014 every Part 107 aircraft must be individually registered regardless of weight", "Only aircraft over 55 lbs require registration", "Weight determines how long the registration stays valid"], a:1, exp:"Part 107 registration applies per aircraft no matter how light it is \u2014 there's no small-aircraft exemption like recreational flyers get."},
      {id:"m1l2_q6", q:"What must a Part 107 remote pilot carry while flying and be ready to present to the FAA, NTSB, or law enforcement on request?", choices:["The aircraft's original sales receipt", "A copy of the Part 107 regulation text", "Proof of registration and the remote pilot certificate", "Nothing needs to be carried once registered"], a:2, exp:"Proof of registration (physical or digital) and the remote pilot certificate must be carried and presented on request."}]},
    {id:"m1l3", title:"Remote ID", content:`
      <p>Remote ID is essentially a <strong>digital license plate</strong> broadcast over radio while your drone is in the air, giving location, altitude, and identifying info to anyone nearby with a receiver &mdash; including the FAA and law enforcement.<span class="cfrcite" data-ref="ref-citations">§89.105</span> Enforcement is active nationwide.</p>
      <p>You have three ways to comply:</p>
      <div class="cardrow">
        <div class="card-sm"><b>Standard Remote ID</b>Built-in broadcast capability, no add-on needed.<span class="cfrcite" data-ref="ref-citations">§89.110</span></div>
        <div class="card-sm"><b>Broadcast module</b>Add-on for older aircraft — restricted to VLOS, ineligible for future BVLOS work.</div>
        <div class="card-sm"><b>FRIA</b>Fly only inside an FAA-Recognized Identification Area — no Remote ID needed there.<span class="cfrcite" data-ref="ref-citations">§89.115(b)</span></div>
      </div>
      <p>Operating a non-compliant drone outside a FRIA can mean fines and put your certificate at risk.</p>
      <div class="callout"><div class="clabel">Why it matters</div>Remote ID exists for the same reason license plates do: accountability without needing to stop every driver (or drone) to ask who they are.</div>
    `,

      {id:"m1l3_q2", q:"What operational restriction applies to a drone using a Remote ID broadcast module rather than built-in Standard Remote ID?",

      {id:"m1l3_q4", q:"What does flying inside a FAA-Recognized Identification Area (FRIA) let a pilot do regarding Remote ID?", choices:["Fly without Remote ID broadcast equipment", "Skip aircraft registration entirely", "Fly BVLOS without any waiver", "Ignore the careless-or-reckless rule"], a:0, exp:"A FRIA is the one place Remote ID broadcast isn't required at all \u2014 the third of the three compliance paths."}]},
    {id:"m1l4", title:"Core Operating Rules", content:`
      <p>A handful of rules apply to essentially every Part 107 flight:</p>
      <ul>
        <li>Operate only <strong>one</strong> unmanned aircraft at a time (without a waiver).<span class="cfrcite" data-ref="ref-citations">§107.35</span></li>
        <li>Maintain <strong>visual line of sight</strong> &mdash; you or a visual observer must be able to see the aircraft unaided (corrective lenses are fine) throughout the flight.<span class="cfrcite" data-ref="ref-citations">§107.31</span></li>
        <li>Give way to all manned aircraft &mdash; drones never have right-of-way.<span class="cfrcite" data-ref="ref-citations">§107.37</span></li>
        <li>Never operate in a <strong>careless or reckless</strong> manner endangering life or property.<span class="cfrcite" data-ref="ref-citations">§107.23</span></li>
        <li>No operations from a moving vehicle unless in a sparsely populated area and the UA isn't carrying hazardous material.<span class="cfrcite" data-ref="ref-citations">§107.25</span></li>
      </ul>
      <div class="diagram">${SVG_YIELD}<div class="dcap">Right-of-way in a nutshell: the small UA is the one that moves.</div></div>
      <div class="tip"><div class="clabel">Case Study</div>In September 2021, in Wesley Chapel, Florida, a drone operator flew close enough to a Pasco County Sheriff's Office helicopter &mdash; searching at night for a burglary suspect &mdash; that the pilot had to break off the search to avoid a midair collision. No single rule caused this. The operator had no Remote Pilot Certificate, the drone was unregistered and unlit, and it was flying above the 400-foot ceiling after dark &mdash; four separate, unrelated basics, all skipped at once, on the same flight. The FAA proposed a $32,700 civil penalty. It wasn't one broken rule that turned a bad decision into a near-miss with a real aircraft doing real police work; it was all of them stacked together.</div>
      <p>Controlled airspace (Class B, C, D, and the surface area of Class E) requires prior authorization &mdash; typically via <strong>LAANC</strong> (near-instant) or a manual FAADroneZone request.<span class="cfrcite" data-ref="ref-citations">§107.41</span> Class G is uncontrolled: no authorization needed, though every other operating rule still applies.</p>
      <div class="tip"><div class="clabel">Test tip</div>"Right-of-way" questions almost always resolve the same way on this test: the drone yields, every time, to every manned aircraft.</div>
    `,
    quiz:[

      {id:"m1l4_q6", q:"Operating a UA from a moving vehicle is permitted under Part 107 only when:", choices:["The area is sparsely populated and the aircraft isn't carrying hazardous material", "The vehicle is government-owned", "The vehicle's speed stays under 25 mph", "It's never allowed, regardless of conditions"], a:0, exp:"Moving-vehicle operations are allowed only in a sparsely populated area, and only if the UA isn't carrying hazardous material."},

      {id:"m1l4_q8", q:"What civil penalty did the FAA propose in the Wesley Chapel, Florida case?", choices:["No penalty was ultimately proposed", "$32,700", "$5,000", "$100,000"], a:1, exp:"The FAA proposed a $32,700 civil penalty after the operator stacked four separate violations on one flight."}]},
    {id:"m1l5", title:"Altitude, Speed, Visibility & Operating Categories", content:`
      <p>The default numeric limits, cold:</p>
      <ul>
        <li>Maximum altitude: <span class="keyfact" data-ref="ref-limits">400 ft AGL</span> (or within 400 ft of a structure, if staying within 400 ft laterally of it).<span class="cfrcite" data-ref="ref-citations">§107.51</span></li>
        <li>Maximum groundspeed: <span class="keyfact" data-ref="ref-limits">100 mph</span> (87 knots).</li>
        <li>Minimum visibility: <span class="keyfact" data-ref="ref-limits">3 statute miles</span> from the control station.</li>
        <li>Cloud clearance: <span class="keyfact" data-ref="ref-limits">500&prime; below</span>, <span class="keyfact" data-ref="ref-limits">1,000&prime; above</span>, <span class="keyfact" data-ref="ref-limits">2,000&prime; horizontal</span>.</li>
      </ul>
      <div class="diagram">${SVG_CLOUD}<div class="dcap">Cloud clearance minimums — note how a low cloud base can cap your altitude well under 400 ft.</div></div>
      <p>Notice cloud clearance can quietly lower your ceiling: if clouds sit at 900 ft AGL, staying 500 ft below them caps you at 400 ft anyway &mdash; but if they're at 700 ft, you're capped at 200 ft, well under the nominal 400.</p>
      <p><strong>Operations over people</strong> are sorted into four risk-based categories rather than a blanket waiver requirement. The one weight number worth memorizing: <span class="keyfact" data-ref="ref-weight">Category 1</span> covers aircraft at or under <span class="keyfact" data-ref="ref-weight">0.55 lb (250 g)</span> at takeoff with no exposed rotating parts that would lacerate skin &mdash; these may fly over people and moving vehicles without a waiver.<span class="cfrcite" data-ref="ref-citations">§107.110</span> Categories 2 and 3 cover heavier aircraft meeting FAA-accepted injury-severity and design requirements, with tighter restrictions on sustained flight over open-air assemblies of people.<span class="cfrcite" data-ref="ref-citations">§107.120</span><span class="cfrcite" data-ref="ref-citations">§107.130</span> Category 4 requires an airworthiness certificate.<span class="cfrcite" data-ref="ref-citations">§107.140</span></p>
      <div class="callout"><div class="clabel">Ask yourself</div>Why would the FAA anchor Category 1 to a weight tied to kinetic-energy-on-impact rather than to drone price or popularity?</div>
    `,
    quiz:[
      {id:"m1l5_q1", q:"What is the default maximum altitude for Part 107 operations?",
       choices:["200 ft AGL","400 ft AGL","500 ft AGL","1,000 ft AGL"],

      {id:"m1l5_q6", q:"What exception exists to the 400 ft altitude ceiling?", choices:["There is no exception \u2014 400 ft is an absolute ceiling everywhere", "The exception only applies to structures taller than 1,000 ft", "You may exceed 400 ft AGL if you stay within 400 ft laterally of a structure", "The exception doubles the ceiling to 800 ft anywhere"], a:2, exp:"Near a structure, you may fly higher than 400 ft AGL as long as you remain within 400 ft laterally of it."},
      {id:"m1l5_q7", q:"How do Categories 2 and 3 for operations over people differ from Category 1?", choices:["They cover heavier aircraft meeting FAA-accepted injury-severity and design requirements, with tighter limits on sustained flight over open-air assemblies", "They require no injury or design standards at all", "They apply only to aircraft under 0.55 lb", "They eliminate the need for any operating rules over people"], a:0, exp:"Categories 2 and 3 allow heavier aircraft over people if they meet FAA-accepted injury-severity and design standards, with added restrictions on sustained flight over crowds."},
      {id:"m1l5_q8", q:"What does Category 4 for operations over people require that Categories 1\u20133 do not?", choices:["A LAANC authorization", "A Remote ID broadcast module", "Registration through FAADroneZone", "An airworthiness certificate"], a:3, exp:"Category 4 requires an FAA airworthiness certificate, unlike Categories 1\u20133."}]},
    {id:"m1l6", title:"Waivers & Authorizations", content:`
      <p>Most of Part 107's operating rules (Subpart B/D limitations — altitude, one-aircraft-at-a-time, visual line of sight, operations over people beyond the categorical framework, and more) can be <strong>waived</strong> if you show the FAA your proposed operation can be conducted safely despite not meeting the rule as written.<span class="cfrcite" data-ref="ref-citations">§107.205</span> Waivers are requested through FAADroneZone and are operation-specific, not blanket permissions.<span class="cfrcite" data-ref="ref-citations">§107.200</span></p>
      <p>This is distinct from <strong>airspace authorization</strong> (LAANC or manual), which grants permission to operate in controlled airspace but doesn't waive any operating rule.<span class="cfrcite" data-ref="ref-citations">§107.41</span></p>
      <p>Some rules cannot be waived at all &mdash; the core "don't be careless or reckless" prohibition<span class="cfrcite" data-ref="ref-citations">§107.23</span> and the drug/alcohol rule<span class="cfrcite" data-ref="ref-citations">§107.27</span> among them.</p>
    `,
    quiz:[
      {id:"m1l6_q1", q:"What's the difference between an airspace authorization and a Part 107 waiver?",
       choices:["They're the same thing","Authorization grants permission to fly in controlled airspace; a waiver excuses you from a specific operating rule you otherwise couldn't meet","A waiver is only for recreational flyers","Authorization is only needed at night"],
       a:1, exp:"Authorization = permission to be in that airspace. Waiver = permission to depart from a specific operating rule (e.g., fly above 400 ft) for a specific operation."},
      {id:"m1l6_q2", q:"Which of the following can NOT be waived under Part 107?",

      {id:"m1l6_q4", q:"Besides the careless-or-reckless prohibition, which other Part 107 rule can never be waived?", choices:["The drug and alcohol rule (\u00a7107.27)", "The 400 ft altitude limit", "The one-aircraft-at-a-time rule", "The visual-line-of-sight requirement"], a:0, exp:"The drug/alcohol rule, like the careless-or-reckless prohibition, cannot be waived under any circumstance."}]}
