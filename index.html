      {id:"b4l2_q5", q:"What is the fixed baud rate that CRSF (ExpressLRS, TBS Crossfire) runs at, configuring automatically once selected as the receiver protocol?", choices:["9,600", "115,200", "921,600", "420,000"], a:3, exp:"CRSF runs at a fixed 420,000 baud and configures automatically once selected on the Configuration tab."},
      {id:"b4l2_q6", q:"What's true about SBUS that isn't true of CRSF, relevant to which UART you use?", choices:["SBUS is an inverted signal, and some F4 boards need a specific UART with hardware inversion support, while F7+ boards handle inversion on any UART", "SBUS requires no UART configuration at all", "SBUS only works with digital goggles", "SBUS automatically configures its own baud rate like CRSF"], a:0, exp:"SBUS's inverted signal means some F4 boards require a specific hardware-inversion-capable UART, while F7 and newer boards handle it on any UART."},
      {id:"b4l2_q7", q:"Why does this lesson recommend a dedicated ARM switch on an AUX channel rather than arming via a stick gesture alone?", choices:["Stick gestures are not supported by any Betaflight version", "AUX channels are required for CRSF to function", "A dedicated switch is safer and more deliberate than relying on a stick gesture alone", "Stick-gesture arming disables Angle mode"], a:2, exp:"The lesson explicitly favors a dedicated ARM switch as safer and more deliberate than leaving arming to a stick gesture."},
      {id:"b4l2_q8", q:"How does Horizon mode's self-leveling differ from Angle mode's?", choices:["Horizon has no self-leveling at all, identical to Acro", "Horizon self-levels only near center stick but allows full rotation at full stick deflection", "Horizon self-levels more aggressively than Angle at every stick position", "Horizon disables yaw control entirely"], a:1, exp:"Horizon behaves like Angle near center stick but permits full rotation at full deflection, unlike Angle's consistent self-leveling."}]},
    {id:"b4l2s", title:"Sim Lab: Correct Flight Feel & Emergency Maneuvers, Before You Tune", content:`
      <p>Before you touch a single PID value, you need to know what you're tuning <em>toward</em>. Reading that P too high sounds like a buzz and too little D lets the quad overshoot is one thing &mdash; recognizing it while a real aircraft is in the air is another, and you can't recognize a deviation from "correct" if you've never actually felt what correct feels like. This lab exists to build that felt baseline in a simulator, at zero risk, before the tuning lesson that follows it.</p>
      <p><strong>Step 1 &mdash; Set up the sim to match your real setup.</strong> Plug your actual transmitter into the simulator by USB (or its bundled dongle receiver) rather than using a keyboard or a generic gamepad &mdash; the whole point is that your hands learn the real sticks, not a different set of controls. If the simulator lets you pick a craft type, choose something close to your real build's size and class. Any Betaflight-compatible simulator works for this lab; <strong>FPV.SkyDive</strong> (free on Steam) is one solid, genuinely free option, covered in more depth later in this course's FPV module if you want a deeper practice progression than this single lab covers.</p>
      <div class="tip"><div class="clabel">Workshop Tip</div>Many transmitters won't be recognized as a game controller until you switch them into <strong>USB joystick/HID mode</strong> in the radio's own system menu &mdash; plugging in over USB alone often isn't enough. Check your transmitter's manual for this setting before assuming the simulator or the cable is at fault. If your transmitter has no USB port at all, an external USB joystick adapter that reads its trainer port is the usual workaround.</div>
      <p><strong>Step 2 &mdash; Fly in the mode you just configured.</strong> B4L2 just had you set up Angle mode on your transmitter &mdash; use that same switch position here. You're not learning a new skill in this lab, you're feeling out the one you just wired up.</p>
      <p><strong>Step 3 &mdash; The drill.</strong> Hold a steady hover for 60 seconds without drifting more than a few feet in any direction. Once that's comfortable, add small, deliberate moves &mdash; forward, back, left, right &mdash; returning to a stable hover after each one before starting the next.</p>
      <p><strong>Step 4 &mdash; Notice what "correct" actually feels like.</strong> A well-behaved response is smooth and proportional: small stick input produces small, controlled movement, and releasing the stick lets the aircraft settle without overshooting past level or oscillating back and forth. That feeling &mdash; not a number on a PID tab &mdash; is the reference point the next lesson is built around. When you start adjusting P, I, and D on a real aircraft, you'll be comparing what you feel against this baseline, not guessing blind.</p>
      <div class="callout"><div class="clabel">Why It Matters</div>PID tuning is fundamentally a comparison: is this response better or worse than before? Without a concrete, already-felt sense of what "better" actually feels like, every tuning change is a guess dressed up as a decision.</div>
      <div class="tip"><div class="clabel">Hands-On</div>Run the Step 3 drill for at least two separate sessions before moving on to tuning. On the second session, try to name out loud what you're feeling &mdash; "that felt sluggish," "that overshot a little" &mdash; before you ever see a real PID tab. You're building vocabulary for a feeling, and that only works with repetition.</div>
      <p><strong>Beyond tuning prep: drill the maneuvers that keep a bad moment from becoming a crashed aircraft or someone else's damaged property.</strong> A tuning problem costs you a rebuild. A panicked reaction to a real emergency can cost a fence, a windshield, or worse &mdash; and panic is exactly what happens when a maneuver has only ever been read about, never actually run. The sim is where these become reflex, at zero cost per attempt, before you ever need one for real at a field trip.</p>
      <p><strong>Step 5 &mdash; Run these four safety maneuvers, every session, in order:</strong></p>
      <ul>
        <li><strong>Kill-switch drill.</strong> This is the same <strong>ARM</strong> switch you assigned back in B4L2 &mdash; "kill switch" is just what you call that switch in the moment you're using it to get out of trouble, not a separate piece of hardware. In a steady hover, trigger it without warning yourself first. Pass: motors cut immediately, no hesitation finding the switch. This is the fastest way to turn "about to hit something" into "dropped in place" &mdash; but only if your hand finds the switch without looking for it.</li>
        <li><strong>Failsafe response drill.</strong> If your simulator can trigger a simulated lost link, use it; otherwise unplug the transmitter's USB connection mid-flight (safe in sim &mdash; never do this as a "test" on a real aircraft outside a deliberate ground test with props off). Watch Stage 1 hold, then Stage 2 execute, the same behavior B4L5 will have you configure for real. Pass: you recognize what's happening within a second or two, not several.</li>
        <li><strong>Loss-of-orientation recovery.</strong> Start this one in the Angle mode you've already been flying, not Acro &mdash; spin the aircraft in place or fly a few unfamiliar turns until you genuinely lose track of which way the nose is pointing. Angle mode's self-leveling means letting go of the stick keeps the aircraft upright while you work out your bearings, so the skill being drilled is regaining orientation, not fighting to stay level. Pass: you can say out loud which way the aircraft is actually facing within about two seconds of losing track. Once that's easy and you've built some comfort flying acro elsewhere in this course (BFPVL3 covers that progression), it's worth deliberately repeating this same drill in Acro, where there's no self-leveling safety net &mdash; a genuinely harder version worth returning to later, not something to force before you're ready.</li>
        <li><strong>Unscripted emergency landing.</strong> Have a partner call "land now" at a random, unannounced moment (or set a phone timer to buzz at an interval you don't know in advance, if practicing alone). Bring the aircraft down clear of anything you wouldn't want to hit, in whatever controlled attitude gets you there fastest. Pass: down and stopped within a few seconds, nowhere near where a real fence, car, or person would actually be standing.</li>
      </ul>
      <div class="callout"><div class="clabel">Why It Matters</div>A maneuver you've only read about is not one your hands can execute under real stress. These drills exist so the first time you actually need one, it's already reflex &mdash; not a decision you're making for the first time with a real aircraft in the air and someone's property in front of you.</div>
      <div class="tip"><div class="clabel">Hands-On</div>Run all four drills, in order, every sim session between now and your next field trip &mdash; not just once. The Field Trip Kit's go/no-go check assumes these are already muscle memory, not a skill you're learning live at the field.</div>
    `,
    quiz:[
      {id:"b4l2s_q1", q:"What is the main reason this lab happens in a simulator before the PID tuning lesson, rather than after it?",
       choices:["Simulators are required by the FAA before real flights","Recognizing whether a tuning change made things better or worse requires already knowing what correct flight feels like — this lab builds that reference point at zero risk before real tuning starts","Simulators tune PID values automatically","It has no bearing on the order — it's just a scheduling preference"],
       a:1, exp:"PID tuning is a before/after comparison. Without a concrete, already-felt baseline for what correct response feels like, a tuning change is a guess rather than an evaluated decision."},
      {id:"b4l2s_q2", q:"Why does this lab specifically recommend plugging your real transmitter into the simulator, rather than using a keyboard or generic gamepad?",
       choices:["Keyboards are technically incompatible with all simulators","So the muscle memory being built transfers directly to the actual aircraft, since the physical sticks are the same ones you'll fly with","Transmitters are required for the simulator software to run at all","It makes no practical difference which input device is used"],
       a:1, exp:"The goal is transferable stick-to-motion muscle memory — that only works if the hands are learning the same physical sticks that will fly the real aircraft."},
      {id:"b4l2s_q3", q:"What does a well-behaved, 'correct' flight response actually feel like, per this lesson?",
       choices:["Instant, maximum-rate rotation regardless of stick position","Small stick input producing small, controlled movement, with the aircraft settling smoothly rather than overshooting or oscillating when the stick is released","Continuous drift that requires constant correction","Identical behavior regardless of which flight mode is active"],
       a:1, exp:"Smooth, proportional response with clean settling — no overshoot, no oscillation — is the felt baseline this lab is built to establish."},
      {id:"b4l2s_q4", q:"Why should the kill-switch drill be practiced until it's reflexive, rather than just understood conceptually?",
       choices:["It has no real safety benefit, it's just tradition","In an actual emergency, hesitating to find the switch costs exactly the seconds that separate a controlled stop from a crash into a person or property","The kill switch only functions correctly after repeated practice","It's a Part 107 knowledge-test requirement"],
       a:1, exp:"An emergency response that has to be located or thought through first is too slow to matter — the drill exists to make the reaction time near-zero."},
      {id:"b4l2s_q5", q:"Why does the emergency landing drill specifically use an unannounced 'land now' call instead of a landing you already know is coming?",
       choices:["To make the lesson take longer","A real emergency never announces itself in advance — the drill has to include the surprise itself, not just the landing technique","Scripted practice landings aren't allowed in a simulator","There's no meaningful difference between the two"],
       a:1, exp:"The point isn't just knowing how to land — it's reacting correctly to an unexpected trigger, which a pre-announced landing never actually tests."}
    ,
      {id:"b4l2s_q6", q:"What setting must many transmitters be switched into before a simulator will recognize them as a game controller?", choices:["USB joystick/HID mode in the radio's own system menu", "Telemetry broadcast mode", "Bind mode", "Failsafe test mode"], a:0, exp:"Plugging in over USB alone often isn't enough \u2014 many transmitters need to be switched into USB joystick/HID mode in their own system menu first."},
      {id:"b4l2s_q7", q:"What's the specific standard for a 'steady hover' in the Step 3 drill?", choices:["30 seconds without drifting more than a foot", "2 minutes with zero drift whatsoever", "10 seconds while performing small deliberate moves", "60 seconds without drifting more than a few feet in any direction"], a:3, exp:"The drill calls for holding a hover for 60 seconds without drifting more than a few feet in any direction before adding deliberate moves."},
      {id:"b4l2s_q8", q:"If a simulator has no built-in way to trigger a simulated lost link for the failsafe response drill, what does the lesson say to do instead?", choices:["Turn off the flight controller's power mid-flight", "Unplug the transmitter's USB connection mid-flight \u2014 safe in sim, but never as a 'test' on a real aircraft outside a deliberate ground test with props off", "Manually switch to a different flight mode", "Skip the drill entirely, since it can't be simulated"], a:1, exp:"Unplugging the transmitter's USB connection is the sim workaround the lesson recommends \u2014 explicitly flagged as unsafe to try as a real-aircraft 'test' outside a deliberate, props-off ground test."},
      {id:"b4l2s_q9", q:"Why does the loss-of-orientation recovery drill specifically start in Angle mode rather than Acro?", choices:["Acro mode is not available in most simulators", "Angle mode makes the aircraft spin faster, which is required for the drill", "Angle mode's self-leveling keeps the aircraft upright while you work out your bearings, so the skill drilled is regaining orientation rather than fighting to stay level", "Acro mode automatically corrects orientation loss on its own"], a:2, exp:"Angle's self-leveling removes the 'stay level' problem so the drill can isolate the actual skill being built: recognizing which way the aircraft is facing."},
      {id:"b4l2s_q10", q:"According to this lesson, how often should the four safety drills be run between now and the next field trip?", choices:["Once, just to confirm they can be done", "Only immediately before the very first field trip", "Only after an actual close call has occurred", "Every sim session between now and the next field trip, since the Field Trip Kit's go/no-go check assumes they're already muscle memory"], a:3, exp:"The lesson calls for running all four drills every session, not once, because the Field Trip Kit's go/no-go check assumes they're already reflexive."}]},
    {id:"b4l3", title:"PID Tuning Fundamentals", content:`
      <p>Once the quad flies at all, the next job is making it fly <em>well</em> — and that's what <strong>PID tuning</strong> is for. The sim lab you just ran (B4L2S) gave you a felt baseline for what "well" actually feels like; tuning, at its core, is the process of making the real aircraft match that feeling. Betaflight's flight controller compares where you told it to go, via stick input, against where the gyro says it actually is, many times a second, and corrects the difference. P, I, and D are three different ways of reacting to that error, and you don't need the underlying control-theory math to tune well — you need to recognize what each one looks and sounds like in the air.</p>
      <p><strong>P (Proportional)</strong> is the direct, immediate response — how hard the FC corrects right now, proportional to how far off it currently is. Too little P and the quad feels sluggish, floaty, slow to respond to stick input. Too much P and it gets twitchy, with fast, high-frequency oscillation you can often hear as a sharp buzz from the motors.</p>
      <p><strong>I (Integral)</strong> corrects for error that builds up over time rather than in the instant — it's what holds an attitude against a steady disturbance like wind, or fights the tendency to sag out of a fast corner. Too little I and the quad drifts, can't hold a locked attitude, or sags mid-maneuver. Too much I produces a slower, rolling oscillation — a bounce-back after a correction, sometimes called I-term wind-up — distinct from P's fast buzz.</p>
      <p><strong>D (Derivative)</strong> is a brake on the rate of change — it dampens overshoot by pushing back as the aircraft approaches the target attitude, so it doesn't fly past it. Too little D and stick inputs overshoot: you stop the stick and the quad keeps rotating a bit before settling. Too much D amplifies whatever noise is present in the gyro signal, which shows up as motor heat, a coarse grinding sound, and in bad cases, burnt motors from constantly fighting noise rather than real motion.</p>
      <p>Default PID values vary meaningfully by Betaflight version and airframe class — not just slightly. Roll/pitch defaults commonly fall somewhere around <span class="keyfact">P:45&ndash;50, I:45&ndash;90, D:25&ndash;45</span> depending on which version and build type you're on, and that I-term range in particular has shifted a lot across recent Betaflight releases. The actual numbers matter less than the principle: defaults exist because they fly safely on a huge range of typical builds — they're a starting point to fly cautiously on, not a target to chase back to. Check your own Configurator's PID tab for what's actually loaded on your firmware rather than trusting any single number from a course or forum post.</p>
      <p>The methodical approach: change <strong>one term, on one axis, in a small increment</strong> — roughly 5–10% at a time — then fly a short, deliberate test, the same maneuver each time, before changing anything else. A good default test maneuver: a steady hover, then one hard punch-out straight up, then back to hover — this exercises both the gentle-flight feel and the aggressive-input response in a single short flight, which matters because B4L4's filter/blackbox lesson covers tune problems that only show up under exactly that kind of hard input. Write down what you changed. If you adjust P, D, and a filter setting all before your next flight and something gets worse, you have no way to know which change caused it. And a PID change is still a firmware change: keep B3L4's caution discipline in mind before you fly it — an untested value can produce a much more aggressive or unstable response than the last one did, so test in a clear, open area with room to recover, and keep a hand ready on the arm switch you drilled as a kill switch back in B4L2S.</p>
      <div class="callout"><div class="clabel">Ask Yourself</div>If you changed three things before your last test flight and it flew worse, what exactly did you learn from that flight?</div>
      <div class="tip"><div class="clabel">Hands-On</div>Open the PID Tuning tab in Configurator now. Without changing anything, note your current P, I, and D values for roll, pitch, and yaw — this is your baseline to return to if a future change makes things worse.</div>
    `,
    quiz:[
      {id:"b4l3_q1", q:"A quad snaps into a fast, high-frequency oscillation right after aggressive stick input, audible as a buzz. Which term is the first thing to check?",
       choices:["P, likely too high","I, likely too low","Battery voltage","Receiver binding"],
       a:0, exp:"Fast, tight, input-correlated oscillation is the classic signature of P set too high."},
      {id:"b4l3_q2", q:"A quad drifts and can't hold a steady attitude in a light breeze, or sags mid-corner. Which term is most likely too low?",
       choices:["P","I","D","None — this is a filter issue"],
       a:1, exp:"I corrects error that builds up over time, like a steady wind push — too little I means the aircraft can't hold against it."},
      {id:"b4l3_q3", q:"Stick input stops but the aircraft keeps rotating briefly before settling, overshooting the intended attitude. What does this suggest?",
       choices:["D set too low","P set too low","I set too high","A dead receiver channel"],
       a:0, exp:"D dampens the approach to the target attitude — too little of it lets the aircraft overshoot before settling."},
      {id:"b4l3_q4", q:"What is the recommended approach to adjusting PID values?",
       choices:["Change several terms at once to save flight time","Change one term, on one axis, in a small increment, then test before changing anything else","Copy another pilot's exact values and never adjust them","Only ever touch D, since P and I are set correctly by default"],
       a:1, exp:"Isolating one change at a time is the only way to know which change caused which result."}
    ,
      {id:"b4l3_q5", q:"A quad shows a slower, rolling bounce-back after a correction, distinct from a fast tight buzz. What does this suggest?", choices:["I set too high, sometimes called I-term wind-up", "P set too high", "D set too low", "A loose propeller"], a:0, exp:"This slower rolling oscillation \u2014 I-term wind-up \u2014 is I's characteristic failure mode when set too high, distinct from P's fast buzz."},
      {id:"b4l3_q6", q:"What symptom does excessive D commonly produce?", choices:["A slow, floaty response to stick input", "Complete loss of self-leveling in Angle mode", "The aircraft refusing to arm", "Amplified gyro noise, showing up as motor heat, a coarse grinding sound, and in bad cases burnt motors"], a:3, exp:"Too much D amplifies whatever noise is present in the gyro signal, which shows up as heat, a grinding sound, and can burn out motors in bad cases."},
      {id:"b4l3_q7", q:"Why does this lesson recommend checking your own Configurator's PID tab rather than trusting a single default number from a course or forum post?", choices:["Because default values are randomized on every firmware boot", "Because PID tabs are only accurate immediately after flashing", "Because default values vary meaningfully by Betaflight version and airframe class, and are a cautious starting point, not a target to chase", "Because forum posts are never accurate about anything"], a:2, exp:"Defaults shift across versions and airframe classes \u2014 they're a safe starting point to fly on, not a specific number worth chasing from an outside source."},
      {id:"b4l3_q8", q:"Why does the lesson recommend a test maneuver that includes one hard punch-out, not just a gentle hover?", choices:["Punch-outs use less battery than hovering", "It exercises both the gentle-flight feel and the aggressive-input response in one flight, since some tune problems only appear under hard input", "It's required to arm the aircraft", "It calibrates the compass"], a:1, exp:"A single test maneuver covering both gentle flight and a hard punch-out catches tune problems \u2014 like the filter issue in B4L4 \u2014 that only surface under aggressive input."}]},
    {id:"b4l4", title:"Filters & Blackbox Logging", content:`
      <p>A quad's gyro doesn't just sense your stick inputs and real rotation — it also picks up mechanical noise: motor vibration, frame resonance, a slightly unbalanced propeller. <strong>Filters</strong> exist to separate that noise from the real signal before it reaches the PID loop, because feeding raw noisy gyro data into D — which amplifies rate of change — is a direct path to hot, straining motors.</p>
      <p>Betaflight layers a few filter types. The <strong>gyro lowpass filter</strong> smooths out high-frequency content above a cutoff (often somewhere in the <span class="keyfact">100–150 Hz</span> range by default) on the assumption that real flight dynamics don't happen that fast. The <strong>dynamic notch filter</strong> is smarter still — it tracks the actual noise frequencies coming off your specific motors and props in real time and carves narrow notches out around them, rather than cutting a whole broad band.</p>
      <p>Filtering is a genuine tradeoff, not a free win. Filter too aggressively and you introduce <strong>latency</strong> — a real delay between stick input and aircraft response — which pilots describe as "mushy" or "numb" flying. Filter too little and noise reaches D-term uncut, which shows up as motor heat, audible grinding or buzzing, reduced flight time from wasted current, and in extreme cases, burnt-out motors. The goal is the least filtering that keeps things clean, not the most filtering available.</p>
      <p><strong>Blackbox logging</strong> is how you stop guessing and start diagnosing. Enable it on Configurator's Blackbox tab (recording to onboard flash or a microSD card, depending on your FC), fly a short, representative flight, then retrieve the log — for onboard flash, use the "Save log" / "Erase flash" controls right on Configurator's Blackbox tab to download it to your computer; for a microSD-equipped FC, just pull the card and copy the file directly. Open it in <strong>Blackbox Explorer</strong>, a separate free desktop app (not part of Configurator itself, though Configurator's Blackbox tab links to it) to see traces of gyro data, your stick commands, the PID loop's output, and individual motor outputs, all lined up on the same timeline. A tune problem that's ambiguous from feel alone — was that a P oscillation or a filter issue? — is usually obvious once you can see the gyro trace ringing at a specific, identifiable frequency. One easy-to-forget housekeeping step: onboard flash storage fills up after a handful of logs and needs to be erased from that same Blackbox tab before it can record another one — if logging silently stops working, check that first.</p>
      <div class="tip"><div class="clabel">Case Study</div>A pilot's quad felt perfectly clean hovering and cruising on the bench and in gentle flight, so they assumed the tune was solid. On a hard punch-out — full throttle, fast — it snapped into a violent, fast oscillation that nearly flipped it out of the air. The blackbox log from that flight showed a sharp D-term spike exactly at the punch-out, riding on top of gyro noise the default filter cutoff wasn't aggressive enough to catch at that motor RPM. Tightening the dynamic notch range and slightly lowering D solved it — but nothing about gentle flying would ever have revealed the problem. A tune that's only tested gently is only validated gently.</div>
      <div class="callout"><div class="clabel">Why It Matters</div>The failure mode you never provoke on purpose during testing is the one that finds you unannounced during a real flight.</div>
      <div class="tip"><div class="clabel">Hands-On</div>Turn on Blackbox logging in Configurator, fly one short flight including at least one hard punch-out, then download the log and open it in Blackbox Explorer. Just look — find the gyro trace and see if you can spot where it's noisiest.</div>
      <div class="diagram">${SVG_GYRO}<div class="dcap">Clean vs. noisy gyro trace &mdash; that jagged D-term spike is exactly what a good filter setup smooths away.</div></div>
    `,
    quiz:[
      {id:"b4l4_q1", q:"What is the core purpose of gyro filtering in Betaflight?",
       choices:["Separate real flight signal from mechanical/motor noise before it reaches the PID loop","Increase maximum motor RPM","Replace the need for PID tuning entirely","Configure receiver binding"],
       a:0, exp:"Filtering keeps noise from being amplified by D and fed into motor output as if it were real motion."},
      {id:"b4l4_q2", q:"What's the downside of over-filtering the gyro signal?",
       choices:["Added latency — a mushy, delayed feel between stick input and response","Guaranteed motor burnout","Faster stick response than reality","The aircraft will refuse to arm"],
       a:0, exp:"Aggressive filtering trades noise rejection for real delay, which pilots feel as sluggish, numb handling."},
      {id:"b4l4_q3", q:"What's the downside of under-filtering the gyro signal?",
       choices:["Nothing meaningful — more signal is always better","Noise reaches D-term uncut, causing motor heat, noise, and potentially burnt motors","It automatically self-corrects at high throttle","It disables Angle mode"],
       a:1, exp:"Unfiltered noise gets amplified by D and sent to the motors as if it were real commanded movement, generating heat and wasted current."},
      {id:"b4l4_q4", q:"A tune problem only appears during a specific hard maneuver, not during gentle flight. What's the best way to diagnose it?",
       choices:["Only fly gently going forward to avoid triggering it","Record a blackbox log of a flight that includes that maneuver, then review the traces","Guess and adjust PID values randomly until it stops","Ask another pilot to diagnose it without seeing any data"],
       a:1, exp:"Blackbox logging captures the exact moment and frequency of the problem, which feel alone often can't distinguish."}
    ,
      {id:"b4l4_q5", q:"What's the functional difference between the gyro lowpass filter and the dynamic notch filter?", choices:["They are two names for the exact same feature", "The dynamic notch filter only works on digital FPV systems", "The lowpass filter only applies to yaw, and the notch filter only applies to roll and pitch", "The lowpass filter cuts everything above a fixed cutoff frequency; the dynamic notch filter tracks the actual noise frequencies from your specific motors/props in real time and carves narrow notches around them"], a:3, exp:"Lowpass is a blunt, fixed-cutoff tool; the dynamic notch filter is adaptive, targeting the real noise frequencies coming off your specific hardware."},
      {id:"b4l4_q6", q:"For an FC that logs blackbox data to onboard flash rather than a microSD card, how do you retrieve a completed log?", choices:["Use the 'Save log' / 'Erase flash' controls on Configurator's Blackbox tab", "Pull the flight controller's onboard flash chip physically", "It uploads automatically to Blackbox Explorer over Wi-Fi", "Logs cannot be retrieved without a microSD card"], a:0, exp:"Onboard-flash logging is downloaded through the Save log / Erase flash controls right on Configurator's Blackbox tab."},
      {id:"b4l4_q7", q:"Blackbox logging has silently stopped recording new flights. What should you check first?", choices:["Whether the PID values have changed recently", "Whether the receiver is bound correctly", "Whether onboard flash storage is full and needs erasing from the Blackbox tab", "Whether the dynamic notch filter is enabled"], a:2, exp:"Onboard flash fills up after a handful of logs and needs to be erased from the Blackbox tab before it can record again \u2014 an easy first thing to check."},
      {id:"b4l4_q8", q:"In the case study, what specifically fixed the violent oscillation that only appeared during a hard punch-out?", choices:["Increasing P and lowering I", "Tightening the dynamic notch filter range and slightly lowering D", "Replacing the flight controller entirely", "Disabling all filtering"], a:1, exp:"The blackbox log pinpointed a D-term spike riding on unfiltered gyro noise at that motor RPM; tightening the dynamic notch range and lowering D resolved it."}]},
    {id:"b4l5", title:"Failsafe & Pre-Flight Safety Configuration", content:`
      <p>B1 covered failsafe at the hardware and radio-link level — what your receiver does when it loses contact with the transmitter. This lesson is the software layer on top of that: what <strong>Betaflight itself</strong> does once the flight controller detects that receiver signal has gone bad or stopped entirely, configured on the Failsafe tab.</p>
      <p>Betaflight's failsafe runs in stages. <strong>Stage 1</strong> begins the moment valid signal is lost — the FC typically holds recent throttle/attitude briefly rather than reacting instantly, in case it's a momentary glitch. If signal doesn't return within the <strong>guard time</strong> (<span class="keyfact">1.5 seconds</span> by default in current Betaflight versions — it was 1.0 second in the older 4.4 release line, and it's configurable down to a 200&nbsp;ms floor), it escalates to <strong>Stage 2</strong>, which executes your configured procedure: cut motors and drop, auto-land, or — on GPS-equipped builds with compatible firmware — an autonomous return. Note the naming if you go looking for this in Configurator: Betaflight's own feature is labeled <strong>GPS Rescue</strong>, on its own dedicated tab — not "RTH," which is the term you'll actually encounter on the ArduPilot side in B5. Which option is right depends entirely on what you're flying and over what: a park flyer over grass with no GPS should probably just drop or land in place, since attempting a poorly configured autonomous return is its own hazard.</p>
      <p>Arming itself has safety interlocks worth understanding rather than treating as red tape. Betaflight blocks arming if throttle isn't at minimum, specifically to prevent a spun-up motor the instant you arm. Related but distinct is <strong>Runaway Takeoff Prevention</strong>, which watches for unexpected, uncommanded aircraft movement in the moments right after arming — built for scenarios like a prop that isn't seated correctly or a motor mapping error, where the aircraft flips or lurches on its own right after spin-up rather than responding to your stick input — and disarms automatically rather than letting it continue.</p>
      <p>None of this replaces a deliberate pre-flight check before a maiden flight:</p>
      <ul>
        <li>Propellers correctly oriented and fully seated, checked by hand before the battery ever goes in.</li>
        <li>Arm switch tested with props off, confirming the correct switch arms and disarms as expected.</li>
        <li>Failsafe behavior tested deliberately — with props off or in a fully open, controlled space — by powering down the transmitter briefly and confirming the aircraft does what you configured it to do.</li>
        <li>Flight modes confirmed on the Modes tab match what you intend to fly first (Angle, not Acro).</li>
        <li>Battery voltage alarm configured and audible before you're relying on it mid-flight — set on Configurator's <strong>Battery/Voltage</strong> tab, where you also confirm the FC has correctly auto-detected your cell count so the alarm threshold actually corresponds to a real low-voltage condition.</li>
      </ul>
      <div class="tip"><div class="clabel">Case Study</div>A pilot's maiden flight went out further than planned, the link dropped, and the quad kept flying in a straight line rather than doing anything resembling a failsafe response. Failsafe had never actually been configured beyond Betaflight's blank default — no Stage 2 action was set. The aircraft was never seen again. The failure wasn't a bad component; it was an unconfigured setting nobody had tested because nobody had deliberately triggered it before flying somewhere signal loss was possible.</div>
      <div class="callout"><div class="clabel">Ask Yourself</div>You've configured failsafe but never actually tested it triggering — is that meaningfully different from not having configured it at all?</div>
      <div class="tip"><div class="clabel">Hands-On</div>With propellers removed, arm the aircraft, then power off your transmitter and watch what Betaflight actually does — check the Failsafe tab's live status or observe motor behavior directly. Confirm it matches what you intended to configure before you ever fly somewhere signal loss is plausible.</div>
      <div class="diagram">${SVG_FAILSAFE}<div class="dcap">Failsafe isn&rsquo;t instant &mdash; a brief hold, then a guard-time window, before Stage 2 (RTH/Land) actually fires.</div></div>
    `,
    quiz:[
      {id:"b4l5_q1", q:"What triggers Betaflight's Stage 2 failsafe action?",
       choices:["The guard time elapsing after signal loss without recovery","Low battery voltage alone","High motor temperature","The pilot manually pressing a failsafe button"],
       a:0, exp:"Stage 2 executes once the guard time following signal loss has elapsed without the link recovering."},
      {id:"b4l5_q2", q:"What is the purpose of Betaflight's throttle-not-zero arming check?",
       choices:["Prevent a motor from spinning up unexpectedly at the instant of arming","Measure battery voltage","Bind the receiver","Select the active flight mode"],
       a:0, exp:"Requiring throttle at minimum to arm prevents an unintended spin-up the moment the aircraft becomes armed."},
      {id:"b4l5_q3", q:"What scenario is Runaway Takeoff Prevention specifically designed to catch?",
       choices:["Unexpected, uncommanded movement right after arming, such as from a bad prop or motor mapping error","A dead transmitter battery","GPS signal loss during flight","An incorrectly set PID value"],
       a:0, exp:"It watches for the aircraft moving on its own immediately after arming — rather than responding to stick input — and disarms automatically."},
      {id:"b4l5_q4", q:"What's the best way to know failsafe is actually configured correctly before flying somewhere signal loss is possible?",
       choices:["Assume the defaults are fine since B1 already covered failsafe","Deliberately trigger it in a controlled test — e.g. props off, power down the transmitter, and observe the result","Wait until a real signal loss happens to find out","Configure it once and never revisit it"],
       a:1, exp:"An untested failsafe configuration is functionally unknown — deliberately triggering it under controlled conditions is the only way to confirm it behaves as intended."}
    ,
      {id:"b4l5_q5", q:"What does Betaflight's Stage 1 failsafe behavior do immediately after valid signal is lost?", choices:["Immediately cuts all motor output", "Immediately triggers GPS Rescue", "Holds recent throttle/attitude briefly, in case it's a momentary glitch, before Stage 2 can escalate", "Immediately disarms the aircraft"], a:2, exp:"Stage 1 begins with a brief hold of recent throttle/attitude rather than reacting instantly, in case the signal loss is momentary."},
      {id:"b4l5_q6", q:"What is Betaflight's current default guard time before Stage 2 executes, and how does it compare to the older 4.4 release line?", choices:["1.5 seconds by default now, versus 1.0 second in the 4.4 release line", "3.0 seconds now, versus 5.0 seconds in 4.4", "0.5 seconds now, versus 2.0 seconds in 4.4", "The guard time has never changed across any Betaflight version"], a:0, exp:"Current Betaflight defaults to a 1.5 second guard time, up from 1.0 second in the 4.4 line, and it's configurable down to a 200ms floor."},
      {id:"b4l5_q7", q:"What is Betaflight's own name for its autonomous-return failsafe feature, and how does that compare to the ArduPilot-side term?", choices:["It's called 'RTH,' the same term used on the ArduPilot side", "It's called 'Auto Land,' with no ArduPilot equivalent", "Betaflight has no autonomous-return feature at all", "It's called 'GPS Rescue,' on its own dedicated tab \u2014 not 'RTH,' which is the term used on the ArduPilot side"], a:3, exp:"Betaflight's feature is labeled GPS Rescue on its own tab; 'RTH' is the term you'll encounter later on the ArduPilot side."},
      {id:"b4l5_q8", q:"In the case study where a pilot's aircraft was never recovered after signal loss, what was the actual root cause?", choices:["A defective receiver that failed to bind", "Failsafe had never been configured beyond Betaflight's blank default \u2014 no Stage 2 action was set", "The battery died mid-flight before failsafe could trigger", "The propellers detached in flight"], a:1, exp:"The failure wasn't hardware \u2014 Stage 2 had simply never been given an action to execute, so the aircraft kept flying straight when signal dropped."}]}
  ],
  finalQuiz:[
    {id:"b4_final_q1", q:"What is the practical danger of flashing the wrong Betaflight target?",choices:["Permanent destruction of the FC with no recovery","Misconfigured pin mapping or behavior — but almost always recoverable via a DFU bootloader reflash","Nothing; targets are interchangeable across boards","It only affects battery life"],a:1,exp:"The hardware bootloader survives a bad flash, so re-entering DFU mode and reflashing the correct target is the standard recovery."},
    {id:"b4_final_q2", q:"A receiver shows no signal in Configurator despite solid wiring. What's a likely software-side cause?",choices:["The wrong UART or receiver protocol is selected on the Ports/Configuration tabs","The propellers are unbalanced","The battery is undercharged","PID values are too aggressive"],a:0,exp:"Port and protocol misconfiguration produces the same symptom as a wiring fault — no channel data reaching Configurator."},
    {id:"b4_final_q3", q:"Why should a beginner fly in Angle mode rather than Acro?",choices:["Angle self-levels and gives a built-in recovery when the sticks are released; Acro has no self-leveling at all","Acro mode is disabled on most beginner flight controllers","Angle mode uses noticeably less battery","Acro requires a separate FAA endorsement"],a:0,exp:"Angle's self-leveling behavior is itself a safety net that Acro simply doesn't have."},
    {id:"b4_final_q4", q:"A quad snaps into a fast, tight oscillation specifically right after quick stick inputs, but is otherwise smooth. What's the first thing to suspect?",choices:["P set too high","GPS signal quality","Battery voltage sag","Receiver binding failure"],a:0,exp:"Fast, input-correlated oscillation is the classic signature of excessive P."},
    {id:"b4_final_q5", q:"What's the main risk of over-filtering the gyro signal?",choices:["Added latency — a delayed, mushy response between stick input and aircraft motion","Guaranteed motor burnout","Improved battery efficiency with no downside","The aircraft becomes impossible to arm"],a:0,exp:"Heavy filtering trades noise rejection for real delay, which pilots feel as sluggish, numb control."},
    {id:"b4_final_q6", q:"What does blackbox logging let you do that judging a tune by feel alone cannot?",choices:["See exact gyro, PID, and motor-output traces on a shared timeline to pinpoint the cause and moment of a problem","Automatically rewrite the PID values for you","Replace the need for flight mode configuration","Bind the receiver without a transmitter"],a:0,exp:"Blackbox data resolves ambiguity — like whether an issue is a P oscillation or a filtering gap — that feel alone can't reliably distinguish."},
    {id:"b4_final_q7", q:"What defines Betaflight's Stage 2 failsafe action?",choices:["The specific behavior — drop, land, or return-to-home — that executes once the guard time elapses without signal recovery","The switch position used to arm the aircraft","The flight mode active at takeoff","The firmware target selected during flashing"],a:0,exp:"Stage 2 is the actual failsafe procedure the aircraft carries out once Stage 1's guard time has run out with no signal recovery."}
  ,
    {id:"b4_final_q8", q:"On a brand-new board's first flash, what does checking 'Full chip erase' accomplish?", choices:["It speeds up the flashing process", "It permanently locks the board to that firmware version", "It wipes any old configuration and firmware cleanly \u2014 appropriate on a brand-new board's first flash", "It backs up the old firmware automatically"], a:2, exp:"A full chip erase clears prior configuration and firmware, giving a fresh board a clean baseline on its first flash."},
    {id:"b4_final_q9", q:"What distinguishes SBUS from CRSF in terms of UART requirements?", choices:["SBUS is an inverted signal \u2014 some F4 boards need a UART with hardware inversion support, while F7+ boards handle inversion on any UART", "SBUS requires no UART selection at all, unlike CRSF", "SBUS only functions with digital video systems", "SBUS automatically negotiates its own baud rate like CRSF does"], a:0, exp:"SBUS's inverted signal is handled differently across FC generations \u2014 some F4 boards need a specific UART, while F7 and newer boards don't care which UART you use."},
    {id:"b4_final_q10", q:"Why does the Sim Lab specifically recommend using your real transmitter rather than a keyboard or generic gamepad?", choices:["Because keyboards are not supported by any simulator software", "Because a generic gamepad damages the simulator's calibration", "It makes no practical difference which input device is used", "So the muscle memory built transfers directly to the real aircraft, since the same physical sticks are used"], a:3, exp:"The lesson's whole point is transferable stick-to-motion muscle memory, which only works if the hands are training on the same physical sticks they'll fly with."},
    {id:"b4_final_q11", q:"A quad shows a slower, rolling bounce-back after a correction rather than a fast, tight buzz. Which term is the likely culprit, and how is it distinct from excess P?", choices:["P set too low", "I set too high \u2014 a slower, rolling bounce-back distinct from P's fast, tight buzz", "D set too high, causing a fast buzz identical to excess P", "A dead receiver channel"], a:1, exp:"A slower rolling bounce-back after a correction is I-term wind-up, the signature of I set too high \u2014 a different symptom than P's fast, tight oscillation."},
    {id:"b4_final_q12", q:"What's the functional difference between the gyro lowpass filter and the dynamic notch filter?", choices:["They're identical features under different names", "The dynamic notch only works with GPS-equipped builds", "The lowpass filter cuts everything above a fixed cutoff; the dynamic notch filter tracks real-time noise frequencies from your specific motors/props and carves narrow notches around them", "The lowpass filter only affects yaw"], a:2, exp:"Lowpass is a broad, fixed-cutoff tool; the dynamic notch is adaptive and targets the actual noise frequencies coming off your hardware."},
    {id:"b4_final_q13", q:"What is Betaflight's current default guard time before Stage 2 failsafe executes, compared to the older 4.4 release line?", choices:["1.5 seconds by default currently, versus 1.0 second in the 4.4 release line", "5 seconds by default currently, unchanged since 4.4", "200ms by default currently, with no configurability", "10 seconds by default, configurable up to 30 seconds"], a:0, exp:"Current Betaflight defaults to a 1.5 second guard time versus the 4.4 line's 1.0 second, configurable down to a 200ms floor."},
    {id:"b4_final_q14", q:"What is the relationship between the 'kill switch' referenced in the Sim Lab's emergency drills and the ARM switch configured earlier in the module?", choices:["The kill switch is a separate physical switch installed specifically for emergencies", "The kill switch only works when GPS Rescue is enabled", "The kill switch is a software-only feature with no transmitter switch involved", "The 'kill switch' is the same ARM switch configured in B4L2 \u2014 the name just describes using it to get out of trouble in the moment"], a:3, exp:"There's no separate hardware \u2014 the sim lab's 'kill switch' drill is practicing the same ARM switch from B4L2, just used reactively to cut motors in an emergency."}]

{
  id:"b5", title:"ArduPilot & Autonomous Operations", week:"Weeks 10–12",
  lessons:[
    {id:"b5l1", title:"ArduPilot vs. Betaflight: Two Different Jobs", content:`
      <p>Every flight controller firmware is built around an assumption about what the aircraft is for. <strong>Betaflight</strong> assumes your stick inputs are the plan &mdash; it converts thumb movement into rotation rate as fast and directly as possible, and treats GPS or altitude hold as an afterthought bolted on for modes most freestyle pilots never touch. <strong>ArduPilot</strong> (the multirotor build is called <strong>ArduCopter</strong>) assumes the opposite: the plan comes first, and the pilot is often supervising rather than flying. It's built around GPS-referenced position, altitude, and heading, with a mission-planning and autonomy stack Betaflight doesn't have at all.</p>
      <p>That difference shows up everywhere once you dig in. Betaflight's tuning conversation is about rate response, filtering, and motor output &mdash; how the aircraft answers your stick, right now. ArduCopter's tuning includes all of that at the low level, but layers a navigation controller and an <strong>EKF (Extended Kalman Filter)</strong> that fuses GPS, compass, barometer, and <strong>IMU</strong> data into one best-guess position estimate, plus a mission-execution engine on top. IMU (inertial measurement unit) is just the formal name for the same gyro-plus-accelerometer sensor package B1 introduced as the FC's core sensing hardware — same physical chip, just referred to more precisely once you're talking about how the EKF uses it. You're not just tuning how it responds to you &mdash; you're tuning how much it can be trusted to fly itself.</p>
      <p>Neither firmware is better in the abstract; they're built for different jobs. A freestyle or racing quad wants raw responsiveness and doesn't care about GPS &mdash; loading ArduCopter onto it solves a problem that doesn't exist. A survey, mapping, or long-range inspection aircraft needs repeatable, precise, autonomous flight, which Betaflight has no path to. It's common for a serious builder to run Betaflight on the acro build and ArduPilot on the mapping build &mdash; same skill set, different tool for the job.</p>
      <p>Autonomy isn't free hardware-wise. Beyond the flight controller, ArduCopter needs a <strong>GPS/compass module</strong> (almost always one combined unit on a mast above the frame, kept away from magnetic interference), a <strong>barometer</strong> for altitude reference (often built into the FC), and, if you want to command or monitor beyond RC range, a <strong>telemetry radio</strong> pair &mdash; commonly <span class="keyfact">915 MHz</span> in the US or <span class="keyfact">433 MHz</span> in Europe &mdash; linking the aircraft to your ground control station.</p>
      <div class="callout"><div class="clabel">Ask Yourself</div>If a firmware's whole job is to fly the mission for you, what does that imply about how much more there is to verify before you trust it, compared to a manual quad where your thumbs are the last check on every command?</div>
      <div class="callout"><div class="clabel">Why It Matters</div>Flashing ArduCopter onto the same board you tuned in Betaflight overwrites that firmware and its saved settings entirely — it's not a mode switch, it's a full firmware replacement. Most builders either keep a second board dedicated to ArduPilot experiments or accept that exploring ArduCopter means re-flashing Betaflight back afterward if they want that quad flying manual again.</div>
      <div class="tip"><div class="clabel">Hands-On</div>Open the flight controller you used for Betaflight tuning and check its silkscreen or documentation for an unpopulated GPS/compass connector (often labeled I2C or GPS/UART). Most 30x30 stacks sold for freestyle already have the pins &mdash; they're just unused until you add the module.</div>
    `,
    quiz:[
      {id:"b5l1_q1", q:"What is the fundamental difference in design philosophy between Betaflight and ArduCopter?",
       choices:["Betaflight prioritizes autonomous GPS navigation; ArduCopter prioritizes raw manual response","Betaflight prioritizes direct, fast manual stick response; ArduCopter is built around GPS-referenced position and mission autonomy","They are functionally identical firmware with different menus","ArduCopter only runs on fixed-wing aircraft, never multirotors"],
       a:1, exp:"Betaflight optimizes stick-to-motor responsiveness for manual flight; ArduCopter (ArduPilot's multirotor build) is architected around a position/navigation estimate and mission execution."},
      {id:"b5l1_q2", q:"Which additional hardware does a build typically need to run ArduCopter's autonomous modes that a pure Betaflight acro build doesn't require?",
       choices:["A larger propeller","A GPS/compass module, plus a barometer and usually a telemetry radio","A more powerful ESC","Nothing — the exact same hardware runs both firmwares identically"],
       a:1, exp:"GPS/compass gives position and heading, the barometer gives altitude reference, and a telemetry radio lets a ground control station talk to the aircraft beyond RC range."},
      {id:"b5l1_q3", q:"A builder owns a freestyle racing quad and a long-range mapping quad. Which firmware pairing makes the most sense?",
       choices:["Betaflight on both","ArduCopter on both","Betaflight on the racing quad, ArduCopter on the mapping quad","ArduCopter on the racing quad, Betaflight on the mapping quad"],
       a:2, exp:"Racing wants raw manual response with no GPS overhead; mapping needs repeatable autonomous navigation — each firmware matches a different job."}
    ,
      {id:"b5l1_q4", q:"What does ArduCopter's EKF (Extended Kalman Filter) actually do?", choices:["It converts stick input directly into motor output", "It calibrates the ESCs during first-time setup", "It manages firmware updates between Betaflight and ArduCopter", "It fuses GPS, compass, barometer, and IMU data into one best-guess position estimate"], a:3, exp:"The EKF is the navigation layer that combines multiple sensor inputs into a single trusted position/orientation estimate \u2014 the foundation everything from Loiter to Auto missions relies on."},
      {id:"b5l1_q5", q:"What actually happens when you flash ArduCopter onto a flight controller board that was previously running Betaflight?", choices:["The board runs both firmwares simultaneously, selectable by a switch", "ArduCopter is installed as a full firmware replacement, overwriting Betaflight and its saved settings entirely", "ArduCopter installs as an add-on mode inside the existing Betaflight firmware", "The board automatically reverts to Betaflight after each power cycle"], a:1, exp:"Flashing is a complete firmware replacement, not a mode switch \u2014 going back to Betaflight later means re-flashing it."},
      {id:"b5l1_q6", q:"Which telemetry radio frequency pairing does the lesson associate with the US and Europe respectively?", choices:["433 MHz in the US, 915 MHz in Europe", "2.4 GHz in the US, 5.8 GHz in Europe", "915 MHz in the US, 433 MHz in Europe", "900 MHz in both regions"], a:2, exp:"915 MHz is the common US telemetry band; 433 MHz is common in Europe \u2014 the reverse of a common assumption."}]},
    {id:"b5l2", title:"Ground Control Stations: Mission Planner & QGroundControl", content:`
      <p>ArduCopter doesn't get flown from the transmitter alone the way a Betaflight quad does &mdash; almost everything about configuring, calibrating, and mission-planning it happens through a <strong>ground control station (GCS)</strong> running on a laptop or tablet. The two you'll actually encounter are <strong>Mission Planner</strong> (Windows-native, the deepest and most widely documented for ArduPilot specifically) and <strong>QGroundControl</strong> (cross-platform &mdash; Windows, Mac, Linux, Android, iOS &mdash; and also the primary GCS for PX4, so it favors a leaner, more universal interface). Neither is objectively better; Mission Planner exposes more raw parameters and logs, QGroundControl is cleaner for straightforward mission flying. Many ArduPilot users keep both installed.</p>
      <p>Connecting for the first time is almost always <strong>USB</strong> &mdash; plug the flight controller directly into the computer, select the correct COM port, and connect at the default baud rate. Once configured, ongoing field connections typically go through the <strong>telemetry radio</strong> pair instead, so you can monitor and adjust the mission without tethering a cable to the aircraft.</p>
      <p>Before any of that, the flight controller needs <strong>ArduCopter firmware</strong> flashed onto it &mdash; the same board that ran Betaflight can very often run ArduPilot instead, since both are open-source projects targeting common STM32-based flight controller hardware. Both GCS apps have a built-in firmware installer: pick your board, pick the ArduCopter version, and it flashes over USB. Double-check board compatibility first, against ArduPilot's own published hardware compatibility list (searchable from the ArduPilot documentation site) rather than assuming — not every Betaflight-oriented board has an ArduPilot port, and flashing the wrong target can brick it. One specific, common blocker worth knowing before you start: ArduCopter's firmware and logging needs meaningfully more flash memory than many small racing-oriented Betaflight boards actually have, so a board that flies Betaflight perfectly well can still be too small to run ArduCopter at all &mdash; check the compatibility list's flash size note, not just whether the processor family matches.</p>
      <p>After flashing, a fixed sequence of calibrations is mandatory before first flight, not optional housekeeping:</p>
      <ul>
        <li><strong>Accelerometer calibration</strong> &mdash; six-position calibration (level, each side, nose up, nose down, inverted) so the FC knows what "level" actually means.</li>
        <li><strong>Compass calibration</strong> &mdash; rotating the aircraft through all axes so the FC can map out magnetic interference from its own frame and motors.</li>
        <li><strong>Radio calibration</strong> &mdash; recording the full stick and switch travel range from your transmitter.</li>
        <li><strong>ESC calibration</strong> &mdash; syncing throttle endpoints across all ESCs so every motor spins up in step.</li>
      </ul>
      <p>Skip any one of these and the symptoms show up in the air, not on the bench &mdash; an unlevel hover from a bad accel cal, a slow heading drift from a bad compass cal, one motor lagging the others from a bad ESC cal.</p>
      <div class="tip"><div class="clabel">Hands-On</div>If you have a spare FC, install Mission Planner, connect over USB, and run through the full calibration wizard (accel, compass, radio, ESC) start to finish before you ever add GPS into the mix. Get comfortable with the sequence on hardware you're not depending on.</div>
    `,
    quiz:[
