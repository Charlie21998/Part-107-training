  {id:"pq74", topic:"Operations I", q:"If a remote pilot monitoring CTAF hears a transmission but can't make out part of it, the standard phraseology response to request repetition is:", choices:["\"Say again\"", "\"Copy that\"", "\"Roger, wilco\"", "\"Standby one\""], a:0, exp:"\"Say again\" is the standard phraseology request for a transmission to be repeated — plain, unambiguous, and immediately understood by any listener."},
  {id:"pq75", topic:"Operations I", q:"During a two-person operation, the visual observer radios a hazard call and the remote PIC responds by restating exactly what was heard before acting on it. This is an example of:", choices:["Redundant and unnecessary chatter", "Closed-loop communication, confirming the message was received correctly", "A violation of standard phraseology", "An emergency deviation under §107 authority"], a:1, exp:"Repeating back a message to confirm correct receipt is closed-loop communication — a core CRM practice that catches mishearing before it turns into a bad decision."},
  {id:"pq76", topic:"Operations I", q:"A remote pilot is operating well within legal limits near a non-towered airport when a manned aircraft on approach appears to be flying an unusual, erratic pattern. What does §107.37 require of the remote pilot?", choices:["Nothing — the manned aircraft is behaving abnormally, so normal right-of-way rules are suspended", "The remote pilot must still give way and avoid interfering with the manned aircraft's operation, regardless of how it's flying", "The remote pilot may climb to get a better view of the manned aircraft's flight path", "The remote pilot should attempt to contact the manned aircraft's pilot directly by radio before yielding"], a:1, exp:"§107.37 requires a small UAS to give way to manned aircraft and avoid interfering with their operations at all times — the manned aircraft's flying style doesn't change that obligation."},
  {id:"pq77", topic:"Operations I", q:"You're operating a drone under a waiver near a runway when a manned aircraft turns onto final approach on a path that will cross your operating area. The correct action is to:", choices:["Continue your mission since you were there first", "Yield the area and avoid interfering with the manned aircraft's approach", "Climb above 400 ft to let the aircraft pass underneath", "Land immediately regardless of the aircraft's actual flight path"], a:1, exp:"Right-of-way rules require the small UAS to give way and not interfere with manned aircraft operations — practically, that means clearing the area the manned aircraft needs, not just holding position or blindly landing per §107.37."},
  {id:"pq78", topic:"Operations I", q:"At a non-towered airport, a remote pilot wants to gauge which runway manned traffic is likely using before starting a nearby operation. What ground-based visual cue is designed to communicate wind direction and, indirectly, active runway use to arriving pilots?", choices:["A windsock or wind indicator", "The airport's rotating beacon", "Runway centerline markings", "The airport diagram in a sectional chart legend"], a:0, exp:"A windsock (or similar wind indicator) shows wind direction, which manned pilots use to select which runway to use — checking it gives a remote pilot a quick read on likely traffic flow before operating nearby."},
  {id:"pq79", topic:"Operations I", q:"Even when a remote pilot is not required to transmit on CTAF, doing so briefly before operating near a non-towered airport is good practice because it:", choices:["Satisfies a §107.37 transmission requirement", "Gives nearby manned pilots a chance to build awareness of the drone's presence, even though the drone won't always be able to hear a reply", "Is legally mandatory for any Part 107 operation within 5 miles of an airport", "Replaces the need for visual line of sight"], a:1, exp:"There's no blanket transmission requirement for small UAS on CTAF, but a courtesy call adds to shared situational awareness for manned pilots nearby — supporting, not replacing, the see-and-avoid and right-of-way obligations of §107.37."},
  {id:"pq80", topic:"Operations I", q:"A remote pilot flies a pattern that repeatedly causes a manned aircraft on approach to alter its course to avoid the drone. Even if the remote pilot never physically endangers the aircraft, this pattern of operation most directly risks violating:", choices:["§107.29 (night operations)", "§107.37 (right-of-way / no interference with manned aircraft operations)", "§107.49 (preflight inspection)", "§107.9 (accident reporting)"], a:1, exp:"Repeatedly forcing a manned aircraft to maneuver around a drone is interference with its operation, which §107.37 prohibits regardless of whether an actual collision or close call occurs."},
  {id:"pq81", topic:"Operations I", q:"A remote pilot's aircraft stops responding to control inputs and continues flying an unplanned course despite the programmed lost-link failsafe engaging as expected. This scenario is best described as:", choices:["A normal lost-link event, since the failsafe engaged", "A flyaway — the aircraft is not behaving as commanded or expected even with the failsafe active", "A GPS drift error with no operational significance", "A routine RTH (return-to-home) sequence"], a:1, exp:"A lost-link failsafe engaging and working as designed is a contained event. A flyaway is the more serious case where the aircraft is not under control and not behaving predictably — which is why it calls for a different response (warning others in its path, not just waiting)."},
  {id:"pq82", topic:"Operations I", q:"At 300 ft AGL, you lose the control-link signal and your aircraft is configured to execute an automatic return-to-home failsafe. What should you do?", choices:["Immediately power off the controller since the aircraft is handling itself", "Keep the controller on, maintain visual contact if possible, and be ready to take back manual control the moment link is reestablished", "Walk toward the last known GPS coordinate and wait there", "Assume the flight is over and file an accident report regardless of outcome"], a:1, exp:"A failsafe is a default behavior, not a guarantee — the remote PIC should stay engaged, keep the controller on and ready, and regain manual control as soon as the link returns rather than treating the failsafe as hands-off."},
  {id:"pq83", topic:"Operations I", q:"During a flyaway, the aircraft is heading toward a nearby road with pedestrian and vehicle traffic. Besides continuing to attempt to regain control, the remote PIC's priority should be:", choices:["Chasing the aircraft on foot to catch it", "Warning people in the aircraft's projected path and, if warranted, notifying appropriate authorities", "Filing the required accident report before the flight concludes", "Immediately shutting down the transmitter to force a crash"], a:1, exp:"Protecting people on the ground takes priority — warning those in the projected path (and looping in authorities if the situation calls for it) is the practical priority alongside continued attempts to regain control."},
  {id:"pq84", topic:"Operations I", q:"Many small UAS lose the ability to hold a stable GPS position if GPS signal is lost or degraded. What typically happens to the aircraft's flight behavior in that case?", choices:["It shuts down its motors immediately as a safety measure", "It usually reverts to a non-GPS-assisted mode (e.g., attitude/manual mode) requiring more active pilot control to hold position", "It automatically switches to a satellite backup navigation system", "Nothing changes — GPS has no effect on flight modes"], a:1, exp:"Without reliable GPS, most small UAS drop out of position-hold modes into an attitude-based or manual mode, which drifts with wind and requires the pilot to actively correct — a good reason to be ready to fly manually before it happens."},
  {id:"pq85", topic:"Operations I", q:"A small UAS accident causes serious injury to a bystander meeting the FAA's reportable threshold. Under §107.9, the remote PIC must report the event to the FAA within:", choices:["24 hours", "72 hours", "10 days", "30 days"], a:2, exp:"§107.9 requires reporting a qualifying safety event (serious injury at or above AIS Level 3, loss of consciousness, or property damage over $500) to the FAA within 10 days of the occurrence."},
  {id:"pq86", topic:"Operations I", q:"Before a multi-person small UAS operation begins, effective crew resource management calls for the remote PIC to:", choices:["Assign roles silently and let each crew member figure out the plan during flight", "Conduct a briefing that clarifies each person's role, communication protocol, and emergency contingencies before takeoff", "Rely on the visual observer to set the operating plan independently", "Skip briefing if the crew has worked together before"], a:1, exp:"A pre-flight crew briefing — roles, how the crew will communicate, and what happens if something goes wrong — is a core CRM practice that prevents ambiguity from becoming a hazard once the aircraft is airborne."},
  {id:"pq87", topic:"Operations I", q:"A visual observer notices the aircraft drifting toward a restricted area but the remote PIC seems not to have noticed. Sound CRM practice holds that the visual observer should:", choices:["Wait for the remote PIC to notice on their own, since only the PIC has final authority", "Speak up immediately and clearly, regardless of the hierarchy between observer and PIC", "Take control of the aircraft directly", "Say nothing unless directly asked for input"], a:1, exp:"A core CRM principle is that any crew member should speak up about a safety concern immediately, without waiting for permission — deferring to hierarchy in the moment is exactly the failure pattern CRM training tries to prevent."},
  {id:"pq88", topic:"Operations I", q:"What is the core distinction between the remote PIC's role and the visual observer's role in a Part 107 crew?", choices:["The visual observer has full authority to operate the controller if needed", "The visual observer maintains visual contact and communicates hazards; the remote PIC retains control and final decision-making authority", "The visual observer is only needed for night operations", "Both roles are interchangeable at any point during flight"], a:1, exp:"The visual observer's job is to watch and communicate, not to fly — the remote PIC keeps control of the aircraft and the final call on how to respond to what the observer reports."},
  {id:"pq89", topic:"Operations I", q:"A visual observer momentarily loses sight of the aircraft during flight. Per good CRM protocol, what should happen next?", choices:["The observer should say nothing and try to relocate the aircraft quietly", "The observer should immediately notify the remote PIC using their agreed communication method, so the PIC can adjust the flight as needed", "The flight is automatically in violation and must be reported to the FAA", "The observer should instruct the PIC to increase altitude to make the aircraft easier to spot"], a:1, exp:"Losing visual contact breaks the VLOS safety chain the observer is there to maintain — prompt, clear notification lets the PIC decide how to respond (e.g., adjusting position or bringing the aircraft back), rather than the observer trying to quietly fix it alone."},
  {id:"pq90", topic:"Operations I", q:"In a crew operation, why is it important to agree on a specific communication protocol (e.g., set phrases for 'hazard,' 'clear,' 'lost sight') before the flight rather than improvising during it?", choices:["Improvised communication is always faster in an emergency", "Predetermined, unambiguous phrases reduce the chance of a hazard call being misunderstood or missed under time pressure", "The FAA requires a written communication script for every crew flight", "It eliminates the need for a visual observer altogether"], a:1, exp:"Agreeing on clear, specific terms in advance removes ambiguity exactly when there's least time to sort out what someone meant — a basic CRM tool for making communication reliable under stress."},
  {id:"pq91", topic:"Operations I", q:"In the IMSAFE checklist, the 'S' prompts a pilot to consider:", choices:["Sunlight exposure", "Stress — psychological or situational pressure that could affect judgment", "Signal strength of the control link", "Storage voltage of the battery"], a:1, exp:"IMSAFE's 'S' stands for Stress — asking whether personal or situational pressures might be affecting judgment or focus before flight."},
  {id:"pq92", topic:"Operations I", q:"A remote pilot has been operating outdoors in high heat for several hours without adequate water breaks. What is the most relevant IMSAFE/ADM concern in this situation?", choices:["Heat and dehydration can degrade concentration and decision-making well before a pilot recognizes it themselves", "Heat has no meaningful effect on cognitive performance", "Only alcohol and drugs are relevant to the IMSAFE checklist", "Dehydration only affects the aircraft's battery, not the pilot"], a:0, exp:"Heat stress and dehydration measurably degrade reaction time and judgment, often before the person experiencing it notices the decline — which is exactly why IMSAFE treats physical condition, not just substances, as a go/no-go factor."},
  {id:"pq93", topic:"Operations I", q:"A remote pilot just finished an overnight shift and has had almost no sleep before a scheduled commercial flight. Applying the IMSAFE checklist, the appropriate response is:", choices:["Fly as scheduled since fatigue isn't covered by any Part 107 rule", "Self-assess honestly under the 'Fatigue' factor and consider delaying or declining the flight if impairment is likely", "Rely on the visual observer to compensate for any lapses in judgment", "Drink caffeine immediately before flight and proceed without further consideration"], a:1, exp:"IMSAFE exists precisely for judgment calls like this — fatigue degrades reaction time and decision-making even without any specific numeric rule attached, so a pilot exercising sound aeronautical decision-making should weigh delaying or declining the flight."},
  {id:"pq94", topic:"Operations I", q:"A remote pilot has taken an over-the-counter allergy medication that carries a drowsiness warning on the label. Under the standard incorporated into §107.27, operating a small UAS while affected by this medication is:", choices:["Permitted, since it's not alcohol", "Permitted only if the pilot feels alert enough to fly", "Prohibited if the medication affects the pilot's faculties in a way contrary to safety, regardless of whether it's a prescription or over-the-counter drug", "Permitted as long as the flight is under 400 ft"], a:2, exp:"§107.27 (incorporating §91.17) prohibits operating while using any drug — prescription or over-the-counter — that affects the person's faculties in a way contrary to safety; a drowsiness-inducing medication squarely fits that standard regardless of how the pilot feels."},
  {id:"pq95", topic:"Operations I", q:"A remote pilot had one alcoholic drink five hours ago and feels completely normal. Per the standard incorporated into §107.27, is it legal to operate now?", choices:["Yes, since the pilot feels unaffected", "Yes, as long as the flight stays below 100 ft", "No — the 8-hour bottle-to-throttle minimum hasn't elapsed, regardless of how the pilot feels", "No, but only because alcohol is banned entirely under Part 107 with no time limit"], a:2, exp:"The rule sets an 8-hour minimum after consuming alcohol, independent of self-assessed sobriety — feeling fine doesn't satisfy the bottle-to-throttle requirement, and BAC must also be below 0.04."},
  {id:"pq96", topic:"Operations II", q:"Does 14 CFR Part 107 require a fixed, calendar-based maintenance schedule for small UAS, similar to the annual inspections required for manned aircraft?", choices:["Yes, an annual inspection by an A&P mechanic is required", "No — the requirement is functional: the remote PIC must ensure the aircraft is in a condition for safe operation before each flight", "Yes, but only for aircraft used in Category 3 or 4 operations", "No, there are no maintenance-related obligations of any kind under Part 107"], a:1, exp:"Per 14 CFR §107.49, the standard is functional, not a fixed inspection calendar — the remote PIC must confirm the aircraft is fit to fly before every flight, drawing on manufacturer guidance as needed."},
  {id:"pq97", topic:"Operations II", q:"Under §107.49, which of the following is part of the remote PIC's preflight responsibility?", choices:["Confirming the aircraft is in a condition for safe operation, including things like propeller condition, airframe integrity, battery condition, and control-link function", "Filing a maintenance log with the FAA before each flight", "Having the aircraft inspected by an FAA-certificated repair station", "Submitting a NOTAM confirming the aircraft's airworthiness"], a:0, exp:"§107.49 requires the remote PIC to personally ensure the sUAS is in a safe condition to fly — there is no FAA filing, repair-station inspection, or NOTAM requirement tied to this."},
  {id:"pq98", topic:"Operations II", q:"During a preflight walk-around, a remote PIC notices a small hairline crack near the tip of one propeller but decides to fly anyway, reasoning it's 'probably fine for one more flight.' Is this compliant with Part 107?", choices:["Yes, since Part 107 has no specific propeller-condition rule", "No — flying with a known defect fails the §107.49 safe-condition standard and could also constitute careless or reckless operation under §107.23", "Yes, as long as the flight stays below 400 ft AGL", "No, but only because a written maintenance log entry was not made first"], a:1, exp:"Knowingly flying with a compromised propeller doesn't meet the 'condition for safe operation' standard of §107.49, and deliberately accepting that risk can also implicate the careless-or-reckless prohibition in §107.23."},
  {id:"pq99", topic:"Operations II", q:"Is a remote PIC federally required to keep written maintenance records for a small UAS?", choices:["Yes, logs must be submitted to the FAA quarterly", "There is no FAA-mandated recordkeeping requirement, but keeping basic maintenance records is still good practice", "Yes, but only for aircraft flown at night", "No, and keeping any records is actively discouraged because it can be used as evidence in an investigation"], a:1, exp:"Part 107 doesn't mandate a maintenance-log paperwork regime the way manned aviation rules do, but maintaining basic records helps a pilot demonstrate — and actually track — that the safe-condition standard under §107.49 is being met over time."},
  {id:"pq100", topic:"Operations II", q:"A manufacturer releases a firmware update addressing a known bug that can cause sudden loss of control. A remote PIC keeps flying the outdated firmware because 'the FAA hasn't made the update mandatory.' What's the concern with this reasoning?", choices:["There is none — firmware currency is irrelevant to Part 107 compliance", "Even without an explicit FAA mandate, flying a known-defective firmware version undermines the §107.49 determination that the aircraft is in a condition for safe operation", "Firmware updates are illegal to install without an A&P certificate", "This is only a problem if the aircraft is being flown over people"], a:1, exp:"§107.49's safe-condition requirement is a substantive judgment, not just 'has the FAA mandated it.' Knowingly operating with a documented safety-relevant defect undercuts that judgment."},
  {id:"pq101", topic:"Operations II", q:"A battery manufacturer issues a recall for a battery model prone to internal shorting and swelling. A remote PIC continues using the recalled batteries, reasoning that 'the FAA doesn't enforce manufacturer recalls.' Is this a sound approach to Part 107 compliance?", choices:["Yes — manufacturer recalls have no bearing on FAA rules", "No — known airworthiness issues like recalls and service bulletins still factor into whether the aircraft is genuinely in a safe condition to fly under §107.49", "Yes, as long as the batteries have not yet visibly swollen", "No, but only because using recalled parts violates registration requirements under §48.15"], a:1, exp:"While the FAA doesn't independently police manufacturer recalls, ignoring a known safety issue conflicts with the remote PIC's duty to ensure a genuinely safe condition for operation under §107.49."},
  {id:"pq102", topic:"Operations II", q:"Which of the following is NOT something a remote PIC would typically be checking as part of a §107.49 preflight condition assessment?", choices:["Propeller and airframe condition", "Battery condition and charge level", "Control link function", "Confirmation that the remote PIC has passed a TSA background check for that specific flight"], a:3, exp:"A per-flight TSA background check isn't part of the preflight condition assessment; §107.49 is about the aircraft's physical and functional readiness — propellers, airframe, battery, and control link are the relevant items."},
  {id:"pq103", topic:"Operations II", q:"Under §107.29, anti-collision lighting for night operations must be visible for at least what distance?", choices:["1 statute mile", "2 nautical miles", "3 statute miles", "5 statute miles"], a:2, exp:"§107.29 requires anti-collision lighting visible for at least 3 statute miles."},
  {id:"pq104", topic:"Operations II", q:"The anti-collision lighting required for night flight under §107.29 must be visible through what field of coverage around the aircraft?", choices:["180°, forward-facing only", "270°, excluding the tail", "360°, all the way around the aircraft", "90°, downward only, to avoid disturbing manned aircraft"], a:2, exp:"The lighting must be visible through the full 360° around the aircraft, not just in one direction, so it can be seen from any angle of approach."},
  {id:"pq105", topic:"Operations II", q:"Does a remote pilot need a waiver to conduct routine night operations under current Part 107 rules?", choices:["Yes, a night-operations waiver is always required", "No — for most remote pilots, night flight is allowed under §107.29's equipment- and training-based requirements, without a waiver", "Yes, but only if flying over people", "No, but only within a FRIA"], a:1, exp:"Night operation no longer requires a waiver for most Part 107 pilots; instead, §107.29 sets equipment (anti-collision lighting) and training conditions that must be met."},
  {id:"pq106", topic:"Operations II", q:"A remote pilot launches a flight 20 minutes after the end of evening civil twilight. The aircraft has no anti-collision lighting installed. Is this operation compliant with §107.29?", choices:["Yes, since visibility is still adequate that soon after sunset", "No — once the operation occurs at night (after the end of evening civil twilight), anti-collision lighting visible for 3 statute miles, 360° around the aircraft, is required", "Yes, as long as the pilot has completed night-operations training", "No, but only because the flight occurred without an airspace authorization"], a:1, exp:"Once past the end of evening civil twilight, the operation is legally 'at night' and triggers §107.29's equipment requirement — training alone doesn't substitute for the required lighting."},
  {id:"pq107", topic:"Operations II", q:"During a night flight, a remote PIC finds the anti-collision lighting is causing distracting glare off nearby structures. What is the pilot permitted to do under §107.29?", choices:["Turn the lighting off entirely for the remainder of the flight", "Reduce the lighting's intensity if doing so improves safety, but not extinguish it entirely", "Nothing — lighting settings may never be adjusted in flight", "Land immediately, since any glare issue makes the flight non-compliant"], a:1, exp:"§107.29 allows the remote PIC to reduce anti-collision lighting intensity when it serves safety, such as reducing glare, but the light may never be fully extinguished."},
  {id:"pq108", topic:"Operations II", q:"Before conducting night operations, what must a remote pilot have completed, per §107.29?", choices:["A separate FAA night-operations certificate", "Initial or recurrent training/testing that specifically addresses night operations knowledge areas", "A logged minimum of 10 hours of daytime flight time", "A medical exam specific to night vision"], a:1, exp:"§107.29 conditions night operation on the remote PIC having completed training or testing covering night-operations knowledge areas — there's no separate certificate, minimum daytime hour requirement, or FAA night-vision medical exam."},
  {id:"pq109", topic:"Operations II", q:"For purposes of §107.29's night-operation requirements, when does 'night' begin?", choices:["At local sunset", "At the end of evening civil twilight", "One hour after sunset", "Whenever the pilot's visual observer determines visibility has dropped"], a:1, exp:"Aviation 'night' is the period from the end of evening civil twilight to the beginning of morning civil twilight — not sunset itself, which occurs somewhat earlier."},
  {id:"pq110", topic:"Operations II", q:"Which human-factors consideration is most relevant to night sUAS operations that doesn't apply the same way in daylight?", choices:["Increased risk of sunburn", "Reduced depth perception and other physiological effects of low illumination that the pilot must be able to recognize", "Higher battery drain from cold temperatures", "Greater likelihood of GPS multipath error"], a:1, exp:"Night flying introduces physiological effects like reduced depth perception under low illumination, which a remote PIC must be trained to recognize as part of operating safely at night."},
  {id:"pq111", topic:"Operations II", q:"A pilot's aircraft has a bright strobe mounted on the nose that is clearly visible from the front for over 3 statute miles, but is largely blocked by the airframe when viewed from directly behind. Does this configuration satisfy §107.29?", choices:["Yes, because the 3-statute-mile visibility threshold is met from at least one direction", "No — the lighting must be visible for 3 statute miles through the full 360° around the aircraft, not just from one side", "Yes, as long as the flight remains within visual line of sight", "No, but only because a single strobe can never meet the flash-rate requirement"], a:1, exp:"Meeting the distance requirement from only one angle isn't sufficient — §107.29 requires 360° visibility around the aircraft, so a light blocked from certain angles by the airframe doesn't comply."},
  {id:"pq112", topic:"Operations II", q:"In the PAVE risk-assessment checklist, what does the 'P' stand for?", choices:["Payload", "Pilot", "Position", "Propulsion"], a:1, exp:"P stands for Pilot — self-assessment of fitness to fly, including fatigue, currency, and stress."},
  {id:"pq113", topic:"Operations II", q:"In the PAVE risk-assessment checklist, what does the 'A' stand for?", choices:["Airspace", "Aircraft", "Altitude", "Authorization"], a:1, exp:"A stands for Aircraft — its airworthiness, equipment, and performance limitations for the planned mission."},
  {id:"pq114", topic:"Operations II", q:"A remote PIC is scouting a flight and notes nearby high-voltage power lines, rough terrain, and gusty crosswinds at the site. Which PAVE category do these considerations fall under?", choices:["Pilot", "Aircraft", "enVironment", "External pressures"], a:2, exp:"Terrain, obstacles, and weather conditions at the site are enVironment factors in the PAVE framework."},
  {id:"pq115", topic:"Operations II", q:"A remote PIC feels pressured to fly a job today because the client threatened to switch to a competitor if the shoot is delayed again. Under PAVE, this pressure is best categorized as:", choices:["Pilot", "Aircraft", "enVironment", "External pressures"], a:3, exp:"Deadlines, client demands, and similar pressures to fly despite risk factors fall under External pressures — the 'E' in PAVE."},
  {id:"pq116", topic:"Operations II", q:"Before a risky flight in gusty conditions, a pilot thinks, 'Nothing will happen to me — I've flown in worse.' Which hazardous attitude does this reflect?", choices:["Anti-authority", "Macho", "Invulnerability", "Resignation"], a:2, exp:"This is Invulnerability — the belief that accidents happen to other people, not oneself. The antidote thought is 'it could happen to me.'"},
  {id:"pq117", topic:"Operations II", q:"A remote PIC skips the preflight checklist under time pressure, thinking, 'Checklists are for people who don't know what they're doing — I don't need one.' Which hazardous attitude is this?", choices:["Anti-authority", "Impulsivity", "Macho", "Resignation"], a:0, exp:"Dismissing rules or procedures as unnecessary for oneself reflects the Anti-authority attitude — 'rules don't apply to me.' The antidote is to follow the rules, since they're usually there for a reason."},
  {id:"pq118", topic:"Operations II", q:"A remote PIC pushes forward with a challenging low-light flight near obstacles to impress a client with their piloting skill, despite personal doubts about the risk. Which hazardous attitude best fits this behavior?", choices:["Macho", "Invulnerability", "Anti-authority", "Resignation"], a:0, exp:"Taking on unnecessary risk to prove one's skill or ability is the Macho attitude. Its antidote is the thought 'taking chances is foolish.'"},
  {id:"pq119", topic:"Operations II", q:"Facing deteriorating weather mid-mission, a pilot thinks, 'There's nothing I can do about it now anyway,' and keeps flying without adjusting the plan. Which hazardous attitude does this represent?", choices:["Impulsivity", "Resignation", "Macho", "Anti-authority"], a:1, exp:"This is Resignation — feeling helpless to influence the outcome. The antidote is 'I'm not helpless, I can make a difference,' such as by adjusting the flight plan or landing early."},
  {id:"pq120", topic:"Operations II", q:"Mid-flight, a warning appears on the controller and the pilot immediately yanks the aircraft into a sharp climb without first assessing what the warning means. Which hazardous attitude does this best illustrate?", choices:["Impulsivity", "Invulnerability", "Resignation", "Anti-authority"], a:0, exp:"Acting immediately without pausing to think through the situation reflects Impulsivity — 'do something now.' The antidote is 'not so fast, think first.'"},
,
  {id:"pq121", topic:"Regulations", q:"What is the minimum age to be eligible for an FAA remote pilot certificate with a small UAS rating under \u00a7107.61?", choices:["16 years old", "14 years old", "18 years old", "21 years old"], a:0, exp:"\u00a7107.61(a) sets the minimum age for a remote pilot certificate at 16 \u2014 younger than the 17-year minimum for most manned-aircraft pilot certificates."},
  {id:"pq122", topic:"Regulations", q:"Does the FAA require a remote pilot certificate applicant to hold a medical certificate, like a manned-aircraft pilot?", choices:["Yes, a third-class medical certificate is mandatory", "Yes, but only a first-class medical certificate qualifies", "No \u2014 \u00a7107.61(c) instead requires the applicant to self-certify they have no physical or mental condition that would interfere with safe operation", "No medical or fitness standard applies at all"], a:2, exp:"Part 107 has no formal medical certificate requirement; \u00a7107.61(c) relies on self-certification that no disqualifying physical or mental condition exists."},
  {id:"pq123", topic:"Regulations", q:"Under \u00a7107.61(b), what language proficiency must a remote pilot certificate applicant demonstrate?", choices:["No language requirement exists", "Fluency in any FAA-recognized language", "Proficiency in aviation radio phraseology only, not general English", "The ability to read, speak, write, and understand English, with medical-reason exceptions allowing operating limitations instead"], a:3, exp:"\u00a7107.61(b) requires English proficiency; an applicant unable to meet it for medical reasons may instead receive operating limitations on the certificate."},
  {id:"pq124", topic:"Regulations", q:"What is the minimum passing score on the Part 107 initial aeronautical knowledge test?", choices:["60%", "70%", "65%", "80%"], a:1, exp:"The FAA sets the passing grade for the Part 107 initial knowledge test (60 questions, 120 minutes) at 70%, per \u00a7107.67(c) procedures."},
  {id:"pq125", topic:"Regulations", q:"An applicant fails the Part 107 initial knowledge test. Under \u00a7107.71, how soon may they retest?", choices:["After 14 calendar days", "Immediately, no waiting period", "After 30 calendar days", "After 90 calendar days"], a:0, exp:"\u00a7107.71 bars reapplying for the knowledge test for 14 calendar days after a failed attempt."},
  {id:"pq126", topic:"Regulations", q:"How does a certificated remote pilot satisfy the aeronautical knowledge recency requirement of \u00a7107.65 today?", choices:["By retaking and passing the paid recurrent knowledge test every 12 months", "Recency is permanent once the initial certificate is issued \u2014 nothing further is required", "By logging 100 hours of flight time every 2 years", "By completing a free, online recurrent training course within the previous 24 calendar months"], a:3, exp:"Since the April 2021 rule change, \u00a7107.65 recency is satisfied by free online recurrent training every 24 calendar months \u2014 the paid recurrent knowledge test was eliminated."},
  {id:"pq127", topic:"Regulations", q:"Under \u00a7107.7, what must a remote pilot in command do with their remote pilot certificate while exercising its privileges?", choices:["Leave it at their home address for safekeeping", "Mail a copy to the FAA before every flight", "Have it in their physical possession and present it on request to the FAA, NTSB, law enforcement, or TSA", "Nothing \u2014 no possession requirement exists"], a:2, exp:"\u00a7107.7 requires the certificate be readily accessible and produced on request from the Administrator, NTSB, any law enforcement officer, or TSA."},
  {id:"pq128", topic:"Regulations", q:"A remote pilot certificate applicant was convicted of a drug-related offense 8 months before applying. What does \u00a7107.57 say about this?", choices:["It is irrelevant to remote pilot certification", "It is grounds for denying the application for up to 1 year after the conviction date", "It permanently bars the person from ever holding a remote pilot certificate", "It only matters if the conviction happened while operating a UAS"], a:1, exp:"\u00a7107.57 makes a qualifying drug or alcohol conviction grounds for denial for up to 1 year after the conviction, or for suspension/revocation of an existing certificate."},
  {id:"pq129", topic:"Regulations", q:"As of 2026, what does FAA small UAS registration cost, and how long does it remain valid?", choices:["$5, valid for 3 years", "$5, valid for 1 year", "$25, valid for 3 years", "Free, valid indefinitely"], a:0, exp:"FAA DroneZone registration costs $5 and is valid for 3 years before renewal is required."},
  {id:"pq130", topic:"Regulations", q:"A Part 107 operator's aircraft weighs 0.4 lb (under 250 g) at takeoff. Must it still be registered?", choices:["No \u2014 the 250 g exemption applies to all operations", "Only if it carries a camera", "Only if it will be flown over people", "Yes \u2014 the sub-0.55 lb registration exemption applies only to the recreational flyer exception, not to Part 107 operations"], a:3, exp:"The under-0.55 lb registration exemption applies solely to the recreational Exception for Limited Recreational Operations; any Part 107 operation must register the aircraft regardless of weight."},
  {id:"pq131", topic:"Regulations", q:"By what date did the FAA end its discretionary enforcement policy and require full operational compliance with Remote ID?", choices:["September 16, 2023", "January 1, 2024", "March 16, 2024", "June 30, 2024"], a:2, exp:"The FAA extended discretionary enforcement six months, from September 16, 2023 to March 16, 2024, after which Remote ID compliance became fully enforced."},
  {id:"pq132", topic:"Regulations", q:"How does using a Remote ID broadcast module (rather than a Standard Remote ID aircraft) affect an operation?", choices:["It has no operational effect \u2014 both comply identically", "It restricts the operation to visual line of sight, since a broadcast module has no built-in ability to support BVLOS compliance", "It requires an additional FRIA authorization", "It doubles the required registration fee"], a:1, exp:"Aircraft complying via a broadcast module must be flown within VLOS; Standard Remote ID aircraft carry the broadcast function natively and aren't limited this way."},
  {id:"pq133", topic:"Regulations", q:"Which of the following Part 107 rules is on the \u00a7107.205 list of regulations the FAA may waive?", choices:["\u00a7107.31 \u2014 Visual line of sight aircraft operation", "\u00a7107.15 \u2014 Condition for safe operation", "\u00a7107.49 \u2014 Preflight familiarization and inspection", "\u00a7107.7 \u2014 Inspection, testing, and demonstration of compliance"], a:0, exp:"\u00a7107.205 lists \u00a7107.31 (VLOS) among the waivable sections; \u00a7\u00a7107.15, 107.49, and 107.7 do not appear on that list."},
  {id:"pq134", topic:"Regulations", q:"What must be true for a Part 107 operator to fly at night without a waiver?", choices:["A \u00a7107.29 night waiver is still required in all cases", "Night flight is categorically prohibited under Part 107", "Only a visual observer, not the remote PIC, needs night training", "The remote PIC completed night-inclusive training/testing after April 6, 2021, and the aircraft has anti-collision lighting visible for at least 3 statute miles"], a:3, exp:"Since the April 2021 rule change, night operations no longer require a waiver \u2014 \u00a7107.29 instead requires post-April 6, 2021 training and anti-collision lighting visible for 3 statute miles."},
  {id:"pq135", topic:"Regulations", q:"A certificated Part 107 remote pilot wants to also fly under the recreational exception (49 U.S.C. \u00a744809) on a separate occasion. Do they need to pass TRUST?", choices:["No \u2014 the Part 107 knowledge test always substitutes for TRUST", "No \u2014 TRUST only applies to people who have never been certificated", "Yes \u2014 a remote pilot certificate holder who wants to fly under the recreational exception must still pass TRUST for that flight", "Yes, but only if flying a different aircraft than their Part 107 drone"], a:2, exp:"TRUST and the Part 107 knowledge test serve different operating frameworks; a Part 107 certificate holder flying under the recreational exception must still pass TRUST for that operation."},
  {id:"pq136", topic:"Regulations", q:"What does \u00a7107.36 prohibit a small unmanned aircraft from carrying?", choices:["Any payload exceeding 5 lbs", "Hazardous material, as defined in 49 CFR 171.8", "Cameras with a resolution above 20 megapixels", "More than one battery"], a:1, exp:"\u00a7107.36 bars a small UAS from carrying hazardous material, using the definition in 49 CFR 171.8."},
  {id:"pq137", topic:"Regulations", q:"Per \u00a7107.19, when must a remote pilot in command be designated for a small UAS operation?", choices:["Before or during the flight", "Only after the flight is complete, for reporting purposes", "Only if the flight will exceed 30 minutes", "Designation is optional if a visual observer is present"], a:0, exp:"\u00a7107.19(a) requires a remote PIC to be designated before or during the flight; that person is directly responsible for and has final authority over the operation."},
  {id:"pq138", topic:"Regulations", q:"How does \u00a7107.15's 'condition for safe operation' duty differ from the preflight check required by \u00a7107.49?", choices:["They are identical and redundant", "\u00a7107.15 only applies to aircraft over 55 lbs", "\u00a7107.49 is the continuing duty and \u00a7107.15 is the one-time check", "\u00a7107.15 is a continuing duty \u2014 a pilot may not continue flight once they know or have reason to know the aircraft is no longer safe, not just a one-time preflight check"], a:3, exp:"\u00a7107.15 imposes an ongoing safety obligation throughout the flight, distinct from \u00a7107.49's preflight assessment and inspection requirement."},
  {id:"pq139", topic:"Regulations", q:"Under \u00a7107.51(d), what is the full minimum cloud clearance requirement for a small UAS?", choices:["500 ft below the cloud only", "1,000 ft below and 1 mile horizontally", "500 ft below and 2,000 ft horizontally from the cloud", "No cloud clearance requirement applies below 400 ft AGL"], a:2, exp:"\u00a7107.51(d) requires both vertical (500 ft below) and horizontal (2,000 ft) clearance from clouds, not vertical clearance alone."},
  {id:"pq140", topic:"Regulations", q:"What is the minimum flight visibility required under \u00a7107.51(c), as observed from the control station?", choices:["1 statute mile", "3 statute miles", "5 statute miles", "10 statute miles"], a:1, exp:"\u00a7107.51(c) requires at least 3 statute miles of flight visibility as observed from the control station."},
  {id:"pq141", topic:"Regulations", q:"Under \u00a7107.39, a small UAS may be operated over a human being who is NOT a subpart D category participant if which condition is met?", choices:["The person is located under a covered structure or inside a stationary vehicle that provides reasonable protection from a falling aircraft", "The aircraft is flown above 200 ft AGL", "The operation lasts less than 5 minutes", "The remote pilot has more than 2 years of experience"], a:0, exp:"\u00a7107.39 permits operation over a non-participant only if they're a direct participant, under a covered structure or inside a stationary vehicle, or the operation meets a subpart D category."},
  {id:"pq142", topic:"Regulations", q:"What does \u00a7107.43 require regarding airport operations, separate from the airspace authorization duty of \u00a7107.41?", choices:["A remote pilot must never operate within 5 miles of any airport", "Airport operations always require a control tower phone call", "\u00a7107.43 duplicates \u00a7107.41 exactly", "A remote pilot may not operate in a manner that interferes with operations and traffic patterns at any airport, heliport, or seaplane base"], a:3, exp:"\u00a7107.43 is a standalone prohibition on interfering with airport traffic patterns \u2014 distinct from \u00a7107.41's separate controlled-airspace authorization requirement."},
  {id:"pq143", topic:"Regulations", q:"Per \u00a7107.45, what is required to operate a small UAS in a prohibited or restricted area?", choices:["Nothing \u2014 Part 107 exempts sUAS from these restrictions", "Permission from the using or controlling agency for that area", "A \u00a7107.200 waiver only", "A LAANC authorization only"], a:1, exp:"\u00a7107.45 requires permission from the using or controlling agency before operating in a prohibited or restricted area \u2014 a separate requirement from airspace-class authorization."},
  {id:"pq144", topic:"Regulations", q:"Which CFR sections does \u00a7107.47 require a remote pilot in command to comply with regarding NOTAM-designated flight restrictions?", choices:["\u00a7\u00a791.137 through 91.145 and \u00a799.7", "\u00a7\u00a7107.1 through 107.9 only", "\u00a748.15 only", "\u00a789.105 only"], a:0, exp:"\u00a7107.47 incorporates the Part 91 temporary flight restriction sections (\u00a7\u00a791.137\u201391.145) and \u00a799.7 by reference for small UAS operations."},
  {id:"pq145", topic:"Regulations", q:"During an in-flight emergency, what does \u00a7107.21 permit a remote pilot in command to do?", choices:["Nothing \u2014 Part 107 has no emergency deviation provision", "Only land immediately with no other deviation permitted", "Deviate from any rule of Part 107 to the extent necessary to meet the emergency, with a written report available on request", "Contact ATC before any deviation is legal"], a:2, exp:"\u00a7107.21 allows deviation from any Part 107 rule as necessary to address an in-flight emergency, and requires a written report to the Administrator upon request."},
  {id:"pq146", topic:"Airspace", q:"On a sectional chart, what airspace class does a dashed blue line denote?", choices:["Class D", "Class C", "Class E surface area", "Class B"], a:0, exp:"A dashed blue line marks the lateral boundary of Class D airspace \u2014 smaller towered airports without radar approach control."},
  {id:"pq147", topic:"Airspace", q:"A dashed magenta line around an airport on a sectional chart indicates what?", choices:["The airport has no control tower", "Class E airspace that begins at the surface (a Class E surface area)", "A Restricted Area boundary", "The 700 ft AGL floor of overlying Class E airspace"], a:1, exp:"A dashed magenta line marks a Class E surface area \u2014 Class E airspace extending down to the ground, typically at a non-towered field with an instrument approach."},
  {id:"pq148", topic:"Airspace", q:"Fading (shaded) magenta on a sectional chart, without an underlying dashed boundary, indicates Class E airspace beginning at what altitude?", choices:["The surface", "1,200 ft AGL", "700 ft AGL", "18,000 ft MSL"], a:2, exp:"Fading magenta marks a Class E floor of 700 ft AGL, contrasting with fading blue, which marks the 1,200 ft AGL floor."},
  {id:"pq149", topic:"Airspace", q:"Why is Class A airspace essentially irrelevant to standard Part 107 operations?", choices:["Class A never requires authorization, so it doesn't matter", "Class A only exists over international waters", "Class A airspace has no altitude limit, so it always includes 400 ft AGL", "Class A begins at 18,000 ft MSL and extends to FL600 \u2014 far above the 400 ft AGL ceiling standard Part 107 flights operate under"], a:3, exp:"Class A spans 18,000 ft MSL to FL600; since \u00a7107.51 caps standard operations at 400 ft AGL, sUAS flights never reach it."},
  {id:"pq150", topic:"Airspace", q:"A UAS Facility Map divides controlled airspace into 1 NM x 1 NM grid cells, each showing a maximum LAANC-eligible altitude. Which of these is one of the standard ceiling values used?", choices:["150 ft AGL", "175 ft AGL", "225 ft AGL", "350 ft AGL"], a:0, exp:"UAS Facility Map grid cells use standard ceiling increments of 0, 50, 100, 150, 200, 300, or 400 ft AGL."},
  {id:"pq151", topic:"Airspace", q:"A UAS Facility Map grid cell shows a ceiling of 0 ft. What does this mean for a remote pilot?", choices:["Flight is permanently banned in that grid cell", "Near-real-time LAANC approval isn't available there; the pilot must submit a further coordination request instead", "The grid cell is Class G and no authorization is needed", "The grid cell only applies to recreational flyers"], a:1, exp:"A 0 ft grid value means automatic LAANC approval isn't available at that location \u2014 not that flight is impossible \u2014 and a manual further coordination request may still be submitted."},
  {id:"pq152", topic:"Airspace", q:"How far in advance can a manual 'further coordination' airspace authorization request be submitted through FAADroneZone?", choices:["24 hours", "7 days", "Up to 90 days", "There is no advance-submission window"], a:2, exp:"Manual further coordination requests, like LAANC requests, may be submitted up to 90 days before the planned flight, with the FAA aiming to decide within that same window."},
  {id:"pq153", topic:"Airspace", q:"The FAA's stadium flight restriction prohibits drone operations within 3 nautical miles of a venue during which events?", choices:["Any concert or public gathering of more than 500 people", "High school and youth sporting events nationwide", "Any outdoor event lasting more than 2 hours", "Major League Baseball, NFL, NCAA Division One football, and NASCAR Sprint Cup/IndyCar/Champ Series races, from 1 hour before to 1 hour after"], a:3, exp:"Per current FAA guidance, the stadium restriction covers MLB, NFL, NCAA D-I football, and top-tier NASCAR races, running from 1 hour before to 1 hour after the event, within 3 NM of the venue."},
  {id:"pq154", topic:"Airspace", q:"Which 14 CFR section authorizes the FAA to issue a NOTAM restricting flight in the vicinity of a disaster or hazard area, such as to support firefighting aircraft?", choices:["\u00a791.137", "\u00a791.141", "\u00a791.143", "\u00a7107.51"], a:0, exp:"\u00a791.137 lets the FAA designate temporary flight restrictions to protect persons/property from a surface hazard and to give disaster relief aircraft, like wildfire tankers, a safe operating environment."},
  {id:"pq155", topic:"Airspace", q:"A VIP movement TFR (e.g., for presidential travel) is established under \u00a791.141. How is its size and duration determined?", choices:["A fixed 3 NM radius, identical every time", "It's event-specific, published via NOTAM rather than a standard fixed radius", "It's always identical to the DC SFRA", "It never affects small UAS, only manned aircraft"], a:1, exp:"Unlike the fixed-parameter stadium restriction, a \u00a791.141 VIP TFR's size and duration vary by event and are published in the specific NOTAM."},
  {id:"pq156", topic:"Airspace", q:"Which CFR section restricts flight in the proximity of space launch or reentry operations?", choices:["\u00a791.137", "\u00a791.141", "\u00a791.143", "\u00a799.7"], a:2, exp:"\u00a791.143, 'Flight limitation in the proximity of space flight operations,' covers restrictions near launch and reentry activity."},
  {id:"pq157", topic:"Airspace", q:"Inside the Washington, D.C. Flight Restricted Zone (FRZ), what must a Part 107 operator do before flying?", choices:["Nothing beyond a standard LAANC request", "File a VFR flight plan only", "Nothing, since the FRZ only restricts manned aircraft", "Obtain specific FAA/TSA authorization \u2014 the FRZ prohibits UAS flight without it"], a:3, exp:"The DC FRZ, the innermost ring of the DC SFRA, prohibits UAS operations absent a specific waiver/authorization coordinated through the FAA and TSA."},
  {id:"pq158", topic:"Airspace", q:"Under what authority has the National Park Service banned drone launching, landing, and operation across NPS lands?", choices:["36 CFR 1.5, via NPS Policy Memorandum 14-05", "14 CFR \u00a7107.45", "The DC Flight Restricted Zone", "There is no NPS-wide ban \u2014 it's park-by-park"], a:0, exp:"NPS Policy Memorandum 14-05 directs superintendents to use the closure authority in 36 CFR 1.5 to ban launching, landing, or operating UAS across the park system \u2014 a restriction separate from FAA airspace class."},
  {id:"pq159", topic:"Airspace", q:"What is the primary function of the FAA's official B4UFLY app?", choices:["Submitting LAANC controlled-airspace authorization requests directly", "Providing situational awareness \u2014 airspace classification, restrictions, and active TFRs \u2014 for a given location", "Filing Remote ID broadcast module registrations", "Issuing \u00a7107.200 waivers"], a:1, exp:"B4UFLY is an airspace-awareness tool showing classification, restrictions, and TFRs; submitting a LAANC request itself is a separate function some approved apps also offer."},
  {id:"pq160", topic:"Airspace", q:"A remote pilot has \u00a7107.41 authorization to fly in the Class D airspace where their operation sits. Does that also clear them to fly inside a Restricted Area overlapping that same airspace?", choices:["Yes, one authorization covers both automatically", "Restricted Areas can never overlap controlled airspace", "No \u2014 special use airspace like a Restricted Area is a separate overlay, and permission from its using/controlling agency is independently required", "Only Prohibited Areas require separate permission, not Restricted Areas"], a:2, exp:"Special use airspace sits as an overlay independent of the underlying A-G classification; satisfying a controlled-airspace authorization doesn't excuse the separate permission a Restricted Area requires."},
  {id:"pq161", topic:"Airspace", q:"Federal (Victor) airways are a form of Class E airspace. Why do they rarely factor into standard Part 107 planning?", choices:["They only exist over open ocean", "Victor airways are reserved exclusively for military traffic", "They were eliminated when GPS navigation became standard", "Their floor is typically 1,200 ft AGL \u2014 well above the 400 ft AGL ceiling for standard Part 107 operations"], a:3, exp:"Victor airways are Class E airspace with a floor typically at 1,200 ft AGL, above where standard 400-ft-AGL-ceiling Part 107 flights normally operate."},
  {id:"pq162", topic:"Airspace", q:"What are the typical lateral and vertical dimensions of Class D airspace around its primary airport?", choices:["Surface to 2,500 ft AGL, out to 4 NM from the airport", "Surface to 700 ft AGL, out to 10 NM", "1,200 ft AGL to 18,000 ft MSL, out to 4 NM", "Surface to 10,000 ft MSL, out to 20 NM"], a:0, exp:"Class D airspace typically extends from the surface to 2,500 ft AGL within about 4 NM of the primary airport, though specific dimensions can vary by location."},
  {id:"pq163", topic:"Airspace", q:"Who publishes and maintains the UAS Facility Maps that define LAANC grid-cell altitude ceilings?", choices:["Individual UAS Service Suppliers (USS), each maintaining their own version", "The FAA", "Local airport authorities, independently of the FAA", "The National Park Service"], a:1, exp:"The FAA publishes and maintains the UAS Facility Maps; approved USS apps consume that same FAA data to process LAANC requests."},
  {id:"pq164", topic:"Airspace", q:"Can a LAANC-authorized grid cell ceiling ever exceed 400 ft AGL?", choices:["Yes, up to 500 ft AGL near Class B airports", "Yes, without limit inside Class D airspace", "No \u2014 UAS Facility Map ceilings top out at 400 ft AGL, matching the general Part 107 operating limit", "Yes, but only for Category 4 aircraft"], a:2, exp:"UAS Facility Map grid ceilings never exceed 400 ft AGL, consistent with \u00a7107.51's general altitude limit for standard operations."},
  {id:"pq165", topic:"Airspace", q:"On a sectional chart, an airport symbol printed in blue rather than magenta tells you what?", choices:["The airport is permanently closed", "The airport is inside a Restricted Area", "The airport has no instrument approach", "The airport has an operating control tower"], a:3, exp:"A blue airport symbol indicates an airport with an operating control tower; a magenta symbol indicates no operating tower."},
  {id:"pq166", topic:"Weather", q:"Under 14 CFR \u00a7107.51(d), a remote pilot must keep the small UAS how far from clouds?", choices:["At least 500 ft below and 1,000 ft horizontally", "At least 1,000 ft below and 2,000 ft horizontally", "At least 500 ft below and 2,000 ft horizontally", "Cloud clearance requirements do not apply to small UAS"], a:2, exp:"\u00a7107.51(d) requires remaining at least 500 ft below and 2,000 ft horizontally from clouds at all times."},
  {id:"pq167", topic:"Weather", q:"The 3-statute-mile minimum visibility required under \u00a7107.51(c) is measured relative to what location?", choices:["The location of the control station, as observed by the remote pilot", "The nearest airport with weather reporting equipment", "The aircraft's actual position, regardless of pilot position", "Whichever nearby location has less restrictive visibility"], a:0, exp:"\u00a7107.51(c) defines flight visibility as observed from the control station's location \u2014 a distant airport's METAR can't substitute for what the remote pilot can actually see on site."},
  {id:"pq168", topic:"Weather", q:"A TAF contains the group 'BECMG 1416'. What does BECMG indicate?", choices:["A brief, sub-hour fluctuation in conditions", "A rapid change beginning precisely at 1400Z", "The probability of thunderstorms during the period", "A gradual change expected to occur sometime within the 1400-1600Z window"], a:3, exp:"BECMG (\"becoming\") signals a gradual change expected sometime within the stated time window, unlike FM's rapid, pinpointed change or TEMPO's brief fluctuations."},
  {id:"pq169", topic:"Weather", q:"A TAF includes 'PROB40 2022 1/2SM TSRA'. What does the PROB40 group communicate?", choices:["A 40-49% probability of the stated thunderstorm/heavy-precipitation conditions occurring in that window", "The forecaster is 40% confident the entire TAF is accurate", "Wind gusts up to 40 knots are expected", "The forecast will be updated again in 40 minutes"], a:0, exp:"PROB30/PROB40 groups express the forecaster's estimated probability (30-39% or 40-49%) that thunderstorms or heavy precipitation will occur during the stated period."},
  {id:"pq170", topic:"Weather", q:"A METAR ends its body with 'A2992'. What does this group report?", choices:["Wind gusting to 29.92 knots", "Ambient temperature of 29.92\u00b0C", "Visibility of 29.92 statute miles", "The altimeter setting: 29.92 inches of mercury"], a:3, exp:"The A-group reports the current altimeter setting in inches of mercury with the decimal implied \u2014 A2992 is 29.92 inHg."},
  {id:"pq171", topic:"Weather", q:"Everything appearing after 'RMK' in a METAR is:", choices:["A repeat of the main body for redundancy", "Reserved exclusively for military reporting stations", "The remarks section, carrying additional detail like peak wind and precise temperature/dewpoint not given in the main body", "A log of the station's prior METARs from that day"], a:2, exp:"RMK introduces the remarks section, which adds detail such as peak wind (PK WND) and tenths-of-a-degree temperature/dewpoint beyond what the rounded main body reports."},
  {id:"pq172", topic:"Weather", q:"A METAR reports 'BR' rather than 'FG' in its present-weather group. What does this distinction tell a remote pilot?", choices:["BR and FG are interchangeable codes for the same condition", "BR (mist) is reported at or above 5/8 statute mile visibility, while FG (fog) is reported once visibility drops below 5/8 statute mile", "BR only occurs at night; FG only occurs during the day", "BR indicates freezing conditions while FG does not"], a:1, exp:"Per the Aeronautical Information Manual, mist (BR) is reported at or above 5/8 SM visibility with high humidity, while fog (FG) marks the same obscuration once visibility falls below 5/8 SM."},
  {id:"pq173", topic:"Weather", q:"A remote pilot plans a sunrise launch after a clear, calm, high-humidity night. What weather hazard is this combination most likely to produce at the site?", choices:["Radiation fog, formed as the ground radiates away heat and chills near-surface air to its dew point overnight", "Thunderstorm gust fronts", "Severe turbulence from a passing cold front", "Volcanic ash contamination"], a:0, exp:"Clear skies, calm wind, and a moist air mass overnight are the classic setup for radiation fog \u2014 a real visibility hazard to check for before an early launch."},
  {id:"pq174", topic:"Weather", q:"A remote pilot notes calm wind at the surface but plans to operate up to 400 ft AGL. Why might wind speed at that altitude be meaningfully higher than what's felt on the ground?", choices:["It wouldn't be \u2014 wind speed is constant through the lowest 400 ft", "Wind speed only increases above 10,000 ft MSL", "Surface friction slows wind near the ground, and that frictional effect diminishes with height, so wind speed typically increases within the lower few hundred feet", "Density altitude causes wind speed to decrease with height"], a:2, exp:"Surface friction suppresses near-ground wind; as height increases through the atmospheric boundary layer that drag lessens, so wind speed typically rises \u2014 surface-calm conditions don't guarantee calm air at 400 ft AGL."},
  {id:"pq175", topic:"Weather", q:"A multirotor's GPS-hold mode is designed to maintain position automatically. In gusty wind, what should a remote pilot still expect?", choices:["GPS-hold makes the aircraft immune to wind-induced drift", "GPS-hold disables itself automatically above 10 knots of wind", "Wind has no effect once GPS-hold is engaged; only manual mode is affected", "The aircraft may still drift or oscillate as the flight controller fights gusts near or beyond its control authority, especially during sudden gust spikes"], a:3, exp:"GPS-hold compensates for steady wind but has finite control authority; strong or gusty wind can still push the aircraft off position or induce oscillation as the controller struggles to keep up."},
  {id:"pq176", topic:"Weather", q:"A remote pilot plans a linear inspection mission with a steady 15-knot wind blowing directly along the flight path. Why can't the outbound and return legs be assumed to consume equal battery capacity?", choices:["Flying into the headwind leg requires more power to maintain groundspeed, consuming more battery than the tailwind-assisted return leg", "Wind never affects a multirotor's battery consumption, only fixed-wing aircraft", "Only fixed-wing aircraft are affected by headwind/tailwind asymmetry", "Battery consumption is identical because average groundspeed over the round trip is unchanged"], a:0, exp:"Flying against a headwind demands more thrust, and battery, to hold a given groundspeed than the tailwind-assisted return leg, so a round-trip plan should budget extra reserve for the higher-power outbound leg."},
  {id:"pq177", topic:"Weather", q:"How is density altitude technically defined?", choices:["The aircraft's true height above mean sea level", "The altitude at which the battery reaches minimum voltage", "Pressure altitude corrected for non-standard (deviation from ISA) temperature", "Indicated altitude corrected for wind speed"], a:2, exp:"Density altitude is pressure altitude corrected for temperature deviation from the International Standard Atmosphere \u2014 it's the altitude the air effectively behaves like, not a physical height."},
  {id:"pq178", topic:"Weather", q:"A manufacturer publishes a maximum wind-resistance rating of 10 m/s (about 19 knots) for a small UAS. What should a remote pilot take from this figure?", choices:["It's a rating with no real-world caution needed, since manufacturers test conservatively", "It represents the aircraft's tested limit, not a target \u2014 margin for gusts, obstacle-induced turbulence, and pilot error should be built in below that number", "It only applies to fixed-wing aircraft, not multirotors", "It is a legal minimum required by \u00a7107.51 before flight is authorized"], a:1, exp:"A manufacturer's published wind rating marks the edge of tested performance, not a safe operating target \u2014 remote pilots should plan with margin below it, since gusts and local turbulence can exceed the steady wind reported nearby."},
  {id:"pq179", topic:"Weather", q:"Which of these is the FAA-referenced source a remote pilot should consult for authoritative current and forecast aviation weather, including METARs, TAFs, and TFR data?", choices:["Any general-purpose smartphone weather app", "A local television news broadcast", "Social media posts from other pilots", "aviationweather.gov, operated by the National Weather Service's Aviation Weather Center"], a:3, exp:"aviationweather.gov, run by the NWS Aviation Weather Center, is the source cited in the FAA's Remote Pilot Study Guide for METARs, TAFs, AIRMETs/SIGMETs, and related aeronautical weather products."},
  {id:"pq180", topic:"Weather", q:"Routine TAFs at major U.S. airports are issued four times per day. Which schedule matches this issuance cycle?", choices:["0000Z, 0600Z, 1200Z, and 1800Z", "Every 3 hours, on the hour", "Only once at midnight local time", "On demand, whenever conditions change"], a:0, exp:"Routine TAFs are issued four times daily at 0000Z, 0600Z, 1200Z, and 1800Z, each covering a 24-to-30-hour period, and are amended between cycles if conditions change significantly."},
  {id:"pq181", topic:"Loading & Performance", q:"Under 14 CFR \u00a7107.3's definition of 'small unmanned aircraft,' the 55-pound weight limit is measured how?", choices:["At takeoff, including everything on board or otherwise attached to the aircraft", "The aircraft's empty weight only, excluding payload and battery", "The maximum weight the manufacturer certifies, regardless of actual payload flown", "Average weight across the full flight, accounting for battery burn"], a:0, exp:"\u00a7107.3 defines a small unmanned aircraft as weighing less than 55 lbs at takeoff, including everything on board or attached \u2014 battery and payload count toward that limit, not just the bare airframe."},
  {id:"pq182", topic:"Loading & Performance", q:"Under \u00a7107.49, what must a remote pilot confirm about any object attached to or carried by the small UAS before flight?", choices:["That it's registered separately with the FAA", "That it weighs less than 5 pounds", "That it's secured and does not adversely affect the flight characteristics or controllability of the aircraft", "That it has its own independent power source"], a:2, exp:"\u00a7107.49 requires the remote pilot to ensure any attached or carried object is secure and doesn't adversely affect the aircraft's flight characteristics or controllability \u2014 a direct preflight loading check."},
  {id:"pq183", topic:"Loading & Performance", q:"In the context of a small UAS operation, Crew (or Single-Pilot) Resource Management is best described as:", choices:["A checklist used only during the FAA knowledge test", "A requirement that applies only to operations with more than one aircraft", "A backup communication protocol used only during lost-link events", "The effective use of all available resources \u2014 people, equipment, and information \u2014 to manage workload and support safe decision-making"], a:3, exp:"CRM/SRM is about making full, effective use of every available resource \u2014 crew, equipment, and information \u2014 to manage workload and support sound aeronautical decision-making, a concept carried over from manned aviation into sUAS crews."},
  {id:"pq184", topic:"Loading & Performance", q:"Under \u00a7107.33, what must the remote PIC, the person manipulating the controls, and the visual observer do throughout a small UAS operation that uses a VO?", choices:["Maintain effective communication with each other at all times, and coordinate to scan for hazards and maintain awareness of the aircraft's position", "Rotate roles every 10 minutes to prevent fatigue", "File a joint report with the FAA within 24 hours of each flight", "Operate on separate, non-communicating frequencies to avoid distraction"], a:0, exp:"\u00a7107.33 requires the remote PIC, the person manipulating the controls, and the visual observer to maintain effective communication at all times and coordinate to scan for collision hazards and track the aircraft's position."},
  {id:"pq185", topic:"Loading & Performance", q:"A remote pilot flying solo is also operating a camera gimbal, monitoring a live video feed, and watching for air traffic. This scenario illustrates the risk of:", choices:["Improved situational awareness through multitasking", "Task saturation \u2014 workload exceeding what one person can safely manage, raising the chance of a missed hazard or control error", "A required operational configuration under \u00a7107.31", "A reduced legal minimum crew size"], a:1, exp:"Piling every task onto a single remote pilot risks task saturation, a core single-pilot resource management concern \u2014 workload management, such as adding a visual observer, helps keep it from degrading safety."},
  {id:"pq186", topic:"Loading & Performance", q:"A small UAS was factory-certified by its manufacturer as airworthy at a specific weight and CG range. Does that certification alone satisfy the remote pilot's preflight responsibility for every subsequent flight?", choices:["Yes \u2014 once certified, no further weight or balance check is required", "Yes, but only for flights within 30 days of certification", "No \u2014 the remote pilot must confirm the aircraft's actual loaded weight and balance falls within limits before each individual flight, since payload and configuration can change", "No \u2014 only a certificated aviation mechanic may make that determination before each flight"], a:2, exp:"Manufacturer certification establishes the aircraft's tested limits, but confirming the actual as-loaded weight and balance falls within those limits before every flight remains the remote pilot's own preflight responsibility under \u00a7107.49."},
  {id:"pq187", topic:"Loading & Performance", q:"A fixed-wing small UAS is loaded with its center of gravity near the aft limit of its published envelope. What handling change should the remote pilot expect compared to a more forward CG loading?", choices:["Increased longitudinal stability and easier stall recovery", "No change \u2014 CG position only affects multirotor aircraft", "Increased stall speed and reduced cruise speed", "Reduced longitudinal stability, more sensitive pitch control, and more difficult stall recovery"], a:3, exp:"Moving CG aft reduces longitudinal stability and pitch damping and makes stall recovery progressively harder \u2014 the same weight-and-balance principle used in manned fixed-wing aircraft applies to fixed-wing small UAS."},
  {id:"pq188", topic:"Loading & Performance", q:"A multirotor loaded close to its manufacturer's maximum gross weight encounters a sudden gust during flight. Why does this loading condition specifically increase risk in that moment?", choices:["Less reserve thrust is available above what's needed just to maintain level flight, leaving less margin for the extra power an emergency correction demands", "Heavier aircraft are inherently more resistant to gusts", "Maximum gross weight only affects fixed-wing aircraft, not multirotors", "Gross weight has no relationship to available thrust margin"], a:0, exp:"Near maximum gross weight, more of the aircraft's total thrust capability is already committed to sustaining level flight, leaving a smaller reserve of power for the sudden correction a gust demands."},
  {id:"pq189", topic:"Loading & Performance", q:"A heavily loaded small UAS draws significantly more current at hover than the same aircraft flown light. What direct electrical effect does this higher current draw have on the battery?", choices:["None \u2014 current draw has no relationship to output voltage", "Increased voltage sag, as the battery's internal resistance causes a larger voltage drop under the higher load", "Automatically extended flight time", "Reduced internal resistance, improving efficiency"], a:1, exp:"Higher current draw through a battery's internal resistance produces greater voltage sag \u2014 the heavier the load, the more voltage drops under demand, which can trigger low-voltage failsafes sooner than rated capacity alone would suggest."},
  {id:"pq190", topic:"Loading & Performance", q:"Part 107 itself does not publish a specific maximum payload or CG range for every small UAS model. Where should a remote pilot get that aircraft-specific loading information before flight?", choices:["From the general 55-lb small UAS weight definition in \u00a7107.3, which doubles as the payload limit for any airframe", "From the aircraft manufacturer's flight manual, operating handbook, or published specifications for that specific model", "From the nearest METAR report", "It doesn't need to be checked, since the knowledge test only covers general concepts"], a:1, exp:"\u00a7107.3's 55-lb figure defines what counts as a small UAS at all \u2014 it isn't a per-aircraft payload or CG spec. Aircraft-specific weight, balance, and performance limits come from that model's manufacturer documentation."},
  {id:"pq191", topic:"Operations I", q:"Under \u00a7107.37(a), a small UAS must yield the right of way not just to other aircraft but also to which additional categories of vehicles?", choices:["Ultralights and paragliders only", "Airborne vehicles and launch and reentry vehicles", "Aircraft operating under an active ATC clearance only", "Weather balloons only"], a:1, exp:"\u00a7107.37(a) requires a small UAS to yield right of way to all aircraft, airborne vehicles, and launch and reentry vehicles \u2014 a broader category than manned aircraft alone."},
  {id:"pq192", topic:"Operations I", q:"Per \u00a7107.37(a), what specifically counts as failing to yield the right of way to another aircraft?", choices:["Flying below 400 ft AGL near it", "Operating within 5 statute miles of it", "Passing over, under, or ahead of it unless well clear", "Using the same CTAF frequency it is monitoring"], a:2, exp:"\u00a7107.37(a) defines yielding as giving way and not passing over, under, or ahead of the other aircraft or vehicle unless well clear."},
  {id:"pq193", topic:"Operations I", q:"Beyond the right-of-way yielding requirement, \u00a7107.37(b) separately prohibits:", choices:["Operating a small UAS so close to another aircraft as to create a collision hazard", "Operating within Class B airspace without authorization", "Flying two small UAS simultaneously under one remote PIC", "Operating without a visual observer near an airport"], a:0, exp:"\u00a7107.37(b) is a standalone clause: no person may operate a small UAS so close to another aircraft as to create a collision hazard, independent of the yielding rule in (a)."},
  {id:"pq194", topic:"Operations I", q:"After deviating from a Part 107 rule under the in-flight emergency authority of \u00a7107.21, when must the remote PIC submit a written report of the deviation to the FAA?", choices:["Automatically within 24 hours", "Automatically within 10 calendar days", "Only if the deviation involved airspace, not altitude", "Only upon request by the FAA Administrator"], a:3, exp:"\u00a7107.21(b) requires a written report only upon request of the Administrator \u2014 there is no automatic filing deadline like the 10-day window in \u00a7107.9."},
  {id:"pq195", topic:"Operations I", q:"Under \u00a7107.21, how far may a remote PIC deviate from Part 107 operating rules during an in-flight emergency requiring immediate action?", choices:["Any deviation the pilot judges reasonable, regardless of the emergency", "Only to the extent necessary to meet the emergency", "Only deviations pre-approved in the operating manual", "No deviation is ever permitted under Part 107"], a:1, exp:"\u00a7107.21(a) limits emergency deviation to what is necessary to meet the emergency, not unlimited discretion."},
  {id:"pq196", topic:"Operations I", q:"Where would a remote pilot typically find the correct CTAF frequency for a non-towered airport before a flight near it?", choices:["The remote pilot certificate application", "Only by telephone request to the nearest ATC tower", "The Chart Supplement (and airport data on sectional charts)", "There is no published source for CTAF frequencies"], a:2, exp:"CTAF frequencies are published in the Chart Supplement and shown in the airport data on sectional charts, not obtained by certificate application or phone request."},
  {id:"pq197", topic:"Operations I", q:"At a non-towered airport, the CTAF a remote pilot monitors may actually be which type of frequency, depending on what services the field has?", choices:["A UNICOM, MULTICOM, FSS, or tower frequency, as identified in aeronautical publications", "Always 121.5, the emergency guard frequency", "Always a frequency used for nothing but CTAF", "A frequency assigned uniquely to each remote pilot certificate holder"], a:0, exp:"CTAF isn't a single dedicated frequency type \u2014 depending on the airport it may be a UNICOM, MULTICOM, FSS, or tower frequency, per the AIM."},
  {id:"pq198", topic:"Operations I", q:"A remote PIC needs to briefly exceed the 400 ft altitude limit to avoid an imminent mid-air collision with a manned aircraft. Is this permitted?", choices:["No, altitude and VLOS limits can never be waived even in a genuine emergency", "Only the altitude limit may be waived, never VLOS", "Only if a waiver was obtained before the flight began", "Yes \u2014 \u00a7107.21 permits deviation from any Part 107 rule to the extent necessary to meet the emergency"], a:3, exp:"\u00a7107.21's emergency authority covers deviation from any Part 107 rule, including altitude and VLOS limits, to the extent the emergency requires."},
  {id:"pq199", topic:"Operations I", q:"A remote pilot has a head cold with sinus congestion before a scheduled flight. In the IMSAFE checklist, this is most directly relevant to which factor?", choices:["Fatigue", "Illness", "Emotion", "Medication"], a:1, exp:"IMSAFE's 'I' is Illness \u2014 even a mild cold can impair judgment or cause pain from pressure changes, which is why it's assessed separately from fatigue or medication."},
  {id:"pq200", topic:"Operations I", q:"In the IMSAFE checklist, 'M' stands for:", choices:["Mission", "Morale", "Medication", "Maintenance"], a:2, exp:"IMSAFE's 'M' is Medication \u2014 even an over-the-counter drug can impair judgment or cause drowsiness enough to affect safe operation."},
  {id:"pq201", topic:"Operations I", q:"A remote pilot is grieving the recent loss of a family member and feels emotionally unsettled before a scheduled flight. Which IMSAFE factor most directly applies?", choices:["Emotion", "Stress", "Illness", "Fatigue"], a:0, exp:"IMSAFE's 'E' (Emotion) covers strong feelings like grief, anger, or anxiety that could interfere with safe decision-making, distinct from situational Stress."},
  {id:"pq202", topic:"Operations I", q:"What is the risk of not using closed-loop communication during a crew operation?", choices:["It increases radio congestion unnecessarily", "It violates the VLOS requirement of \u00a7107.31", "It requires a post-flight report to the FAA", "A hazard call or instruction may be misheard, with no one catching the error before it affects the flight"], a:3, exp:"Closed-loop communication exists to catch mishearing before it becomes a bad decision; skipping it removes that safety check, not because of any regulatory citation."},
  {id:"pq203", topic:"Operations I", q:"Under \u00a7107.31, the remote PIC, visual observer, and any person manipulating the controls must be able to see the small UAS using:", choices:["Binoculars or a spotting scope, if available", "Vision unaided by any device other than corrective lenses (spectacles or contact lenses)", "The live video downlink from the aircraft's camera", "Night-vision goggles during low-light operations"], a:1, exp:"\u00a7107.31(a) requires unaided vision except for corrective lenses \u2014 devices like binoculars or an FPV feed don't satisfy the VLOS requirement."},
  {id:"pq204", topic:"Operations I", q:"As of a 2022 FAA rule amendment, \u00a7107.9 is officially titled:", choices:["Accident reporting", "Mishap notification", "Safety event reporting", "Incident disclosure"], a:2, exp:"\u00a7107.9 was retitled 'Safety event reporting' by Amdt. 107-10 (87 FR 75846), effective December 9, 2022, replacing its original title of 'Accident reporting.'"},
  {id:"pq205", topic:"Operations I", q:"A small UAS crash damages a homeowner's fence, with repair estimated at $450. Must this be reported to the FAA under \u00a7107.9?", choices:["Yes, because any property damage from a small UAS must be reported", "Yes, but only within 30 days rather than 10", "No, because a fence is not considered 'property' under \u00a7107.9", "No \u2014 reporting isn't required when repair cost does not exceed $500"], a:3, exp:"\u00a7107.9(b)(1) exempts property damage from reporting when the cost of repair does not exceed $500."},
