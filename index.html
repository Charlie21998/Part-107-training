{
  id:"b6", title:"Maintenance, Troubleshooting & Field Operations", week:"Weeks 15–16",
  lessons:[
    {id:"b6l1", title:"A Systematic Method for Diagnosing Problems", content:`
      <p>When something goes wrong &mdash; a motor twitches, a wobble that wasn't there last flight, a warning light on arm &mdash; the instinct is to start swapping parts: new ESC, new motor, new flight controller, whichever's cheapest to try first. That's not troubleshooting, that's gambling with your parts bin. A <strong>systematic method</strong> treats a failure as a problem with a small number of possible causes, and works to isolate which one before you touch a screwdriver.</p>
      <p>Split every symptom into one of three <strong>failure domains</strong> before you diagnose further:</p>
      <ul>
        <li><strong>Power</strong> &mdash; battery, connectors, ESCs, voltage sag under load.</li>
        <li><strong>Signal</strong> &mdash; receiver, transmitter, telemetry link, RF interference from other equipment.</li>
        <li><strong>Mechanical</strong> &mdash; motors, bearings, prop balance, frame flex or damage.</li>
      </ul>
      <div class="diagram">${SVG_TROUBLESHOOT}<div class="dcap">Three failure domains, one symptom &mdash; trace power, signal, and mechanical branches before you start swapping parts.</div></div>
      <p>Once you know the domain, check the <strong>simplest explanation first</strong>. A motor spinning slower than its neighbors is far more likely to be a loose or lightly corroded connector than a dead flight controller &mdash; but if you start by re-flashing firmware, you've spent an hour ruling out the least likely cause first.</p>
      <p>Don't diagnose from memory or hunch when you have better evidence available. Betaflight's <strong>blackbox log</strong> and ArduPilot's <strong>dataflash log</strong> record exactly what happened in flight &mdash; motor output per channel, <strong>RSSI</strong> (received signal strength indicator &mdash; how strong the radio link was at each moment, a low or dropping value pointing straight at the signal domain), vibration levels, and voltage under load. A pack sagging noticeably more under full-throttle load than it used to — or more than a healthy, same-spec pack in the same aircraft — is worth flagging as a power-domain suspect before you assume the ESC firmware is at fault. Acceptable sag depends heavily on pack C-rating, cell count, and current draw, so there's no single universal voltage number to check against; a log-recorded baseline from a known-good pack is a far more reliable comparison than any fixed figure. Logs are evidence; your recollection of "it felt weird around the second flip" is not.</p>
      <div class="tip"><div class="clabel">Workshop Tip</div>Keep a simple log of every failure and fix, even minor ones. Patterns that aren't visible in a single incident &mdash; "this connector always seems to be the one" &mdash; jump out after three or four entries.</div>
      <div class="tip"><div class="clabel">Hands-On</div>Pull the blackbox or dataflash log from your last flight right now, even if nothing went wrong. Learn where voltage, RSSI, and motor output live in the viewer before you need to read them under pressure.</div>
      <div class="callout"><div class="clabel">Ask Yourself</div>If you replace a part and the problem goes away, have you actually learned what was wrong &mdash; or just gotten lucky?</div>
    `,
    quiz:[
      {id:"b6l1_q1", q:"What's the first step in a systematic troubleshooting approach when a quad exhibits a new problem?",
       choices:["Replace the most expensive component first","Isolate which failure domain — power, signal, or mechanical — the symptom points to before replacing anything","Immediately re-flash the flight controller firmware","Ask other pilots on a forum what part usually fails"],
       a:1, exp:"Isolating the domain first prevents wasted time and money chasing the wrong fix — parts-swapping without a hypothesis is guessing, not diagnosing."},
      {id:"b6l1_q2", q:"Why check blackbox or telemetry logs before forming a hypothesis about the cause of a problem?",
       choices:["They're required by the FAA for every flight","They provide objective evidence — voltage sag, RSSI, motor output — instead of relying on memory or guesswork","They automatically repair the underlying fault","They're only useful for post-crash investigations"],
       a:1, exp:"Logs record exactly what the aircraft experienced in flight. That's a far better starting point than recollection, which is easy to misremember under stress."},
      {id:"b6l1_q3", q:"A quad briefly loses power during aggressive maneuvers but flies fine otherwise. Which failure domain should you suspect first?",
       choices:["Signal domain","Power domain","Mechanical domain","Firmware domain"],
       a:1, exp:"Power sag under high current draw during aggressive throttle changes is a classic power-domain symptom — check the battery, connectors, and ESCs before anything else."},
      {id:"b6l1_q4", q:"During a bench test, one motor spins noticeably slower than the others. What should you check first?",
       choices:["Replace the flight controller","Check the ESC and motor connector for a loose, corroded, or damaged connection","Recalibrate the compass","Re-register the aircraft"],
       a:1, exp:"A loose or corroded connector is the simplest, most common explanation for one underperforming motor — rule it out before assuming a component failure."}
    ,
      {id:"b6l1_q5", q:"What's the naming difference between Betaflight's and ArduPilot's in-flight recording logs?", choices:["Blackbox is Betaflight's flight log, dataflash is ArduPilot's \u2014 different names for the same kind of recorded flight data", "Blackbox only records crashes, dataflash records every flight", "Dataflash is stored in the cloud, blackbox is stored locally", "They are the same file format, just renamed between firmware versions"], a:0, exp:"Both record real flight data like motor output, RSSI, vibration, and voltage \u2014 they're just named differently depending on which firmware you're running."},
      {id:"b6l1_q6", q:"What does a low or dropping RSSI value in a flight log point to?", choices:["The mechanical domain", "The power domain", "A GPS-only issue with no other implications", "The signal domain"], a:3, exp:"RSSI measures radio link strength \u2014 a low or dropping value points straight at the signal domain rather than power or mechanical causes."},
      {id:"b6l1_q7", q:"Why is there no single universal voltage number to check pack sag against, according to the lesson?", choices:["Voltage sag can't actually be measured in flight", "All packs sag identically regardless of specification", "Sag depends heavily on pack C-rating, cell count, and current draw, so a log-recorded baseline from a known-good pack is the better comparison", "Sag only matters for fixed-wing aircraft, not multirotors"], a:2, exp:"Because sag varies with C-rating, cell count, and current draw, comparing against a baseline from a known-good pack in the same aircraft is more reliable than any fixed voltage figure."},
      {id:"b6l1_q8", q:"Why does the lesson recommend keeping a simple log of every failure and fix, even minor ones?", choices:["It's required for warranty claims", "Patterns that aren't visible in a single incident become clear after three or four logged entries", "It replaces the need for blackbox or dataflash logs", "It's needed to register the aircraft with the FAA"], a:1, exp:"A single failure can look random; a logged pattern across several incidents \u2014 like the same connector failing repeatedly \u2014 only becomes visible with a record to compare against."}]},
    {id:"b6l2", title:"Preflight, Post-Crash, and Battery Lifecycle", content:`
      <p>Troubleshooting fixes problems after they show up. <strong>Maintenance discipline</strong> is what keeps most of them from showing up at all. It's less interesting than tuning PIDs, which is exactly why it gets skipped &mdash; until the flight it would have prevented.</p>
      <p>Run a real preflight check before every flight, not just a glance:</p>
      <ul>
        <li><strong>Props</strong> &mdash; check for nicks, chips, or stress-whitening near the hub; replace, don't fly on a damaged blade.</li>
        <li><strong>Frame</strong> &mdash; flex the arms gently by hand and look along them under raking light for hairline cracks, especially near mounting points.</li>
        <li><strong>Motor bearings</strong> &mdash; spin each motor by hand; it should feel smooth, with no grinding, grit, or side-to-side play.</li>
        <li><strong>Connectors</strong> &mdash; check XT60/bullet connectors for heat discoloration, looseness, or bent pins.</li>
        <li><strong>Firmware currency</strong> &mdash; confirm flight controller and receiver firmware match what you last tested and trust; don't discover a stale update mid-flight.</li>
      </ul>
      <div class="tip"><div class="clabel">Hands-On</div>Write this checklist on an index card or laminate it and keep it in your field kit. A checklist you have to recall from memory gets shortened under time pressure; one you can read doesn't.</div>
      <p>Post-crash inspection is its own separate discipline, and it applies after <strong>any</strong> hard impact &mdash; not just a visible tumble. Before the next flight, check specifically for a bent motor shaft (spin each motor and watch for wobble), hairline frame cracks near the arms and standoffs, and loose motor screws (a hard landing can back a screw out without snapping it). None of these reliably show up in a five-second glance.</p>
      <div class="tip"><div class="clabel">Case Study</div>A pilot clipped a fence post on landing, checked that the props still spun freely, and flew again the next weekend. A hairline crack near one arm's mounting point &mdash; invisible without raking light &mdash; had been quietly propagating under vibration. On the third flight after the impact, the arm let go mid-air. The postmortem: the frame damage was there the whole time, and a two-minute inspection would have caught it before the money got spent on a second replacement frame.</div>
      <p>Battery care is a lifecycle, not a single "is it charged" check. For storage between flying sessions, LiPo packs should sit around <span class="keyfact">3.80–3.85V per cell</span>, not full charge &mdash; most quality chargers have a storage-charge mode for exactly this; if yours doesn't, the practical fallback is to fly the pack down to roughly that range on a normal flight (rather than fully discharging it) and stop there for storage, checking individual cell voltages on a balance charger or cell checker to confirm you're in range. Track cycle count; a pack that's seen heavy use for a season is not the same battery it was new, even if it still holds a charge. Retire a pack immediately if it shows visible swelling or puffing, a punctured or damaged wrap, or a sharp rise in internal resistance &mdash; these aren't cosmetic issues, they're fire risk indicators.</p>
      <div class="tip"><div class="clabel">Case Study</div>A pack got fully charged before a trip that fell through, then sat in a drawer at 4.20V/cell for four months. When it finally came out, one cell had visibly puffed. Left at high voltage for that long, the cell chemistry degrades and can build internal gas pressure — a swollen pack is not something to "use up carefully," it's one to retire and dispose of properly.</div>
      <div class="tip"><div class="clabel">Workshop Tip</div>A damaged or swollen pack still needs careful handling on the way out, not just a decision to stop using it: keep it in a fire-safe bag or metal container until disposal, never in household trash, and either fully discharge it via a dedicated LiPo disposal service or a saltwater discharge method done correctly, or drop it at a battery-recycling collection point that accepts LiPo cells. The Reference Sheet's <span class="keyfact" data-ref="ref-battery-safety">Battery Safety</span> entry has the full disposal protocol.</div>
      <div class="callout"><div class="clabel">Why It Matters</div>A LiPo fire isn't a hypothetical safety-briefing line item — it's a fast, hard-to-extinguish chemical fire, and the packs most likely to start one are exactly the damaged or swollen ones a two-minute inspection would have caught.</div>
    `,
    quiz:[
      {id:"b6l2_q1", q:"What should you check before flying again after ANY hard landing or crash, even if the aircraft looks fine at a glance?",
       choices:["Nothing — if it powers on and the props spin, it's fine","Motor shafts for bending, the frame for hairline cracks, and motor screws for looseness","Only the battery's remaining charge","Only whether the propellers are the correct rotation"],
       a:1, exp:"Hard impacts can cause damage that isn't visible in a casual glance — bent shafts, hairline cracks, and backed-out screws all require a deliberate check, not just a look."},
      {id:"b6l2_q2", q:"What's the recommended storage voltage for a LiPo pack that won't be flown for an extended period?",
       choices:["Fully charged, around 4.20V per cell","Around 3.80–3.85V per cell","Fully discharged, around 3.0V per cell","Voltage doesn't matter as long as it's above 3.0V"],
       a:1, exp:"Storing at a mid-range voltage rather than full charge slows cell degradation. Most quality chargers have a dedicated storage-charge mode for this."},
      {id:"b6l2_q3", q:"Which of these is a legitimate reason to retire a LiPo pack rather than keep flying it?",
       choices:["It's more than six months old, regardless of condition","Visible swelling or puffing in one or more cells","It was charged at a slightly different rate than usual once","It has a different cell count than your other packs"],
       a:1, exp:"Swelling indicates internal degradation and rising fire risk — it's a retire-immediately signal, unlike age alone, which isn't by itself disqualifying."},
      {id:"b6l2_q4", q:"Why does a hairline frame crack from a hard landing remain dangerous even if the drone flies fine on the next few flights?",
       choices:["It doesn't — hairline cracks are purely cosmetic","Cracks propagate under repeated vibration and load, and can fail without warning on a later flight","It only ever affects GPS accuracy, not structural integrity","It automatically voids the aircraft's FAA registration"],
       a:1, exp:"A crack that doesn't fail immediately can still be growing with every flight's vibration. Flying fine today isn't evidence it will fly fine next week."}
    ,
      {id:"b6l2_q5", q:"What does the preflight prop check specifically look for, and what should you do if you find it?", choices:["Check for nicks, chips, or stress-whitening near the hub; replace rather than fly on a damaged blade", "Only check for correct rotation direction", "Weigh each prop and discard any outside a preset tolerance", "Check only that props spin freely, ignoring surface condition"], a:0, exp:"Nicks, chips, or stress-whitening are structural warning signs, not cosmetic \u2014 the lesson calls for replacement, not flying on a damaged blade."},
      {id:"b6l2_q6", q:"What technique does the lesson recommend for spotting hairline frame cracks during inspection?", choices:["Tapping the frame and listening for a change in pitch", "Flexing the arms gently by hand and looking along them under raking light, especially near mounting points", "Submerging the frame in water to look for air bubbles", "Weighing the frame against its original spec sheet"], a:1, exp:"Raking light reveals hairline cracks that a casual glance under normal lighting misses \u2014 exactly the kind of damage the fence-post case study shows going undetected."},
      {id:"b6l2_q7", q:"In the case study where a fully charged pack sat unused for four months, what happened and why?", choices:["The pack lost all capacity and became unusable, unrelated to voltage", "The pack caught fire spontaneously while in storage", "Nothing happened \u2014 full-charge storage has no long-term effect", "One cell visibly puffed, because leaving cells at high voltage for an extended period degrades the chemistry and can build internal gas pressure"], a:3, exp:"Storing at 4.20V/cell for months, rather than the recommended 3.80\u20133.85V storage range, let the cell chemistry degrade and build gas pressure."},
      {id:"b6l2_q8", q:"How should a damaged or swollen LiPo pack be handled on the way to disposal?", choices:["Thrown directly into household trash once fully discharged", "Left on a shelf indefinitely since it's no longer usable", "Kept in a fire-safe bag or metal container until proper disposal via a LiPo disposal service, correct saltwater discharge, or a battery-recycling collection point", "Punctured to release pressure before storage"], a:2, exp:"A damaged or swollen pack is still a fire risk right up until it's actually disposed of \u2014 fire-safe containment and a proper disposal channel are required, never household trash."}]},
    {id:"b6l3", title:"Field Operations: A Real Preflight-to-Postflight Routine", content:`
      <p>Bench maintenance keeps the aircraft airworthy. <strong>Field operations discipline</strong> is what keeps a given flight session safe, from the moment you arrive at the site to the moment you pack up.</p>
      <p>Start with a real <strong>site assessment</strong> before you unpack anything: walk the area, note obstacles and power lines, identify where people are and might move to, pick a launch/landing zone with a clear retreat path, and check whether other pilots nearby are using the same radio frequency or video channel — BFPVL1 covers exactly how VTX/goggle channel conflicts happen and why asking around before powering on matters.</p>
      <div class="diagram">${SVG_FIELDFLOW}<div class="dcap">Six steps, one hard stop &mdash; the Go/No-Go check is where a field day either continues or gets scrubbed.</div></div>
      <p>Stage your batteries and gear deliberately rather than digging through a bag mid-session: batteries in a fire-safe bag until they're going into the aircraft, tools laid out, spare props within reach. A genuine <strong>go/no-go checklist</strong>, run immediately before each flight, should cover:</p>
      <ul>
        <li>Weather (wind, visibility) within the aircraft's and your own limits.</li>
        <li>Batteries charged, at a reasonable temperature, and undamaged.</li>
        <li>Props secured, correct rotation, undamaged.</li>
        <li>Radio link check and failsafe behavior confirmed before takeoff.</li>
        <li>GPS lock acquired, if flying in a GPS-dependent mode.</li>
        <li>Flight path and landing zone clear of bystanders.</li>
      </ul>
      <div class="tip"><div class="clabel">Hands-On</div>Build this into a physical checklist card you actually hold and check off, not something you run through from memory. Under time pressure at a field, memory drops items — a card doesn't.</div>
      <p>Standard field kit worth carrying every time: spare props <strong>in matched sets</strong> (mixing a single new blade into an old set reintroduces imbalance), a tool set specific to your aircraft's screws, a fire-safe LiPo bag for charging, transport, and any damaged pack, more charged batteries than you think you'll need, and a reliable way to check current weather &mdash; a handheld wind meter or a weather app with live conditions, not a guess based on how it feels standing there.</p>
      <div class="tip"><div class="clabel">Workshop Tip</div>Weight and pad your field kit the same way every time you pack it, so a missing item is obvious at a glance rather than discovered at the flying site.</div>
      <p>At a shared flying site, basic etiquette is also a safety practice: announce your launches, keep clear of other pilots' flight lines and frequencies, brief anyone acting as a visual observer on what to watch for, and never fly directly over bystanders regardless of altitude.</p>
      <div class="callout"><div class="clabel">Why It Matters</div>Most field incidents aren't caused by a component failing in some unforeseeable way — they're caused by skipping a step that was already on a checklist somewhere, under the pressure of "we're already here, let's just fly."</div>
    `,
    quiz:[
      {id:"b6l3_q1", q:"What belongs on a genuine go/no-go checklist run immediately before flight?",
       choices:["Only confirming the aircraft powers on","Weather within limits, batteries charged and undamaged, radio/failsafe check, props secure, area clear of bystanders","Only checking the memory card has free space","Whether other pilots at the field are watching"],
       a:1, exp:"A real go/no-go checklist covers every domain that could cause a problem in flight — weather, power, control link, mechanical, and people in the flight path."},
      {id:"b6l3_q2", q:"Why should spare propellers be kept and installed as matched sets rather than swapping in a single replacement blade?",
       choices:["Matched sets preserve rotational balance, preventing vibration that mismatched blades can introduce","It's purely a cosmetic preference","Any propeller works interchangeably with any other","Regulations require props to be sold and used in matched sets"],
       a:0, exp:"Even small manufacturing differences between mismatched props can introduce vibration that stresses motors and bearings over time — matched sets avoid that."},
      {id:"b6l3_q3", q:"Which item in a standard field kit is a genuine safety necessity rather than just a convenience?",
       choices:["Extra charging cables","A fire-safe bag for charging, transporting, and containing damaged LiPo packs","A folding chair","A backup drone"],
       a:1, exp:"A fire-safe LiPo bag directly mitigates a real hazard — a damaged or shorting pack — rather than just making the session more comfortable."},
      {id:"b6l3_q4", q:"What's the appropriate practice when flying at a site shared with other pilots?",
       choices:["Fly wherever you want, since the airspace isn't owned by anyone","Announce your launches, keep clear of others' flight lines, and never fly directly over bystanders","Always fly at maximum altitude to stay out of everyone's way","Use the same radio channel as other pilots to simplify setup"],
       a:1, exp:"Shared-site etiquette is a safety practice, not just courtesy — announcing intentions and respecting flight lines prevents mid-air conflicts and keeps bystanders out of harm's way."}
    ,
      {id:"b6l3_q5", q:"What should a site assessment identify before you unpack anything, according to the lesson?", choices:["Only the compass heading for takeoff", "The exact GPS coordinates for a future flight log entry", "Only whether the battery is charged", "Obstacles, power lines, where people are or might move to, a launch/landing zone with a clear retreat path, and other pilots' radio/video channels"], a:3, exp:"A real site assessment covers physical hazards, people in the area, a safe launch/landing zone, and channel conflicts with other pilots \u2014 all before gear comes out of the bag."},
      {id:"b6l3_q6", q:"As part of shared-site etiquette, what should be done with anyone acting as a visual observer?", choices:["Brief them specifically on what to watch for", "Nothing extra \u2014 visual observers don't need any briefing", "Have them hold the transmitter instead of the pilot", "Position them out of sight of the aircraft"], a:0, exp:"The lesson calls for briefing a visual observer on what to watch for, not just having a second person present \u2014 an unbriefed observer isn't doing the job the role requires."},
      {id:"b6l3_q7", q:"What's the recommended way to check weather conditions at the field, rather than relying on how it feels standing there?", choices:["Asking other pilots for their subjective impression", "A handheld wind meter or a weather app with live conditions", "Checking the forecast from the night before only", "Relying on the aircraft's own onboard sensors mid-flight"], a:1, exp:"The lesson calls for a reliable, objective weather check \u2014 a wind meter or live-conditions app \u2014 rather than a guess based on how conditions feel on the ground."},
      {id:"b6l3_q8", q:"What's the difference in timing between a site assessment and a go/no-go checklist, per the lesson's field-operations sequence?", choices:["They happen simultaneously, with no defined order", "The go/no-go checklist happens first, then the site assessment", "Site assessment happens once, on arrival, before unpacking; the go/no-go checklist runs immediately before each individual flight", "Site assessment replaces the need for a go/no-go checklist"], a:2, exp:"Site assessment is a one-time read of the whole location on arrival; the go/no-go checklist is a per-flight gate run immediately before each takeoff \u2014 different scope, different frequency."}]},
    {id:"b6l4", title:"From Builder to Operator: What Changes Next", content:`
      <p>Take stock of where you are. You can build a quad from parts, tune it so it flies the way you want, actually fly it well in FPV, diagnose a fault instead of guessing at it, keep it airworthy between flights, and run a real field session from setup to pack-up. Every constraint you've worked around so far &mdash; motor KV, prop pitch, PID gains, stick habits, battery C-rating, connector wear &mdash; has been mechanical or technical, or a matter of practiced skill. Something you could research, measure, drill, or engineer your way past.</p>
      <p>That changes the moment your flying stops being purely for personal enjoyment. The FAA draws a hard line here, and it isn't about skill, aircraft size, or how well-built your quad is &mdash; it's about <strong>purpose</strong>. Fly strictly for your own recreation and you fall under the recreational exception (Section 44809): pass TRUST, follow the safety guidelines, and you're covered. Fly for any other reason &mdash; compensation, a business purpose, in furtherance of a job even if you're not paid for that specific flight, testing a product, anything beyond personal fun &mdash; and you need a <strong>Remote Pilot Certificate</strong> and you operate under <strong>Part 107</strong>, full stop. The aircraft in your hands can be identical in both cases. What changes is why you're flying it.</p>
      <p>That's the constraint the rest of this course is built around, and it's not one you can fix with a better ESC. Semester 2 covers the regulatory and operational layer that governs Part 107 flight: the rules themselves, airspace classes and how to get authorized to fly in controlled airspace, reading weather and performance data, loading and operating limits, aeronautical decision-making, and the practical mechanics of the exam &mdash; a <span class="keyfact">60-question</span> knowledge test at an FAA-approved testing center, requiring a <span class="keyfact">70%</span> passing score.</p>
      <p>None of the mechanical or troubleshooting knowledge from this semester goes to waste. A remote pilot who understands why a pack sags under load, what a hairline crack looks like, or why a failsafe matters is a better-informed operator than one who only memorized the regulation. Semester 2 adds a layer on top of what you've already built &mdash; it doesn't replace it.</p>
      <div class="tip"><div class="clabel">Hands-On</div>Before starting Semester 2, download the FAA's Remote Pilot &mdash; Small Unmanned Aircraft Systems Airman Certification Standards. It's the actual document the exam is written from, and skimming it now will make the next module's material feel less abstract.</div>
      <div class="callout"><div class="clabel">Ask Yourself</div>You've spent a semester mastering a machine. What does it mean that the next set of rules you need to learn has nothing to do with the machine at all?</div>
    `,
    quiz:[
      {id:"b6l4_q1", q:"What changes the moment a drone flight stops being purely for personal enjoyment?",
       choices:["Nothing — only the aircraft and pilot skill matter","The flight moves out of the recreational exception and into Part 107, with its own certification and operating rules","The pilot needs a larger drone to comply","Only the paint scheme or registration number needs updating"],
       a:1, exp:"The FAA's line is drawn by purpose, not by aircraft or skill — any non-recreational purpose puts the flight under Part 107."},
      {id:"b6l4_q2", q:"What kind of test does a Part 107 candidate take, as opposed to a recreational flyer?",
       choices:["The TRUST online test, same as recreational flyers","An FAA Aeronautical Knowledge Test administered at an approved testing center","No test — Part 107 certification is granted automatically after registration","A state DMV written exam"],
       a:1, exp:"Recreational flyers take TRUST online for free; Part 107 requires passing a proctored knowledge test at an approved testing center."},
      {id:"b6l4_q3", q:"What is the passing score for the Part 107 Aeronautical Knowledge Test?",
       choices:["50%","60%","70%","90%"],
       a:2, exp:"70% is the passing threshold on the 60-question exam."},
      {id:"b6l4_q4", q:"Which best describes what happens to your existing flying and maintenance skills once you move into Part 107 operations?",
       choices:["They become irrelevant — Part 107 is an entirely separate skill set","They remain fully relevant — Part 107 adds a regulatory and airspace layer on top of them","You must relearn to fly manually from scratch","Nothing changes; Part 107 is purely a paperwork formality with no operational relevance"],
       a:1, exp:"Building, tuning, and maintaining the aircraft stays useful — Part 107 adds the rules and airspace knowledge governing when and where you're allowed to fly it."}
    ,
      {id:"b6l4_q5", q:"What is the name of the regulatory exception that covers purely recreational drone flying?", choices:["Section 44809", "Part 61", "The TRUST Waiver", "Part 91"], a:0, exp:"Section 44809 is the recreational exception \u2014 pass TRUST and follow the safety guidelines, and purely personal-enjoyment flying is covered under it."},
      {id:"b6l4_q6", q:"A pilot flies a mission that benefits their employer but isn't personally paid for that specific flight. Does Part 107 apply?", choices:["No \u2014 Part 107 only applies when the pilot is directly and personally paid", "It depends on the size of the aircraft used", "No \u2014 only flights with a paying customer present trigger Part 107", "Yes \u2014 flying in furtherance of a job counts as a non-recreational purpose even without direct payment for that flight"], a:3, exp:"The lesson is explicit that furtherance of a job counts even if the pilot isn't paid for that specific flight \u2014 purpose, not payment mechanics, is what triggers Part 107."},
      {id:"b6l4_q7", q:"Which topics does the lesson say Semester 2 will cover?", choices:["Advanced PID tuning and motor selection", "FPV goggle setup and video transmitter channel selection", "Regulations, airspace classes and controlled-airspace authorization, weather and performance data, operating limits, and aeronautical decision-making", "LiPo battery chemistry and charger settings"], a:2, exp:"Semester 2 is framed as the regulatory and operational layer on top of Semester 1's building/flying skills: rules, airspace, weather/performance data, operating limits, and decision-making."},
      {id:"b6l4_q8", q:"What does the lesson recommend doing before starting Semester 2?", choices:["Purchasing a Part 107-compliant aircraft", "Downloading and skimming the FAA's Remote Pilot \u2014 Small Unmanned Aircraft Systems Airman Certification Standards", "Registering for the knowledge test immediately", "Re-flashing every aircraft with ArduCopter firmware"], a:1, exp:"The Hands-On calls for downloading and skimming the actual ACS document the exam is written from, so Semester 2's material feels less abstract."}]}
  ],
  finalQuiz:[
    {id:"b6_final_q1", q:"What are the three failure domains a systematic troubleshooting method isolates before replacing parts?",choices:["Power, signal, mechanical","Software, hardware, pilot error","Battery, motor, propeller","GPS, IMU, barometer"],a:0,exp:"Splitting a symptom into power, signal, or mechanical narrows down where to look before you start swapping components."},
    {id:"b6_final_q2", q:"What's the recommended storage voltage for a LiPo pack not being flown for an extended period?",choices:["4.20V per cell","3.80–3.85V per cell","3.0V per cell","2.5V per cell"],a:1,exp:"Mid-range storage voltage slows cell degradation compared to leaving a pack at full charge."},
    {id:"b6_final_q3", q:"After ANY hard landing or crash, before flying again you should at minimum check:",choices:["Only that the battery still holds a charge","Motor shafts for bending, the frame for hairline cracks, and motor screws for looseness","Only the paint for scratches","Nothing, as long as the props still spin freely by hand"],a:1,exp:"Impact damage isn't always visible at a glance — a deliberate post-crash check catches bent shafts, hairline cracks, and loosened screws before they fail in flight."},
    {id:"b6_final_q4", q:"Why rely on blackbox or telemetry logs rather than guesswork when troubleshooting a flight issue?",choices:["They're legally required after every flight","They provide objective evidence of what actually happened, rather than relying on memory","They automatically repair firmware issues","They replace the need for a preflight inspection"],a:1,exp:"Logs record actual voltage, RSSI, and motor data from the flight — far more reliable than recalling what a problem 'felt like.'"},
    {id:"b6_final_q5", q:"Which of these is a legitimate item on a real go/no-go checklist before flight?",choices:["Radio link and failsafe check","Whether other pilots at the field are watching","The aircraft's resale value","The pilot's general mood"],a:0,exp:"A go/no-go checklist covers concrete, safety-relevant conditions — control link integrity is a core one."},
    {id:"b6_final_q6", q:"What is a legitimate reason to retire a LiPo battery pack?",choices:["It has been used more than once","Visible swelling or puffing in the cells","A sticker on the wrap is peeling","It was charged indoors instead of outdoors"],a:1,exp:"Swelling signals internal degradation and rising fire risk — a genuine retirement criterion, unlike cosmetic wear or normal use."},
    {id:"b6_final_q7", q:"The line between recreational flying and Part 107 operation is drawn primarily by:",choices:["The price of the aircraft","The purpose of the flight — personal enjoyment versus anything else","The pilot's age","The drone's weight alone"],a:1,exp:"Purpose, not aircraft, skill, or size, determines whether a flight falls under the recreational exception or requires Part 107 certification."}
  ,
    {id:"b6_final_q8", q:"What does a low or dropping RSSI reading in a flight log indicate?", choices:["A power-domain issue", "A mechanical-domain issue", "A signal-domain issue \u2014 weak radio link strength", "A GPS-only issue with no diagnostic value"], a:2, exp:"RSSI measures radio link strength; a low or dropping value points at the signal domain rather than power or mechanical causes."},
    {id:"b6_final_q9", q:"What's the naming difference between Betaflight's and ArduPilot's in-flight recording logs?", choices:["Betaflight logs only crashes; ArduPilot logs every parameter change", "ArduPilot's log is cloud-based; Betaflight's is local only", "There is no equivalent log in ArduPilot", "Betaflight calls it a blackbox log; ArduPilot calls it a dataflash log \u2014 same kind of recorded flight data, different firmware, different name"], a:3, exp:"Both record real flight data like motor output, RSSI, vibration, and voltage \u2014 just named differently depending on which firmware you're running."},
    {id:"b6_final_q10", q:"Which of these is part of a real PREflight check, distinct from a post-crash inspection?", choices:["Checking for a bent motor shaft after impact", "Checking for hairline cracks caused by a hard landing", "Checking props for nicks, chips, or stress-whitening near the hub", "Checking for backed-out motor screws after a crash"], a:2, exp:"Prop condition, frame flex under raking light, motor bearing smoothness, connector condition, and firmware currency are routine preflight items \u2014 the other three are specifically post-crash checks."},
    {id:"b6_final_q11", q:"How should a damaged or swollen LiPo pack be handled before final disposal?", choices:["Thrown in household trash once visibly deflated", "Kept in a fire-safe bag or metal container until disposed of via a proper LiPo disposal channel", "Stored normally alongside healthy packs", "Punctured immediately to relieve pressure, then stored loose"], a:1, exp:"A damaged or swollen pack remains a fire risk until it's actually disposed of \u2014 fire-safe containment and a proper disposal channel are required."},
    {id:"b6_final_q12", q:"What should a site assessment identify before any gear comes out of the bag?", choices:["Only the compass heading for the day's first flight", "The resale value of nearby property", "Only whether cell phone signal is available", "Obstacles, power lines, where people are or might move to, a launch/landing zone with a clear retreat path, and other pilots' channels"], a:3, exp:"A real site assessment covers physical hazards, bystander movement, a safe launch/landing zone, and channel conflicts \u2014 all before any equipment is unpacked."},
    {id:"b6_final_q13", q:"What's the recommended way to check field weather conditions, per the lesson?", choices:["A handheld wind meter or a weather app with live conditions, not a guess based on how it feels", "Checking the previous night's forecast only", "Relying on other pilots' subjective impressions", "Waiting to see how the aircraft handles in the air"], a:0, exp:"The lesson calls for an objective, reliable weather check rather than a felt impression on the ground."},
    {id:"b6_final_q14", q:"What is the name of the regulatory exception that covers purely recreational drone flying, without a Remote Pilot Certificate?", choices:["Part 107", "Section 44809", "The Aeronautical Knowledge Test exception", "Part 61"], a:1, exp:"Section 44809 is the recreational exception \u2014 pass TRUST and follow the safety guidelines to fly under it; anything beyond personal enjoyment moves you into Part 107."}]
}

const POPUP_BANK = [
  {id:"pq1", topic:"Regulations", q:"A photographer flies her drone to shoot aerial video of a friend's backyard wedding, accepting $150 in payment for the footage. Under which framework does this flight fall?", choices:["Part 107, because compensation was received for a non-recreational purpose", "The recreational flyer exception under 49 U.S.C. §44809, because it was for a friend", "No regulation applies since it was a one-time favor", "Part 91, because it involved photography"], a:0, exp:"Accepting compensation makes this a civil, non-recreational operation governed by Part 107 per §107.1, regardless of how casual or one-time the flight was."},
  {id:"pq2", topic:"Regulations", q:"Which of the following is included when calculating whether an unmanned aircraft is under the 55-pound small UAS threshold defined in 14 CFR §107.3?", choices:["Only the bare airframe, excluding any payload", "The airframe plus everything attached to it at takeoff, including payload and batteries", "Only the battery weight", "The aircraft's weight after landing, once the battery is depleted"], a:1, exp:"Per §107.3, the 55 lb threshold is measured at takeoff and includes everything attached — payload, cameras, batteries, and any other equipment."},
  {id:"pq3", topic:"Regulations", q:"A property manager wants to fly a drone himself but hasn't passed the Part 107 knowledge test. His employee holds a remote pilot certificate. Can the property manager legally operate the controls?", choices:["No, only certificate holders may ever touch the controls", "Yes, provided the certificated employee directly supervises, can take over at any time, and accepts responsibility for the flight", "Yes, with no supervision required as long as the certificate holder is on the same property", "No, this arrangement is prohibited under all circumstances"], a:1, exp:"Per §107.12, an uncertificated person may manipulate the controls under the direct, capable-of-taking-over supervision of a certificated remote PIC, who retains responsibility for the flight."},
  {id:"pq4", topic:"Regulations", q:"Which statement about small UAS registration is correct?", choices:["Registration is governed by 14 CFR §107.41", "Registration is governed by 14 CFR §48.15, a section outside of Part 107", "Registration under Part 107 is optional for aircraft under 5 lbs", "Registration never expires once issued"], a:1, exp:"Aircraft registration is codified in 14 CFR §48.15 (Part 48), not Part 107 — a commonly tested distinction."},
  {id:"pq5", topic:"Regulations", q:"A Part 107 operator owns three drones used for different jobs. How many FAA registration numbers does she need?", choices:["One, covering the fleet", "Three — one per aircraft", "None, since all are used commercially", "One per year of operation"], a:1, exp:"Under Part 107, registration is per aircraft (§48.15) — unlike the recreational exception, where a single number covers an entire fleet."},
  {id:"pq6", topic:"Regulations", q:"Where must a small UAS registration number be displayed?", choices:["It doesn't need to be physically displayed if registered electronically", "In a location on the aircraft accessible without the use of any tools", "Only inside the original retail packaging", "On the remote pilot's certificate card instead"], a:1, exp:"Per §48.205, the number must be legible and accessible without tools — for example, not sealed behind a screwed-down access panel."},
  {id:"pq7", topic:"Regulations", q:"What is the primary purpose of Remote ID as required under 14 CFR §89.105?", choices:["To track battery health remotely", "To broadcast identification, location, and altitude information receivable by the FAA, law enforcement, and the public", "To transmit live video to the FAA", "To automatically file a flight plan with ATC"], a:1, exp:"Remote ID functions as a digital license plate, broadcasting identifying and location data over radio per §89.105."},
  {id:"pq8", topic:"Regulations", q:"An aircraft equipped with Standard Remote ID complies with Remote ID requirements how?", choices:["By requiring a separate broadcast module purchase", "Through built-in broadcast capability, with no add-on hardware needed", "By registering the aircraft twice", "By flying exclusively within a FRIA"], a:1, exp:"Standard Remote ID aircraft broadcast the required data natively, per §89.110, without needing an add-on module."},
  {id:"pq9", topic:"Regulations", q:"A pilot wants to fly a drone with no Remote ID capability and no broadcast module installed. Under what condition can this flight still be legal?", choices:["If flown below 100 ft AGL", "If flown entirely within an FAA-Recognized Identification Area (FRIA)", "If flown only at night", "It can never be legal regardless of location"], a:1, exp:"Section 89.115(b) permits operation without Remote ID equipage as long as the flight stays entirely within a FRIA."},
  {id:"pq10", topic:"Regulations", q:"Who is responsible for establishing a FAA-Recognized Identification Area (FRIA)?", choices:["The FAA unilaterally designates every FRIA with no application", "A community-based organization or educational institution applies to the FAA following the process in §§89.205–89.210", "Any individual pilot may declare their backyard a FRIA", "FRIAs are established only by state governments"], a:1, exp:"FRIAs are established through an application process under §§89.205–89.210, typically by community-based organizations or educational institutions, not declared unilaterally by individuals."},
  {id:"pq11", topic:"Regulations", q:"During a Part 107 flight, a rotor strike causes a bystander to require hospitalization for a serious injury. Within how many days must the remote PIC report this to the FAA?", choices:["24 hours", "10 days", "30 days", "No reporting requirement exists for civil operators"], a:1, exp:"Per §107.9, a safety event meeting the injury or property-damage threshold must be reported to the FAA within 10 calendar days."},
  {id:"pq12", topic:"Regulations", q:"Which of the following would NOT, by itself, trigger the mandatory reporting requirement under §107.9?", choices:["A serious injury classified at AIS Level 3 or higher", "Loss of consciousness by any person", "Minor cosmetic scuffing of the drone's own airframe with no other damage", "Property damage, other than to the UAS itself, exceeding $500 in repair cost or fair market value"], a:2, exp:"Damage limited to the unmanned aircraft itself doesn't trigger the report — the threshold covers serious injury (AIS Level 3+ or loss of consciousness) or more than $500 in damage to other property."},
  {id:"pq13", topic:"Regulations", q:"Before every flight, what does 14 CFR §107.49 require the remote pilot in command to do?", choices:["Obtain a new airspace authorization each time", "Ensure the aircraft is in a condition for safe operation via a preflight inspection", "File a report with the FAA", "Have the aircraft inspected by an A&P mechanic"], a:1, exp:"Section 107.49 requires a preflight check of things like propellers, airframe, battery, and control link — a functional safety determination, not a fixed inspection schedule."},
  {id:"pq14", topic:"Regulations", q:"A remote pilot is operating at 380 ft AGL. Clouds are reported at 700 ft AGL. Is this flight compliant with the operating limitations in §107.51?", choices:["No — 500 ft below a 700 ft cloud base caps the pilot at 200 ft AGL, so 380 ft violates cloud clearance", "Yes, because 380 ft is under the 400 ft ceiling", "Yes, as long as visibility is at least 3 statute miles", "No, because 380 ft exceeds the 100 mph speed limit"], a:0, exp:"Cloud clearance (500 ft below) can cap altitude well under the nominal 400 ft ceiling; at a 700 ft cloud base, the effective ceiling is 200 ft AGL, per §107.51."},
  {id:"pq15", topic:"Regulations", q:"What is the maximum permitted groundspeed for a standard Part 107 operation?", choices:["55 mph", "87 mph", "100 mph (87 knots)", "No speed limit exists"], a:2, exp:"Section 107.51 sets a 100 mph (87 knot) maximum groundspeed for standard operations."},
  {id:"pq16", topic:"Regulations", q:"A remote pilot loses sight of her aircraft behind a building for several seconds but continues flying by reference to the first-person-view camera feed alone. Does this satisfy the visual-line-of-sight requirement?", choices:["Yes, FPV video always satisfies VLOS", "No — §107.31 requires the remote PIC or a visual observer to see the aircraft unaided (corrective lenses excepted) throughout the flight", "Yes, as long as the flight stays under 400 ft", "No, but only because the flight exceeded 3 statute miles visibility"], a:1, exp:"Section 107.31 requires actual unaided visual contact with the aircraft, not a camera feed, throughout the operation absent a waiver."},
  {id:"pq17", topic:"Regulations", q:"Which corrective device is permitted while still satisfying the 'unaided' visual line of sight requirement under §107.31?", choices:["Binoculars", "A second drone's camera feed", "Prescription eyeglasses or contact lenses", "Night-vision goggles"], a:2, exp:"Corrective lenses (glasses or contacts) are treated as unaided vision for VLOS purposes; binoculars, camera feeds, and vision-enhancing devices are not."},
  {id:"pq18", topic:"Regulations", q:"Without a waiver, how many unmanned aircraft may a single remote pilot in command operate simultaneously?", choices:["One", "Two, if both stay within 100 ft of each other", "Up to five, if all are Category 1", "Unlimited, provided a visual observer is used for each"], a:0, exp:"Section 107.35 limits a remote PIC to one unmanned aircraft at a time without a waiver."},
  {id:"pq19", topic:"Regulations", q:"A remote pilot is operating near an airport with permission and notices a low-flying manned aircraft approaching. What must the remote pilot do?", choices:["Maintain course, since the drone was there first", "Yield the right-of-way and maneuver to avoid the manned aircraft", "Climb above 400 ft to get out of the way", "Contact ATC and wait for instructions before moving"], a:1, exp:"Section 107.37 requires the remote PIC to yield right-of-way to all manned aircraft and avoid interfering with their operations."},
  {id:"pq20", topic:"Regulations", q:"A remote pilot flies in gusty winds that exceed the aircraft's manufacturer-rated wind limit, resulting in a crash into a parked car. Which rule most directly applies to this outcome?", choices:["§107.31, visual line of sight", "§107.23, prohibition on careless or reckless operation", "§107.35, one-aircraft-at-a-time rule", "§107.41, controlled airspace authorization"], a:1, exp:"Operating outside the aircraft's known safe limits in a way that endangers people or property falls under the careless-or-reckless prohibition in §107.23."},
  {id:"pq21", topic:"Regulations", q:"Under what condition may a small UAS be operated from a moving land vehicle?", choices:["Never, under any circumstance", "Only over a densely populated area", "In a sparsely populated area, provided the aircraft isn't carrying hazardous material", "Only if the vehicle is stationary at the time of launch and landing"], a:2, exp:"Section 107.25 permits operation from a moving vehicle only in a sparsely populated area and only if the UA isn't carrying hazardous material."},
  {id:"pq22", topic:"Regulations", q:"A remote pilot had one alcoholic drink 5 hours before a planned flight. Is this flight compliant with §107.27?", choices:["Yes, as long as the pilot feels sober", "No — the incorporated §91.17 standard requires at least 8 hours between the last drink and operating", "Yes, one drink is always permitted regardless of timing", "No, because any alcohol consumption within 24 hours is prohibited"], a:1, exp:"Section 107.27 incorporates the §91.17 standard: at least 8 hours since the last drink, a BAC under 0.04, and no impairment from drugs."},
  {id:"pq23", topic:"Regulations", q:"A Category 1 small UAS operating over an open-air assembly of people must, at minimum, meet which condition?", choices:["Weigh 5 lbs or less at takeoff", "Weigh 0.55 lb (250 g) or less at takeoff, with no exposed rotating parts capable of lacerating skin", "Hold an airworthiness certificate", "Be equipped with a parachute recovery system"], a:1, exp:"Category 1 (§107.110) requires 0.55 lb / 250 g or less at takeoff and no exposed rotating parts that would lacerate skin — no waiver needed for operations over people or moving vehicles."},
  {id:"pq24", topic:"Regulations", q:"A manufacturer wants its heavier aircraft eligible for sustained operations over open-air assemblies without the weight cap of Category 1. Which category, requiring an FAA-issued airworthiness certificate, would apply?", choices:["Category 1", "Category 2", "Category 3", "Category 4"], a:3, exp:"Category 4 operations over people require the aircraft to hold an FAA airworthiness certificate, per §107.140 — a materially different bar than the injury-severity/design standards for Categories 2 and 3."},
  {id:"pq25", topic:"Regulations", q:"A commercial operator wants to fly beyond the 400 ft altitude limit for a tower inspection. What must they obtain?", choices:["A LAANC authorization only", "A waiver of §107.51 under §§107.200/107.205, since airspace authorization alone won't excuse the rule", "Nothing, since tower inspections are exempt by default", "A recreational flyer exemption"], a:1, exp:"Exceeding a numeric operating limitation like the 400 ft ceiling requires a waiver (§§107.200, 107.205) — airspace authorization only addresses being in controlled airspace, not excusing an operating rule."},
  {id:"pq26", topic:"Loading & Performance", q:"A remote pilot mounts a heavy gimbal payload significantly off-center from the aircraft's normal center of gravity. What is the most direct consequence?", choices:["Improved battery efficiency", "The flight controller must continuously compensate, degrading stability and control response", "Increased maximum groundspeed", "No measurable effect below 400 ft AGL"], a:1, exp:"An off-center load forces the flight controller to work harder to hold level, predictable flight, reducing stability and control response."},
  {id:"pq27", topic:"Loading & Performance", q:"A manufacturer publishes a maximum takeoff weight and a recommended center-of-gravity envelope for a small UAS. Loading the aircraft outside that envelope is best described as:", choices:["A cosmetic issue with no safety implication", "A controllability and safety issue that can itself constitute careless or reckless operation", "Something the FAA has no interest in regulating", "Relevant only for aircraft flown at night"], a:1, exp:"Exceeding published weight/balance limits threatens controllability and can itself violate the careless-or-reckless standard under §107.23."},
  {id:"pq28", topic:"Loading & Performance", q:"Why might a small UAS that handles predictably at its normal loaded weight become abruptly unpredictable once loaded beyond its published limits?", choices:["Because the aircraft's registration becomes invalid", "Because it departs a tested and stable weight/balance envelope, and control authority can degrade suddenly rather than gradually", "Because Remote ID broadcasting stops functioning", "Because the maximum groundspeed automatically increases"], a:1, exp:"Outside its tested envelope, an aircraft's handling characteristics are no longer validated by the manufacturer and can change abruptly, often under stress like wind or low battery."},
  {id:"pq29", topic:"Loading & Performance", q:"A remote pilot consults a manufacturer's range-vs-payload chart to plan a mission. What is this chart primarily useful for?", choices:["Determining the correct Remote ID broadcast frequency", "Reading the expected range or endurance at the pilot's actual payload weight, rather than relying on the headline spec", "Calculating the registration fee owed", "Determining required cloud clearance"], a:1, exp:"Performance charts let a pilot read off values, like range or endurance, at their actual operating inputs (payload, temperature, etc.) rather than the best-case headline number."},
  {id:"pq30", topic:"Loading & Performance", q:"A drone's spec sheet advertises a 30-minute flight time. What does this figure typically represent?", choices:["A guaranteed minimum under any condition", "An estimate based on specific reference conditions — payload, temperature, and wind — that a real flight may not match", "The maximum possible flight time, achievable only with a tailwind", "A legally mandated minimum enforced by the FAA"], a:1, exp:"Published flight-time specs assume specific test conditions; adding payload, flying in cold weather, or fighting a headwind can meaningfully reduce real-world endurance below the spec sheet number."},
  {id:"pq31", topic:"Loading & Performance", q:"All else being equal, how does adding payload weight to a small UAS affect its hover endurance?", choices:["It increases endurance, since more mass improves stability", "It decreases endurance, since more power is required to generate the additional lift needed to hover", "It has no effect on endurance, only on top speed", "It only affects endurance if the payload exceeds 55 lbs"], a:1, exp:"Additional weight requires more power to produce the lift needed to sustain flight, which draws the battery down faster and reduces available flight time."},
  {id:"pq32", topic:"Loading & Performance", q:"A heavily loaded quadcopter, compared to the same aircraft flown at minimum weight, will generally exhibit which handling characteristic?", choices:["Faster response to control inputs and tighter turns", "Greater inertia, leading to slower response to control inputs and longer stopping distances", "No difference in handling characteristics", "Automatically reduced maximum altitude regardless of pilot input"], a:1, exp:"Added mass increases inertia, which slows the aircraft's response to control inputs and lengthens the distance needed to stop or change direction."},
  {id:"pq33", topic:"Loading & Performance", q:"Which combination of conditions produces the highest density altitude, and therefore the most degraded small UAS performance, at a given physical field elevation?", choices:["Cold, dry, low-elevation air", "Hot, humid conditions layered on top of a high field elevation", "Cold temperatures at sea level", "High barometric pressure with low humidity"], a:1, exp:"Heat, humidity, and elevation all raise density altitude by thinning the effective air the propellers work against; hot, humid conditions at a high-elevation field produce the worst-case performance scenario."},
  {id:"pq34", topic:"Loading & Performance", q:"How does rising density altitude affect a small UAS's propeller and motor efficiency, even when the aircraft's true (physical) altitude hasn't changed?", choices:["It has no effect, since density altitude is only relevant to manned aircraft", "It reduces propeller and motor efficiency, because the effectively thinner air produces less lift and thrust for the same rotor speed", "It improves propeller efficiency by reducing drag", "It only affects electric motors, not gas-powered aircraft"], a:1, exp:"Density altitude represents the 'effective' altitude the aircraft feels; as it rises, air is effectively thinner, so a given RPM produces less lift and thrust, cutting into performance and endurance."},
  {id:"pq35", topic:"Loading & Performance", q:"A remote pilot is planning a mission on a hot summer afternoon at a high-elevation site with high humidity. Which adjustment to the flight plan best reflects an understanding of density altitude effects?", choices:["Assume performance identical to a cool, low-elevation morning flight", "Plan for reduced climb performance, reduced payload capacity, and shorter available flight time than the spec sheet suggests", "Plan for increased maximum groundspeed under §107.51", "Ignore density altitude since it only matters above 10,000 ft true altitude"], a:1, exp:"High density altitude conditions (heat, humidity, and elevation combined) degrade real-world performance — climb rate, payload margin, and endurance should all be planned conservatively relative to sea-level spec numbers."},
  {id:"pq36", topic:"Airspace", q:"A sectional chart shows a solid magenta line around an airport. What airspace class does this mark?", choices:["Class B", "Class C", "Class D", "Class E surface area"], a:1, exp:"Solid magenta marks Class C airspace — mid-size towered airports with radar approach control. Prior authorization is required to fly there under 14 CFR §107.41."},
  {id:"pq37", topic:"Airspace", q:"Which type of special use airspace is legally off-limits to aircraft, including small UAS, without specific case-by-case permission from the controlling agency?", choices:["Alert Area", "Warning Area", "Prohibited Area", "Military Operations Area (MOA)"], a:2, exp:"A Prohibited Area is airspace where flight is barred outright for security, national welfare, or safety reasons — the most restrictive category of special use airspace."},
  {id:"pq38", topic:"Airspace", q:"A Restricted Area is best described as airspace where:", choices:["All flight is permanently banned", "Flight requires specific permission because of unusual, often invisible hazards like artillery firing or guided missiles", "Only military aircraft may ever enter", "Weather radar is being tested"], a:1, exp:"Restricted Areas contain hazards to aircraft not necessarily visible from the air, such as artillery or missile activity, and require permission from the controlling agency to enter."},
  {id:"pq39", topic:"Airspace", q:"You're planning a flight and notice the route crosses a Military Operations Area (MOA). What does this mean for your flight?", choices:["The MOA is always closed to civilian aircraft, including drones, with no exceptions", "Flight isn't restricted, but the area sees military training activity and warrants extra caution and situational awareness", "It's identical in meaning to a Prohibited Area", "It only affects manned aircraft above 18,000 ft MSL"], a:1, exp:"An MOA isn't off-limits by default, but it flags military training activity — a remote pilot should use extra caution when operating in or near one."},
  {id:"pq40", topic:"Airspace", q:"A Warning Area, as depicted on aeronautical charts, is most accurately described as:", choices:["Airspace over domestic land reserved for parachute jumping", "Airspace, often over water, where hazardous military activity may be occurring", "A term used only for Class B airspace", "An area where NOTAMs never apply"], a:1, exp:"Warning Areas extend from a state's territorial waters outward and warn of potentially hazardous activity, such as military exercises, over or near international waters."},
  {id:"pq41", topic:"Airspace", q:"An Alert Area on a sectional chart indicates:", choices:["Airspace with an unusually high volume of pilot training or other unusual aerial activity", "An area where all radio communication is prohibited", "The boundary of a Temporary Flight Restriction", "Airspace reserved exclusively for airline traffic"], a:0, exp:"Alert Areas warn pilots of a high volume of training or other unusual flight activity; the airspace itself isn't restricted, but heightened vigilance is expected."},
  {id:"pq42", topic:"Airspace", q:"On a sectional chart, a small boxed number sitting next to an airspace boundary line represents:", choices:["The airport's radio frequency", "The floor and/or ceiling of that airspace, in hundreds of feet MSL", "The magnetic variation for that area", "The number of runways at the nearest airport"], a:1, exp:"Boxed numbers along airspace boundaries give the floor or ceiling altitude in hundreds of feet MSL — for example, a boxed '35' means 3,500 ft MSL."},
  {id:"pq43", topic:"Airspace", q:"Which 14 CFR Part 107 section establishes the requirement that a remote pilot obtain authorization before operating in controlled airspace?", choices:["§107.1", "§107.3", "§107.41", "§107.51"], a:2, exp:"§107.41 is the controlled airspace authorization requirement — it's the section behind both LAANC and manual FAADroneZone requests."},
  {id:"pq44", topic:"Airspace", q:"A sectional chart shows faded blue shading around an airport, with no other airspace symbol overlapping it. What does this tell you about the Class E airspace floor there?", choices:["It starts at the surface", "It starts at 700 ft AGL", "It starts at 1,200 ft AGL", "It starts at 18,000 ft MSL"], a:2, exp:"Faded blue shading marks Class E airspace with a floor of 1,200 ft AGL (faded magenta, by contrast, marks a 700 ft AGL floor)."},
  {id:"pq45", topic:"Airspace", q:"To request LAANC authorization, a remote pilot must use:", choices:["A handwritten letter mailed to the FAA", "An FAA-approved LAANC app or service provider", "A phone call to the nearest control tower only", "FAADroneZone, exclusively"], a:1, exp:"LAANC requests are submitted through an FAA-approved app or UAS Service Supplier, which checks the request against the grid cell's pre-approved ceiling in near real time."},
  {id:"pq46", topic:"Airspace", q:"You received LAANC authorization to fly at 200 ft over a specific address inside Class D airspace. Your client now wants you to fly the same drone at 200 ft over an address six blocks away, still inside the same Class D airspace. Are you covered by your existing authorization?", choices:["Yes — Class D authorization applies to the whole airspace at any altitude", "No — authorization is specific to both the location and the altitude requested; a new request is needed for the new location", "Yes, as long as the altitude doesn't change", "No — LAANC authorizations expire after one use regardless of location"], a:1, exp:"LAANC (and manual) authorizations are tied to a specific location and altitude. Moving to a different site, even within the same airspace, requires its own authorization."},
  {id:"pq47", topic:"Airspace", q:"A NOTAM in your preflight briefing reports a temporary GPS interference test in your operating area. This NOTAM is:", choices:["A type of Temporary Flight Restriction, since all NOTAMs are TFRs", "An example of a NOTAM that isn't a TFR — it's a hazard notice unrelated to any airspace-entry restriction", "Not something a remote pilot needs to check", "Only relevant to airline pilots"], a:1, exp:"NOTAMs cover a broad range of temporary hazards and changes — GPS interference testing and obstacle lighting outages are NOTAM items that aren't TFRs, which are a narrower category restricting airspace entry."},
  {id:"pq48", topic:"Airspace", q:"A wildfire breaks out near your planned operating area the morning of your flight. What's the appropriate preflight action?", choices:["Nothing — wildfires don't affect small UAS operations", "Check for an active TFR before flying, since firefighting operations commonly trigger one", "Fly at a lower altitude to avoid any restriction", "Only check if you can see smoke from the launch site"], a:1, exp:"Wildfires routinely prompt TFRs to protect firefighting aircraft. Checking for an active TFR is required preflight planning, not an optional step reserved for obvious hotspots."},
  {id:"pq49", topic:"Airspace", q:"Which of these best describes Class D airspace?", choices:["Uncontrolled airspace with no authorization requirement", "Smaller towered airports; controlled, authorization required", "The busiest airports in the country, always the largest lateral footprint", "Airspace that starts at 18,000 ft MSL"], a:1, exp:"Class D covers smaller towered airports. It's controlled airspace, so Part 107 operations there require prior authorization."},
  {id:"pq50", topic:"Airspace", q:"Which of these best describes Class B airspace?", choices:["Uncontrolled airspace surrounding rural airstrips", "The busiest airports (major hubs); controlled, authorization required", "Military-only airspace closed to all civilian authorization requests", "Airspace with no chart symbol at all"], a:1, exp:"Class B surrounds the nation's busiest hub airports. It's controlled airspace requiring prior authorization for Part 107 operations, marked with a solid blue line on sectional charts."},
  {id:"pq51", topic:"Airspace", q:"What distinguishes Class C airspace from Class D airspace operationally?", choices:["Class C airports are mid-size towered fields with radar approach control, while Class D airports are smaller towered fields without it", "Class C never requires authorization while Class D always does", "Class D is larger in lateral extent than Class C", "There is no meaningful difference"], a:0, exp:"Class C surrounds mid-size towered airports that have radar approach control; Class D covers smaller towered airports. Both are controlled airspace requiring Part 107 authorization."},
  {id:"pq52", topic:"Airspace", q:"You're flying in an area with no chart markings showing Class B, C, D, or E surface airspace overhead. By default, what airspace are you in from the surface up to the floor of the overlying controlled airspace?", choices:["Class A", "Class G", "Class E surface area", "Restricted airspace"], a:1, exp:"Absent an overlying controlled-airspace floor reaching the ground, the airspace from the surface up is Class G — uncontrolled, with no Part 107 authorization required."},
  {id:"pq53", topic:"Airspace", q:"A sectional chart shows an airport symbol in magenta with no surrounding blue or magenta boundary lines. What can you conclude about the airport and the airspace around it?", choices:["The airport has a control tower and sits in Class D airspace", "The airport has no operating control tower, and absent other overlying controlled airspace, the surrounding area is likely Class G", "The airport is permanently closed", "The airport is inside a TFR"], a:1, exp:"A magenta airport symbol indicates no operating control tower. With no Class B/C/D/E-surface boundary line depicted, the surrounding airspace defaults to Class G near the surface."},
  {id:"pq54", topic:"Airspace", q:"A remote pilot flies into an active TFR without checking for it beforehand, unaware it existed. Under FAA enforcement, does 'I didn't know' excuse the violation?", choices:["Yes — TFRs only apply to pilots who were specifically notified", "No — TFRs are legally binding regardless of whether the pilot checked for them, and checking is a required part of preflight planning", "Yes, as long as the flight stayed below 400 ft", "No enforcement action is possible against small UAS operators"], a:1, exp:"TFRs are legally binding airspace restrictions. Failing to check for one doesn't excuse a violation — checking NOTAMs for active TFRs is a required part of preflight planning for every flight."},
  {id:"pq55", topic:"Airspace", q:"You submit a LAANC request to fly at 100 ft in a Class D grid cell where the pre-approved ceiling is 150 ft. What should you expect?", choices:["Automatic denial, since Class D never allows LAANC", "Near-real-time approval, since your requested altitude is within the grid cell's ceiling", "A mandatory 90-day wait regardless of altitude", "Approval only if requested through FAADroneZone instead"], a:1, exp:"Because 100 ft is at or below the grid cell's 150 ft LAANC ceiling, the request should be eligible for near-real-time LAANC approval rather than falling back to a manual request."},
  {id:"pq56", topic:"Weather", q:"Roughly how often is a routine METAR issued at a reporting station?", choices:["Every 15 minutes", "Roughly once an hour", "Once every 6 hours", "Once a day"], a:1, exp:"METARs are routine, current-conditions reports issued roughly hourly at airports with weather reporting capability."},
  {id:"pq57", topic:"Weather", q:"A METAR sky condition reads 'SKC'. What does this indicate?", choices:["Sky obscured by fog", "Sky clear — no clouds reported", "Scattered clouds at an unknown height", "Severe cloud cover"], a:1, exp:"SKC stands for 'sky clear' — no cloud layers are reported at the station."},
  {id:"pq58", topic:"Weather", q:"A METAR reports 'FEW040'. What does the 'FEW' portion tell you about cloud coverage?", choices:["The sky is completely overcast", "Only a few, scattered clouds cover a small portion of the sky at that layer", "There is no cloud data available", "Clouds are moving quickly (high wind aloft)"], a:1, exp:"FEW describes the lightest reported cloud coverage category — a small amount of sky covered by clouds at that layer, in this case based at 4,000 ft."},
  {id:"pq59", topic:"Weather", q:"Comparing the METAR sky-condition codes SCT and OVC, which represents greater cloud coverage of the sky?", choices:["SCT (scattered)", "OVC (overcast)", "They represent identical coverage", "Neither describes cloud coverage"], a:1, exp:"OVC (overcast) means the sky is completely covered by cloud at that layer, while SCT (scattered) describes a lesser, partial amount of coverage."},
  {id:"pq60", topic:"Weather", q:"You read a METAR showing 'OVC008'. What does this tell a remote pilot about the ceiling?", choices:["The sky is completely overcast with a ceiling at 800 ft", "The sky is completely overcast with a ceiling at 8,000 ft", "Only a few clouds exist at 800 ft, well below an overcast layer", "The visibility is 8 statute miles"], a:0, exp:"Cloud height codes in a METAR are given in hundreds of feet, so 008 = 800 ft. OVC means the sky is completely overcast at that height — an 800 ft ceiling."},
  {id:"pq61", topic:"Weather", q:"How is completely calm wind (no measurable speed or direction) typically encoded in a METAR?", choices:["CALM", "VRB00KT", "00000KT", "000/00"], a:2, exp:"Calm wind is reported as 00000KT — zero direction, zero knots."},
  {id:"pq62", topic:"Weather", q:"Wind direction reported in a METAR is referenced to:", choices:["Magnetic north, the same as an ATC tower instruction", "True north, which can differ from the magnetic-referenced wind an ATC tower gives verbally", "The direction of the nearest runway only", "Whichever direction the observing station happens to face"], a:1, exp:"METAR (and TAF) wind directions are given relative to true north, while a control tower reporting wind verbally over the radio typically uses magnetic direction — a subtle but real distinction."},
  {id:"pq63", topic:"Weather", q:"You compare two METARs: one reads 18010KT, the other reads 18010G28KT. Both report the same sustained wind. Why should the second reading concern a small UAS pilot more?", choices:["It doesn't — sustained wind is all that matters for small UAS", "The large gust spread (10 to 28 knots) signals more turbulent, less predictable air than a wind of steady sustained speed", "G28 means the wind is 28 knots slower than reported", "Gusts only affect manned aircraft"], a:1, exp:"A wide gust spread indicates more turbulent, variable conditions. Even if the sustained wind is within limits, large gusts can exceed a small UAS's control authority or rated max wind speed."},
  {id:"pq64", topic:"Weather", q:"A METAR reports moderate rain (RA) at your operating area. What's the primary small-UAS-specific concern this raises, beyond reduced visibility?", choices:["Rain has no effect on small UAS since they're all weatherproof", "Most consumer/prosumer drones aren't rated for rain, creating an electronics risk", "Rain increases propeller efficiency", "Rain automatically triggers a TFR"], a:1, exp:"Beyond cutting visibility, precipitation poses a direct electronics risk since most consumer and prosumer small UAS are not rated for flight in rain."},
  {id:"pq65", topic:"Weather", q:"A METAR shows a temperature of -5°C at your launch site. What effect should you expect on your battery-powered small UAS?", choices:["No effect — battery chemistry is unaffected by cold", "Reduced battery capacity and worse voltage sag than at moderate temperatures", "Increased battery capacity", "The battery will charge faster in cold weather"], a:1, exp:"Cold temperatures reduce battery capacity and worsen voltage sag, cutting into available flight time and power delivery — a real preflight planning factor on cold days."},
  {id:"pq66", topic:"Weather", q:"A METAR shows a high temperature reading at your launch site on a summer afternoon. Besides reduced air density, what's a direct small-UAS-specific risk of the heat itself?", choices:["None — heat only affects manned aircraft engines", "Thermal throttling or damage to the battery and electronics", "Improved motor efficiency at all temperatures", "Automatic grounding under Part 107"], a:1, exp:"High temperatures risk thermal throttling or outright damage to battery chemistry and onboard electronics, separate from the density-altitude effect on propeller performance."},
  {id:"pq67", topic:"Weather", q:"A METAR at a low-elevation airport reports a hot, humid afternoon. Why would a remote pilot expect propeller performance to suffer, even though the field's physical elevation hasn't changed?", choices:["Humidity makes air denser, improving lift", "Heat and humidity raise density altitude, making the air 'feel thinner' to the propeller — the same effect as flying at a higher physical elevation", "METARs don't report conditions relevant to density altitude", "Propeller performance is unaffected by air density"], a:1, exp:"Heat and humidity both raise density altitude, which reduces the effective density of the air a propeller works against — degrading performance just as a higher physical elevation would."},
  {id:"pq68", topic:"Weather", q:"A TAF includes the group 'FM1800'. What does the FM indicator signal?", choices:["A brief fluctuation lasting under an hour", "A rapid, significant change in conditions expected to begin at the indicated time and persist afterward", "The station's forecast issuance time", "Wind will become calm at that time"], a:1, exp:"FM (\"from\") marks a rapid, significant change expected to begin at the stated time, with the new conditions holding until the next change group — unlike TEMPO's brief fluctuations."},
  {id:"pq69", topic:"Weather", q:"A TAF you pull the night before a flight covers roughly how long a forecast period?", choices:["6 hours", "24 to 30 hours", "72 hours", "One week"], a:1, exp:"TAFs typically forecast conditions at an airport for a 24- to 30-hour period, and are updated about every 6 hours."},
  {id:"pq70", topic:"Weather", q:"You pull the current METAR before launch and it reports 2SM visibility. Per Part 107 operating limitations, what's your go/no-go call?", choices:["Go — 2SM is above the minimum required visibility", "No-go — the reported visibility is below the 3 statute mile minimum required under §107.51", "Go, but only above 400 ft", "No-go, but only because of cloud clearance, not visibility"], a:1, exp:"Part 107 requires a minimum flight visibility of 3 statute miles from the control station under §107.51. A METAR reporting 2SM visibility is below that minimum — a clear no-go."},
  {id:"pq71", topic:"Operations I", q:"Why does standard aviation radio phraseology (e.g., stating position, altitude, and intentions in a fixed order) matter for a remote pilot monitoring or transmitting on CTAF?", choices:["It's required to file a flight plan", "It lets other pilots quickly build an accurate mental picture from partial or garbled transmissions", "It allows aircraft to bypass air traffic control entirely", "It reduces the need for a preflight inspection"], a:1, exp:"Standardized phraseology packs the essential information (who, where, how high, what next) into a predictable order so listeners with only patchy radio reception can still reconstruct a clear picture — this is what makes shared self-announced situational awareness work."},
  {id:"pq72", topic:"Operations I", q:"You're operating a drone under an airspace authorization near a towered airport and are monitoring the tower frequency for situational awareness. ATC issues an instruction to a manned aircraft that has nothing to do with your operation. What should you do?", choices:["Respond immediately to acknowledge you heard it", "Continue listening without transmitting, since the instruction wasn't addressed to you", "Switch off the radio since it's not relevant", "Relay the instruction to your visual observer over the same frequency"], a:1, exp:"Monitoring a frequency for awareness doesn't mean responding to every transmission — keying up to acknowledge instructions not directed at you adds unnecessary radio congestion and can mask a transmission meant for you or another aircraft."},
  {id:"pq73", topic:"Operations I", q:"A remote pilot decides to self-announce on CTAF before operating near a non-towered airstrip. Which combination of information does standard phraseology call for in that report?", choices:["Aircraft registration number, pilot's certificate number, and battery voltage", "Location/airport name, position/altitude, and intentions", "Weather forecast, insurance carrier, and takeoff weight", "Manufacturer, model, and Remote ID serial number"], a:1, exp:"A useful position report identifies where you are, your position and altitude relative to the field, and what you intend to do next — the same structure manned pilots use so others can build a mental picture of traffic."},
